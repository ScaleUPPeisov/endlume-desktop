name: ENDLUME 10.0.14 Build Sign Physical Gate

on:
  push:
    branches:
      - release-endlume-10.0.14
    paths:
      - 'release/ENDLUME_10.0.14_SIGN_TRIGGER.md'

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1014-build-sign
  cancel-in-progress: false

jobs:
  build-sign-smoke:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Exact successful compile sentinel and branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin release-endlume-10.0.14
          test "$(git rev-parse origin/release-endlume-10.0.14)" = "$GITHUB_SHA"
          COMPILE_RUN_ID="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_COMPILE_PASS.json"))["compileRunId"])')"
          COMPILE_HEAD="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_COMPILE_PASS.json"))["compileHead"])')"
          RELEASE_COMMIT="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_COMPILE_PASS.json"))["releaseCommit"])')"
          python3 - release/ENDLUME_10.0.14_COMPILE_PASS.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['version']=='10.0.14' and d['status']=='PASS',d
          assert d['functionalSource']=='55372b94a35ef76ee160347783cf8c62e003fa4e',d
          assert d['releaseCommit']=='b2d3ea03a3c5ecd0293df83260d0c35f2a54bcc9',d
          print('COMPILE_SENTINEL=PASS')
          PY
          git merge-base --is-ancestor "$COMPILE_HEAD" HEAD
          STATUS="$(gh api repos/ScaleUPPeisov/endlume-desktop/actions/runs/$COMPILE_RUN_ID --jq '.status+":"+.conclusion')"
          test "$STATUS" = 'completed:success'
          RUN_HEAD="$(gh api repos/ScaleUPPeisov/endlume-desktop/actions/runs/$COMPILE_RUN_ID --jq .head_sha)"
          test "$RUN_HEAD" = "$COMPILE_HEAD"
          git diff --quiet 55372b94a35ef76ee160347783cf8c62e003fa4e HEAD -- src src-tauri/src
          git diff --quiet "$RELEASE_COMMIT" HEAD -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          echo COMPILE_RUN_ID="$COMPILE_RUN_ID"
          echo RELEASE_COMMIT_SHA="$RELEASE_COMMIT"
          echo FUNCTIONAL_PRODUCT_DIFF=0
          echo RELEASE_HEAD="$GITHUB_SHA"

      - name: Fresh production build sign and packaged physical smoke
        shell: bash
        env:
          RELEASE_HEAD: ${{ github.sha }}
        run: bash scripts/phase4_build_sign_1014_retry.sh

      - name: Pin signed evidence to exact build source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$PHASE4_STAGE/ENDLUME-10.0.14-release.json" "$GITHUB_SHA" <<'PY'
          import json,sys
          p=sys.argv[1]; head=sys.argv[2]
          d=json.load(open(p)); d['releaseHead']=head
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          assert d['releaseHead']==head
          print('SIGNED_RELEASE_HEAD='+head)
          PY
          /usr/bin/shasum -a 256 "$PHASE4_STAGE"/ENDLUME-10.0.14-* "$PHASE4_STAGE/ENDLUME-macos-aarch64.app.tar.gz" "$PHASE4_STAGE/ENDLUME-macos-aarch64.app.tar.gz.sig" > "$PHASE4_STAGE/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.14-PHASE4-SIGNED-MACOS-ARM64
          path: |
            ${{ env.PHASE4_STAGE }}/ENDLUME-10.0.14-macos-aarch64.app.zip
            ${{ env.PHASE4_STAGE }}/ENDLUME-10.0.14-macos-aarch64.app.tar.gz
            ${{ env.PHASE4_STAGE }}/ENDLUME-10.0.14-macos-aarch64.app.tar.gz.sig
            ${{ env.PHASE4_STAGE }}/ENDLUME-macos-aarch64.app.tar.gz
            ${{ env.PHASE4_STAGE }}/ENDLUME-macos-aarch64.app.tar.gz.sig
            ${{ env.PHASE4_STAGE }}/ENDLUME-10.0.14-release.json
            ${{ env.PHASE4_STAGE }}/SHA256SUMS.txt
            ${{ env.PHASE4_STAGE }}/vyron-routing.json
            ${{ env.PHASE4_STAGE }}/preview-subscribe-render.json
            ${{ env.PHASE4_STAGE }}/durable-before.json
            ${{ env.PHASE4_STAGE }}/durable-after.json
          if-no-files-found: error
          retention-days: 30

      - name: Signed candidate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo SIGNED_RUN_ID="$GITHUB_RUN_ID"
          echo SIGNED_SOURCE_HEAD="$GITHUB_SHA"
          echo SIGNED_ARTIFACT=ENDLUME-10.0.14-PHASE4-SIGNED-MACOS-ARM64
          echo PACKAGED_SMOKE=PASS
          echo STABLE_PUBLISH=NOT_YET
