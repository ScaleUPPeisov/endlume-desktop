name: ENDLUME Hosted Runner Smoke

on:
  push:
    branches: [ci/endlume-861-rc-publish-recovery]
    paths:
      - '.github/workflows/endlume-hosted-smoke.yml'
  workflow_dispatch:

jobs:
  hosted-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hosted runner is available
        run: |
          echo HOSTED_RUNNER_GREEN
          uname -a
