# One-shot trusted owner installation, triggered only by the explicit marker commit.
# The PR67 source is NEVER checked out, built, or executed as a build script on the M1.
# Private local RC ad-hoc signing does not alter Gatekeeper, SIP or stable Tauri feed.
name: VYRON PR67 6.1.28 guarded PRIVATE owner install
on:
  push:
    branches: [diagnostics/vyron-m1-connection-20261118]
    paths: [scripts/vyron-628-owner-install-trigger.txt]
permissions:
  contents: read
  actions: read
concurrency:
  group: vyron-physical-m1-exclusive-install
  cancel-in-progress: false
jobs:
  private-guarded-install:
    if: github.repository == 'ScaleUPPeisov/endlume-desktop'
    name: Verify GitHub artifact, locally ad-hoc sign, backup guard, swap, restart
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 45012606476
          name: VYRON-PR67-6.1.28-UNSIGNED-NOT-INSTALLABLE
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr67-628-download
      - name: Local stage, verify backup, guarded app installation and restart
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash -n scripts/vyron-628-pr67-stage-hosted-artifact.sh
          bash -n scripts/vyron-628-pr67-guarded-local-install.sh
          bash scripts/vyron-628-pr67-stage-hosted-artifact.sh
          bash scripts/vyron-628-pr67-guarded-local-install.sh

  publish-install-marker:
    name: Publish non-secret physical install marker
    needs: private-guarded-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record successful physical 6.1.28 install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '{"status":"SUCCESS","version":"6.1.28","source":"270f0b66d71b7a4c9f91984f98a48d0d8374e237","buildRunId":45012606476,"installRunId":%s,"stableFeed":"UNCHANGED"}\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/vyron-628-install.json"
          CONTENT="$(base64 < "$RUNNER_TEMP/vyron-628-install.json" | tr -d '\n')"
          gh api --method PUT repos/ScaleUPPeisov/endlume-desktop/contents/status/vyron-628-install.json \
            -f message="install(vyron): record successful physical 6.1.28 install" \
            -f content="$CONTENT" \
            -f branch="diagnostics/vyron-m1-connection-20261118" >/dev/null
