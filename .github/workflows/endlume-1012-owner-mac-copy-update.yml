name: ENDLUME 10.0.11 to 10.0.12 owner Mac copy update

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/endlume-1012-owner-mac-copy-update.yml'

permissions:
  contents: read

jobs:
  physical-copy-update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify real installed 10.0.11 and create isolated copy
        shell: bash
        run: |
          set -euo pipefail
          SRC='/Applications/ENDLUME YT Studio PEISOV.app'
          test -d "$SRC"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Contents/Info.plist")
          echo "SOURCE_CFBundleShortVersionString=$SHORT"
          echo "SOURCE_CFBundleVersion=$BUILD"
          test "$SHORT" = '10.0.11'
          test "$BUILD" = '10.0.11'
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$SRC/Contents/Info.plist")
          SRC_BIN_SHA=$(shasum -a 256 "$SRC/Contents/MacOS/$EXE" | awk '{print $1}')
          ROOT="$RUNNER_TEMP/endlume-1012-owner-copy-${GITHUB_RUN_ID}"
          TEST_APP="$ROOT/ENDLUME Update Test.app"
          TEST_HOME="$ROOT/home"
          rm -rf "$ROOT"; mkdir -p "$ROOT" "$TEST_HOME/Library/Application Support"
          ditto "$SRC" "$TEST_APP"
          REAL_DATA="$HOME/Library/Application Support/studio.endlume.desktop"
          TEST_DATA="$TEST_HOME/Library/Application Support/studio.endlume.desktop"
          if [ -d "$REAL_DATA" ]; then ditto "$REAL_DATA" "$TEST_DATA"; else mkdir -p "$TEST_DATA"; fi
          for f in license.json library.json; do
            if [ -f "$TEST_DATA/$f" ]; then shasum -a 256 "$TEST_DATA/$f" | awk -v n="$f" '{print n"="$1}' >> "$ROOT/settings-before.txt"; fi
          done
          printf 'ROOT=%s\nTEST_APP=%s\nTEST_HOME=%s\nSRC=%s\nEXE=%s\nSRC_BIN_SHA=%s\n' "$ROOT" "$TEST_APP" "$TEST_HOME" "$SRC" "$EXE" "$SRC_BIN_SHA" >> "$GITHUB_ENV"

      - name: Redirect only the copied 10.0.11 app to staging updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TEST_APP" <<'PY'
          import os,sys
          root=sys.argv[1]
          old=b'endlume-updates.vercel.app'
          new=b'endlume-test012.vercel.app'
          assert len(old)==len(new)
          hits=[]
          for base,_,files in os.walk(root):
            for name in files:
              p=os.path.join(base,name)
              try:data=open(p,'rb').read()
              except OSError:continue
              n=data.count(old)
              if n:
                open(p,'wb').write(data.replace(old,new));hits.append((p,n))
          print('PATCH_HITS',hits)
          if not hits: raise SystemExit('staging endpoint string not found in copied app')
          PY
          xattr -cr "$TEST_APP" || true
          codesign --force --deep --sign - "$TEST_APP"
          codesign --verify --deep --strict "$TEST_APP"
          # Original application must remain byte-for-byte untouched.
          NOW=$(shasum -a 256 "$SRC/Contents/MacOS/$EXE" | awk '{print $1}')
          test "$NOW" = "$SRC_BIN_SHA"
          echo ORIGINAL_APP_UNTOUCHED=PASS

      - name: Verify public staging payload and updater bytes
        shell: bash
        run: |
          set -euo pipefail
          JSON="$ROOT/update.json"
          curl -fsSL 'https://endlume-test012.vercel.app/api/update?target=darwin&arch=aarch64&current_version=10.0.11' -o "$JSON"
          URL=$(python3 - "$JSON" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));assert d['version']=='10.0.12',d;assert d['signature'],d;print(d['url'])
          PY
          )
          curl -fsSL "$URL" -o "$ROOT/update.tar.gz"
          HASH=$(shasum -a 256 "$ROOT/update.tar.gz" | awk '{print $1}')
          echo "STAGING_TAR_SHA256=$HASH"
          test "$HASH" = '760f1da52011cbe9745894eeb04ef3dfef3b5c0e7d85ceb3841f63d67c8ae6e9'
          echo DOWNLOAD=PASS

      - name: Launch copied 10.0.11 and click its native update notice
        shell: bash
        run: |
          set -euo pipefail
          BIN="$TEST_APP/Contents/MacOS/$EXE"
          env HOME="$TEST_HOME" "$BIN" > "$ROOT/app-before-update.log" 2>&1 &
          PID=$!
          echo "OLD_PID=$PID" >> "$GITHUB_ENV"
          echo "Launched copied ENDLUME pid=$PID"
          clicked=0
          for attempt in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then echo 'copied app exited before updater click'; cat "$ROOT/app-before-update.log"; exit 1; fi
            set +e
            OUT=$(osascript - "$PID" <<'APPLESCRIPT'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              try
                set p to first application process whose unix id is targetPid
                set frontmost of p to true
                repeat with w in windows of p
                  try
                    set elems to entire contents of w
                    repeat with e in elems
                      try
                        if (role of e is "AXButton") then
                          set nm to ""
                          try
                            set nm to name of e as text
                          end try
                          if nm contains "ОБНОВИТЬ" and nm does not contain "ПОЗЖЕ" then
                            click e
                            return "CLICKED:" & nm
                          end if
                        end if
                      end try
                    end repeat
                  end try
                end repeat
              on error errText
                return "ERROR:" & errText
              end try
            end tell
            return "NOT_FOUND"
          end run
          APPLESCRIPT
            )
            RC=$?
            set -e
            echo "attempt=$attempt rc=$RC result=$OUT"
            if [[ "$OUT" == CLICKED:* ]]; then clicked=1; break; fi
            sleep 1
          done
          test "$clicked" -eq 1
          echo UPDATE_BUTTON_CLICKED=PASS

      - name: Gate install and relaunch to 10.0.12
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for i in $(seq 1 90); do
            if [ -f "$TEST_APP/Contents/Info.plist" ]; then
              SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$TEST_APP/Contents/Info.plist" 2>/dev/null || true)
              BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TEST_APP/Contents/Info.plist" 2>/dev/null || true)
              if [ "$SHORT" = '10.0.12' ] && [ "$BUILD" = '10.0.12' ]; then installed=1; break; fi
            fi
            sleep 1
          done
          test "$installed" -eq 1
          echo INSTALL=PASS
          echo CFBundleShortVersionString=10.0.12
          echo CFBundleVersion=10.0.12
          sleep 3
          if ps -axo command= | grep -F "$TEST_APP/Contents/MacOS/$EXE" | grep -v grep >/dev/null; then
            echo RELAUNCH=PASS
          else
            echo 'updated test copy was installed but relaunch process was not found'
            exit 1
          fi
          # About/Settings version is compiled into the installed web assets/binary; require the value to be present.
          if grep -R -a -q '10.0.12' "$TEST_APP/Contents"; then echo ABOUT_VERSION_PAYLOAD=PASS; else exit 1; fi

      - name: Verify copied settings survived and original app is still 10.0.11
        shell: bash
        run: |
          set -euo pipefail
          TEST_DATA="$TEST_HOME/Library/Application Support/studio.endlume.desktop"
          touch "$ROOT/settings-after.txt"
          for f in license.json library.json; do
            if [ -f "$TEST_DATA/$f" ]; then shasum -a 256 "$TEST_DATA/$f" | awk -v n="$f" '{print n"="$1}' >> "$ROOT/settings-after.txt"; fi
          done
          sort -o "$ROOT/settings-before.txt" "$ROOT/settings-before.txt" 2>/dev/null || true
          sort -o "$ROOT/settings-after.txt" "$ROOT/settings-after.txt"
          diff -u "$ROOT/settings-before.txt" "$ROOT/settings-after.txt"
          echo SETTINGS_PRESERVED=PASS
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$SRC/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$SRC/Contents/Info.plist")
          NOW=$(shasum -a 256 "$SRC/Contents/MacOS/$EXE" | awk '{print $1}')
          test "$SHORT" = '10.0.11'; test "$BUILD" = '10.0.11'; test "$NOW" = "$SRC_BIN_SHA"
          echo ORIGINAL_INSTALLED_10_0_11_UNTOUCHED=PASS
          pkill -f "$TEST_APP/Contents/MacOS/$EXE" || true

      - name: Upload owner-Mac updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.11-to-10.0.12-owner-mac-copy
          path: |
            ${{ runner.temp }}/endlume-1012-owner-copy-${{ github.run_id }}/update.json
            ${{ runner.temp }}/endlume-1012-owner-copy-${{ github.run_id }}/settings-before.txt
            ${{ runner.temp }}/endlume-1012-owner-copy-${{ github.run_id }}/settings-after.txt
            ${{ runner.temp }}/endlume-1012-owner-copy-${{ github.run_id }}/app-before-update.log
          if-no-files-found: warn
          retention-days: 14
