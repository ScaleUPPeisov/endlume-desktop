name: VYRON physical Mac read-only connection probe

on:
  push:
    branches:
      - diagnostics/vyron-m1-connection-20261118
    paths:
      - .github/workflows/vyron-m1-connection-probe.yml

permissions:
  contents: read

jobs:
  probe-physical-vyron-mac:
    name: Physical VYRON M1 connection (read-only)
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 5
    steps:
      - name: Verify Mac and VYRON without accessing user data
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PROBE_MODE=READ_ONLY"
          if [ "$(uname -m)" = "arm64" ]; then
            echo "PHYSICAL_MAC_ARM64=PASS"
          else
            echo "PHYSICAL_MAC_ARM64=FAIL"
            exit 1
          fi
          installed=no
          for bundle in "/Applications/VYRON.app" "$HOME/Applications/VYRON.app"; do
            if [ -f "$bundle/Contents/Info.plist" ]; then
              installed=yes
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" 2>/dev/null || printf 'unknown')
              case "$version" in
                *[!0-9A-Za-z._-]*) version=redacted ;;
              esac
              echo "VYRON_APP_VERSION=$version"
              break
            fi
          done
          echo "VYRON_INSTALLED_STANDARD_LOCATION=$installed"
          if /usr/bin/pgrep -x channelflow >/dev/null 2>&1; then
            echo "VYRON_PROCESS_RUNNING=YES"
          else
            echo "VYRON_PROCESS_RUNNING=NO_OR_DIFFERENT_NAME"
          fi
          echo "VYRON_MAC_READ_ONLY_CONNECTION=PASS"
      - name: Read-only aggregate of VYRON local inventory (never print video data)
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/"Library"/"Application Support"/"studio.channelflow.desktop"/"youtube-inventory"
          print("VYRON_INVENTORY_DIR_PRESENT="+("YES" if root.is_dir() else "NO"))
          if root.is_dir():
              files=[x for x in root.iterdir() if x.is_file() and x.suffix==".json"]
              counts={"files":len(files),"valid":0,"corrupt":0,"schema_mismatch":0,
                  "schedule_complete_true":0,"schedule_complete_false":0,
                  "video_entries":0,"entries_with_publishAt":0,"with_last_complete_at":0,
                  "large_files_skipped":0}
              for p in files:
                  try:
                      if p.stat().st_size>20_000_000:
                          counts["large_files_skipped"]+=1
                          continue
                      d=json.loads(p.read_text(encoding="utf-8"))
                      if not isinstance(d,dict):
                          counts["corrupt"]+=1
                          continue
                      counts["valid"]+=1
                      if d.get("schemaVersion")!=2:
                          counts["schema_mismatch"]+=1
                      s=d.get("syncInfo")
                      if isinstance(s,dict) and s.get("scheduleComplete") is True:
                          counts["schedule_complete_true"]+=1
                      else:
                          counts["schedule_complete_false"]+=1
                      if d.get("lastCompleteAt"):
                          counts["with_last_complete_at"]+=1
                      videos=d.get("videos")
                      if isinstance(videos,list):
                          counts["video_entries"]+=len(videos)
                          counts["entries_with_publishAt"]+=sum(1 for v in videos if isinstance(v,dict) and v.get("publishAt"))
                  except (OSError,ValueError,UnicodeError):
                      counts["corrupt"]+=1
              for k,v in counts.items():
                  print("INVENTORY_"+k.upper()+"="+str(v))
          print("VYRON_LOCAL_INVENTORY_READ_ONLY=PASS")
          PY
      - name: Correlate active channel state with cached schedule safely
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path.home()/"Library"/"Application Support"/"studio.channelflow.desktop"
          statefile=root/"state.json"
          cache=root/"youtube-inventory"
          now=datetime.now(timezone.utc)
          if not statefile.is_file():
              print("VYRON_STATE_PRESENT=NO")
          else:
              try:
                  state=json.loads(statefile.read_text(encoding="utf-8"))
                  channels=state.get("channels",[])
                  if not isinstance(channels,list):
                      channels=[]
                  print("VYRON_STATE_PRESENT=YES")
                  print("VYRON_STATE_CHANNELS="+str(len(channels)))
                  all_ids=set()
                  mapped=0
                  targets={"Neon Drive FM":"NEON_DRIVE_FM","After Dark Voice":"AFTER_DARK_VOICE"}
                  for channel in channels:
                      if not isinstance(channel,dict): continue
                      cid=channel.get("id")
                      if not isinstance(cid,str) or not cid or "/" in cid or ".." in cid: continue
                      all_ids.add(cid)
                      p=cache/(cid+".json")
                      if p.is_file(): mapped+=1
                      if channel.get("name") in targets:
                          label=targets[channel["name"]]
                          print(label+"_CHANNEL_IN_STATE=YES")
                          print(label+"_CACHE_PRESENT="+("YES" if p.is_file() else "NO"))
                          if p.is_file() and p.stat().st_size < 20_000_000:
                              try:
                                  data=json.loads(p.read_text(encoding="utf-8"))
                                  videos=data.get("videos",[])
                                  if not isinstance(videos,list):videos=[]
                                  info=data.get("syncInfo",{})
                                  if not isinstance(info,dict):info={}
                                  future=0
                                  for v in videos:
                                      if not isinstance(v,dict) or str(v.get("privacyStatus","")).lower()!="private":
                                          continue
                                      ts=v.get("publishAt")
                                      if not isinstance(ts,str): continue
                                      try:
                                          if datetime.fromisoformat(ts.replace("Z","+00:00"))>now:
                                              future+=1
                                      except ValueError:
                                          pass
                                  print(label+"_CACHED_VIDEOS="+str(len(videos)))
                                  print(label+"_FUTURE_PRIVATE_PUBLISH_AT="+str(future))
                                  print(label+"_SCHEDULE_COMPLETE="+str(info.get("scheduleComplete") is True).upper())
                                  print(label+"_SYNC_COMPLETE="+str(info.get("syncComplete") is True).upper())
                                  print(label+"_COVERAGE_VERIFIED="+str(info.get("scheduledCoverageVerified") is True).upper())
                                  print(label+"_LAST_COMPLETE_PRESENT="+str(bool(data.get("lastCompleteAt"))).upper())
                              except (OSError,ValueError,UnicodeError):
                                  print(label+"_CACHE_READABLE=NO")
                  print("VYRON_ACTIVE_CHANNELS_WITH_CACHE="+str(mapped))
                  if cache.is_dir():
                      n=sum(1 for p in cache.glob("*.json") if p.stem not in all_ids)
                      print("VYRON_UNMATCHED_CACHE_FILES="+str(n))
                  for name,label in targets.items():
                      if not any(isinstance(c,dict) and c.get("name")==name for c in channels):
                          print(label+"_CHANNEL_IN_STATE=NO")
              except (OSError,ValueError,UnicodeError):
                  print("VYRON_STATE_PARSE=FAILED")
          print("VYRON_TARGET_SCHEDULE_AUDIT_READ_ONLY=PASS")
          PY
      - name: Inspect affected owner inventory statuses (read-only, aggregate only)
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/"Library"/"Application Support"/"studio.channelflow.desktop"
          state=json.loads((root/"state.json").read_text(encoding="utf-8"))
          targets={"Neon Drive FM":"NEON","After Dark Voice":"AFTER_DARK","Midnight Noir Lounge":"MIDNIGHT_NOIR"}
          channels=state.get("channels",[])
          for name,label in targets.items():
              channel=next((x for x in channels if isinstance(x,dict) and x.get("name")==name),None)
              if not channel:
                  print(label+"_FOUND=NO")
                  continue
              p=root/"youtube-inventory"/(channel["id"]+".json")
              if not p.is_file():
                  print(label+"_CACHE_PRESENT=NO")
                  continue
              d=json.loads(p.read_text(encoding="utf-8"))
              rows=d.get("videos")
              if not isinstance(rows,list):rows=[]
              counts={"public":0,"private":0,"unlisted":0,"unknown":0,
                      "private_with_publish_at":0,"other_with_publish_at":0}
              for row in rows:
                  if not isinstance(row,dict):continue
                  privacy=str(row.get("privacyStatus") or "unknown").lower()
                  key=privacy if privacy in ("public","private","unlisted") else "unknown"
                  counts[key]+=1
                  if row.get("publishAt"):
                      counts["private_with_publish_at" if key=="private" else "other_with_publish_at"]+=1
              for key,value in counts.items():print(label+"_"+key.upper()+"="+str(value))
              info=d.get("syncInfo") or {}
              if not isinstance(info,dict):info={}
              reasons=info.get("incompleteReasons") or []
              if not isinstance(reasons,list):reasons=[]
              allowed={"SCHEDULE_EMPTY_NOT_INDEPENDENTLY_VERIFIED",
                  "OWNER_SEARCH_PAGE_LIMIT","OWNER_SEARCH_NOT_EXHAUSTED",
                  "OWNER_SEARCH_FAILED","UPLOADS_PLAYLIST_SCHEDULE_COVERAGE_MISMATCH",
                  "MISSING_VIDEO_HYDRATION","PLAYLIST_TOTAL_METADATA_MISMATCH",
                  "PLAYLIST_NOT_EXHAUSTED","SCHEDULE_DATA_INCOMPLETE"}
              codes=sorted(set(str(x) for x in reasons if str(x) in allowed))
              print(label+"_INCOMPLETE_REASON_COUNT="+str(len(reasons)))
              print(label+"_ALLOWED_REASON_CODES="+(",".join(codes) or "NONE"))
              print(label+"_SYNCINFO_KEYS="+str(len(info)))
          print("VYRON_AFFECTED_CHANNELS_CACHE_READ_ONLY=PASS")
          PY
      - name: Audit VIDEO 041-043 collision evidence from installed VYRON (metadata only)
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json, collections
          from pathlib import Path
          p=Path.home()/"Library"/"Application Support"/"studio.channelflow.desktop"/"state.json"
          state=json.loads(p.read_text(encoding="utf-8"))
          jobs=[j for j in state.get("jobs",[]) if isinstance(j,dict)]
          hist=[h for h in state.get("uploadHistory",[]) if isinstance(h,dict)]
          target=[j for j in jobs if j.get("number") in (41,42,43)]
          print("QUEUE_DIAG_JOBS_ALL="+str(len(jobs)))
          print("QUEUE_DIAG_HISTORY_ALL="+str(len(hist)))
          print("QUEUE_DIAG_TARGET_041_043="+str(len(target)))
          print("QUEUE_DIAG_TARGET_CHANNELS="+str(len(set(str(j.get("channelId","")) for j in target))))
          print("QUEUE_DIAG_TARGET_JOB_ID_UNIQUE="+str(len(set(str(j.get("id","")) for j in target))))
          print("QUEUE_DIAG_TARGET_REMOTE_VIDEO_ID_COUNT="+str(sum(bool(j.get("youtubeVideoId")) for j in target)))
          valid_states={"READY_UPLOAD","UPLOADING","SCHEDULED","ERROR","NEED_IMAGE","PENDING","READY"}
          states=collections.Counter(str(j.get("status","UNKNOWN")) for j in target)
          for key in sorted(valid_states):
              if states[key]: print("QUEUE_DIAG_TARGET_STATUS_"+key+"="+str(states[key]))
          print("QUEUE_DIAG_TARGET_STATUS_OTHER="+str(sum(v for k,v in states.items() if k not in valid_states)))
          for kind, field in (("CURRENT", "currentSourceFingerprint"),("UPLOADED","uploadFingerprint")):
              values=[(str(j.get("channelId","")),str(j.get(field,"")).lower()) for j in target if j.get(field)]
              counts=collections.Counter(values)
              print("QUEUE_DIAG_TARGET_"+kind+"_FINGERPRINTS_PRESENT="+str(len(values)))
              print("QUEUE_DIAG_TARGET_"+kind+"_SAME_CHANNEL_FINGERPRINT_COLLISIONS="+str(sum(v-1 for v in counts.values() if v>1)))
          ids=set(str(j.get("id","")) for j in target)
          target_hist=[h for h in hist if str(h.get("jobId","")) in ids]
          print("QUEUE_DIAG_TARGET_HISTORY_RECORDS="+str(len(target_hist)))
          print("QUEUE_DIAG_TARGET_HISTORY_WITH_YOUTUBE_ID="+str(sum(bool(h.get("youtubeVideoId")) for h in target_hist)))
          error_codes={"UPLOAD_QUEUE_DUPLICATE","UPLOAD_QUEUE_DUPLICATE_VERIFIED","UPLOAD_ALREADY_HAS_VIDEO_ID","UPLOAD_QUEUE_PERSIST_FAILED"}
          for code in sorted(error_codes):
              count=sum(code in str(j.get("error","")) for j in target)
              print("QUEUE_DIAG_TARGET_ERROR_"+code+"="+str(count))
          print("QUEUE_DIAG_LOCAL_STATE_READ_ONLY=PASS")
          PY
