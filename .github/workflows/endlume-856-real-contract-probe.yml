name: ENDLUME 8.56 Real Contract Probe
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Restore sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true
      - name: Probe exact real 1-image 15-MP3 warm path
        shell: bash
        run: |
          set -Eeuo pipefail
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          BASE="$(find /Volumes -type d -name "$UUID" -print -quit 2>/dev/null || true)"; test -d "$BASE"
          SIDE="$(find "$BASE" -type f -path '*/Rendered/logs/*' -name '*project.json' -print -quit 2>/dev/null || true)"; test -f "$SIDE"
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          TMP="$(mktemp -d /tmp/e856contract.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          python3 - "$SIDE" "$TMP/env" <<'PY'
          import json,shlex,sys
          d=json.load(open(sys.argv[1])); assert len(d['project']['media'])==1; assert len(d['project']['audio'])==15
          lines=['IMG='+shlex.quote(d['project']['media'][0])]
          for i,e in enumerate([x for x in d['effects'] if x.get('enabled')]): lines.append(f'FX{i+1}='+shlex.quote(e['source']))
          lines.append('AUDIO_JSON='+shlex.quote(json.dumps(d['project']['audio'],ensure_ascii=False)))
          open(sys.argv[2],'w').write('\n'.join(lines))
          PY
          source "$TMP/env"
          : "${FX1:?}"; : "${FX2:?}"
          # Exact current output look, but chromakey+scale are losslessly cached once.
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          WARM="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          t0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$WARM" -map '[outv]' -t 30 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 1800 -tag:v hvc1 -pix_fmt yuv420p -r 60 -video_track_timescale 60000 -y "$TMP/master.mp4"
          t1=$(python3 -c 'import time;print(time.time())')
          python3 - "$t0" "$t1" <<'PY'
          import sys
          dt=float(sys.argv[2])-float(sys.argv[1]); print('WARM_MASTER_30_SEC',round(dt,3)); assert dt<=20.0,dt
          PY
          python3 - "$AUDIO_JSON" "$FFP" "$TMP" <<'PY'
          import json,subprocess,sys,os
          tracks=json.loads(sys.argv[1]); ffp=sys.argv[2]; tmp=sys.argv[3]; ds=[]; sig=None
          for i,p in enumerate(tracks):
            out=subprocess.check_output([ffp,'-v','error','-select_streams','a:0','-show_entries','stream=codec_name,sample_rate,channels:format=duration','-of','json',p],text=True)
            j=json.loads(out); s=j['streams'][0]; cur=(s['codec_name'],int(s['sample_rate']),int(s['channels'])); assert cur[0]=='mp3',cur
            sig=sig or cur; assert cur==sig,(sig,cur); ds.append(float(j['format']['duration']))
          target=7200.0;t=0.0;i=0
          while t<target: t+=ds[i%len(ds)]; i+=1
          print('WHOLE_TRACK_FINAL_SEC',round(t,3)); open(os.path.join(tmp,'final_duration'),'w').write(str(t))
          PY
          FINAL="$(cat "$TMP/final_duration")"
          python3 - "$AUDIO_JSON" "$TMP/audio-list.txt" <<'PY'
          import json,sys
          def esc(s): return s.replace('\\','/').replace("'","'\\''")
          open(sys.argv[2],'w').write('\n'.join("file '"+esc(x)+"'" for x in json.loads(sys.argv[1])))
          PY
          t0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -f concat -safe 0 -i "$TMP/audio-list.txt" -map 0:a:0 -c:a copy -map_metadata -1 -write_xing 0 -id3v2_version 0 -y "$TMP/audio-cycle.mp3"
          "$FFM" -hide_banner -loglevel error -i "$TMP/master.mp4" -stream_loop -1 -fflags +genpts -i "$TMP/audio-cycle.mp3" -t "$FINAL" -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -y "$TMP/seed.mov"
          t1=$(python3 -c 'import time;print(time.time())')
          python3 - "$t0" "$t1" <<'PY'
          import sys
          dt=float(sys.argv[2])-float(sys.argv[1]); print('AUDIO_COPY_PLUS_SEED_SEC',round(dt,3)); assert dt<=10.0,dt
          PY
          "$FFP" -v error -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate,sample_rate,channels -of json "$TMP/master.mp4"
          "$FFP" -v error -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate,sample_rate,channels -of json "$TMP/seed.mov"
          echo PASS_REAL_856_WARM_CONTRACT
