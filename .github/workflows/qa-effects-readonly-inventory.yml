name: QA ENDLUME Effects read-only inventory

on:
  push:
    branches:
      - qa/endlume-effects-readonly-inventory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Read-only historical canonical Effect records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json
          home=pathlib.Path.home()
          diag=home/'.github-runners'/'endlume-desktop-macos-arm64'/'_diag'
          exact=['825dd7a4-f0cf-4032-a3c9-64290cb5756d','9951d1c3-5ff6-4a37-891f-1c323889a663']
          smoke_terms=['smoke or steam','get-save.com','smoke green screen','smoke effect','smoke preset','smoke_effect','smoke id','"name":"smoke','"name": "smoke','дым']
          interesting=[]
          for p in sorted(diag.glob('Worker_*.log')):
            try: lines=p.read_text(errors='ignore').splitlines()
            except Exception: continue
            for i,line in enumerate(lines):
              low=line.lower()
              reason=[]
              for x in exact:
                if x.lower() in low: reason.append(x)
              for x in smoke_terms:
                if x in low: reason.append(x)
              if reason:
                # Ignore bare workflow/script names unless nearby context contains record-like details.
                lo=max(0,i-5); hi=min(len(lines),i+6)
                ctx='\n'.join(lines[lo:hi])
                ctxlow=ctx.lower()
                recordish=(any(x.lower() in ctxlow for x in exact) or any(k in ctxlow for k in ['source','library.json','effect','preset','uuid','get-save.com','enabled','usage']))
                if recordish:
                  interesting.append((str(p),i+1,reason,ctx))
          # Deduplicate contexts by file + approximate line window and cap noise.
          emitted=0; last={}
          for p,line,reason,ctx in interesting:
            if emitted>=160: break
            prev=last.get(p,-999)
            if line-prev<8: continue
            last[p]=line
            print(f'=== CONTEXT file={p} line={line} reason={json.dumps(reason,ensure_ascii=False)} ===')
            print(ctx)
            emitted+=1
          print(f'CONTEXTS_EMITTED={emitted}')

          print('=== CURRENT MANAGED EFFECT ASSETS ===')
          d=home/'Library'/'Application Support'/'studio.endlume.desktop'/'library-assets'/'effects'
          if d.is_dir():
            for p in sorted(d.iterdir()):
              if p.is_file(): print(f'{p.name}\t{p.stat().st_size}\t{p}')
          print('READ_ONLY_HISTORY_EXTRACT_DONE')
          PY
