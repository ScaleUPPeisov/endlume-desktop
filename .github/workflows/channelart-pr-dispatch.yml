name: ChannelArt silent dispatch
on:
  pull_request:
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch silent M1 installer build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run channelart-one-shot.yml --repo "$GITHUB_REPOSITORY" --ref main
