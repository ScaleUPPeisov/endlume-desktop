name: ENDLUME 8.45 Self-Hosted Candidate

on:
  push:
    branches: [endlume-v845-performance-finalize-release]
    paths: ['endlume-845-selfhosted-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-845-selfhosted-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.0.0-alpha.8.45
      TAG: endlume-v1.0.0-alpha.8.45
    steps:
      - name: Checkout 8.45 candidate
        uses: actions/checkout@v4
        with:
          ref: endlume-v845-performance-finalize-release
          clean: true
          fetch-depth: 1

      - name: Verify self-hosted Apple Silicon runner
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v node; command -v npm; command -v cargo; command -v ffmpeg; command -v ffprobe
          test -s "$HOME/.endlume-updater/endlume.key"
          test -s "$HOME/.endlume-updater/endlume.key.pub"
          echo "Runner ${RUNNER_NAME:-unknown} ready"

      - name: Prepare exact 8.45 builder from proven 8.40 pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('scripts/build-endlume-840-fast-ci.sh').read_text()
          src=src.replace("VERSION='1.0.0-alpha.8.40'","VERSION='1.0.0-alpha.8.45'",1)
          src=src.replace('ENDLUME 8.40 FAST CI','ENDLUME 8.45 FINALIZE CI')
          src=src.replace('"version": "1\\.0\\.0-alpha\\.8\\.40"','"version": "1\\.0\\.0-alpha\\.8\\.45"',1)
          needle='python3 scripts/apply-vyron-bridge-8-40.py\nnpm run check'
          repl='python3 scripts/apply-vyron-bridge-8-40.py\npython3 scripts/apply-finalize-performance-8-45.py\nchmod +x scripts/validate-release-8-45.sh\nscripts/validate-release-8-45.sh\nnpm run check'
          if needle not in src: raise SystemExit('8.45 injection marker missing')
          Path('/tmp/build-endlume-845-ci.sh').write_text(src.replace(needle,repl,1))
          PY
          chmod +x /tmp/build-endlume-845-ci.sh

      - name: Build signed candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          ART="$HOME/.endlume-release-bridge/endlume/845-candidate"
          rm -rf "$ART"; mkdir -p "$ART"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$HOME/.endlume-updater/endlume.key"
          export TAURI_SIGNING_PRIVATE_KEY="$HOME/.endlume-updater/endlume.key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          export ENDLUME_RELEASE_ARTIFACT_DIR="$ART"
          export ENDLUME_CI_ARTIFACT_DIR="$ART"
          export ENDLUME_CI_ASSET_NAME="ENDLUME-Studio-${VERSION}-macos-arm64.zip"
          export ENDLUME_RELEASE_PLATFORM="darwin-aarch64"
          export ENDLUME_RELEASE_VERSION="$VERSION"
          export ENDLUME_UPDATER_PUBLIC_KEY_FILE="$HOME/.endlume-updater/endlume.key.pub"
          export ENDLUME_UPDATER_ENDPOINT="https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/latest.json"
          /tmp/build-endlume-845-ci.sh
          find "$ART" -maxdepth 2 -type f -print

      - name: Verify 97 percent deadlock and fidelity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          scripts/validate-release-8-45.sh
          grep -Fq 'FFPROBE_TIMEOUT_SECS' src-tauri/src/render.rs
          grep -Fq '"final-verify"' src-tauri/src/render.rs
          grep -Fq '"-c:v","copy","-c:a","copy"' src-tauri/src/render.rs
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Verify packaged app identity and ARM64
        shell: bash
        run: |
          set -Eeuo pipefail
          ART="$HOME/.endlume-release-bridge/endlume/845-candidate"
          TAR="$(find "$ART" -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$TAR" -a -s "$TAR"
          test -s "$TAR.sig"
          U="$ART/unpack"; rm -rf "$U"; mkdir -p "$U"; /usr/bin/tar -xzf "$TAR" -C "$U"
          APP="$(find "$U" -maxdepth 4 -type d -name 'ENDLUME Studio.app' -print -quit)"
          test -n "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.endlume.desktop
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          EXE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          codesign --verify --deep --strict "$APP"

      - name: Publish 8.45 release and signed updater
        shell: bash
        env:
          ENDLUME_RELEASE_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          ART="$HOME/.endlume-release-bridge/endlume/845-candidate"
          TAR="$(find "$ART" -type f -name '*.app.tar.gz' -print -quit)"; SIG="$TAR.sig"
          CANON="$ART/ENDLUME-macos-aarch64.app.tar.gz"; CANSIG="$CANON.sig"
          cp "$TAR" "$CANON"; cp "$SIG" "$CANSIG"
          ZIP="$(find "$ART" -type f -name 'ENDLUME-Studio-*.zip' -print -quit)"
          test -s "$CANON" -a -s "$CANSIG"
          NOTES="$(python3 -c 'import json;print(json.load(open("updates/release-candidate.json"))["notes"])')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$TAG" "$CANON" "$CANSIG" ${ZIP:+"$ZIP"} --clobber --repo "$GITHUB_REPOSITORY"; gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "ENDLUME Studio $VERSION" --notes "$NOTES"; else gh release create "$TAG" "$CANON" "$CANSIG" ${ZIP:+"$ZIP"} --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ENDLUME Studio $VERSION" --notes "$NOTES"; fi
          test -n "${ENDLUME_RELEASE_TOKEN:-}" || { echo 'ENDLUME_RELEASE_TOKEN missing' >&2; exit 1; }
          export GH_TOKEN="$ENDLUME_RELEASE_TOKEN"
          HOST=ScaleUPPeisov/scaleup-site; STABLE=endlume-stable; URL="https://github.com/$HOST/releases/download/$STABLE/ENDLUME-macos-aarch64.app.tar.gz"
          SIGTEXT="$(tr -d '\r\n' < "$CANSIG")"
          python3 - "$ART/latest.json" "$VERSION" "$URL" "$SIGTEXT" <<'PY'
          import datetime,json,sys
          p,v,u,s=sys.argv[1:]
          json.dump({'version':v,'notes':'ENDLUME 8.45 FFprobe/finalize reliability hotfix; render/audio fidelity pipeline preserved.','pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'platforms':{'darwin-aarch64':{'url':u,'signature':s}}},open(p,'w'),ensure_ascii=False,indent=2)
          PY
          gh release view "$STABLE" --repo "$HOST" >/dev/null 2>&1 || gh release create "$STABLE" --repo "$HOST" --title 'ENDLUME Stable Updates' --notes 'Signed updater channel for ENDLUME Studio.'
          gh release upload "$STABLE" "$CANON" "$CANSIG" "$ART/latest.json" --clobber --repo "$HOST"
          curl -fsSL "$URL" -o /dev/null
          curl -fsSL "https://github.com/$HOST/releases/download/$STABLE/latest.json" | python3 -c 'import json,sys;d=json.load(sys.stdin);assert d["version"]=="1.0.0-alpha.8.45"'

      - name: Promote tested source to release
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin release
          git merge-base --is-ancestor origin/release HEAD
          git push origin HEAD:release
          echo 'ENDLUME 8.45 tested source promoted to release'
