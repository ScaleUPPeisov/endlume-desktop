name: ENDLUME 8.62 Windows Production Build & Publish

on:
  push:
    branches: [windows/endlume-862-qa-fixes]
    paths:
      - '.github/workflows/endlume-862-windows-production.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-862-windows-production
  cancel-in-progress: false

env:
  QA_SOURCE_SHA: cc42a23094dc92590e0f2ecf0a1cfeeca5cf5961
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  ENDLUME_VERSION: 1.0.0-alpha.8.62
  FINAL_INSTALLER: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.62-x64.exe
  RELEASE_TAG: endlume-v1.0.0-alpha.8.62-windows
  RELEASE_TITLE: ENDLUME YT Studio PEISOV 1.0.0-alpha.8.62 Windows

jobs:
  build-publish:
    name: Windows x64 • NSIS • Publish 8.62
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120

    steps:
      - name: Checkout exact software-QA source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact QA source and version surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$QA_SOURCE_SHA"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          expected='1.0.0-alpha.8.62'
          pkg=json.loads(Path('package.json').read_text())
          lock=json.loads(Path('package-lock.json').read_text())
          tauri=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          win=json.loads(Path('src-tauri/tauri.windows.conf.json').read_text())
          cargo=Path('src-tauri/Cargo.toml').read_text()
          cargo_lock=Path('src-tauri/Cargo.lock').read_text()
          settings=Path('src/pages/SettingsPage.tsx').read_text()
          history=Path('src/components/ReleaseHistory.tsx').read_text()
          assert pkg['version']==expected,pkg['version']
          assert lock['version']==expected,lock['version']
          assert tauri['version']==expected,tauri['version']
          assert re.search(r'^version\s*=\s*"'+re.escape(expected)+r'"$',cargo,re.M)
          root=cargo_lock[cargo_lock.index('name = "endlume"'):]
          assert f'version = "{expected}"' in root[:300]
          assert expected in settings
          assert f"version:'{expected}'" in history
          assert win['productName']=='ENDLUME YT Studio PEISOV'
          assert win['mainBinaryName']=='ENDLUME YT Studio PEISOV'
          assert win['identifier']=='studio.endlume.desktop'
          assert win['bundle']['targets']==['nsis']
          assert win['bundle']['windows']['nsis']['installerIcon']=='icons/icon.ico'
          print('ENDLUME_862_VERSION_SURFACE_GREEN')
          PY

      - name: Assert 8.61 production release remains immutable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/endlume-v1.0.0-alpha.8.61-windows"             --jq '.assets[] | select(.name=="ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe") | [.name,.size,.digest] | @tsv'             | grep -F $'ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe\t98228835\tsha256:3029774d277833194588488c82211b07bb5e52c402442581c139d151da98f1a2'

      - name: Install cross-build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v brew >/dev/null
          command -v rustup >/dev/null
          command -v cargo >/dev/null
          command -v npm >/dev/null
          brew list nsis >/dev/null 2>&1 || brew install nsis
          brew list llvm >/dev/null 2>&1 || brew install llvm
          command -v gh >/dev/null 2>&1 || brew install gh
          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          export PATH="$LLVM_BIN:$PATH"
          rustup target add "$WINDOWS_TARGET"
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          fi
          makensis -VERSION
          cargo xwin --version

      - name: Stage pinned Windows FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_TAG='autobuild-2026-09-14-13-17'
          ARCHIVE='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          CACHE="$RUNNER_TEMP/endlume-ffmpeg-862"
          ZIP="$CACHE/$ARCHIVE"
          EXTRACT="$CACHE/extract"
          DEST='src-tauri/binaries'
          rm -rf "$EXTRACT"
          mkdir -p "$CACHE" "$EXTRACT" "$DEST"
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --output "$ZIP" "$URL"
          fi
          ditto -x -k "$ZIP" "$EXTRACT"
          FFMPEG="$(find "$EXTRACT" -type f -name ffmpeg.exe -print -quit)"
          FFPROBE="$(find "$EXTRACT" -type f -name ffprobe.exe -print -quit)"
          test -n "$FFMPEG"; test -n "$FFPROBE"
          cp "$FFMPEG" "$DEST/ffmpeg-$WINDOWS_TARGET.exe"
          cp "$FFPROBE" "$DEST/ffprobe-$WINDOWS_TARGET.exe"
          python3 - <<'PY'
          from pathlib import Path
          target='x86_64-pc-windows-msvc'
          for name in ('ffmpeg','ffprobe'):
              p=Path('src-tauri/binaries')/f'{name}-{target}.exe'
              assert p.is_file() and p.stat().st_size>1_000_000,p
              with p.open('rb') as f: assert f.read(2)==b'MZ',p
              print(name,p.stat().st_size,'PE/MZ OK')
          print('WINDOWS_FFMPEG_FFPROBE_PE_GREEN')
          PY

      - name: Build frontend for Tauri
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build

      - name: Verify release-critical Windows contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/test-windows-861-strict-port.py
          python3 scripts/test-windows-861-release-surface.py
          python3 scripts/test-managed-license-render-gate.py
          python3 scripts/test-runtime-safety-8-62.py

      - name: Build Windows x64 NSIS 8.62
        shell: bash
        run: |
          set -Eeuo pipefail
          LLVM_BIN="$(brew --prefix llvm)/bin"
          export PATH="$LLVM_BIN:$PATH"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          cfg=json.loads(p.read_text())
          assert cfg['version']=='1.0.0-alpha.8.62'
          # Manual installer release is independent from stable updater publication.
          # Keep runtime signature verification intact; only skip generating updater
          # artifacts because the matching private signing key is intentionally absent.
          assert cfg['bundle']['createUpdaterArtifacts'] is True
          cfg['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('STABLE_UPDATER_ARTIFACT_GENERATION_SKIPPED_PENDING_SIGNING_KEY=1')
          PY
          npm run tauri build --             --runner cargo-xwin             --target "$WINDOWS_TARGET"             --bundles nsis             --config src-tauri/tauri.windows.conf.json

      - name: Normalize and verify production installer
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"
          if [ ! -s "$FINAL" ]; then
            CANDIDATE="$(find "$NSIS_DIR" -maxdepth 1 -type f -name '*.exe' ! -name "$FINAL_INSTALLER" -print -quit)"
            test -n "$CANDIDATE"
            cp "$CANDIDATE" "$FINAL"
          fi
          test -s "$FINAL"
          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          assert p.stat().st_size>1_000_000
          with p.open('rb') as f: assert f.read(2)==b'MZ'
          print('NSIS_PE_MZ_GREEN',p.stat().st_size)
          PY
          SHA="$(shasum -a 256 "$FINAL" | awk '{print $1}')"
          SIZE="$(stat -f%z "$FINAL")"
          printf '%s  %s\n' "$SHA" "$FINAL_INSTALLER" > "$FINAL.sha256"
          test "$(awk '{print $1}' "$FINAL.sha256")" = "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "installer=$FINAL" >> "$GITHUB_OUTPUT"
          echo "checksum=$FINAL.sha256" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERIFIED=YES"
          echo "NSIS_VERIFIED=YES"
          echo "INSTALLER_SIZE=$SIZE"
          echo "INSTALLER_SHA256=$SHA"

      - name: Publish immutable Windows 8.62 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_SHA: ${{ steps.verify.outputs.sha }}
          INSTALLER_SIZE: ${{ steps.verify.outputs.size }}
          INSTALLER_PATH: ${{ steps.verify.outputs.installer }}
          CHECKSUM_PATH: ${{ steps.verify.outputs.checksum }}
        run: |
          set -Eeuo pipefail
          NOTES="$RUNNER_TEMP/endlume-862-release-notes.md"
          cat > "$NOTES" <<EOF
          ENDLUME YT Studio PEISOV 1.0.0-alpha.8.62 Windows

          Software QA: PASS
          Hardware E2E: PENDING HARDWARE
          Stable updater: PENDING SIGNING KEY

          Fixes:
          - managed license generation strengthened to 160-bit cryptographic keys;
          - OWNER license minting restricted to OWNER;
          - stronger database/device/license isolation and ENDLUME integrity constraints;
          - duplicate production render prevention;
          - remote revoke enforcement hardened through finalization;
          - synthetic MOV/free-atom size padding removed;
          - backend database errors sanitized from client responses;
          - duplicate privileged RPC access hardened;
          - ENDLUME Supabase integrity/index hardening;
          - application version metadata synchronized to 1.0.0-alpha.8.62.

          Natural real-media QA:
          - five masters: 18.333 / 18.056 / 18.043 / 18.031 / 18.096 s;
          - Subscribe OFF: 207,824,213 bytes, 7468.083 s, HEVC 1920x1080 CFR 60, MP3 packet-copy;
          - Subscribe ON: 324,012,891 bytes, 7468.083 s, HEVC 1920x1080 CFR 60;
          - no synthetic padding.

          Source QA commit: $QA_SOURCE_SHA
          Installer SHA-256: $INSTALLER_SHA
          Installer bytes: $INSTALLER_SIZE
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; verifying immutability instead of overwriting."
          else
            gh release create "$RELEASE_TAG"               "$INSTALLER_PATH" "$CHECKSUM_PATH"               --repo "$GITHUB_REPOSITORY"               --target "$QA_SOURCE_SHA"               --title "$RELEASE_TITLE"               --notes-file "$NOTES"
          fi

          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          EXE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$FINAL_INSTALLER" '.assets[] | select(.name==$n) | .id')"
          EXE_SIZE="$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$FINAL_INSTALLER" '.assets[] | select(.name==$n) | .size')"
          EXE_DIGEST="$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$FINAL_INSTALLER" '.assets[] | select(.name==$n) | .digest')"
          SHA_NAME="$FINAL_INSTALLER.sha256"
          SHA_ID="$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$SHA_NAME" '.assets[] | select(.name==$n) | .id')"
          test -n "$EXE_ID"; test "$EXE_SIZE" = "$INSTALLER_SIZE"
          test "$EXE_DIGEST" = "sha256:$INSTALLER_SHA"
          test -n "$SHA_ID"

          TMP="$RUNNER_TEMP/verify-862"
          mkdir -p "$TMP"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$EXE_ID" > "$TMP/$FINAL_INSTALLER"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$SHA_ID" > "$TMP/$SHA_NAME"
          DOWN_SHA="$(shasum -a 256 "$TMP/$FINAL_INSTALLER" | awk '{print $1}')"
          PUB_SHA="$(awk '{print $1}' "$TMP/$SHA_NAME")"
          test "$DOWN_SHA" = "$INSTALLER_SHA"
          test "$PUB_SHA" = "$INSTALLER_SHA"

          echo "DOWNLOAD_VERIFIED=YES"
          echo "WINDOWS_862_PRODUCTION_RELEASE_PUBLISHED"
          echo "DIRECT_DOWNLOAD=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$FINAL_INSTALLER"
          echo "RELEASE_PAGE=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

      - name: Upload build provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-8.62-Windows-Production-Provenance
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.62-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
