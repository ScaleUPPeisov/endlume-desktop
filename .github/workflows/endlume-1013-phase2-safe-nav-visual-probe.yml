name: ENDLUME 10.0.13 Phase 2 Safe Nav Visual Probe

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-canonical-product-reconstruction
    paths:
      - .github/workflows/endlume-1013-phase2-safe-nav-visual-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase2-safe-nav-visual-probe
  cancel-in-progress: true

env:
  CANONICAL_PRODUCT_SHA: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  SOURCE_BUILD_RUN: '38030777284'
  EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250

jobs:
  safe-nav-visual:
    name: Owner Mac safe top-nav visual proof
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    steps:
      - name: Owner runner and production app safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          UI=$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || echo false)
          test "$UI" = true
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER_APP"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist")"
          OWNER_BIN="$OWNER_APP/Contents/MacOS/$OWNER_EXE"
          OWNER_SHA="$(shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          test "$OWNER_SHA" = 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7
          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then
            echo BLOCKED_OWNER_PRODUCTION_APP_ALREADY_RUNNING=true >&2
            exit 73
          fi
          mkdir -p "$RUNNER_TEMP/endlume-safe-nav"
          printf 'OWNER_APP_VERSION=10.0.12\nOWNER_APP_BINARY_SHA256=%s\n' "$OWNER_SHA" > "$RUNNER_TEMP/endlume-safe-nav/owner-before.txt"

      - name: Download exact accepted canonical QA artifact
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/canonical-safe-nav-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38030777284

      - name: Verify mount and launch exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-safe-nav"
          SRC="$RUNNER_TEMP/canonical-safe-nav-source"
          UNPACK="$RUNNER_TEMP/canonical-safe-nav-unpacked"
          DMG="$RUNNER_TEMP/ENDLUME-CANONICAL-SAFE-NAV.dmg"
          rm -rf "$UNPACK" && mkdir -p "$UNPACK"
          ZIP="$SRC/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          test "$(shasum -a 256 "$ZIP" | awk '{print $1}')" = "$EXPECTED_APP_ZIP_SHA256"
          ditto -x -k "$ZIP" "$UNPACK"
          BUILT_APP="$(find "$UNPACK" -maxdepth 2 -type d -name '*.app' -print -quit)"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$BUILT_APP/Contents/Info.plist")"
          BUILT_SHA="$(shasum -a 256 "$BUILT_APP/Contents/MacOS/$EXE" | awk '{print $1}')"
          test "$BUILT_SHA" = 4d208994181c5ca21b20c2e01dd06bda25e82a16bb1405379e79cc4da3026436
          rm -f "$DMG"
          hdiutil create -quiet -size 350m -fs APFS -volname ENDLUME_CANONICAL_QA "$DMG"
          hdiutil attach -nobrowse -plist "$DMG" > "$RUNNER_TEMP/endlume-safe-nav-attach.plist"
          VOL="$(python3 - "$RUNNER_TEMP/endlume-safe-nav-attach.plist" <<'PY'
          import plistlib,sys
          p=plistlib.load(open(sys.argv[1],'rb'))
          xs=[x.get('mount-point') for x in p.get('system-entities',[]) if isinstance(x.get('mount-point'),str)]
          if not xs: raise SystemExit(1)
          print(xs[-1])
          PY
          )"
          case "$VOL" in /Volumes/ENDLUME_CANONICAL_QA*) ;; *) exit 74;; esac
          QA_APP="$VOL/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app"
          ditto "$BUILT_APP" "$QA_APP"
          QA_BIN="$QA_APP/Contents/MacOS/$EXE"
          test "$(shasum -a 256 "$QA_BIN" | awk '{print $1}')" = "$BUILT_SHA"
          /usr/bin/codesign --verify --deep --strict "$QA_APP"
          printf 'QA_APP=%s\nQA_BIN=%s\nQA_VOL=%s\n' "$QA_APP" "$QA_BIN" "$VOL" > "$RUNNER_TEMP/endlume-safe-nav-env"
          /usr/bin/open -n "$QA_APP"

          PID=""
          for second in $(seq 0 30); do
            PIDS="$(pgrep -f "$QA_BIN" || true)"
            COUNT="$(printf '%s\n' "$PIDS" | awk 'NF{n++} END{print n+0}')"
            if [ "$COUNT" -eq 1 ]; then PID="$(printf '%s\n' "$PIDS" | awk 'NF{print;exit}')"; break; fi
            [ "$COUNT" -le 1 ] || exit 75
            sleep 1
          done
          test -n "$PID"
          /usr/sbin/lsof -a -p "$PID" -d txt -Fn 2>/dev/null | grep -Fxq "n$QA_BIN"
          printf 'CANDIDATE_PID=%s\nCANDIDATE_PATH_PROVEN=YES\nAPP_SHA256=%s\n' "$PID" "$BUILT_SHA" > "$REPORT/candidate-process.txt"

          READY=0
          for second in $(seq 0 60); do
            kill -0 "$PID"
            set +e
            GEOM=$(/usr/bin/osascript - "$PID" 2>"$REPORT/geometry.raw.err" <<'OSA'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              set ps to every application process whose unix id is targetPid
              if (count of ps) is not 1 then error "candidate process missing"
              tell item 1 of ps
                if (count of windows) is 0 then error "candidate window missing"
                set p to position of window 1
                set s to size of window 1
                return (item 1 of p as text) & "," & (item 2 of p as text) & "," & (item 1 of s as text) & "," & (item 2 of s as text)
              end tell
            end tell
          end run
          OSA
            )
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then READY=1; echo "WINDOW_READY_AFTER_SECONDS=$second"; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          printf '%s\n' "$GEOM" > "$REPORT/window-geometry.txt"
          IFS=',' read -r X Y W H <<EOF
          $GEOM
          EOF
          CROP_H=220
          [ "$H" -ge "$CROP_H" ] || CROP_H="$H"
          /usr/sbin/screencapture -x -R"$X,$Y,$W,$CROP_H" "$REPORT/top-nav-safe.png"
          test -s "$REPORT/top-nav-safe.png"
          printf 'SAFE_CROP=TOP_220PX_ONLY\nLICENSE_SECRET_REGION_CAPTURED=NO_BY_GEOMETRY\n' > "$REPORT/screenshot-safety.txt"
          rm -f "$REPORT/geometry.raw.err"

      - name: Cleanup and verify owner app unchanged
        if: always()
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/endlume-safe-nav"
          if [ -f "$RUNNER_TEMP/endlume-safe-nav-env" ]; then
            source "$RUNNER_TEMP/endlume-safe-nav-env"
            pkill -f "$QA_BIN" >/dev/null 2>&1 || true
            sleep 2
            hdiutil detach -quiet "$QA_VOL" >/dev/null 2>&1 || true
          fi
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)"
          OWNER_SHA="$(shasum -a 256 "$OWNER_APP/Contents/MacOS/$OWNER_EXE" 2>/dev/null | awk '{print $1}')"
          printf 'OWNER_APP_VERSION=10.0.12\nOWNER_APP_BINARY_SHA256=%s\n' "$OWNER_SHA" > "$REPORT/owner-after.txt"
          cmp -s "$REPORT/owner-before.txt" "$REPORT/owner-after.txt"
          echo OWNER_APPLICATION_REPLACED=NO

      - name: Upload safe visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE2-SAFE-NAV-VISUAL
          path: |
            ${{ runner.temp }}/endlume-safe-nav/candidate-process.txt
            ${{ runner.temp }}/endlume-safe-nav/window-geometry.txt
            ${{ runner.temp }}/endlume-safe-nav/screenshot-safety.txt
            ${{ runner.temp }}/endlume-safe-nav/top-nav-safe.png
            ${{ runner.temp }}/endlume-safe-nav/owner-before.txt
            ${{ runner.temp }}/endlume-safe-nav/owner-after.txt
          if-no-files-found: warn
          retention-days: 14
