name: ENDLUME 10.0.11 Preview Subscribe Compile Gate

on:
  push:
    branches: [hotfix/endlume-10.0.11-preview-subscribe-final]
    paths:
      - ".github/workflows/endlume-1011-preview-subscribe-compile.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1011-preview-subscribe-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Compile only changed paths on GitHub-hosted macOS
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml cache::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml live_preview::tests -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --features e2e-render --target aarch64-apple-darwin
          grep -q "FRONTEND_PAYLOAD_BYTES" src/components/LiveCompositePreview.tsx
          grep -q "IMAGE_NATURAL_WIDTH" src/components/LiveCompositePreview.tsx
          grep -q "subscribe_chromakey_params_1011" src-tauri/src/render.rs
          grep -q "ENDLUME-10.0.11-SUBSCRIBE-v2-CHROMA-SAFE" src-tauri/src/render.rs
          echo ENDLUME_1011_TARGETED_COMPILE_GREEN
