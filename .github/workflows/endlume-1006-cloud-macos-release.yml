name: ENDLUME 10.0.6 Cloud macOS Production

on:
  push:
    branches:
      - release-cloud-endlume-10.0.6
    paths:
      - ".github/workflows/endlume-1006-cloud-macos-release.yml"

permissions:
  contents: write

concurrency:
  group: endlume-1006-cloud-macos-production
  cancel-in-progress: false

env:
  SOURCE_SHA: bd81d86152cb2f20fe02e33849aec255ea013634
  HOTFIX_SHA: 03df61a58641d5ce0b4e1c432c99af935acbf4d1
  VERSION: 10.0.6
  RELEASE_TAG: endlume-v10.0.6
  ZIP_NAME: ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip
  SHA_NAME: ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip.sha256

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source-of-truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$HOTFIX_SHA" "$SOURCE_SHA"
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          want="10.0.6"
          assert json.loads(Path("package.json").read_text())["version"]==want
          assert json.loads(Path("package-lock.json").read_text())["version"]==want
          cfg=json.loads(Path("src-tauri/tauri.conf.json").read_text())
          assert cfg["version"]==want
          assert cfg["app"]["windows"]
          cargo=Path("src-tauri/Cargo.toml").read_text()
          assert re.search(r'^version\s*=\s*"10\.0\.6"$',cargo,re.M)
          print("SOURCE_HOTFIX_INCLUDED_GREEN")
          print("VERSION_10_0_6_GREEN")
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust target
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup target add aarch64-apple-darwin

      - name: Stage portable Apple Silicon FFmpeg and FFprobe
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          curl -fL --retry 4 --connect-timeout 20 --max-time 300             "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"             -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 --connect-timeout 20 --max-time 300             "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"             -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          FFMPEG="$(find "$TMP/fm" -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find "$TMP/fp" -type f -name ffprobe -print -quit)"
          test -n "$FFMPEG" && test -f "$FFMPEG"
          test -n "$FFPROBE" && test -f "$FFPROBE"
          chmod 755 "$FFMPEG" "$FFPROBE"
          file "$FFMPEG" | grep -E 'arm64|Mach-O'
          file "$FFPROBE" | grep -E 'arm64|Mach-O'
          FILTERS="$("$FFMPEG" -hide_banner -filters 2>&1)"
          printf '%s\n' "$FILTERS" | grep acrossfade
          for BIN in "$FFMPEG" "$FFPROBE"; do
            BAD="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
            test -z "$BAD" || { echo "Non-system dylib dependency:"; echo "$BAD"; exit 24; }
          done
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          echo "PORTABLE_FFMPEG_GREEN"

      - name: Build production app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("src-tauri/tauri.conf.json")
          d=json.loads(p.read_text())
          d["bundle"]["createUpdaterArtifacts"]=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          npm run tauri build -- --target aarch64-apple-darwin --bundles app

      - name: Validate app and create updater-compatible ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="$(find src-tauri/target -type d -path '*/aarch64-apple-darwin/release/bundle/macos/*.app' -print -quit)"
          test -n "$APP" && test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          file "$APP/Contents/MacOS/"* | grep arm64
          test -x "$APP/Contents/MacOS/ffmpeg" || test -x "$APP/Contents/Resources/ffmpeg" || find "$APP/Contents" -type f -name 'ffmpeg*' -perm +111 | grep .
          test -x "$APP/Contents/MacOS/ffprobe" || test -x "$APP/Contents/Resources/ffprobe" || find "$APP/Contents" -type f -name 'ffprobe*' -perm +111 | grep .

          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$OUT" "$STAGE"
          ditto "$APP" "$STAGE/ENDLUME Studio.app"
          codesign --verify --deep --strict "$STAGE/ENDLUME Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE/ENDLUME Studio.app" "$OUT/$ZIP_NAME"
          SUM="$(shasum -a 256 "$OUT/$ZIP_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SUM" "$ZIP_NAME" > "$OUT/$SHA_NAME"
          echo "LOCAL_SHA=$SUM" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "MAC_BUILD_GREEN"

      - name: Publish private release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA"               --title "ENDLUME 10.0.6"               --notes "ENDLUME 10.0.6 production macOS update. Source $SOURCE_SHA. Hotfix $HOTFIX_SHA."
          fi
          gh release upload "$RELEASE_TAG" "$OUT/$ZIP_NAME" "$OUT/$SHA_NAME" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Re-download private release and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERIFY="$RUNNER_TEMP/verify"
          mkdir -p "$VERIFY"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"             --pattern "$ZIP_NAME" --pattern "$SHA_NAME" --dir "$VERIFY" --clobber
          (cd "$VERIFY" && shasum -a 256 -c "$SHA_NAME")
          REMOTE_SHA="$(shasum -a 256 "$VERIFY/$ZIP_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          rm -rf "$RUNNER_TEMP/unpack"
          mkdir -p "$RUNNER_TEMP/unpack"
          ditto -x -k "$VERIFY/$ZIP_NAME" "$RUNNER_TEMP/unpack"
          APP="$RUNNER_TEMP/unpack/ENDLUME Studio.app"
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$APP"
          echo "PUBLIC_REDOWNLOAD_GREEN"

      - name: Publish 10.0.6 to old in-app updater manifest LAST
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MANIFEST="$RUNNER_TEMP/latest.json"
          python3 - "$MANIFEST" <<'PY'
          import json,sys,datetime
          out=sys.argv[1]
          d={
            "version":"10.0.6",
            "date":"01.10.2026",
            "channel":"remote-binary",
            "candidateRevision":6,
            "builder":"github-hosted-macos-production",
            "ciBuilder":"github-hosted-macos-production",
            "releaseTag":"endlume-v10.0.6",
            "asset":"ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip",
            "checksumAsset":"ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip.sha256",
            "notes":"ENDLUME 10.0.6 production: FFmpeg launch fix, finite concat audio, working Crossfade, AAC 320 kbps / 48 kHz / stereo, duration-aware output validation, Effects/Subscribe Preview fixes, Delete Effect and correct FAILED queue state."
          }
          json.dump(d,open(out,"w"),ensure_ascii=False,indent=2)
          PY

          CONTENT_PATH="updates/latest.json"
          OLD_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$CONTENT_PATH?ref=release" --jq .sha)"
          PAYLOAD="$RUNNER_TEMP/payload.json"
          python3 - "$MANIFEST" "$PAYLOAD" "$OLD_SHA" <<'PY'
          import base64,json,pathlib,sys
          src,out,sha=sys.argv[1:]
          p={
            "message":"release: publish ENDLUME 10.0.6 in-app updater manifest",
            "branch":"release",
            "sha":sha,
            "content":base64.b64encode(pathlib.Path(src).read_bytes()).decode()
          }
          json.dump(p,open(out,"w"))
          PY
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$CONTENT_PATH" --input "$PAYLOAD" >/dev/null

          RAW="$(gh api -H 'Accept: application/vnd.github.raw+json' "/repos/$GITHUB_REPOSITORY/contents/$CONTENT_PATH?ref=release")"
          printf '%s' "$RAW" > "$RUNNER_TEMP/published-latest.json"
          python3 - "$RUNNER_TEMP/published-latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["version"]=="10.0.6"
          assert d["releaseTag"]=="endlume-v10.0.6"
          assert d["asset"]=="ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip"
          assert d["checksumAsset"]=="ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip.sha256"
          print("IN_APP_UPDATER_MANIFEST_GREEN")
          PY

      - name: Optional public direct-download mirror
        env:
          PUBLIC_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PUBLIC_TOKEN:-}" ]]; then
            echo "ENDLUME_RELEASE_TOKEN unavailable; private in-app update remains authoritative."
            exit 0
          fi
          export GH_TOKEN="$PUBLIC_TOKEN"
          HOST="ScaleUPPeisov/scaleup-site"
          TAG="endlume-stable"
          gh release view "$TAG" --repo "$HOST" >/dev/null 2>&1 ||             gh release create "$TAG" --repo "$HOST" --title "ENDLUME Stable Updates" --notes "ENDLUME stable channel"
          gh release upload "$TAG" "$OUT/$ZIP_NAME" "$OUT/$SHA_NAME" --clobber --repo "$HOST"
          echo "PUBLIC_DIRECT_DOWNLOAD_GREEN"

      - name: Final release gate
        shell: bash
        run: |
          echo "VERSION: 10.0.6"
          echo "HOTFIX COMMIT: $HOTFIX_SHA"
          echo "RELEASE HEAD: $SOURCE_SHA"
          echo "MAC: GREEN"
          echo "PUBLIC RE-DOWNLOAD: GREEN"
          echo "OLD APP UPDATE MANIFEST: 10.0.6"
