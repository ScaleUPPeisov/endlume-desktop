name: ENDLUME 10.0.12 Cloud macOS Release

on:
  push:
    branches:
      - release-endlume-10.0.12-macos
    paths:
      - '.github/workflows/endlume-1012-cloud-release.yml'
      - '.release/endlume-1012-trigger.txt'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1012-cloud-macos-release
  cancel-in-progress: false

env:
  VERSION: '10.0.12'
  PRODUCT_HEAD: '750623fde68ef73a58429a5fdef1b85d541c7e12'
  STABLE_REPO: 'ScaleUPPeisov/scaleup-site'
  STABLE_TAG: 'endlume-stable'
  TARGET: 'aarch64-apple-darwin'
  MAC_UPDATER: 'ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz'
  MAC_ZIP: 'ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.zip'

jobs:
  release-macos-arm64:
    name: macOS ARM64 • GitHub hosted • 10.0.12
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ENDLUME_RELEASE_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
      GITHUB_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN }}

    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify source and cloud-only release
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PRODUCT_HEAD" HEAD
          test "$(node -p 'require(\"./package.json\").version')" = "$VERSION"
          test "$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" = "$VERSION"
          grep -q '^version = "10.0.12"$' src-tauri/Cargo.toml
          echo LOCAL_MAC_USED=NO
          echo WINDOWS_BUILD=NO

      - name: Require updater signing and stable-release credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo 'ERROR: TAURI_SIGNING_PRIVATE_KEY secret is missing'; exit 41; }
          TOKEN="${ENDLUME_RELEASE_TOKEN:-${GITHUB_RELEASE_TOKEN:-}}"
          test -n "$TOKEN" || { echo 'ERROR: ENDLUME_RELEASE_TOKEN/GITHUB_RELEASE_TOKEN secret is missing'; exit 42; }
          echo RELEASE_SECRETS_PRESENT=YES

      - name: Prepare toolchain and release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add "$TARGET"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package-lock.json')
          d=json.loads(p.read_text())
          d['version']='10.0.12'
          if '' in d.get('packages',{}): d['packages']['']['version']='10.0.12'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('src-tauri/Cargo.lock')
          s=p.read_text()
          old='name = "endlume"\nversion = "10.0.11"'
          new='name = "endlume"\nversion = "10.0.12"'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Stage portable Apple Silicon FFmpeg and FFprobe
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fL --retry 4 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip' -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip' -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" "src-tauri/binaries/ffmpeg-$TARGET"
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" "src-tauri/binaries/ffprobe-$TARGET"
          chmod 755 "src-tauri/binaries/ffmpeg-$TARGET" "src-tauri/binaries/ffprobe-$TARGET"
          file "src-tauri/binaries/ffmpeg-$TARGET"
          file "src-tauri/binaries/ffprobe-$TARGET"

      - name: Compile and regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --target "$TARGET"
          echo COMPILE_AND_TESTS=GREEN

      - name: Build signed macOS ARM64 updater
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/endlume-1012-target"
          export TAURI_SIGNING_PRIVATE_KEY
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          ENDLUME_TAURI_TARGET="$TARGET" node scripts/prepare-macos-ffmpeg-runtime.mjs
          npm run tauri -- build --target "$TARGET" --bundles app

          BUNDLE="$CARGO_TARGET_DIR/$TARGET/release/bundle/macos"
          APP="$(find "$BUNDLE" -maxdepth 1 -type d -name '*.app' -print -quit)"
          UPDATER="$(find "$BUNDLE" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          SIG="${UPDATER}.sig"
          test -n "$APP" -a -d "$APP"
          test -n "$UPDATER" -a -s "$UPDATER"
          test -s "$SIG"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.endlume.desktop'
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP"

          OUT="$RUNNER_TEMP/endlume-1012-release"
          mkdir -p "$OUT"
          cp "$UPDATER" "$OUT/$MAC_UPDATER"
          cp "$SIG" "$OUT/$MAC_UPDATER.sig"
          cp "$UPDATER" "$OUT/ENDLUME-macos-aarch64.app.tar.gz"
          cp "$SIG" "$OUT/ENDLUME-macos-aarch64.app.tar.gz.sig"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/$MAC_ZIP"
          (cd "$OUT" && /usr/bin/shasum -a 256 "$MAC_ZIP" > "$MAC_ZIP.sha256")
          echo "RELEASE_OUT=$OUT" >> "$GITHUB_ENV"
          echo MACOS_UPDATER_PACKAGE=GREEN

      - name: Build latest.json preserving Windows exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://github.com/${STABLE_REPO}/releases/download/${STABLE_TAG}"
          curl -fL --retry 5 "$BASE/latest.json?before=$(date +%s)" -o "$RELEASE_OUT/latest.previous.json"
          python3 - "$RELEASE_OUT" "$BASE" <<'PY'
          import json,sys,datetime,pathlib
          out=pathlib.Path(sys.argv[1]); base=sys.argv[2]
          d=json.loads((out/'latest.previous.json').read_text())
          platforms=d.get('platforms')
          assert isinstance(platforms,dict) and platforms
          mac=[k for k in platforms if 'darwin' in k.lower() or 'mac' in k.lower()]
          assert mac, list(platforms)
          sig=(out/'ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz.sig').read_text().strip()
          for k in mac:
              platforms[k]={
                  'signature':sig,
                  'url':base+'/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz'
              }
          d['version']='10.0.12'
          d['notes']='ENDLUME 10.0.12 macOS: Background Music loop/volume/3-band EQ, isolated project previews, atomic Effects/Subscribe first frame, durable Effect asset recovery and release hardening.'
          d['pub_date']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          (out/'latest.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool "$RELEASE_OUT/latest.json" >/dev/null
          echo LATEST_JSON=GREEN

      - name: Publish macOS 10.0.12 to stable channel
        shell: bash
        run: |
          set -Eeuo pipefail
          export GH_TOKEN="${ENDLUME_RELEASE_TOKEN:-${GITHUB_RELEASE_TOKEN:-}}"
          gh release view "$STABLE_TAG" --repo "$STABLE_REPO" >/dev/null
          gh release upload "$STABLE_TAG" \
            "$RELEASE_OUT/$MAC_UPDATER" \
            "$RELEASE_OUT/$MAC_UPDATER.sig" \
            "$RELEASE_OUT/$MAC_ZIP" \
            "$RELEASE_OUT/$MAC_ZIP.sha256" \
            "$RELEASE_OUT/ENDLUME-macos-aarch64.app.tar.gz" \
            "$RELEASE_OUT/ENDLUME-macos-aarch64.app.tar.gz.sig" \
            "$RELEASE_OUT/latest.json" \
            --repo "$STABLE_REPO" --clobber
          echo STABLE_RELEASE_PUBLISHED=YES
          echo WINDOWS_BINARIES_TOUCHED=NO
          echo LOCAL_MAC_USED=NO

      - name: Verify public stable updater
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="https://github.com/${STABLE_REPO}/releases/download/${STABLE_TAG}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fL --retry 5 "$BASE/latest.json?ts=$(date +%s)" -o "$TMP/latest.json"
          curl -fL --retry 5 "$BASE/$MAC_UPDATER?ts=$(date +%s)" -o "$TMP/update.tar.gz"
          python3 - "$TMP/latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['version']=='10.0.12', d.get('version')
          mac=[v for k,v in d['platforms'].items() if 'darwin' in k.lower() or 'mac' in k.lower()]
          assert mac
          assert all('10.0.12-macOS-ARM64.app.tar.gz' in v['url'] for v in mac)
          print('PUBLIC_ENDLUME_10_0_12_MACOS=GREEN')
          PY
          test -s "$TMP/update.tar.gz"
          echo RELEASE=PUBLIC_GREEN

      - name: Upload cloud build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-10.0.12-macos-release
          path: ${{ runner.temp }}/endlume-1012-release/*
          if-no-files-found: ignore
