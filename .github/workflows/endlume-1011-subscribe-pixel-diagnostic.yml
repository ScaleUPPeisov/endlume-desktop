name: ENDLUME 10.0.11 Subscribe Pixel Diagnostic

on:
  push:
    branches: [hotfix/endlume-10.0.11-preview-subscribe-final]
    paths:
      - ".github/workflows/endlume-1011-subscribe-pixel-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: endlume-1011-subscribe-pixel-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Prove real Subscribe full prep alpha
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          lib=Path.home()/"Library/Application Support/studio.endlume.desktop/library.json"
          d=json.loads(lib.read_text())
          s=next(x for x in d["subscribes"] if x.get("enabled") and Path(x.get("source","")).is_file())
          src=s["source"];key=str(s.get("keyColor","#65ff07")).lstrip("#")
          scale=float(s.get("scale",.32))
          tw=round(960*scale);tw += tw%2
          filters={
            "key":f"format=rgba,colorkey=0x{key}:0.10:0.06",
            "key_despill":f"format=rgba,colorkey=0x{key}:0.10:0.06,despill=type=green:mix={float(s.get('despill',1))}:expand=0.20",
            "fullprep":f"fps=30,format=rgba,colorkey=0x{key}:0.10:0.06,despill=type=green:mix={float(s.get('despill',1))}:expand=0.20,scale={tw}:-2:flags=lanczos,colorchannelmixer=aa={float(s.get('opacity',1))}",
          }
          for t in (0.25,0.75,1.5,2.5,4.0):
            for name,vf in filters.items():
              p=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-ss",str(t),"-i",src,"-frames:v","1","-vf",vf,"-f","rawvideo","-pix_fmt","rgba","-"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              a=p.stdout[3::4];n=len(a)
              print(f"T={t} FILTER={name} PIXELS={n} A1={sum(x>0 for x in a)/n:.6f} A128={sum(x>=128 for x in a)/n:.6f} A240={sum(x>=240 for x in a)/n:.6f} MEAN={sum(a)/n:.4f}")
          PY
