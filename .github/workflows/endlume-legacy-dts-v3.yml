name: ENDLUME legacy Subscribe DTS v3

on:
  push:
    branches: [qa/endlume-04a-legacy-dts-v3]

permissions:
  contents: read

jobs:
  legacy-dts-v3:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow v3 patch to exact 04a
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor 04a63df522af75ece111ba4eb59dc56f48bdcb77 HEAD
          python3 scripts/patch_legacy_dts_v3.py
          git diff --check
          test "$(git diff --name-only | grep -v '^src-tauri/src/render.rs$' | wc -l | tr -d ' ')" = 0
          grep -q 'fn exact_segment_frames' src-tauri/src/render.rs
          grep -q 'shortest=0:eof_action=repeat' src-tauri/src/render.rs
          git diff -- src-tauri/src/render.rs

      - name: Build actual patched app
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm run build
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          BIN="$APP/Contents/MacOS/endlume"; test -x "$BIN"
          ROOT="$RUNNER_TEMP/legacy-dts-v3"; mkdir -p "$ROOT/project" "$ROOT/effects" "$ROOT/out"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Generate visible 14-second Subscribe fixture
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$ROOT/project/cover.png"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=520:sample_rate=48000:duration=14" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$ROOT/project/audio14.mp3"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x00ff00:s=640x360:r=60:d=3" -vf "drawbox=x=170:y=120:w=200:h=120:color=white:t=fill" -an -c:v libx264 -preset ultrafast -g 180 -pix_fmt yuv420p -r 60 -y "$ROOT/effects/subscribe.mp4"
          python3 - <<'PY'
          import json,os
          r=os.environ['ROOT']; p=os.path.join(r,'project'); src=os.path.join(r,'effects','subscribe.mp4')
          sub={'id':'subscribe','name':'Subscribe Visible','source':src,'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.12,'blend':0.08,'despill':1.0,'lumaThreshold':0.10,'lumaTolerance':0.05,'saturation':1.0,'x':0.15,'y':0.65,'scale':0.30,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':None,'firstAtSec':2.0,'secondAtSec':6.0,'repeatEverySec':4.0}
          job={'project':{'id':'legacy-dts-v3','name':'Legacy Subscribe DTS v3','path':p,'media':[os.path.join(p,'cover.png')],'audio':[os.path.join(p,'audio14.mp3')],'valid':True,'error':None},'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':8.0,'durationHours':14.0/3600.0,'durationMode':'exact','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':os.path.join(r,'out'),'preset':'fast','encoderPreference':'auto'},'effects':[],'subscribes':[sub],'ambient':None}
          json.dump(job,open(os.path.join(r,'job.json'),'w'),indent=2)
          PY

      - name: Launch actual patched app
        shell: bash
        run: |
          set -euo pipefail
          ENDLUME_ACCEPTANCE_JOB="$ROOT/job.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/receipt.json" ENDLUME_ACCEPTANCE_PREVIEW_TIMES="1,2.5,5.5,6.5,10.5,13.5" ENDLUME_SOURCE_HEAD="04a63d+legacy-dts-v3" "$BIN" > "$ROOT/app.log" 2>&1
          cat "$ROOT/receipt.json"

      - name: Hard gate exact CFR visibility DTS and parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,sys
          root=os.environ['ROOT']; d=json.load(open(os.path.join(root,'receipt.json'))); assert d.get('status')=='ok',d
          r=d['result']; v=next(s for s in r['probe']['streams'] if s.get('codec_type')=='video'); fb=str((r.get('fallback') or {}).get('reason','')).lower(); W,H=320,180; N=W*H
          def frame(path,t):
              q=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',str(t),'-i',path,'-frames:v','1','-an','-vf',f'scale={W}:{H},format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
              if len(q.stdout)<N: raise RuntimeError(('short frame',path,t,len(q.stdout)))
              return q.stdout[:N]
          def contrast(x): return max(x)-min(x)
          def mae(a,b): return sum(abs(x-y) for x,y in zip(a,b))/N
          rows=[]
          for q in r.get('preview_outputs',[]): rows.append({'at':float(q['at']),'mae':mae(frame(r['output_path'],float(q['at'])),frame(q['path'],0))})
          checks={'FAST_REJECTED':not r.get('fast_path_used'),'LEGACY':r.get('legacy_fallback_used') is True,'REASON':'whole-track' in fb or 'duration' in fb,'DECODE':r.get('full_decode',{}).get('ok') is True,'NO_DTS':'non monotonically increasing dts' not in str(r.get('full_decode',{}).get('stderr','')).lower(),'SEEKS':all(x.get('ok') for x in r.get('seek_checks',[])),'HEVC':v.get('codec_name')=='hevc','FPS':v.get('r_frame_rate')=='60/1' and v.get('avg_frame_rate')=='60/1','FRAMES':int(v.get('nb_frames','0'))==840,'VIDEO_DURATION':abs(float(v.get('duration','0'))-14.0)<=0.001,'FORMAT_DURATION':abs(float(r.get('output_duration',0))-14.0)<=0.05,'PREVIEW':len(rows)==6 and max(x['mae'] for x in rows)<12.0,'OFF1':contrast(frame(r['output_path'],1.0))<15,'ON2':contrast(frame(r['output_path'],2.5))>20,'OFF5':contrast(frame(r['output_path'],5.5))<15,'ON6':contrast(frame(r['output_path'],6.5))>20,'ON10':contrast(frame(r['output_path'],10.5))>20,'OFF13':contrast(frame(r['output_path'],13.5))<15}
          report={'checks':checks,'fps':[v.get('r_frame_rate'),v.get('avg_frame_rate')],'frames':v.get('nb_frames'),'video_duration':v.get('duration'),'format_duration':r.get('output_duration'),'fallback':fb,'preview':rows,'decode':r.get('full_decode')}
          print(json.dumps(report,indent=2)); json.dump(report,open(os.path.join(root,'gate.json'),'w'),indent=2)
          if not all(checks.values()): sys.exit(1)
          print('LEGACY_DTS_V3=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-dts-v3-evidence
          path: |
            ${{ env.ROOT }}/job.json
            ${{ env.ROOT }}/receipt.json
            ${{ env.ROOT }}/gate.json
            ${{ env.ROOT }}/app.log
          retention-days: 14
