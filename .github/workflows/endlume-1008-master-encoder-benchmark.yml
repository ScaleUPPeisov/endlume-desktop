name: ENDLUME 10.0.8 Master Encoder Benchmark

on:
  push:
    branches: [hotfix/endlume-10.0.8-performance-visual]
    paths:
      - ".github/workflows/endlume-1008-master-encoder-benchmark.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1008-master-encoder-benchmark
  cancel-in-progress: true

jobs:
  bench:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - name: Real Round Equalizer encoder comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          FF="$(command -v ffmpeg)"; FP="$(command -v ffprobe)"
          "$FF" -hide_banner -encoders 2>/dev/null | grep -q hevc_videotoolbox
          ROOT="$RUNNER_TEMP/e1008-master-enc"; rm -rf "$ROOT"; mkdir -p "$ROOT"

          LIB=""
          while IFS= read -r p; do
            if python3 - "$p" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except:raise SystemExit(1)
          ok=any(isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()) for x in d.get("effects",[]))
          raise SystemExit(0 if ok else 1)
          PY
            then LIB="$p"; break; fi
          done < <(find "$HOME/Library/Application Support" "$HOME/Library/Containers" -type f -name library.json 2>/dev/null)
          test -n "$LIB"

          python3 - "$LIB" "$ROOT/e.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for x in d.get("effects",[]):
            if isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()):
              json.dump(x,open(sys.argv[2],"w"),ensure_ascii=False);break
          PY
          SRC="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source"])' "$ROOT/e.json")"
          test -f "$SRC"
          "$FF" -hide_banner -loglevel error -f lavfi -i "gradients=s=1920x1080:r=1:c0=0x10182a:c1=0x334866" -frames:v 1 -y "$ROOT/base.png"

          python3 - "$ROOT/e.json" > "$ROOT/v.env" <<'PY'
          import json,shlex,sys
          e=json.load(open(sys.argv[1]))
          vals={"KEY":str(e.get("keyColor","#00ff00")).lstrip("#"),"SCALE":float(e.get("scale",.25) or .25),"X":float(e.get("x",.5) or .5),"Y":float(e.get("y",.5) or .5),"OP":float(e.get("opacity",1) if e.get("opacity") is not None else 1),"DSP":float(e.get("despill",0) or 0)}
          for k,v in vals.items():print(k+"="+shlex.quote(str(v)))
          PY
          source "$ROOT/v.env"
          TARGET="$(python3 -c 'import sys;x=round(1920*float(sys.argv[1]));print(max(2,x if x%2==0 else x+1))' "$SCALE")"
          GRAPH="[0:v]fps=FPS,setsar=1[b0];[1:v]format=rgba,colorkey=0x$KEY:0.18:0.03,despill=type=green:mix=$DSP:expand=0.20,scale=$TARGET:-2:flags=lanczos,colorchannelmixer=aa=$OP[fx];[b0][fx]overlay=x='max(0,min(W-w,W*$X-w/2))':y='max(0,min(H-h,H*$Y-h/2))':shortest=1:eof_action=repeat:format=auto,format=yuv420p[outv]"

          run_case(){
            name="$1"; fps="$2"; threads="$3"; g="$4"
            out="$ROOT/$name.mp4"
            graph="$(printf '%s' "$GRAPH" | sed "s/FPS/$fps/g")"
            start="$(python3 -c 'import time;print(time.time())')"
            "$FF" -hide_banner -loglevel error -filter_complex_threads "$threads" -loop 1 -framerate "$fps" -i "$ROOT/base.png" -stream_loop -1 -i "$SRC"               -filter_complex "$graph" -map "[outv]" -t 40 -an               -c:v hevc_videotoolbox -realtime 1 -prio_speed 1 -power_efficient 0 -constant_bit_rate 1 -b:v 22M -g "$g" -bf 0 -tag:v hvc1 -pix_fmt yuv420p               -fps_mode cfr -r "$fps" -video_track_timescale 60000 -y "$out"
            end="$(python3 -c 'import time;print(time.time())')"
            python3 - "$name" "$start" "$end" "$out" "$fps" "$FP" <<'PY'
          import subprocess,sys,os
          name,start,end,out,fps,fp=sys.argv[1:]
          packets=int(subprocess.check_output([fp,"-v","error","-count_packets","-select_streams","v:0","-show_entries","stream=nb_read_packets","-of","default=nw=1:nk=1",out],text=True).strip())
          size=os.path.getsize(out)
          print(f"MASTER_BENCH_{name}_SECONDS={float(end)-float(start):.3f}")
          print(f"MASTER_BENCH_{name}_MIB={size/1048576:.3f}")
          print(f"MASTER_BENCH_{name}_PACKETS={packets}")
          print(f"MASTER_BENCH_{name}_FPS={fps}")
          PY
          }

          run_case A30_I_2T 30 2 1
          run_case B30_I_8T 30 8 1
          run_case C60_G60_8T 60 8 60

          for t in 1 10 20 30 39; do
            "$FF" -hide_banner -loglevel error -ss "$t" -i "$ROOT/A30_I_2T.mp4" -frames:v 1 -y "$ROOT/a-$t.png"
            "$FF" -hide_banner -loglevel error -ss "$t" -i "$ROOT/C60_G60_8T.mp4" -frames:v 1 -y "$ROOT/c-$t.png"
            "$FF" -hide_banner -nostats -loglevel info -i "$ROOT/a-$t.png" -i "$ROOT/c-$t.png" -lavfi "[0:v][1:v]ssim" -f null - 2>>"$ROOT/ssim.log"
          done
          python3 - "$ROOT/ssim.log" <<'PY'
          import re,sys
          vals=[float(x) for x in re.findall(r"All:([0-9.]+)",open(sys.argv[1]).read())]
          print("MASTER_BENCH_C_VS_A_SSIM_MIN="+f"{min(vals):.6f}")
          print("MASTER_BENCH_C_VS_A_SSIM_AVG="+f"{sum(vals)/len(vals):.6f}")
          assert min(vals)>=0.985,vals
          print("ENDLUME_1008_MASTER_ENCODER_BENCH_GREEN")
          PY
