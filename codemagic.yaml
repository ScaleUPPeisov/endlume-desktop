workflows:
  endlume-1012-release-macos:
    name: ENDLUME 10.0.12 macOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "release-endlume-10.0.12-macos"
          include: true
          source: true
    environment:
      node: v22.11.0
      vars:
        ENDLUME_VERSION: "10.0.12"
        ENDLUME_PRODUCT_HEAD: "750623fde68ef73a58429a5fdef1b85d541c7e12"
        STABLE_REPO: "ScaleUPPeisov/scaleup-site"
        STABLE_TAG: "endlume-stable"
    scripts:
      - name: Verify release source and remote Mac
        script: |
          set -Eeuo pipefail
          echo "CM_BUILD_ID=${CM_BUILD_ID:-unknown}"
          echo "CM_BRANCH=${CM_BRANCH:-unknown}"
          echo "HEAD=$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$ENDLUME_PRODUCT_HEAD" HEAD
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"
          test "$(node -p 'require("./package.json").version')" = "$ENDLUME_VERSION"
          test "$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" = "$ENDLUME_VERSION"
          grep -q '^version = "10.0.12"$' src-tauri/Cargo.toml
          echo LOCAL_MAC_USED=NO
          echo WINDOWS_BUILD=NO

      - name: Require release secrets
        script: |
          set -Eeuo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: Add secure Codemagic variable TAURI_SIGNING_PRIVATE_KEY before release."
            exit 41
          fi
          if [ -z "${GITHUB_RELEASE_TOKEN:-}" ]; then
            echo "ERROR: Add secure Codemagic variable GITHUB_RELEASE_TOKEN with Contents: Read and write for ScaleUPPeisov/scaleup-site."
            exit 42
          fi
          echo RELEASE_SECRETS_PRESENT=YES

      - name: Prepare Rust toolchain
        script: |
          set -Eeuo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-darwin
          rustc --version
          cargo --version

      - name: Stage FFmpeg and FFprobe
        script: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Normalize lockfile release metadata
        script: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package-lock.json')
          d=json.loads(p.read_text())
          d['version']='10.0.12'
          if '' in d.get('packages',{}): d['packages']['']['version']='10.0.12'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=Path('src-tauri/Cargo.lock')
          s=p.read_text()
          old='name = "endlume"\nversion = "10.0.11"'
          new='name = "endlume"\nversion = "10.0.12"'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY

      - name: Compile and regression
        script: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$CM_BUILD_DIR/.codemagic-target"
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml live_preview::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml cache::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          echo COMPILE=GREEN
          echo RUST_TESTS=GREEN

      - name: Build signed macOS ARM64 updater artifacts
        script: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$CM_BUILD_DIR/.codemagic-target"
          export TAURI_SIGNING_PRIVATE_KEY
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app

          BUNDLE="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$BUNDLE" -maxdepth 1 -type d -name '*.app' -print -quit)"
          UPDATER="$(find "$BUNDLE" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          SIG="${UPDATER}.sig"
          test -n "$APP" -a -d "$APP"
          test -n "$UPDATER" -a -s "$UPDATER"
          test -s "$SIG"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$ENDLUME_VERSION"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          BIN="$APP/Contents/MacOS/$EXE"
          /usr/bin/lipo -archs "$BIN" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP"

          OUT="$CM_BUILD_DIR/release-out"
          mkdir -p "$OUT"
          VERSIONED="ENDLUME-YT-Studio-PEISOV-${ENDLUME_VERSION}-macOS-ARM64.app.tar.gz"
          cp "$UPDATER" "$OUT/$VERSIONED"
          cp "$SIG" "$OUT/$VERSIONED.sig"
          cp "$UPDATER" "$OUT/ENDLUME-macos-aarch64.app.tar.gz"
          cp "$SIG" "$OUT/ENDLUME-macos-aarch64.app.tar.gz.sig"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/ENDLUME-YT-Studio-PEISOV-${ENDLUME_VERSION}-macOS-ARM64.zip"
          (cd "$OUT" && /usr/bin/shasum -a 256 "ENDLUME-YT-Studio-PEISOV-${ENDLUME_VERSION}-macOS-ARM64.zip" > "ENDLUME-YT-Studio-PEISOV-${ENDLUME_VERSION}-macOS-ARM64.zip.sha256")
          echo MACOS_UPDATER_PACKAGE=GREEN

      - name: Build latest.json without touching Windows binaries
        script: |
          set -Eeuo pipefail
          OUT="$CM_BUILD_DIR/release-out"
          BASE="https://github.com/${STABLE_REPO}/releases/download/${STABLE_TAG}"
          curl -fL --retry 4 "$BASE/latest.json" -o "$OUT/latest.previous.json"
          curl -fL --retry 4 "$BASE/ENDLUME-YT-Studio-PEISOV-Setup-10.0.12-x64.exe.sig" -o "$OUT/windows-10.0.12.sig"
          python3 - "$OUT" "$BASE" <<'PY'
          import json,sys,datetime,pathlib
          out=pathlib.Path(sys.argv[1]); base=sys.argv[2]
          d=json.loads((out/'latest.previous.json').read_text())
          platforms=d.get('platforms')
          assert isinstance(platforms,dict) and platforms, d
          mac=[k for k in platforms if 'darwin' in k.lower() or 'mac' in k.lower()]
          win=[k for k in platforms if 'windows' in k.lower() or k.lower().startswith('win')]
          assert mac, platforms.keys()
          mac_sig=(out/'ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz.sig').read_text().strip()
          win_sig=(out/'windows-10.0.12.sig').read_text().strip()
          for k in mac:
              platforms[k]={
                  'signature':mac_sig,
                  'url':base+'/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz'
              }
          for k in win:
              platforms[k]={
                  'signature':win_sig,
                  'url':base+'/ENDLUME-YT-Studio-PEISOV-Setup-10.0.12-x64.exe'
              }
          d['version']='10.0.12'
          d['notes']='ENDLUME 10.0.12 macOS: Background Music loop/volume/3-band EQ, isolated project previews, atomic Effects/Subscribe first frame, durable Effect asset recovery and macOS QA/release hardening.'
          d['pub_date']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          (out/'latest.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print('LATEST_PLATFORM_KEYS=',','.join(platforms.keys()))
          PY
          python3 -m json.tool "$OUT/latest.json" >/dev/null
          echo LATEST_JSON=GREEN

      - name: Publish macOS 10.0.12 to stable channel
        script: |
          set -Eeuo pipefail
          export GH_TOKEN="$GITHUB_RELEASE_TOKEN"
          command -v gh >/dev/null 2>&1 || brew install gh
          OUT="$CM_BUILD_DIR/release-out"
          gh release view "$STABLE_TAG" --repo "$STABLE_REPO" >/dev/null
          gh release upload "$STABLE_TAG" \
            "$OUT/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz" \
            "$OUT/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz.sig" \
            "$OUT/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.zip" \
            "$OUT/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.zip.sha256" \
            "$OUT/ENDLUME-macos-aarch64.app.tar.gz" \
            "$OUT/ENDLUME-macos-aarch64.app.tar.gz.sig" \
            "$OUT/latest.json" \
            --repo "$STABLE_REPO" --clobber
          echo STABLE_RELEASE_PUBLISHED=YES
          echo WINDOWS_BINARIES_TOUCHED=NO
          echo LOCAL_MAC_USED=NO

      - name: Verify public stable assets
        script: |
          set -Eeuo pipefail
          BASE="https://github.com/${STABLE_REPO}/releases/download/${STABLE_TAG}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fL --retry 5 "$BASE/latest.json?ts=$(date +%s)" -o "$TMP/latest.json"
          curl -fL --retry 5 "$BASE/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz?ts=$(date +%s)" -o "$TMP/update.tar.gz"
          python3 - "$TMP/latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); assert d['version']=='10.0.12',d.get('version')
          mac=[(k,v) for k,v in d['platforms'].items() if 'darwin' in k.lower() or 'mac' in k.lower()]
          assert mac, d['platforms'].keys()
          assert all('10.0.12-macOS-ARM64.app.tar.gz' in v['url'] for _,v in mac),mac
          print('PUBLIC_LATEST_10_0_12=GREEN')
          PY
          test -s "$TMP/update.tar.gz"
          echo RELEASE=PUBLIC_GREEN

    artifacts:
      - release-out/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz
      - release-out/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.app.tar.gz.sig
      - release-out/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.zip
      - release-out/ENDLUME-YT-Studio-PEISOV-10.0.12-macOS-ARM64.zip.sha256
      - release-out/latest.json
