name: ENDLUME 10.0.2 P0 Candidate QA

on:
  push:
    branches: [hotfix/endlume-10.0.2-p0]
    paths:
      - '.github/workflows/endlume-1002-p0-qa.yml'
      - 'src-tauri/src/render.rs'
      - 'src-tauri/src/mp4_manifest.rs'
      - 'src-tauri/src/cache.rs'
      - 'src-tauri/src/lib.rs'
      - 'scripts/run-endlume-1002-pingpong-e2e.py'
      - 'scripts/run-endlume-1000-render-job-e2e.py'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
      - 'src/pages/SettingsPage.tsx'
      - 'src/components/ReleaseHistory.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-1002-p0-candidate
  cancel-in-progress: true

jobs:
  qa:
    name: macOS ARM64 • Real Audio + Real Ping-Pong • NO RELEASE
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Contract guard — no release mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF_NAME}" = "hotfix/endlume-10.0.2-p0"
          python3 - <<'PY'
          from pathlib import Path
          r=Path('src-tauri/src/render.rs').read_text()
          for token in [
            'FAST_SHORT_VIDEO_PINGPONG',
            'pingpong-master-v10',
            'pingpong-visual-v10',
            'verify_final_audio_structure_1002',
            'APPLE AUDIO BLOCKER',
            'SOURCE_MP3_TO_AAC_320K',
            'remap_video_samples'
          ]:
              assert token in r,token
          print('ENDLUME_1002_SOURCE_CONTRACT_GREEN')
          PY

      - name: Stage native Apple Silicon FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          test -x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          test -x src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Frontend + Rust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1002"
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build audit-only candidate app
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1002"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          d=json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts']=False
          for w in d.get('app',{}).get('windows',[]):
              w['visible']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm run tauri build -- --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          echo "E1002_E2E_BIN=$APP/Contents/MacOS/$EXE" >> "$GITHUB_ENV"

      - name: Reclaim release-only CI cache and audit free disk
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "DISK_BEFORE_CI_CLEANUP"
          df -Pk "$HOME/Movies"
          du -sh "$HOME/.endlume-build-cache/target-1002-windows" 2>/dev/null || true
          du -sh "$HOME/.endlume-build-cache/windows-sidecars-1002" 2>/dev/null || true
          rm -rf "$HOME/.endlume-build-cache/target-1002-windows"
          rm -rf "$HOME/.endlume-build-cache/windows-sidecars-1002/extract"
          rm -f "$HOME/.endlume-build-cache/windows-sidecars-1002/"*.zip 2>/dev/null || true
          echo "DISK_AFTER_CI_CLEANUP"
          df -Pk "$HOME/Movies"

      - name: Resolve real Subscribe and image regression fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/e1002-subscribe.json"
          test -s "$GITHUB_WORKSPACE/e1002-subscribe.json"
          TMP="$(mktemp -d /tmp/e1002fixture.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test -f "$SIDE"
          PING_SOURCE="$(mdfind 'kMDItemFSName == "для Японского канала .mp4"c' | head -n 1 || true)"
          if [ -z "$PING_SOURCE" ]; then
            PING_SOURCE="$(find "$HOME/Desktop" "$HOME/Movies" "$HOME/Downloads" -maxdepth 6 -type f -name 'для Японского канала .mp4' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$PING_SOURCE" ]; then
            python3 - "$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin" "$RUNNER_TEMP/e1002-relocated-source.txt" <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          ffprobe=Path(sys.argv[1]);out=Path(sys.argv[2])
          roots=[Path.home()/"Desktop",Path.home()/"Movies",Path.home()/"Downloads"]
          candidates=[]
          for root in roots:
              if not root.exists(): continue
              try:
                  for p in root.rglob("*.mp4"):
                      try:
                          candidates.append((p.stat().st_mtime,p))
                      except OSError: pass
              except OSError: pass
          for _,p in sorted(candidates,reverse=True)[:600]:
              try:
                  raw=subprocess.check_output([str(ffprobe),"-v","error","-select_streams","v:0","-show_entries","stream=codec_name,width,height,avg_frame_rate:format=duration","-of","json",str(p)],stderr=subprocess.DEVNULL,timeout=5)
                  d=json.loads(raw)
                  s=(d.get("streams") or [{}])[0];dur=float((d.get("format") or {}).get("duration") or 0)
                  if s.get("codec_name")=="hevc" and s.get("width")==1920 and s.get("height")==1080 and s.get("avg_frame_rate")=="60/1" and 19.0<=dur<=21.0:
                      out.write_text(str(p))
                      print("RELOCATED_PING_SOURCE="+str(p))
                      break
              except Exception:
                  pass
          PY
            if [ -s "$RUNNER_TEMP/e1002-relocated-source.txt" ]; then PING_SOURCE="$(cat "$RUNNER_TEMP/e1002-relocated-source.txt")"; fi
          fi
          if [ -z "$PING_SOURCE" ]; then
            DURABLE_RECOVERED="$HOME/.endlume-ci-fixtures/pingpong-source-1002/recovered-real-forward.mp4"
            if [ -s "$DURABLE_RECOVERED" ]; then
              DUR="$("$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin" -v error -show_entries format=duration -of default=nw=1:nk=1 "$DURABLE_RECOVERED" 2>/dev/null || true)"
              if python3 - "$DUR" <<'PY'
          import sys
          try:
              d=float(sys.argv[1])
              raise SystemExit(0 if 19.0 <= d <= 21.0 else 1)
          except Exception:
              raise SystemExit(1)
          PY
              then
                PING_SOURCE="$DURABLE_RECOVERED"
                echo "DURABLE_REAL_PING_SOURCE=$PING_SOURCE"
              fi
            fi
          fi
          if [ -z "$PING_SOURCE" ]; then
            CACHE_ROOT="$HOME/Library/Caches/studio.endlume.desktop/pingpong-master-v10"
            RECOVER_DIR="$HOME/.endlume-ci-fixtures/pingpong-source-1002"
            mkdir -p "$RECOVER_DIR"
            RECOVERED="$RECOVER_DIR/recovered-real-forward.mp4"
            python3 - "$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin" "$CACHE_ROOT" "$RUNNER_TEMP/e1002-cycle-source.txt" <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          ffprobe=Path(sys.argv[1]);root=Path(sys.argv[2]);out=Path(sys.argv[3])
          rows=[]
          if root.exists():
              for p in root.glob("*.mp4"):
                  try: rows.append((p.stat().st_mtime,p))
                  except OSError: pass
          for _,p in sorted(rows,reverse=True):
              try:
                  raw=subprocess.check_output([str(ffprobe),"-v","error","-select_streams","v:0","-show_entries","stream=codec_name,width,height,avg_frame_rate:format=duration","-of","json",str(p)],stderr=subprocess.DEVNULL,timeout=5)
                  d=json.loads(raw);s=(d.get("streams") or [{}])[0];dur=float((d.get("format") or {}).get("duration") or 0)
                  if s.get("codec_name")=="hevc" and s.get("width")==1920 and s.get("height")==1080 and s.get("avg_frame_rate")=="60/1" and 39.0<=dur<=42.0:
                      out.write_text(str(p));print("RECOVERABLE_REAL_PINGPONG_CYCLE="+str(p));break
              except Exception: pass
          PY
            if [ -s "$RUNNER_TEMP/e1002-cycle-source.txt" ]; then
              CYCLE="$(cat "$RUNNER_TEMP/e1002-cycle-source.txt")"
              "$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-aarch64-apple-darwin" -hide_banner -loglevel error -i "$CYCLE" -t 20.033 -map 0:v:0 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 1 -power_efficient 0 -constant_bit_rate 1 -b:v 20M -g 1800 -tag:v hvc1 -pix_fmt yuv420p -r 60 -movflags +faststart -y "$RECOVERED"
              test -s "$RECOVERED"
              PING_SOURCE="$RECOVERED"
              echo "RECOVERED_REAL_PING_SOURCE=$PING_SOURCE"
            fi
          fi
          test -n "$PING_SOURCE" -a -f "$PING_SOURCE"
          PING_DIR="$(dirname "$PING_SOURCE")"
          AVAIL_KB="$(df -Pk "$HOME/Movies" | awk 'NR==2{print $4}')"
          echo "DISK_FREE_PREFLIGHT_KB=$AVAIL_KB"
          test "$AVAIL_KB" -ge 3500000
          echo "E1002_PING_PROJECT_DIR=$PING_DIR" >> "$GITHUB_ENV"
          echo "E1002_PING_SOURCE=$PING_SOURCE" >> "$GITHUB_ENV"
          echo "PING_SOURCE=$PING_SOURCE"
          df -h "$HOME/Movies"

      - name: Clear only ENDLUME render caches for true cold Ping-Pong run
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$HOME/Library/Caches/studio.endlume.desktop"
          for name in pingpong-master-v10 pingpong-visual-v10 pingpong-audio-v1002; do
            rm -rf "$ROOT/$name"
          done
          rm -rf /tmp/endlume1002.* /tmp/pingpong1002.* 2>/dev/null || true

      - name: Real short-video Ping-Pong • cold + warm + Apple audio gate
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1002"
          OUT="$HOME/Movies/ENDLUME Studio/ENDLUME-1002-PINGPONG-QA"
          rm -rf "$OUT"; mkdir -p "$OUT"
          FFM="$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
          FFP="$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          mkdir -p "$GITHUB_WORKSPACE/e1002-qa"
          ENDLUME_1002_SOURCE="$E1002_PING_SOURCE" ENDLUME_1002_AUDIO_SIDE="$SIDE" ENDLUME_1002_OUTPUT_DIR="$OUT" python3 scripts/run-endlume-1002-pingpong-e2e.py             "$E1002_PING_PROJECT_DIR"             "$GITHUB_WORKSPACE/e1002-subscribe.json"             "$E1002_E2E_BIN" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e1002-qa/pingpong.json"
          cat "$GITHUB_WORKSPACE/e1002-qa/pingpong.json"
          rm -rf "$OUT"

      - name: One-image fast-path regression
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$HOME/Library/Caches/studio.endlume.desktop"
          rm -rf "$ROOT/visual-master-v10" "$ROOT/subscribe-master-v10"
          OUT="$HOME/Movies/ENDLUME Studio/ENDLUME-1002-IMAGE-REGRESSION"
          rm -rf "$OUT"; mkdir -p "$OUT"
          FFM="$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
          FFP="$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          ENDLUME_1000_OUTPUT_DIR="$OUT" ENDLUME_1000_COLD_LIMIT_SECONDS=65 ENDLUME_1000_WARM_LIMIT_SECONDS=30 python3 scripts/run-endlume-1000-render-job-e2e.py             "$SIDE" "$GITHUB_WORKSPACE/e1002-subscribe.json" "$E1002_E2E_BIN" "$FFM" "$FFP"             "$GITHUB_WORKSPACE/e1002-qa/image-regression.json"
          cat "$GITHUB_WORKSPACE/e1002-qa/image-regression.json"
          rm -rf "$OUT"

      - name: Final P0 verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('e1002-qa/pingpong.json'))
          i=json.load(open('e1002-qa/image-regression.json'))
          assert p['status']=='passed' and p['release_gate'] is True,p
          assert p['cold_seconds']<=60,p
          assert max(p['warm_seconds'])<=30,p
          assert i['status']=='passed' and i['release_gate'] is True,i
          print('ENDLUME_1002_P0_CANDIDATE_GREEN')
          print('PINGPONG_COLD_SECONDS=',p['cold_seconds'])
          print('PINGPONG_WARM_SECONDS=',p['warm_seconds'])
          print('IMAGE_COLD_SECONDS=',i['cold_seconds'])
          print('IMAGE_WARM_SECONDS=',i['warm_seconds'])
          PY
          echo "NO_STABLE_RELEASE_PERFORMED=YES"

