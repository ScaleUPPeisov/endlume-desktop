name: ENDLUME 8.67 HEVC GOP Probe
on:
  push:
    branches: [hotfix/endlume-8.67-render-perf-staging]
    paths: ['.github/workflows/endlume-867-hevc-gop-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Probe q100 GOP/B-frame profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 - <<'PY'
          import json,subprocess,time,tempfile,re
          from pathlib import Path
          d=json.loads(Path('/Volumes/TOSHIBA EXT/ВАЙРОН/Render/First Pour Jazz/logs/005 — Ready Videos — project.json').read_text(errors='replace'))
          image=Path(d['project']['media'][0]);caches=[Path.home()/'Library/Caches/studio.endlume.desktop/strict-effects-856/dd8446163b22cd85f0f04c3e.mov',Path.home()/'Library/Caches/studio.endlume.desktop/strict-effects-856/40fadf87ddc1297403bf34e8.mov']
          def run(a,capture=False):return subprocess.run([str(x) for x in a],check=True,capture_output=capture,text=capture)
          def probe(p):return json.loads(run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=bit_rate,avg_frame_rate,has_b_frames:format=duration,size,bit_rate','-of','json',p],True).stdout)
          with tempfile.TemporaryDirectory(prefix='e867-gop-') as td:
            root=Path(td);base=root/'base.png';run(['ffmpeg','-hide_banner','-loglevel','error','-i',image,'-vf','scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1','-frames:v','1','-y',base])
            g="[0:v]fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834122934888241-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
            profiles={'g600':[],'g120':['-g','120'],'g60':['-g','60'],'bf0_g120':['-bf','0','-g','120'],'bf0_g60':['-bf','0','-g','60']}
            outs={}
            for name,x in profiles.items():
              o=root/(name+'.mp4');args=['ffmpeg','-hide_banner','-loglevel','error','-filter_complex_threads','8','-loop','1','-framerate','30','-i',base,'-stream_loop','-1','-i',caches[0],'-stream_loop','-1','-i',caches[1],'-filter_complex',g,'-map','[outv]','-frames:v','600','-an','-c:v','hevc_videotoolbox','-realtime','1','-prio_speed','1','-power_efficient','0','-q:v','100','-b:v','500k','-maxrate','20M','-bufsize','80M',*x,'-tag:v','hvc1','-pix_fmt','yuv420p','-fps_mode','cfr','-r','60','-video_track_timescale','60000','-y',o]
              t=time.perf_counter()
              try:run(args)
              except subprocess.CalledProcessError as e:print('GOP_FAIL',name,e.returncode,flush=True);continue
              sec=time.perf_counter()-t;outs[name]=o;print('GOP_PROFILE',name,json.dumps({'seconds':round(sec,3),'bytes':o.stat().st_size,'probe':probe(o)},ensure_ascii=False),flush=True)
            ref=outs['g600']
            for name,p in outs.items():
              if name=='g600':continue
              q=subprocess.run(['ffmpeg','-hide_banner','-i',ref,'-i',p,'-lavfi','ssim','-f','null','-'],capture_output=True,text=True)
              m=re.findall(r'All:([0-9.]+)',q.stderr);print('GOP_SSIM',name,(m[-1] if m else 'NA'),flush=True)
          PY
