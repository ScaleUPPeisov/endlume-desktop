name: ENDLUME Windows x64 build

on:
  push:
    branches: [windows-v1]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout ENDLUME
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg sidecars
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $tools = 'C:\ProgramData\chocolatey\lib\ffmpeg\tools'
          $ffmpeg = Get-ChildItem $tools -Recurse -File -Filter ffmpeg.exe | Where-Object { $_.FullName -notlike '*\chocolatey\bin\*' } | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem $tools -Recurse -File -Filter ffprobe.exe | Where-Object { $_.FullName -notlike '*\chocolatey\bin\*' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Real FFmpeg binaries were not found' }
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $ffmpeg src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -Force
          Copy-Item $ffprobe src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -Force
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffmpeg self-test failed' }
          & src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffprobe self-test failed' }

      - name: Build ENDLUME Windows Setup.exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify and collect Setup.exe
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -File -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'ENDLUME Windows Setup.exe was not produced' }
          New-Item -ItemType Directory -Force -Path windows-release | Out-Null
          Copy-Item $setup.FullName 'windows-release/ENDLUME-Studio-Windows-x64-Setup.exe' -Force
          $hash = Get-FileHash 'windows-release/ENDLUME-Studio-Windows-x64-Setup.exe' -Algorithm SHA256
          Write-Host "Setup: $($setup.FullName)"
          Write-Host "SHA256: $($hash.Hash)"
          Get-Item 'windows-release/ENDLUME-Studio-Windows-x64-Setup.exe' | Format-List Name,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-Studio-Windows-x64
          path: windows-release/ENDLUME-Studio-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
