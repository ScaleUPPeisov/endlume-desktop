name: ENDLUME Remote Update Release

on:
  push:
    branches: [release]
    paths-ignore:
      - 'README.md'
      - 'updates/*.md'
  workflow_dispatch:

concurrency:
  group: endlume-remote-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout release channel
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Read update manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python3)"
          test -x "$PY"
          VERSION="$($PY -c 'import json;print(json.load(open("updates/latest.json"))["version"])')"
          BUILDER="$($PY -c 'import json;print(json.load(open("updates/latest.json"))["ciBuilder"])')"
          TAG="$($PY -c 'import json;print(json.load(open("updates/latest.json"))["releaseTag"])')"
          ASSET="$($PY -c 'import json;print(json.load(open("updates/latest.json"))["asset"])')"
          CHECKSUM="$($PY -c 'import json;print(json.load(open("updates/latest.json"))["checksumAsset"])')"
          test -n "$VERSION"; test -f "$BUILDER"; test -n "$TAG"; test -n "$ASSET"; test -n "$CHECKSUM"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "builder=$BUILDER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Build tested ENDLUME package on macOS
        env:
          GH_TOKEN: ${{ github.token }}
          ENDLUME_CI_ARTIFACT_DIR: ${{ github.workspace }}/release-out
          ENDLUME_CI_ASSET_NAME: ${{ steps.manifest.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${{ steps.manifest.outputs.builder }}"
          /bin/bash "${{ steps.manifest.outputs.builder }}"
          test -s "release-out/${{ steps.manifest.outputs.asset }}"
          test -s "release-out/${{ steps.manifest.outputs.checksum }}"

      - name: Verify package before publishing
        shell: bash
        run: |
          set -euo pipefail
          cd release-out
          /usr/bin/shasum -a 256 -c "${{ steps.manifest.outputs.checksum }}"
          TMP="$(mktemp -d)"
          /usr/bin/ditto -x -k "${{ steps.manifest.outputs.asset }}" "$TMP"
          APP="$(find "$TMP" -maxdepth 4 -type d -name 'ENDLUME Studio.app' -print -quit)"
          test -n "$APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "${{ steps.manifest.outputs.version }}"
          /usr/bin/codesign --verify --deep --strict "$APP"
          rm -rf "$TMP"

      - name: Publish private GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.manifest.outputs.tag }}"
          VERSION="${{ steps.manifest.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            :
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ENDLUME Studio $VERSION" --notes "Automated tested macOS ARM64 update package for ENDLUME Remote Update Center."
          fi
          gh release upload "$TAG" \
            "release-out/${{ steps.manifest.outputs.asset }}" \
            "release-out/${{ steps.manifest.outputs.checksum }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload CI copy
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-${{ steps.manifest.outputs.version }}-macos-arm64
          path: release-out/*
          if-no-files-found: error
