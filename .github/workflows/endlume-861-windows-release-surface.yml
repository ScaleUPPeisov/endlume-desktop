name: ENDLUME 8.61 Windows Release Surface

on:
  push:
    branches: [windows/endlume-861-managed-access]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/apply-windows-861-final-branding.py'
      - 'scripts/test-windows-861-release-surface.py'
      - '.github/workflows/endlume-861-windows-release-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-861-windows-release-surface
  cancel-in-progress: true

jobs:
  validate-and-apply:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows/endlume-861-managed-access
          fetch-depth: 0
      - name: Apply Windows-only visible branding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-windows-861-final-branding.py
      - name: Frontend and release surface regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          python3 scripts/test-windows-861-strict-port.py
          python3 scripts/test-windows-861-release-surface.py
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Commit applied branding patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'Release surface already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/SettingsPage.tsx
          git commit -m 'feat(windows): finalize ENDLUME YT Studio PEISOV surfaces'
          git push origin HEAD:windows/endlume-861-managed-access
