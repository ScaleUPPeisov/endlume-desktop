name: ENDLUME 10.0.13 Phase 3 Physical Gate Recovery

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-fast-engine-transplant
    paths:
      - '.github/workflows/endlume-1013-phase3-compile.yml'
      - 'scripts/phase3_physical_acceptance.py'
      - 'QA_PHASE3_*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase3-physical-recovery
  cancel-in-progress: true

env:
  PHASE_3_PRODUCT_HEAD: e4a07972b1566ed73b11c4eb758d59f4dc839e71
  PRODUCT_BASE: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  FAST_ENGINE_SOURCE: a7a399e83de8b9248e2065c6dda1f9079ded6565
  SOURCE_RUN_ID: '38071201778'
  SOURCE_ARTIFACT_ID: '11677270291'
  SOURCE_ARTIFACT_NAME: ENDLUME-10.0.13-PHASE3-FAST-ENGINE-CANDIDATE
  SOURCE_ARTIFACT_DIGEST: sha256:2eb887a0211318eb37171e7d46d46275ea112c88dad251d2ee7006bce2e38961
  OWNER_BINARY_SHA256: 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7

jobs:
  qa-diff-gate:
    name: Phase 3 — QA-only diff gate, PRODUCT_FILES_CHANGED=0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Prove QA-only recovery commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "$PHASE_3_PRODUCT_HEAD^{commit}"
          git merge-base --is-ancestor "$PHASE_3_PRODUCT_HEAD" HEAD
          git diff --name-only "$PHASE_3_PRODUCT_HEAD" HEAD | tee "$RUNNER_TEMP/qa-recovery-files.txt"

          BAD="$(git diff --name-only "$PHASE_3_PRODUCT_HEAD" HEAD | grep -Ev '^(\.github/workflows/|scripts/phase3_physical_acceptance\.py$|QA_PHASE3_.*\.md$)' || true)"
          if [ -n "$BAD" ]; then
            echo "Forbidden non-QA changes:" >&2
            printf '%s\n' "$BAD" >&2
            exit 31
          fi

          git diff --quiet "$PHASE_3_PRODUCT_HEAD" HEAD -- src src-tauri package.json package-lock.json public || {
            echo PRODUCT_FILES_CHANGED=FAIL >&2
            exit 32
          }

          echo "PHASE_3_PRODUCT_HEAD=$PHASE_3_PRODUCT_HEAD"
          echo "QA_HARNESS_HEAD=$(git rev-parse HEAD)"
          echo PRODUCT_FILES_CHANGED=0
          echo RELEASE=BLOCKED
          echo STABLE=UNTOUCHED
          echo LIVE_UPDATER=UNTOUCHED

  physical-owner-acceptance:
    name: Phase 3 — SAME e4a07972 candidate physical acceptance
    needs: qa-diff-gate
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 180
    steps:
      - name: Initialize isolated workspace and prove owner binary start state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

          ROOT="$RUNNER_TEMP/endlume-1013-phase3-physical-recovery"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/download" "$ROOT/unpacked" "$ROOT/acceptance/results" "$ROOT/acceptance/logs" "$ROOT/evidence"
          echo "PHYSICAL_ROOT=$ROOT" >> "$GITHUB_ENV"

          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          OWNER_BIN="$OWNER/Contents/MacOS/$OWNER_EXE"
          test -x "$OWNER_BIN"
          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then
            echo "Owner ENDLUME is running. Refusing to touch live owner state." >&2
            exit 41
          fi

          PRE_SHA="$(/usr/bin/shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          echo "OWNER_BINARY_PRE_SHA256=$PRE_SHA"
          test "$PRE_SHA" = "$OWNER_BINARY_SHA256"
          printf '%s\n' "$PRE_SHA" > "$ROOT/evidence/owner-binary-before.sha256"

          AVAIL_KB="$(df -k "$RUNNER_TEMP" | tail -1 | awk '{print $4}')"
          test "$AVAIL_KB" -ge 8000000

          python3 - "$ROOT/evidence/source.json" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={
            'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],
            'qaHarnessHead':sys.argv[2],
            'productBase':os.environ['PRODUCT_BASE'],
            'fastEngineSource':os.environ['FAST_ENGINE_SOURCE'],
            'sourceRunId':int(os.environ['SOURCE_RUN_ID']),
            'sourceArtifactId':int(os.environ['SOURCE_ARTIFACT_ID']),
            'sourceArtifactName':os.environ['SOURCE_ARTIFACT_NAME'],
            'sourceArtifactDigest':os.environ['SOURCE_ARTIFACT_DIGEST'],
            'release':'BLOCKED',
            'stable':'UNTOUCHED',
            'liveUpdater':'UNTOUCHED',
          }
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          PY
          echo OWNER_APPLICATION_REPLACED=NO
          echo RELEASE=BLOCKED

      - name: Download exact accepted candidate artifact from original run
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE3-FAST-ENGINE-CANDIDATE
          path: ${{ runner.temp }}/endlume-1013-phase3-physical-recovery/download
          github-token: ${{ github.token }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38071201778

      - name: Discover artifact files robustly and verify exact e4a07972 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"

          echo 'SAFE_ARTIFACT_FILE_INVENTORY_BEGIN'
          find "$ROOT/download" -maxdepth 4 -type f -print
          echo 'SAFE_ARTIFACT_FILE_INVENTORY_END'

          META="$(find "$ROOT/download" -type f -name 'PHASE3_HOSTED_BUILD.json' -print -quit)"
          ZIP="$(find "$ROOT/download" -type f -name 'ENDLUME-10.0.13-PHASE3-FAST-ENGINE-CANDIDATE.zip' -print -quit)"
          HARNESS="$(find "$ROOT/download" -type f -name 'phase3_physical_acceptance.py' -print -quit)"

          test -n "$META"; test -f "$META"
          test -n "$ZIP"; test -f "$ZIP"
          test -n "$HARNESS"; test -f "$HARNESS"

          python3 - "$META" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1]))
          required={
            'phase3Head':os.environ['PHASE_3_PRODUCT_HEAD'],
            'productBase':os.environ['PRODUCT_BASE'],
            'fastEngineSource':os.environ['FAST_ENGINE_SOURCE'],
            'release':'BLOCKED',
            'stable':'UNTOUCHED',
            'liveUpdater':'UNTOUCHED',
          }
          for k,v in required.items():
              if d.get(k)!=v: raise SystemExit(f'{k} mismatch: {d.get(k)!r} != {v!r}')
          if d.get('ownerApplicationReplaced')!='NO': raise SystemExit('ownerApplicationReplaced mismatch')
          print('EXACT_PRODUCT_METADATA=PASS')
          PY

          cp "$META" "$ROOT/evidence/PHASE3_HOSTED_BUILD.json"
          /usr/bin/shasum -a 256 "$ZIP" > "$ROOT/evidence/candidate-archive.sha256"
          /usr/bin/ditto -x -k "$ZIP" "$ROOT/unpacked"
          APP="$(find "$ROOT/unpacked" -maxdepth 5 -type d -name '*.app' -print -quit)"
          test -n "$APP"; test -d "$APP"
          case "$APP" in /Applications/*) echo 'Candidate escaped into /Applications' >&2; exit 51;; esac

          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          BIN="$APP/Contents/MacOS/$EXE"
          test "$BID" = "studio.endlume.desktop"
          test -x "$BIN"
          /usr/bin/lipo -archs "$BIN" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP"
          CANDIDATE_SHA="$(/usr/bin/shasum -a 256 "$BIN" | awk '{print $1}')"
          printf '%s\n' "$CANDIDATE_SHA" > "$ROOT/evidence/candidate-binary.sha256"

          cp "$HARNESS" "$ROOT/phase3_physical_acceptance.py"
          chmod 755 "$ROOT/phase3_physical_acceptance.py"

          python3 - "$ROOT/evidence/candidate.json" "$APP" "$BID" "$VER" "$CANDIDATE_SHA" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={
            'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],
            'qaHarnessHead':sys.argv[6],
            'candidateAppPath':sys.argv[2],
            'bundleId':sys.argv[3],
            'bundleVersion':sys.argv[4],
            'candidateBinarySha256':sys.argv[5],
            'architecture':'arm64',
            'codesign':'PASS',
            'installed':False,
          }
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          PY

          echo "PHASE3_APP=$APP" >> "$GITHUB_ENV"
          echo "CANDIDATE_BINARY_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo CANDIDATE_INSTALL=NO
          echo RELEASE=BLOCKED

      - name: Snapshot owner state and keychain immediately before candidate acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"
          STATE="$HOME/Library/Application Support/studio.endlume.desktop"

          python3 - "$STATE" "$ROOT/evidence/owner-state-before.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); out=Path(sys.argv[2]); rows={}
          if root.is_dir():
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=str(p.relative_to(root)); b=p.read_bytes()
                  rows[rel]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          out.write_text(json.dumps({'root':str(root),'files':rows},indent=2)+'\n')
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          print(f'OWNER_STATE_BEFORE_FILES={len(rows)}')
          print(f'OWNER_STATE_BEFORE_SHA256={digest}')
          PY

          TOKEN="$(/usr/bin/security find-generic-password -s studio.endlume.desktop -a managed-session -w 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            printf '%s' "$TOKEN" | /usr/bin/shasum -a 256 | awk '{print $1}' > "$ROOT/evidence/keychain-before.sha256"
          else
            printf 'MISSING\n' > "$ROOT/evidence/keychain-before.sha256"
          fi
          unset TOKEN
          echo OWNER_STATE_PRE_SNAPSHOT=PASS
          echo KEYCHAIN_PRE_SNAPSHOT=PASS

      - name: Run exact 3h static periodic Subscribe combined and fallback acceptance
        shell: bash
        run: |
          set -u
          ROOT="$PHYSICAL_ROOT"
          mkdir -p "$ROOT/acceptance/results" "$ROOT/acceptance/logs"
          set +e
          python3 "$ROOT/phase3_physical_acceptance.py" \
            --app "$PHASE3_APP" \
            --root "$ROOT/acceptance" \
            --head "$PHASE_3_PRODUCT_HEAD"
          RC=$?
          set -e
          printf '%s\n' "$RC" > "$ROOT/evidence/acceptance-exit-code.txt"
          echo "ACCEPTANCE_RC=$RC" >> "$GITHUB_ENV"

          if [ ! -f "$ROOT/acceptance/PHASE3_PHYSICAL_REPORT.json" ]; then
            python3 - "$ROOT/acceptance/PHASE3_PHYSICAL_REPORT.json" "$RC" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={'status':'HARNESS_ERROR','exitCode':int(sys.argv[2]),'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],'qaHarnessHead':sys.argv[3]}
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          PY
          fi
          echo "ACCEPTANCE_EXECUTED=YES"
          echo "ACCEPTANCE_RC=$RC"

      - name: Snapshot owner state and keychain immediately after candidate acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"
          STATE="$HOME/Library/Application Support/studio.endlume.desktop"

          python3 - "$STATE" "$ROOT/evidence/owner-state-after.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); out=Path(sys.argv[2]); rows={}
          if root.is_dir():
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=str(p.relative_to(root)); b=p.read_bytes()
                  rows[rel]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          out.write_text(json.dumps({'root':str(root),'files':rows},indent=2)+'\n')
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          print(f'OWNER_STATE_AFTER_FILES={len(rows)}')
          print(f'OWNER_STATE_AFTER_SHA256={digest}')
          PY

          TOKEN="$(/usr/bin/security find-generic-password -s studio.endlume.desktop -a managed-session -w 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            printf '%s' "$TOKEN" | /usr/bin/shasum -a 256 | awk '{print $1}' > "$ROOT/evidence/keychain-after.sha256"
          else
            printf 'MISSING\n' > "$ROOT/evidence/keychain-after.sha256"
          fi
          unset TOKEN

          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          OWNER_BIN="$OWNER/Contents/MacOS/$OWNER_EXE"
          POST_SHA="$(/usr/bin/shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          printf '%s\n' "$POST_SHA" > "$ROOT/evidence/owner-binary-after.sha256"

          python3 - "$ROOT/evidence/owner-state-before.json" "$ROOT/evidence/owner-state-after.json" "$ROOT/evidence/owner-state-diff.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])).get('files',{}); b=json.load(open(sys.argv[2])).get('files',{})
          added=sorted(set(b)-set(a)); removed=sorted(set(a)-set(b)); changed=[]
          for k in sorted(set(a)&set(b)):
              if a[k]!=b[k]: changed.append({'path':k,'before':a[k],'after':b[k]})
          out={'preserved':not added and not removed and not changed,'added':[{ 'path':k, **b[k]} for k in added],'removed':[{ 'path':k, **a[k]} for k in removed],'changed':changed}
          open(sys.argv[3],'w').write(json.dumps(out,indent=2)+'\n')
          print('OWNER_STATE_PRESERVED='+('YES' if out['preserved'] else 'NO'))
          if not out['preserved']:
              for row in out['added']: print('OWNER_STATE_ADDED',row)
              for row in out['removed']: print('OWNER_STATE_REMOVED',row)
              for row in out['changed']: print('OWNER_STATE_CHANGED',row)
          PY

          STATE_OK="$(python3 -c 'import json,sys;print("YES" if json.load(open(sys.argv[1]))["preserved"] else "NO")' "$ROOT/evidence/owner-state-diff.json")"
          KEYCHAIN_OK=NO
          if cmp -s "$ROOT/evidence/keychain-before.sha256" "$ROOT/evidence/keychain-after.sha256"; then KEYCHAIN_OK=YES; fi
          OWNER_OK=NO
          if [ "$POST_SHA" = "$OWNER_BINARY_SHA256" ] && cmp -s "$ROOT/evidence/owner-binary-before.sha256" "$ROOT/evidence/owner-binary-after.sha256"; then OWNER_OK=YES; fi

          echo "OWNER_STATE_PRESERVED=$STATE_OK" >> "$GITHUB_ENV"
          echo "KEYCHAIN_SESSION_PRESERVED=$KEYCHAIN_OK" >> "$GITHUB_ENV"
          echo "OWNER_APPLICATION_PRESERVED=$OWNER_OK" >> "$GITHUB_ENV"
          echo "OWNER_STATE_PRESERVED=$STATE_OK"
          echo "KEYCHAIN_SESSION_PRESERVED=$KEYCHAIN_OK"
          echo "OWNER_APPLICATION_REPLACED=$([ "$OWNER_OK" = YES ] && echo NO || echo YES)"

          python3 - "$ROOT/evidence/safety-summary.json" "$STATE_OK" "$KEYCHAIN_OK" "$OWNER_OK" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],'qaHarnessHead':sys.argv[5],'ownerStatePreserved':sys.argv[2]=='YES','keychainSessionPreserved':sys.argv[3]=='YES','ownerApplicationPreserved':sys.argv[4]=='YES','release':'BLOCKED','stable':'UNTOUCHED','liveUpdater':'UNTOUCHED'}
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          PY

      - name: Build recovery summary without failing before evidence upload
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"
          mkdir -p "$ROOT/acceptance/results" "$ROOT/acceptance/logs" "$ROOT/evidence"
          : "${ACCEPTANCE_RC:=99}"
          : "${OWNER_STATE_PRESERVED:=NO}"
          : "${KEYCHAIN_SESSION_PRESERVED:=NO}"
          : "${OWNER_APPLICATION_PRESERVED:=NO}"
          python3 - "$ROOT/evidence/PHASE3_QA_RECOVERY_SUMMARY.json" "$ACCEPTANCE_RC" "$OWNER_STATE_PRESERVED" "$KEYCHAIN_SESSION_PRESERVED" "$OWNER_APPLICATION_PRESERVED" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={
            'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],
            'qaHarnessHead':sys.argv[6],
            'productFilesChanged':0,
            'sourceRunId':int(os.environ['SOURCE_RUN_ID']),
            'sourceArtifactId':int(os.environ['SOURCE_ARTIFACT_ID']),
            'candidateBinarySha256':os.environ.get('CANDIDATE_BINARY_SHA256'),
            'acceptanceExitCode':int(sys.argv[2]),
            'ownerStatePreserved':sys.argv[3]=='YES',
            'keychainSessionPreserved':sys.argv[4]=='YES',
            'ownerApplicationPreserved':sys.argv[5]=='YES',
            'release':'BLOCKED',
            'stable':'UNTOUCHED',
            'liveUpdater':'UNTOUCHED',
          }
          out['pass']=out['acceptanceExitCode']==0 and out['ownerStatePreserved'] and out['keychainSessionPreserved'] and out['ownerApplicationPreserved']
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload Phase 3 physical evidence before hard gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE3-PHYSICAL-EVIDENCE-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/endlume-1013-phase3-physical-recovery/acceptance/PHASE3_PHYSICAL_REPORT.json
            ${{ runner.temp }}/endlume-1013-phase3-physical-recovery/acceptance/results/*.json
            ${{ runner.temp }}/endlume-1013-phase3-physical-recovery/acceptance/logs/*.log
            ${{ runner.temp }}/endlume-1013-phase3-physical-recovery/evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Final Phase 3 hard gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"
          test "${ACCEPTANCE_RC:-99}" = "0"
          test "${OWNER_APPLICATION_PRESERVED:-NO}" = "YES"
          test "${OWNER_STATE_PRESERVED:-NO}" = "YES"
          test "${KEYCHAIN_SESSION_PRESERVED:-NO}" = "YES"
          test -f "$ROOT/acceptance/PHASE3_PHYSICAL_REPORT.json"
          python3 - "$ROOT/evidence/PHASE3_QA_RECOVERY_SUMMARY.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['pass'] is True,d
          assert d['productFilesChanged']==0,d
          print('PHASE_3_PHYSICAL_GATE=PASS')
          print('PRODUCT_FILES_CHANGED=0')
          print('OWNER_APPLICATION_REPLACED=NO')
          print('OWNER_STATE_PRESERVED=YES')
          print('KEYCHAIN_SESSION_PRESERVED=YES')
          print('RELEASE=BLOCKED')
          PY

      - name: Cleanup isolated Phase 3 workspace and final owner binary proof
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          OWNER_BIN="$OWNER/Contents/MacOS/$OWNER_EXE"
          FINAL_SHA="$(/usr/bin/shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          echo "OWNER_BINARY_FINAL_SHA256=$FINAL_SHA"
          test "$FINAL_SHA" = "$OWNER_BINARY_SHA256"
          if [ -n "${PHYSICAL_ROOT:-}" ]; then
            test "$PHYSICAL_ROOT" != "/"
            rm -rf "$PHYSICAL_ROOT"
          fi
          echo OWNER_APPLICATION_REPLACED=NO
          echo RELEASE=BLOCKED
