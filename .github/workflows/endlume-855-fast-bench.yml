name: ENDLUME 8.55 Fast Bench
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  bench:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Exact 15 MP3 and exact visual benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          ROOT="$(find /Volumes -maxdepth 10 -type d -path "*${UUID}*/Neon Drive FM_BATCH_2026-09-05_001" -print -quit 2>/dev/null)"
          SIDE="$(find "$ROOT/Rendered/logs" -type f -name '*project.json' -print -quit)"
          FFM="$(find '/Applications' "$HOME/.endlume-local-builder" -type f -name 'ffmpeg*' -perm -111 -print -quit 2>/dev/null || true)"
          FFP="$(find '/Applications' "$HOME/.endlume-local-builder" -type f -name 'ffprobe*' -perm -111 -print -quit 2>/dev/null || true)"
          echo "ROOT=$ROOT"; echo "FFM=$FFM"; echo "FFP=$FFP"; test -f "$SIDE"; test -x "$FFM"; test -x "$FFP"
          python3 -u - "$SIDE" "$FFP" <<'PY'
          import json,subprocess,sys,os
          d=json.load(open(sys.argv[1])); ffp=sys.argv[2]; rows=[]
          for n,p in enumerate(d['project']['audio'],1):
            q=subprocess.run([ffp,'-v','error','-show_entries','format=duration,size:stream=codec_name,bit_rate,sample_rate,channels','-select_streams','a:0','-of','json',p],capture_output=True,text=True)
            print('RC',n,q.returncode,q.stderr.strip(),flush=True)
            x=json.loads(q.stdout); f=x['format']; s=x['streams'][0]; r=(float(f['duration']),int(f['size']),int(s.get('bit_rate') or 0),s['codec_name'],s['sample_rate'],s['channels']); rows.append(r);print('TRACK',n,*r,flush=True)
          t=0.;i=0;b=0
          while t<7200:
            r=rows[i%15];t+=r[0];b+=r[1];i+=1
          print('WHOLE_TRACK_FINAL',t,'TRACKS_PLAYED',i,'AUDIO_SOURCE_BYTES',b,'MB',b/1e6,flush=True)
          PY
          python3 - "$SIDE" <<'PY' >/tmp/e855
          import json,shlex,sys
          d=json.load(open(sys.argv[1]));print('IMG='+shlex.quote(d['project']['media'][0]));print('FX1='+shlex.quote(d['effects'][0]['source']));print('FX2='+shlex.quote(d['effects'][1]['source']))
          PY
          source /tmp/e855
          TMP="$(mktemp -d /tmp/e855.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          REF="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=60,setsar=1[b0];[1:v]fps=60,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=60,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]format=yuv420p[outv]"
          CAND="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          run(){ label="$1"; graph="$2"; dur="$3"; fr="$4"; out="$5"; t0=$(python3 -c 'import time;print(time.time())'); "$FFM" -hide_banner -loglevel error -filter_complex_threads 4 -loop 1 -framerate "$fr" -i "$IMG" -stream_loop -1 -i "$FX1" -stream_loop -1 -i "$FX2" -filter_complex "$graph" -map '[outv]' -t "$dur" -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 1800 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$out"; t1=$(python3 -c 'import time;print(time.time())'); python3 - "$label" "$t0" "$t1" <<'PY'
          import sys;print(sys.argv[1]+'_SEC',round(float(sys.argv[3])-float(sys.argv[2]),3))
          PY
          }
          run REF8 "$REF" 8 60 "$TMP/ref.mp4"
          run CAND8 "$CAND" 8 30 "$TMP/c8.mp4"
          "$FFM" -hide_banner -i "$TMP/ref.mp4" -i "$TMP/c8.mp4" -lavfi '[0:v][1:v]ssim' -f null - 2>&1 | grep 'SSIM' | tail -1 || true
          run CAND30 "$CAND" 30 30 "$TMP/c30.mp4"
          "$FFP" -v error -show_entries format=duration,size,bit_rate:stream=avg_frame_rate,width,height,bit_rate -of json "$TMP/c30.mp4"
