name: ReelsFactory macOS M1 release

on:
  push:
    branches: [reelsfactory-bootstrap]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: ReelsFactory')
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout private release branch
        uses: actions/checkout@v4

      - name: Decode ReelsFactory source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ReelsFactory-v0.1.0
          cat reelsfactory-source.part*.b64 | base64 --decode > /tmp/reelsfactory-source.zip
          unzip -q /tmp/reelsfactory-source.zip
          test -f ReelsFactory-v0.1.0/package.json

      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ReelsFactory-v0.1.0/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ReelsFactory-v0.1.0
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg smoke-test tools
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -hide_banner -encoders | grep -q h264_videotoolbox

      - name: Build native AVFoundation exporter
        working-directory: ReelsFactory-v0.1.0
        run: ./scripts/build-native-macos.sh

      - name: Generate macOS icons
        working-directory: ReelsFactory-v0.1.0
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Verify UI contract and frontend
        working-directory: ReelsFactory-v0.1.0
        run: npm run check

      - name: Verify Rust/Tauri
        working-directory: ReelsFactory-v0.1.0
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Native smoke test — 100 passes
        working-directory: ReelsFactory-v0.1.0
        run: ./scripts/validate-native-macos.sh

      - name: Build DMG + signed updater package
        working-directory: ReelsFactory-v0.1.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Validate app bundle identity
        working-directory: ReelsFactory-v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CONFIG_VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          CARGO_VERSION="$(python3 - <<'PY'
          import re
          s=open('src-tauri/Cargo.toml').read()
          print(re.search(r'^version\s*=\s*"([^"]+)"',s,re.M).group(1))
          PY
          )"
          test "$VERSION" = "$CONFIG_VERSION"
          test "$VERSION" = "$CARGO_VERSION"
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          TAR="$(find "$APP_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -d "$APP"
          test -f "$TAR"
          test -f "$TAR.sig"
          BUNDLE_ID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          APP_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          test "$BUNDLE_ID" = "ai.reelsfactory.desktop"
          test "$APP_VERSION" = "$VERSION"
          find "$APP/Contents" -name 'reels-exporter*' -type f -print -quit | grep -q .
          echo "Verified ReelsFactory.app · $BUNDLE_ID · $APP_VERSION"

      - name: Prepare persistent build artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd ReelsFactory-v0.1.0
          VERSION="$(node -p "require('./package.json').version")"
          rm -rf ../build-artifacts
          mkdir -p ../build-artifacts
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          TAR="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          SIG="$TAR.sig"
          test -f "$DMG"; test -f "$TAR"; test -f "$SIG"
          cp "$DMG" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.dmg"
          cp "$TAR" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.app.tar.gz"
          cp "$SIG" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.app.tar.gz.sig"
          SIG_CONTENT="$(cat "$SIG")"
          python3 - "$VERSION" "$SIG_CONTENT" <<'PY'
          import json,sys,datetime
          version,signature=sys.argv[1:]
          release=json.load(open('RELEASE_NOTES.json'))
          notes='RU:\n- '+'\n- '.join(release['ru'])+'\n\nEN:\n- '+'\n- '.join(release['en'])
          data={'version':version,'pub_date':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'signature':signature,'notes':notes,'smoke_checks':100,'platform':'darwin-aarch64'}
          open('../build-artifacts/build.json','w').write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          cd ..
          shasum -a 256 build-artifacts/* > build-artifacts/SHA256SUMS.txt
          ls -lh build-artifacts

      - name: Persist verified artifacts on private release branch
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("ReelsFactory-v0.1.0/package.json"))["version"])')"
          git config user.name "ReelsFactory Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f build-artifacts
          git commit -m "ci: ReelsFactory ${VERSION} verified 100/100 [skip ci]"
          git push origin HEAD:reelsfactory-bootstrap
