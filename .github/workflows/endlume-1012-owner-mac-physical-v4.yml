name: ENDLUME 10.0.11 to 10.0.12 physical canonical-path gate

on:
  push:
    branches: [release]
    paths: ['.github/workflows/endlume-1012-owner-mac-physical-v4.yml']

permissions:
  contents: read

jobs:
  physical-update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Canonical-path updater test with guaranteed rollback
        shell: bash
        run: |
          set -euo pipefail
          APP='/Applications/ENDLUME YT Studio PEISOV.app'
          INFO="$APP/Contents/Info.plist"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          EXPECTED='8f60dbe1dd611db407c2d096aebd4597f6ff2af07c881e2e41d163e19b2b80c0'
          ROOT="$RUNNER_TEMP/endlume-physical-v4-${GITHUB_RUN_ID}"
          BACKUP="$ROOT/original-10.0.11.bundlebackup"
          DATA="$HOME/Library/Application Support/studio.endlume.desktop"
          DATA_BACKUP="$ROOT/appdata-backup"
          mkdir -p "$ROOT"
          pkill -x "$EXE" 2>/dev/null || true

          restore_original() {
            set +e
            pkill -x "$EXE" 2>/dev/null || true
            sleep 1
            if [ -d "$BACKUP" ]; then
              rm -rf "$APP"
              mv "$BACKUP" "$APP"
            fi
            if [ -d "$DATA_BACKUP" ]; then
              rm -rf "$DATA"
              cp -R "$DATA_BACKUP" "$DATA"
            fi
            if [ -d "$APP" ]; then
              SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" 2>/dev/null || true)
              SHA=$(shasum -a 256 "$APP/Contents/MacOS/$EXE" 2>/dev/null | awk '{print $1}')
              EP=$(strings -a "$APP/Contents/MacOS/$EXE" 2>/dev/null | grep -F 'endlume-stable/latest.json' | head -1 || true)
              echo "ROLLBACK_SHORT=$SHORT"
              echo "ROLLBACK_SHA=$SHA"
              [ "$SHORT" = '10.0.11' ] && [ "$SHA" = "$EXPECTED" ] && [ -n "$EP" ] && echo OWNER_ROLLBACK_EXACT_10_0_11=PASS || echo OWNER_ROLLBACK_EXACT_10_0_11=FAIL
            fi
          }
          trap restore_original EXIT

          # Normalize the physical app back to the exact original 10.0.11 if a previous staging test changed only the equal-length endpoint string.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = '10.0.11'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = '10.0.11'
          CURRENT_SHA=$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')
          if [ "$CURRENT_SHA" != "$EXPECTED" ]; then
            python3 - "$APP" <<'PY'
          import os,sys
          old=b'endlume-test12';new=b'endlume-stable';assert len(old)==len(new)
          hits=[]
          for base,_,files in os.walk(sys.argv[1]):
            for n in files:
              p=os.path.join(base,n)
              try:d=open(p,'rb').read()
              except OSError:continue
              if old in d:
                hits.append((p,d.count(old)));open(p,'wb').write(d.replace(old,new))
          print('NORMALIZE_HITS',hits);assert hits
          PY
            xattr -cr "$APP" || true
            codesign --force --deep --sign - "$APP"
          fi
          test "$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"
          strings -a "$APP/Contents/MacOS/$EXE" | grep -F 'endlume-stable/latest.json'
          echo SOURCE_EXACT_10_0_11=PASS

          # Preserve the user's exact application and state outside any .app bundle path.
          mv "$APP" "$BACKUP"
          if [ -d "$DATA" ]; then cp -R "$DATA" "$DATA_BACKUP"; fi
          cp -R "$BACKUP" "$APP"
          test "$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"

          BEFORE_SETTINGS="$ROOT/settings-before.txt"
          : > "$BEFORE_SETTINGS"
          for f in license.json library.json; do [ ! -f "$DATA/$f" ] || shasum -a 256 "$DATA/$f" | awk -v n="$f" '{print n"="$1}' >> "$BEFORE_SETTINGS"; done
          sort -o "$BEFORE_SETTINGS" "$BEFORE_SETTINGS"

          # Redirect only the temporary canonical-path 10.0.11 to isolated staging.
          python3 - "$APP" <<'PY'
          import os,sys
          old=b'endlume-stable';new=b'endlume-test12';assert len(old)==len(new)
          hits=[]
          for base,_,files in os.walk(sys.argv[1]):
            for n in files:
              p=os.path.join(base,n)
              try:d=open(p,'rb').read()
              except OSError:continue
              if old in d:
                hits.append((p,d.count(old)));open(p,'wb').write(d.replace(old,new))
          print('STAGING_PATCH_HITS',hits);assert hits
          PY
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          test "$(shasum -a 256 "$BACKUP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"
          echo ORIGINAL_BACKUP_ISOLATED=PASS

          # Verify staging metadata and exact signed updater bytes before launch.
          BASE='https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-test12'
          curl -fsSL "$BASE/latest.json" -o "$ROOT/update.json"
          UPDATE_URL=$(python3 - "$ROOT/update.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]));assert d['version']=='10.0.12',d
          p=d['platforms']['darwin-aarch64'];assert p['signature'];assert p['sha256']=='760f1da52011cbe9745894eeb04ef3dfef3b5c0e7d85ceb3841f63d67c8ae6e9';print(p['url'])
          PY
          )
          curl -fsSL "$UPDATE_URL" -o "$ROOT/update.tar.gz"
          test "$(shasum -a 256 "$ROOT/update.tar.gz" | awk '{print $1}')" = '760f1da52011cbe9745894eeb04ef3dfef3b5c0e7d85ceb3841f63d67c8ae6e9'
          echo DOWNLOAD=PASS

          "$APP/Contents/MacOS/$EXE" >"$ROOT/app.log" 2>&1 &
          LAUNCH_PID=$!
          echo "LAUNCH_PID=$LAUNCH_PID"

          clicked=0
          APP_PID=''
          for attempt in $(seq 1 60); do
            for pid in $(pgrep -x "$EXE" 2>/dev/null || true); do
              cmd=$(ps -p "$pid" -o command= 2>/dev/null || true)
              case "$cmd" in "$APP/Contents/MacOS/$EXE"*) APP_PID="$pid"; break;; esac
            done
            if [ -z "$APP_PID" ]; then sleep 1; continue; fi
            OUT=$(osascript - "$APP_PID" <<'APPLESCRIPT'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              try
                set p to first application process whose unix id is targetPid
                set frontmost of p to true
                repeat with w in windows of p
                  repeat with e in entire contents of w
                    try
                      set nm to name of e as text
                      if nm contains "ОБНОВИТЬ" and nm does not contain "ПОЗЖЕ" then
                        perform action "AXPress" of e
                        return "CLICKED:" & nm
                      end if
                    end try
                  end repeat
                end repeat
              on error errText
                return "ERROR:" & errText
              end try
            end tell
            return "NOT_FOUND"
          end run
          APPLESCRIPT
            )
            echo "UPDATE_UI attempt=$attempt pid=$APP_PID result=$OUT"
            if [[ "$OUT" == CLICKED:* ]]; then clicked=1; break; fi
            sleep 1
          done
          if [ "$clicked" -ne 1 ]; then echo '--- APP LOG ---'; cat "$ROOT/app.log" || true; exit 21; fi
          echo UPDATE_DETECTED=PASS
          echo UPDATE_BUTTON_CLICKED=PASS

          # Successful Tauri signature verification + install must physically replace the canonical bundle with 10.0.12.
          installed=0
          for i in $(seq 1 120); do
            SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" 2>/dev/null || true)
            BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist" 2>/dev/null || true)
            if [ "$SHORT" = '10.0.12' ] && [ "$BUILD" = '10.0.12' ]; then installed=1; break; fi
            sleep 1
          done
          test "$installed" -eq 1
          echo SIGNATURE=PASS
          echo INSTALL=PASS
          echo CFBundleShortVersionString=10.0.12
          echo CFBundleVersion=10.0.12

          # Require an actual new process after the old 10.0.11 process is gone.
          relaunched=0
          NEW_PID=''
          for i in $(seq 1 45); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              for pid in $(pgrep -x "$EXE" 2>/dev/null || true); do
                [ "$pid" = "$APP_PID" ] && continue
                cmd=$(ps -p "$pid" -o command= 2>/dev/null || true)
                case "$cmd" in "$APP/Contents/MacOS/$EXE"*) NEW_PID="$pid"; relaunched=1; break;; esac
              done
            fi
            [ "$relaunched" -eq 1 ] && break
            sleep 1
          done
          test "$relaunched" -eq 1
          echo RELAUNCH=PASS
          echo NEW_PID="$NEW_PID"

          # About/Settings payload must contain the production version after updater installation.
          grep -R -a -q '10.0.12' "$APP/Contents/Resources"
          echo SETTINGS_ABOUT_VERSION_PAYLOAD=PASS

          AFTER_SETTINGS="$ROOT/settings-after.txt"
          : > "$AFTER_SETTINGS"
          for f in license.json library.json; do [ ! -f "$DATA/$f" ] || shasum -a 256 "$DATA/$f" | awk -v n="$f" '{print n"="$1}' >> "$AFTER_SETTINGS"; done
          sort -o "$AFTER_SETTINGS" "$AFTER_SETTINGS"
          diff -u "$BEFORE_SETTINGS" "$AFTER_SETTINGS"
          echo SETTINGS_PRESERVED=PASS

          echo PHYSICAL_UPDATE_GATE=PASS
