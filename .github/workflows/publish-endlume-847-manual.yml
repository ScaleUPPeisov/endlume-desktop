name: Publish ENDLUME 8.47 Manual

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - '.github/workflows/publish-endlume-847-manual.yml'

permissions:
  contents: read

concurrency:
  group: endlume-self-hosted-macos-release
  cancel-in-progress: true

jobs:
  publish-manual:
    name: Verify and publish ENDLUME 8.47 manual ZIP
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - name: Verify local signed 8.47 candidate and publish ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          VERSION='1.0.0-alpha.8.47'
          ART="$HOME/.endlume-release-bridge/endlume/candidate-8.47"
          TAR="$ART/ENDLUME-macos-aarch64.app.tar.gz"
          SIG="$ART/ENDLUME-macos-aarch64.app.tar.gz.sig"
          WORK="$(mktemp -d /tmp/endlume-847-manual.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          test -s "$TAR"
          test -s "$SIG"
          /usr/bin/tar -xzf "$TAR" -C "$WORK"
          APP="$(find "$WORK" -type d -name 'ENDLUME Studio.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test "$BID" = 'studio.endlume.desktop'
          test "$VER" = "$VERSION"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP"
          ZIP="$WORK/ENDLUME_Studio_${VERSION}_MAC.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$ZIP"
          ZIP_LIST="$(/usr/bin/unzip -Z1 "$ZIP")"
          printf '%s\n' "$ZIP_LIST" | head -1 | grep -Fq 'ENDLUME Studio.app/'
          if printf '%s\n' "$ZIP_LIST" | grep -Eq '(^|/)(node_modules|target|\.git)(/|$)|\.command$|\.log$'; then
            echo 'manual ZIP contains developer/build files' >&2
            exit 1
          fi
          HOST_REPO='ScaleUPPeisov/scaleup-site'
          TAG='endlume-8.47-manual'
          if ! gh release view "$TAG" --repo "$HOST_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$HOST_REPO" --title 'ENDLUME Studio 8.47 Manual' --notes 'Verified Apple Silicon manual installer for ENDLUME Studio 1.0.0-alpha.8.47. Stable updater channel is separate.'
          fi
          gh release upload "$TAG" "$ZIP" --clobber --repo "$HOST_REPO"
          URL="https://github.com/$HOST_REPO/releases/download/$TAG/ENDLUME_Studio_${VERSION}_MAC.zip"
          /usr/bin/curl -fsIL --connect-timeout 10 --max-time 30 "$URL" >/dev/null
          echo "PASS: $VERSION / $BID / arm64 / codesign"
          echo "PASS: manual ZIP published: $URL"
