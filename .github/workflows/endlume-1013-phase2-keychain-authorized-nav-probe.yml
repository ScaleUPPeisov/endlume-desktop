name: ENDLUME 10.0.13 Phase 2 Keychain Authorized Nav Probe

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-canonical-product-reconstruction
    paths:
      - .github/workflows/endlume-1013-phase2-keychain-authorized-nav-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase2-keychain-authorized-nav-probe
  cancel-in-progress: true

env:
  CANONICAL_PRODUCT_SHA: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  SOURCE_BUILD_RUN: '38030777284'
  EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250
  EXPECTED_APP_BIN_SHA256: 4d208994181c5ca21b20c2e01dd06bda25e82a16bb1405379e79cc4da3026436
  OWNER_APP_BIN_SHA256: 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7

jobs:
  keychain-authorized-nav:
    name: Owner Mac one-time Keychain authorization probe
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Owner runner TCC and production app safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          test "$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || echo false)" = true
          REPORT="$RUNNER_TEMP/endlume-keychain-nav"
          rm -rf "$REPORT" && mkdir -p "$REPORT"
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER_APP"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist")"
          OWNER_BIN="$OWNER_APP/Contents/MacOS/$OWNER_EXE"
          OWNER_SHA="$(shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          test "$OWNER_SHA" = "$OWNER_APP_BIN_SHA256"
          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then
            echo BLOCKED_OWNER_PRODUCTION_APP_ALREADY_RUNNING=true >&2
            exit 73
          fi
          printf 'OWNER_VERSION=%s\nOWNER_BIN_SHA256=%s\n' "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist")" "$OWNER_SHA" > "$REPORT/owner-before.txt"

      - name: Download exact accepted canonical QA artifact
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/canonical-keychain-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38030777284

      - name: Verify and launch exact isolated candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-keychain-nav"
          SRC="$RUNNER_TEMP/canonical-keychain-source"
          UNPACK="$RUNNER_TEMP/canonical-keychain-unpacked"
          DMG="$RUNNER_TEMP/ENDLUME-CANONICAL-KEYCHAIN-QA.dmg"
          rm -rf "$UNPACK" && mkdir -p "$UNPACK"
          ZIP="$SRC/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          test "$(shasum -a 256 "$ZIP" | awk '{print $1}')" = "$EXPECTED_APP_ZIP_SHA256"
          ditto -x -k "$ZIP" "$UNPACK"
          BUILT_APP="$(find "$UNPACK" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -d "$BUILT_APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$BUILT_APP/Contents/Info.plist")"
          BUILT_BIN="$BUILT_APP/Contents/MacOS/$EXE"
          test "$(shasum -a 256 "$BUILT_BIN" | awk '{print $1}')" = "$EXPECTED_APP_BIN_SHA256"
          /usr/bin/codesign --verify --deep --strict "$BUILT_APP"

          rm -f "$DMG"
          hdiutil create -quiet -size 350m -fs APFS -volname ENDLUME_CANONICAL_QA "$DMG"
          hdiutil attach -nobrowse -plist "$DMG" > "$RUNNER_TEMP/endlume-keychain-attach.plist"
          VOL="$(python3 - "$RUNNER_TEMP/endlume-keychain-attach.plist" <<'PY'
          import plistlib,sys
          p=plistlib.load(open(sys.argv[1],'rb'))
          xs=[x.get('mount-point') for x in p.get('system-entities',[]) if isinstance(x.get('mount-point'),str)]
          if not xs: raise SystemExit(1)
          print(xs[-1])
          PY
          )"
          case "$VOL" in /Volumes/ENDLUME_CANONICAL_QA*) ;; *) exit 74;; esac
          QA_APP="$VOL/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app"
          ditto "$BUILT_APP" "$QA_APP"
          QA_BIN="$QA_APP/Contents/MacOS/$EXE"
          test "$(shasum -a 256 "$QA_BIN" | awk '{print $1}')" = "$EXPECTED_APP_BIN_SHA256"
          /usr/bin/codesign --verify --deep --strict "$QA_APP"
          printf '%s' "$QA_APP" > "$RUNNER_TEMP/endlume-keychain-app-path"
          printf '%s' "$QA_BIN" > "$RUNNER_TEMP/endlume-keychain-bin-path"
          printf '%s' "$VOL" > "$RUNNER_TEMP/endlume-keychain-vol-path"
          /usr/bin/open -n "$QA_APP"

          PID=""
          for second in $(seq 0 30); do
            PIDS="$(pgrep -f "$QA_BIN" || true)"
            COUNT="$(printf '%s\n' "$PIDS" | awk 'NF{n++} END{print n+0}')"
            if [ "$COUNT" -eq 1 ]; then PID="$(printf '%s\n' "$PIDS" | awk 'NF{print;exit}')"; break; fi
            [ "$COUNT" -le 1 ] || exit 75
            sleep 1
          done
          test -n "$PID"
          /usr/sbin/lsof -a -p "$PID" -d txt -Fn 2>/dev/null | grep -Fxq "n$QA_BIN"
          printf '%s' "$PID" > "$RUNNER_TEMP/endlume-keychain-pid"
          printf 'CANDIDATE_PID=%s\nCANDIDATE_PATH_PROVEN=YES\nAPP_SHA256=%s\n' "$PID" "$EXPECTED_APP_BIN_SHA256" > "$REPORT/candidate-process.txt"

      - name: Detect Keychain prompt and click only one-time Allow if safely available
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-keychain-nav"
          PID="$(cat "$RUNNER_TEMP/endlume-keychain-pid")"
          kill -0 "$PID"

          cat > "$REPORT/keychain-probe.js" <<'JXA'
          function run(argv) {
            const targetPid = Number(argv[0]);
            const se = Application('System Events');
            const allowedProcNames = ['SecurityAgent','CoreServicesUIAgent'];
            let candidates = [];

            function s(fn) { try { const v=fn(); return v == null ? '' : String(v); } catch (_) { return ''; } }
            function b(fn) { try { return Boolean(fn()); } catch (_) { return false; } }

            const ps = se.applicationProcesses();
            for (let i=0;i<ps.length;i++) {
              const p=ps[i];
              const pid=Number(s(()=>p.unixId()));
              const pname=s(()=>p.name());
              if (pid !== targetPid && allowedProcNames.indexOf(pname) < 0) continue;
              let wins=[]; try { wins=p.windows(); } catch (_) { wins=[]; }
              for (let wi=0;wi<wins.length;wi++) {
                const w=wins[wi];
                let stack=[w], visited=0;
                while (stack.length && visited < 600) {
                  const el=stack.pop(); visited++;
                  const role=s(()=>el.role());
                  const name=s(()=>el.name());
                  if (role === 'AXButton') {
                    const enabled=b(()=>el.enabled());
                    if (name === 'Разрешить' || name === 'Allow') candidates.push({pname,pid,wi,name,enabled,el});
                  }
                  let kids=[]; try { kids=el.uiElements(); } catch (_) { kids=[]; }
                  for (let k=0;k<kids.length;k++) stack.push(kids[k]);
                }
              }
            }

            if (candidates.length !== 1) {
              return `ALLOW_BUTTON_COUNT=${candidates.length}\nALLOW_CLICKED=false`;
            }
            const c=candidates[0];
            if (!c.enabled) return `ALLOW_BUTTON_COUNT=1\nALLOW_ENABLED=false\nALLOW_CLICKED=false\nPROMPT_PROCESS=${c.pname}`;
            c.el.click();
            return `ALLOW_BUTTON_COUNT=1\nALLOW_ENABLED=true\nALLOW_CLICKED=true\nPROMPT_PROCESS=${c.pname}`;
          }
          JXA

          FOUND=0
          : > "$REPORT/keychain-attempts.txt"
          for second in $(seq 0 30); do
            kill -0 "$PID"
            set +e
            OUT=$(/usr/bin/osascript -l JavaScript "$REPORT/keychain-probe.js" "$PID" 2>"$REPORT/keychain-probe.raw.err")
            RC=$?
            set -e
            printf 'SECOND=%s RC=%s %s\n' "$second" "$RC" "$(printf '%s' "$OUT" | tr '\n' ' ')" >> "$REPORT/keychain-attempts.txt"
            if [ "$RC" -eq 0 ] && printf '%s\n' "$OUT" | grep -Fq 'ALLOW_CLICKED=true'; then
              printf '%s\n' "$OUT" > "$REPORT/keychain-result.txt"
              FOUND=1
              break
            fi
            if [ "$RC" -eq 0 ] && printf '%s\n' "$OUT" | grep -Fq 'ALLOW_ENABLED=false'; then
              printf '%s\n' "$OUT" > "$REPORT/keychain-result.txt"
              break
            fi
            sleep 1
          done
          rm -f "$REPORT/keychain-probe.js"
          sed -E 's#/(Users|Volumes)/[^[:space:]]+#<PATH>#g; s/ENDLUME-[A-Z2-9-]+/<LICENSE_REDACTED>/g; s/(Bearer )[A-Za-z0-9._-]+/\1<REDACTED>/g' "$REPORT/keychain-probe.raw.err" | head -40 > "$REPORT/keychain-probe.err" || true
          rm -f "$REPORT/keychain-probe.raw.err"

          if [ "$FOUND" -ne 1 ]; then
            echo KEYCHAIN_AUTH=BLOCKED_MANUAL_KEYCHAIN_AUTH | tee "$REPORT/gate-status.txt"
            echo LICENSED_SESSION=UNKNOWN
            exit 89
          fi
          echo KEYCHAIN_AUTH=ONE_TIME_ALLOW_CLICKED | tee "$REPORT/gate-status.txt"
          echo KEYCHAIN_ALWAYS_ALLOW=NO >> "$REPORT/gate-status.txt"
          echo KEYCHAIN_SECRET_READ=NO >> "$REPORT/gate-status.txt"

      - name: Prove normal navigation visually after one-time authorization
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-keychain-nav"
          PID="$(cat "$RUNNER_TEMP/endlume-keychain-pid")"
          READY=0
          for second in $(seq 0 45); do
            kill -0 "$PID"
            set +e
            GEOM=$(/usr/bin/osascript - "$PID" 2>/dev/null <<'OSA'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              set ps to every application process whose unix id is targetPid
              if (count of ps) is not 1 then error "missing candidate"
              tell item 1 of ps
                if (count of windows) is 0 then error "no window"
                set p to position of window 1
                set s to size of window 1
                return (item 1 of p as text) & "," & (item 2 of p as text) & "," & (item 1 of s as text) & "," & (item 2 of s as text)
              end tell
            end tell
          end run
          OSA
            )
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then READY=1; break; fi
            sleep 1
          done
          test "$READY" -eq 1
          IFS=',' read -r X Y W H <<EOF
          $GEOM
          EOF
          /usr/sbin/screencapture -x -R"$X,$Y,$W,220" "$REPORT/top-nav-after-allow.png"
          test -s "$REPORT/top-nav-after-allow.png"
          printf 'SAFE_CROP=TOP_220PX_ONLY\nLICENSE_SECRET_REGION_CAPTURED=NO_BY_GEOMETRY\n' > "$REPORT/screenshot-safety.txt"
          echo VISUAL_EVIDENCE_CAPTURED=YES

      - name: Cleanup exact candidate and verify owner application unchanged
        if: always()
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/endlume-keychain-nav"
          QA_BIN="$(cat "$RUNNER_TEMP/endlume-keychain-bin-path" 2>/dev/null || true)"
          QA_VOL="$(cat "$RUNNER_TEMP/endlume-keychain-vol-path" 2>/dev/null || true)"
          if [ -n "$QA_BIN" ]; then pkill -f "$QA_BIN" >/dev/null 2>&1 || true; fi
          sleep 2
          if [ -n "$QA_VOL" ]; then hdiutil detach -quiet "$QA_VOL" >/dev/null 2>&1 || true; fi
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)"
          OWNER_SHA="$(shasum -a 256 "$OWNER_APP/Contents/MacOS/$OWNER_EXE" 2>/dev/null | awk '{print $1}')"
          printf 'OWNER_VERSION=%s\nOWNER_BIN_SHA256=%s\n' "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)" "$OWNER_SHA" > "$REPORT/owner-after.txt"
          if cmp -s "$REPORT/owner-before.txt" "$REPORT/owner-after.txt"; then
            echo OWNER_APPLICATION_REPLACED=NO
          else
            echo OWNER_APPLICATION_REPLACED=FAIL >&2
            exit 78
          fi

      - name: Upload non-secret Keychain authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE2-KEYCHAIN-AUTH-NAV
          path: |
            ${{ runner.temp }}/endlume-keychain-nav/candidate-process.txt
            ${{ runner.temp }}/endlume-keychain-nav/keychain-attempts.txt
            ${{ runner.temp }}/endlume-keychain-nav/keychain-result.txt
            ${{ runner.temp }}/endlume-keychain-nav/keychain-probe.err
            ${{ runner.temp }}/endlume-keychain-nav/gate-status.txt
            ${{ runner.temp }}/endlume-keychain-nav/screenshot-safety.txt
            ${{ runner.temp }}/endlume-keychain-nav/top-nav-after-allow.png
            ${{ runner.temp }}/endlume-keychain-nav/owner-before.txt
            ${{ runner.temp }}/endlume-keychain-nav/owner-after.txt
          if-no-files-found: warn
          retention-days: 14
