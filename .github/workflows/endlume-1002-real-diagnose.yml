name: ENDLUME 10.0.2 P0 Real Diagnose

on:
  push:
    branches: [hotfix/endlume-10.0.2-p0]
    paths:
      - '.github/workflows/endlume-1002-real-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-1002-p0-real-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose real final MP4 + Ping-Pong source
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Diagnose exact final MP4
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          TARGET="$HOME/Movies/ENDLUME Studio/Новая папка — Ready Videos_5.mp4"
          echo "TARGET=$TARGET"
          test -f "$TARGET"
          stat -f 'FINAL_BYTES=%z' "$TARGET"
          shasum -a 256 "$TARGET" | sed 's/^/FINAL_SHA256=/'
          echo '=== FFPROBE_FULL ==='
          ffprobe -v error -count_packets -show_entries             stream=index,codec_type,codec_name,codec_long_name,codec_tag_string,codec_tag,profile,sample_fmt,sample_rate,channels,channel_layout,bit_rate,duration,start_time,time_base,nb_read_packets,extradata_size,disposition:format=format_name,format_long_name,duration,start_time,bit_rate,size             -of json "$TARGET"

          python3 - "$TARGET" <<'PY'
          import json, subprocess, sys, math, struct, os
          p=sys.argv[1]
          def out(args):
              return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT)
          meta=json.loads(out(["ffprobe","-v","error","-show_streams","-show_format","-of","json",p]))
          audio=[s for s in meta.get("streams",[]) if s.get("codec_type")=="audio"]
          video=[s for s in meta.get("streams",[]) if s.get("codec_type")=="video"]
          dur=float(meta.get("format",{}).get("duration") or 0)
          print("FINAL_AUDIO_STREAMS="+str(len(audio)))
          print("FINAL_VIDEO_STREAMS="+str(len(video)))
          for i,s in enumerate(audio):
              disp=s.get("disposition") or {}
              print("AUDIO_STREAM_%d="%i+json.dumps({
                  "index":s.get("index"),"codec":s.get("codec_name"),"tag":s.get("codec_tag_string"),
                  "sample_rate":s.get("sample_rate"),"channels":s.get("channels"),
                  "layout":s.get("channel_layout"),"start_time":s.get("start_time"),
                  "duration":s.get("duration"),"time_base":s.get("time_base"),
                  "default":disp.get("default")
              },ensure_ascii=False))
          positions=[
              ("START",0.0),
              ("S30",min(30.0,max(0.0,dur-5))),
              ("P25",max(0.0,dur*.25)),
              ("MIDDLE",max(0.0,dur*.50)),
              ("P75",max(0.0,dur*.75)),
              ("END",max(0.0,dur-20.0))
          ]
          for label,pos in positions:
              cmd=["ffmpeg","-hide_banner","-loglevel","error","-ss",f"{pos:.3f}","-i",p,
                   "-map","0:a:0","-t","5","-vn","-ac","2","-ar","48000","-f","s16le","pipe:1"]
              pcm=subprocess.check_output(cmd)
              n=len(pcm)//2
              vals=struct.unpack("<%dh"%n,pcm[:n*2]) if n else ()
              peak=max((abs(x) for x in vals),default=0)
              nz=sum(1 for x in vals if x)
              rms=math.sqrt(sum(x*x for x in vals)/len(vals)) if vals else 0.0
              peak_db=20*math.log10(peak/32768) if peak else float("-inf")
              rms_db=20*math.log10(rms/32768) if rms else float("-inf")
              print(f"PCM_{label}_POS={pos:.3f}")
              print(f"PCM_{label}_BYTES={len(pcm)}")
              print(f"PCM_{label}_NON_ZERO={nz}")
              print(f"PCM_{label}_PEAK_DB={peak_db:.3f}")
              print(f"PCM_{label}_RMS_DB={rms_db:.3f}")
          for label,pos in [("START",0.0),("MIDDLE",dur*.5),("END",max(0.0,dur-5))]:
              args=["ffprobe","-v","error","-read_intervals",f"{pos:.3f}%+2","-select_streams","a:0",
                    "-show_packets","-show_entries","packet=pts_time,dts_time,duration_time,size,flags","-of","json",p]
              packets=json.loads(out(args)).get("packets",[])
              print(f"PACKETS_{label}_COUNT={len(packets)}")
              if packets:
                  print(f"PACKETS_{label}_FIRST="+json.dumps(packets[0],sort_keys=True))
                  print(f"PACKETS_{label}_LAST="+json.dumps(packets[-1],sort_keys=True))
          PY

          cat > /tmp/endlume-audio-native.swift <<'SWIFT'
          import Foundation
          import AVFoundation
          import AudioToolbox
          import CoreMedia

          guard CommandLine.arguments.count >= 2 else { exit(2) }
          let url=URL(fileURLWithPath: CommandLine.arguments[1])
          let asset=AVURLAsset(url:url)
          let tracks=asset.tracks(withMediaType:.audio)
          print("AVF_AUDIO_STREAMS=\(tracks.count)")
          guard let track=tracks.first else { print("AVF_NO_AUDIO_TRACK=YES"); exit(0) }
          print("AVF_TRACK_ENABLED=\(track.isEnabled)")
          print("AVF_TRACK_START=\(CMTimeGetSeconds(track.timeRange.start))")
          print("AVF_TRACK_DURATION=\(CMTimeGetSeconds(track.timeRange.duration))")
          print("AVF_PREFERRED_VOLUME=\(track.preferredVolume)")
          if let fd=track.formatDescriptions.first {
            let asbd=CMAudioFormatDescriptionGetStreamBasicDescription(fd as! CMAudioFormatDescription)
            if let a=asbd {
              print("AVF_ASBD_SAMPLE_RATE=\(a.pointee.mSampleRate)")
              print("AVF_ASBD_CHANNELS=\(a.pointee.mChannelsPerFrame)")
              print("AVF_ASBD_FORMAT_ID=\(a.pointee.mFormatID)")
            }
          }
          let total=CMTimeGetSeconds(asset.duration)
          let tests:[(String,Double)]=[("START",0),("MIDDLE",max(0,total*0.5)),("END",max(0,total-5))]
          for (label,pos) in tests {
            do {
              let reader=try AVAssetReader(asset:asset)
              reader.timeRange=CMTimeRange(start:CMTime(seconds:pos,preferredTimescale:60000),duration:CMTime(seconds:3,preferredTimescale:60000))
              let settings:[String:Any]=[
                AVFormatIDKey:kAudioFormatLinearPCM,
                AVLinearPCMBitDepthKey:16,
                AVLinearPCMIsFloatKey:false,
                AVLinearPCMIsBigEndianKey:false,
                AVLinearPCMIsNonInterleaved:false
              ]
              let output=AVAssetReaderTrackOutput(track:track,outputSettings:settings)
              guard reader.canAdd(output) else { print("AVF_\(label)=CANNOT_ADD"); continue }
              reader.add(output)
              guard reader.startReading() else { print("AVF_\(label)=START_FAIL"); continue }
              var bytes=0
              var nonzero=0
              var peak:Int16=0
              var buffers=0
              while buffers<256, let sample=output.copyNextSampleBuffer() {
                buffers += 1
                guard let block=CMSampleBufferGetDataBuffer(sample) else { continue }
                let len=CMBlockBufferGetDataLength(block)
                if len<=0 { continue }
                var data=[UInt8](repeating:0,count:len)
                let rc=CMBlockBufferCopyDataBytes(block,atOffset:0,dataLength:len,destination:&data)
                if rc != kCMBlockBufferNoErr { continue }
                bytes += len
                data.withUnsafeBytes { raw in
                  let vals=raw.bindMemory(to:Int16.self)
                  for v in vals {
                    if v != 0 { nonzero += 1 }
                    let a = v == Int16.min ? Int16.max : Swift.abs(v)
                    if a > peak { peak = a }
                  }
                }
              }
              print("AVF_\(label)_BYTES=\(bytes)")
              print("AVF_\(label)_NON_ZERO=\(nonzero)")
              print("AVF_\(label)_PEAK_I16=\(peak)")
              print("AVF_\(label)_STATUS=\(reader.status.rawValue)")
              if bytes==0 || nonzero==0 || peak==0 { print("AVF_\(label)_AUDIBLE=NO") } else { print("AVF_\(label)_AUDIBLE=YES") }
            } catch {
              print("AVF_\(label)_ERROR=\(error)")
            }
          }
          SWIFT
          echo '=== AVFOUNDATION_NATIVE_PCM ==='
          /usr/bin/swift /tmp/endlume-audio-native.swift "$TARGET"

          echo '=== APPLE_AFINFO ==='
          /usr/bin/afinfo "$TARGET" || true

          TMP="$(mktemp -d /tmp/endlume1002.XXXXXX)"
          echo '=== CONTROL_REMUX ==='
          ffmpeg -hide_banner -loglevel error -i "$TARGET" -map 0:v:0 -map 0:a:0 -c copy -disposition:a:0 default -movflags +faststart -y "$TMP/remux.mp4"
          /usr/bin/swift /tmp/endlume-audio-native.swift "$TMP/remux.mp4"
          echo '=== CONTROL_AUDIO_REENCODE ==='
          if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'aac_at'; then AENC=aac_at; else AENC=aac; fi
          ffmpeg -hide_banner -loglevel error -i "$TARGET" -map 0:v:0 -map 0:a:0 -c:v copy -c:a "$AENC" -b:a 320k -ar 48000 -ac 2 -tag:a mp4a -disposition:a:0 default -movflags +faststart -y "$TMP/aac.mp4"
          /usr/bin/swift /tmp/endlume-audio-native.swift "$TMP/aac.mp4"
          rm -rf "$TMP"

      - name: Inspect Ping-Pong source and hardware encoder
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo '=== ENCODER_CACHE ==='
          find "$HOME/Library/Caches" -name 'encoder-selection-8.64.json' -maxdepth 5 -print -exec cat {} \; 2>/dev/null || true
          echo
          echo '=== HEVC_VIDEOTOOLBOX_PROBE ==='
          if ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x360:r=60 -frames:v 30 -an -c:v hevc_videotoolbox -pix_fmt yuv420p -f null - ; then
            echo PINGPONG_HW_ENCODER_AVAILABLE=YES
          else
            echo PINGPONG_HW_ENCODER_AVAILABLE=NO
          fi

          SRC="$(mdfind 'kMDItemFSName == "для Японского канала .mp4"c' | head -n 1 || true)"
          if [ -z "$SRC" ]; then
            SRC="$(find "$HOME/Movies" "$HOME/Downloads" -maxdepth 5 -type f -name 'для Японского канала .mp4' -print -quit 2>/dev/null || true)"
          fi
          echo "PINGPONG_SOURCE=$SRC"
          if [ -n "$SRC" ] && [ -f "$SRC" ]; then
            stat -f 'PINGPONG_SOURCE_BYTES=%z' "$SRC"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,r_frame_rate,pix_fmt,duration:format=duration,size -of json "$SRC"
            D="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$SRC")"
            echo "PINGPONG_SOURCE_DURATION=$D"
            TMP="$(mktemp -d /tmp/pingpong1002.XXXXXX)"
            FILTER="[0:v]trim=duration=$D,setpts=PTS-STARTPTS,split[f][r];[r]reverse[rr];[f][rr]concat=n=2:v=1:a=0[x];[x]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=60,setsar=1[outv]"
            START="$(python3 - <<'PY'
          import time
          print(time.monotonic())
          PY
          )"
            if ffmpeg -hide_banner -loglevel error -i "$SRC" -filter_complex "$FILTER" -map '[outv]' -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 1 -power_efficient 0 -q:v 95 -g 600 -tag:v hvc1 -pix_fmt yuv420p -progress pipe:1 -y "$TMP/pingpong-hw.mp4"; then
              END="$(python3 - <<'PY'
          import time
          print(time.monotonic())
          PY
          )"
              python3 - "$START" "$END" <<'PY'
          import sys
          print("PINGPONG_HW_SECONDS=%.3f"%(float(sys.argv[2])-float(sys.argv[1])))
          PY
              ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=codec_name,avg_frame_rate,nb_read_packets,duration -of json "$TMP/pingpong-hw.mp4"
            else
              echo PINGPONG_HW_ENCODE=FAILED
            fi
            rm -rf "$TMP"
          else
            echo PINGPONG_SOURCE_NOT_FOUND=YES
          fi
