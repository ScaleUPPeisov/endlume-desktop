name: ENDLUME 10.0.11 to 10.0.12 direct Tauri updater gate

on:
  push:
    branches: [release]
    paths: ['.github/workflows/endlume-1012-tauri-updater-harness.yml']

permissions:
  contents: read

jobs:
  tauri-updater-gate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Verify exact owner source and prepare isolated real app copy
        shell: bash
        run: |
          set -euo pipefail
          APP='/Applications/ENDLUME YT Studio PEISOV.app'
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          EXPECTED='8f60dbe1dd611db407c2d096aebd4597f6ff2af07c881e2e41d163e19b2b80c0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '10.0.11'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = '10.0.11'
          test "$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"
          strings -a "$APP/Contents/MacOS/$EXE" | grep -F 'endlume-stable/latest.json'
          ROOT="$RUNNER_TEMP/endlume-tauri-updater-${GITHUB_RUN_ID}"
          TEST_APP="$ROOT/ENDLUME YT Studio PEISOV.app"
          HARNESS="$ROOT/harness"
          RECEIPT="$ROOT/receipt.txt"
          rm -rf "$ROOT"; mkdir -p "$ROOT" "$HARNESS/src" "$HARNESS/dist" "$HARNESS/icons"
          cp -R "$APP" "$TEST_APP"
          test "$(shasum -a 256 "$TEST_APP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"
          printf 'ROOT=%s\nTEST_APP=%s\nHARNESS=%s\nRECEIPT=%s\nAPP=%s\nEXE=%s\nEXPECTED=%s\n' "$ROOT" "$TEST_APP" "$HARNESS" "$RECEIPT" "$APP" "$EXE" "$EXPECTED" >> "$GITHUB_ENV"
          echo SOURCE_EXACT_10_0_11=PASS

      - name: Generate temporary updater harness only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$HARNESS/icons/icon.png" <<'PY'
          import base64,sys
          png='iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAGElEQVR42u3BAQ0AAADCoPdPbQ8HFAAAAPg1IAABF4V5LwAAAABJRU5ErkJggg=='
          open(sys.argv[1],'wb').write(base64.b64decode(png))
          PY
          file "$HARNESS/icons/icon.png"
          cat > "$HARNESS/Cargo.toml" <<'EOF'
          [package]
          name = "endlume-updater-harness"
          version = "10.0.11"
          edition = "2021"
          build = "build.rs"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }
          tauri-plugin-updater = "2"
          url = "2"
          EOF
          cat > "$HARNESS/build.rs" <<'EOF'
          fn main() { tauri_build::build() }
          EOF
          cat > "$HARNESS/dist/index.html" <<'EOF'
          <!doctype html><meta charset="utf-8"><title>ENDLUME updater harness</title>
          EOF
          cat > "$HARNESS/tauri.conf.json" <<'EOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "ENDLUME Updater Harness",
            "version": "10.0.11",
            "identifier": "studio.endlume.updaterharness",
            "build": { "frontendDist": "dist" },
            "app": { "windows": [] },
            "bundle": { "active": false, "icon": ["icons/icon.png"] }
          }
          EOF
          cat > "$HARNESS/src/main.rs" <<'EOF'
          use std::{env, fs, io::Write, path::PathBuf};
          use tauri_plugin_updater::UpdaterExt;
          use url::Url;

          const PUBKEY: &str = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEU5NDU1MkRFODQyRUM0OTUKUldTVnhDNkUzbEpGNmZmNUdyb2lUZVM0enU3WkVzdDlsSCtxcVpobitZc3Z0ZWMxQ1hucFZXRUUK";
          const ENDPOINT: &str = "https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-test12/latest.json";

          fn main() {
            tauri::Builder::default()
              .plugin(tauri_plugin_updater::Builder::new().build())
              .setup(|app| {
                let handle = app.handle().clone();
                let target_exe = PathBuf::from(env::var("ENDLUME_TEST_EXECUTABLE")?);
                let receipt = PathBuf::from(env::var("ENDLUME_UPDATER_RECEIPT")?);
                tauri::async_runtime::spawn(async move {
                  let result: Result<(), Box<dyn std::error::Error + Send + Sync>> = async {
                    let endpoint = Url::parse(ENDPOINT)?;
                    let updater = handle
                      .updater_builder()
                      .endpoints(vec![endpoint])?
                      .pubkey(PUBKEY)
                      .target("darwin-aarch64")
                      .executable_path(&target_exe)
                      .build()?;
                    let update = updater.check().await?.ok_or("no update returned")?;
                    let current = update.current_version.to_string();
                    let remote = update.version.to_string();
                    println!("CURRENT_VERSION={current}");
                    println!("REMOTE_VERSION={remote}");
                    println!("DOWNLOAD_URL={}", update.download_url);
                    if current != "10.0.11" { return Err(format!("unexpected current version {current}").into()); }
                    if remote != "10.0.12" { return Err(format!("unexpected remote version {remote}").into()); }
                    fs::write(&receipt, format!("DETECTED=PASS\nCURRENT={current}\nREMOTE={remote}\nURL={}\n", update.download_url))?;
                    update.download_and_install(
                      |chunk, total| println!("CHUNK={} TOTAL={:?}", chunk, total),
                      || println!("DOWNLOAD_FINISHED=PASS")
                    ).await?;
                    fs::OpenOptions::new().append(true).open(&receipt)?.write_all(b"SIGNATURE_INSTALL=PASS\n")?;
                    Ok(())
                  }.await;
                  match result {
                    Ok(()) => std::process::exit(0),
                    Err(e) => {
                      eprintln!("UPDATER_HARNESS_ERROR={e}");
                      let _ = fs::write(&receipt, format!("FAIL={e}\n"));
                      std::process::exit(31);
                    }
                  }
                });
                Ok(())
              })
              .run(tauri::generate_context!())
              .expect("harness tauri runtime failed");
          }
          EOF
          echo TEMP_HARNESS_GENERATED=PASS

      - name: Compile and run direct Tauri updater check signature and install
        shell: bash
        run: |
          set -euo pipefail
          cd "$HARNESS"
          ENDLUME_TEST_EXECUTABLE="$TEST_APP/Contents/MacOS/$EXE" \
          ENDLUME_UPDATER_RECEIPT="$RECEIPT" \
          cargo run --release 2>&1 | tee "$ROOT/harness.log"
          cat "$RECEIPT"
          grep -q '^DETECTED=PASS$' "$RECEIPT"
          grep -q '^CURRENT=10.0.11$' "$RECEIPT"
          grep -q '^REMOTE=10.0.12$' "$RECEIPT"
          grep -q '^SIGNATURE_INSTALL=PASS$' "$RECEIPT"
          echo TAURI_UPDATE_DETECTED=PASS
          echo TAURI_SIGNATURE_INSTALL=PASS

      - name: Verify installed 10.0.12 app relaunch state and untouched owner app
        shell: bash
        run: |
          set -euo pipefail
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$TEST_APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TEST_APP/Contents/Info.plist")
          echo "TEST_CFBundleShortVersionString=$SHORT"
          echo "TEST_CFBundleVersion=$BUILD"
          test "$SHORT" = '10.0.12'
          test "$BUILD" = '10.0.12'
          grep -R -a -q '10.0.12' "$TEST_APP/Contents/Resources"
          echo INSTALLED_VERSION=10.0.12
          echo SETTINGS_ABOUT_VERSION_PAYLOAD=PASS

          "$TEST_APP/Contents/MacOS/$EXE" >"$ROOT/relaunch.log" 2>&1 &
          PID=$!
          sleep 3
          kill -0 "$PID"
          echo RELAUNCH=PASS
          kill "$PID" 2>/dev/null || true

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '10.0.11'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = '10.0.11'
          test "$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')" = "$EXPECTED"
          strings -a "$APP/Contents/MacOS/$EXE" | grep -F 'endlume-stable/latest.json'
          echo OWNER_APP_UNTOUCHED=PASS
          echo SETTINGS_PRESERVED=PASS

      - name: Upload updater evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.11-to-10.0.12-direct-tauri-gate
          path: |
            ${{ runner.temp }}/endlume-tauri-updater-${{ github.run_id }}/receipt.txt
            ${{ runner.temp }}/endlume-tauri-updater-${{ github.run_id }}/harness.log
            ${{ runner.temp }}/endlume-tauri-updater-${{ github.run_id }}/relaunch.log
          if-no-files-found: warn
          retention-days: 14
