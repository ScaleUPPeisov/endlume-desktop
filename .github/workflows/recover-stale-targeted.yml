name: Recover stale ENDLUME targeted run

on:
  push:
    branches: [hotfix/endlume-10.0.11-preview-subscribe-final]
    paths:
      - ".github/workflows/recover-stale-targeted.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale self-hosted run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "37006270389"
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/cancel.out -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel")"
          cat /tmp/cancel.out || true
          test "$code" = "202" -o "$code" = "409"
          echo "STALE_RUN_CANCEL_HTTP=$code"
