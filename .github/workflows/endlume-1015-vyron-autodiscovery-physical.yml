name: ENDLUME 10.0.15 VYRON Auto Discovery Physical Gate

on:
  push:
    branches:
      - hotfix/endlume-10.0.15-render-destination-routing
    paths:
      - '.github/workflows/endlume-1015-vyron-autodiscovery-physical.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1015-vyron-autodiscovery-physical
  cancel-in-progress: true

jobs:
  physical:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 25
    steps:
      - name: Checkout ENDLUME QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Checkout current VYRON product branch
        uses: actions/checkout@v4
        with:
          repository: ScaleUPPeisov/scaleup-dashboards
          ref: hotfix/vyron-6.1.10-product-correctness
          path: vyron-product

      - name: Discover physical VYRON root and native discovery references
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          found=[]
          for volume in Path('/Volumes').iterdir():
            if not volume.is_dir(): continue
            candidates=[volume]
            try: candidates += [p for p in volume.iterdir() if p.is_dir()]
            except PermissionError: continue
            for root in candidates:
              if (root/'ProductionManager'/'Batches').is_dir() and (root/'Render').is_dir(): found.append(root.resolve())
          unique=[]
          for p in found:
            if p not in unique: unique.append(p)
          if len(unique)!=1: raise SystemExit(f'Expected exactly one physical VYRON workspace, found {unique}')
          root=unique[0]
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write(f'VYRON_PHYSICAL_ROOT={root}\n')
          print(f'VYRON ROOT={root}')
          print('EXTERNAL_WORKSPACE_DISCOVERY=PASS')
          PY
          cd vyron-product
          rg -n "render-inventory-changed|inventory_watch_roots|scan_render|render_folder|renderFolder|Live Inventory|live inventory" src src-tauri 2>/dev/null | head -300 | tee "$RUNNER_TEMP/vyron-discovery-refs.txt" || true
          test -s "$RUNNER_TEMP/vyron-discovery-refs.txt"

      - name: Run current VYRON inventory tests
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          cd vyron-product
          cargo test --manifest-path src-tauri/Cargo.toml inventory -- --nocapture
          echo 'VYRON_NATIVE_INVENTORY_TESTS=PASS'

      - name: Physical native FSEvents gate on actual external Render channel
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          python3 scripts/inject-vyron-physical-autodiscovery-test.py
          cd vyron-product
          VYRON_PHYSICAL_ROOT_FOR_TEST="$VYRON_PHYSICAL_ROOT" cargo test --manifest-path src-tauri/Cargo.toml physical_external_render_event_is_observed_1015 -- --nocapture
          git checkout -- src-tauri/src/inventory_watch.rs
          echo 'VYRON_EXTERNAL_RENDER_WATCH=PASS'

      - name: Verify physical Render folders match VYRON media discovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$VYRON_PHYSICAL_ROOT" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); render=root/'Render'; exts={'.mp4','.mov','.m4v','.mkv'}
          rows=[]
          for d in sorted(p for p in render.iterdir() if p.is_dir()):
            files=sorted(p for p in d.iterdir() if p.is_file() and p.suffix.lower() in exts and not p.name.startswith('.'))
            if files: rows.append((d.name,files))
          if len(rows)<3: raise SystemExit(f'Expected videos in >=3 real Render channels, found {[(n,len(f)) for n,f in rows]}')
          for name,files in rows[:3]: print(f'CHANNEL={name} DISCOVERABLE_VIDEO_COUNT={len(files)} SAMPLE={files[-1]}')
          print('VYRON_PHYSICAL_RENDER_SCAN_CONTRACT=PASS')
          PY

      - name: Final auto-discovery verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'VYRON_AUTO_DISCOVERY=PASS'
          echo 'RELEASE=BLOCKED'
          echo 'WAITING_FOR_OWNER_APPROVAL'
