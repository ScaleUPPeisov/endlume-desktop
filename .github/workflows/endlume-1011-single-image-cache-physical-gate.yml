name: ENDLUME 10.0.11 Single Image Cache Physical Gate

on:
  push:
    branches: [hotfix/endlume-10.0.11-performance-effects-reliability]
    paths:
      - "src-tauri/src/render.rs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1011-single-image-cache-physical
  cancel-in-progress: true

jobs:
  physical:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Prove product fix exists
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'fast_path_decision(job).reason=="FAST_MULTI_STILL"' src-tauri/src/render.rs
          test -d "/Volumes/TOSHIBA EXT"
          echo CANDIDATE_HEAD=$(git rev-parse HEAD)

      - name: Stage Apple Silicon FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Build patched packaged candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1011-perf-effects-reliability"
          npm ci
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          d=json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          printf '%s' "$APP/Contents/MacOS/$EXE" > "$RUNNER_TEMP/e1011-single-cache-bin.txt"
          printf '%s' "$APP/Contents/MacOS/ffmpeg" > "$RUNNER_TEMP/e1011-single-cache-ffmpeg.txt"
          printf '%s' "$APP/Contents/MacOS/ffprobe" > "$RUNNER_TEMP/e1011-single-cache-ffprobe.txt"
          echo PACKAGED_APP=GREEN

      - name: Cold and warm baseline on TOSHIBA
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1011-single-cache-physical"
          rm -rf "$ROOT"; mkdir -p "$ROOT/tmp"
          export TMPDIR="$ROOT/tmp"
          BIN="$(cat "$RUNNER_TEMP/e1011-single-cache-bin.txt")"
          FFMPEG="$(cat "$RUNNER_TEMP/e1011-single-cache-ffmpeg.txt")"
          FFPROBE="$(cat "$RUNNER_TEMP/e1011-single-cache-ffprobe.txt")"
          python3 - "$BIN" "$FFMPEG" "$FFPROBE" "$ROOT" <<'PY'
          import json,os,subprocess,sys,time
          from pathlib import Path
          APP=Path(sys.argv[1]);FFMPEG=Path(sys.argv[2]);FFPROBE=Path(sys.argv[3]);ROOT=Path(sys.argv[4])
          VOL=Path('/Volumes/TOSHIBA EXT');OUT=VOL/'ВАЙРОН'/'Render'/'Brewroom Jazz'
          IMAGE={'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff','.heic','.avif'}
          AUDIO={'.mp3','.wav','.m4a','.aac','.flac','.ogg','.opus','.aiff','.aif','.alac'}
          project=media=songs=None
          for d in (VOL/'ВАЙРОН').rglob('*'):
              if not d.is_dir():continue
              try:files=[x for x in d.iterdir() if x.is_file() and not x.name.startswith('.') and not x.name.startswith('._')]
              except Exception:continue
              mm=sorted([x for x in files if x.suffix.lower() in IMAGE],key=lambda x:x.name.lower())
              aa=sorted([x for x in files if x.suffix.lower() in AUDIO],key=lambda x:x.name.lower())
              if mm and len(aa)>=10:project=d;media=mm[0];songs=aa[:10];break
          assert project and media and songs,'REAL_PROJECT_NOT_FOUND'
          # Create a unique valid PNG so this gate owns a fresh visual-cache key without deleting user caches.
          unique=ROOT/'unique-baseline-source.png'
          subprocess.run([str(FFMPEG),'-hide_banner','-loglevel','error','-i',str(media),'-vf','scale=1918:1078,pad=1920:1080:1:1:black','-frames:v','1','-compression_level','4','-y',str(unique)],check=True,timeout=90)
          settings={'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':8.0,'durationHours':2.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':str(OUT),'preset':'fast','encoderPreference':'auto'}
          base={'path':str(project),'media':[str(unique)],'audio':[str(x) for x in songs],'valid':True,'error':None,'anchors':{}}
          rows=[]
          def render(label):
              fixture=ROOT/f'{label}.job.json';result=ROOT/f'{label}.result.json'
              job={'project':dict(base,id=f'single-cache-{label}',name=f'ENDLUME SINGLE CACHE {label}'),'settings':settings,'effects':[],'subscribes':[],'ambient':None}
              fixture.write_text(json.dumps({'jobs':[job]},ensure_ascii=False))
              env=os.environ.copy();env.update({'ENDLUME_E2E_RENDER_JOB':str(fixture),'ENDLUME_E2E_RESULT':str(result)})
              t=time.perf_counter();p=subprocess.run([str(APP)],env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=180);proc=time.perf_counter()-t
              assert p.returncode==0 and result.is_file(),(label,p.returncode,p.stderr[-3000:])
              raw=json.loads(result.read_text());r=raw['results'][0];out=Path(r['outputPath']);assert out.is_file()
              probe=json.loads(subprocess.run([str(FFPROBE),'-v','error','-show_entries','stream=codec_type,codec_name,width,height,avg_frame_rate:format=duration,size','-of','json',str(out)],capture_output=True,text=True,check=True).stdout)
              video=next(x for x in probe['streams'] if x.get('codec_type')=='video')
              row={'label':label,'wallSeconds':float(r['wallSeconds']),'processSeconds':proc,'bytes':out.stat().st_size,'encoder':r.get('encoder'),'duration':float(probe['format']['duration']),'codec':video.get('codec_name'),'fps':video.get('avg_frame_rate'),'width':video.get('width'),'height':video.get('height')}
              print('BASELINE='+json.dumps(row,sort_keys=True));rows.append(row);out.unlink()
          render('COLD')
          render('WARM')
          assert rows[0]['encoder']=='hevc_videotoolbox' and rows[1]['encoder']=='hevc_videotoolbox',rows
          assert all(r['codec']=='hevc' and r['fps']=='60/1' and r['width']==1920 and r['height']==1080 for r in rows),rows
          assert rows[1]['wallSeconds'] < 10.0,rows
          assert rows[1]['wallSeconds'] < rows[0]['wallSeconds']*0.75,rows
          (ROOT/'report.json').write_text(json.dumps({'candidateHead':os.environ.get('GITHUB_SHA'),'renders':rows,'warmUnder10s':True},indent=2))
          print('SINGLE_IMAGE_PERSISTENT_CACHE_GATE=PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.11-SINGLE-IMAGE-CACHE-PHYSICAL
          path: ${{ runner.temp }}/endlume-1011-single-cache-physical/report.json
          if-no-files-found: warn
          retention-days: 7
