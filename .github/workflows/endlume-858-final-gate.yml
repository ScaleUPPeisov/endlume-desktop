name: ENDLUME 8.58 Final Gate
on:
  push:
    branches: [candidate/endlume-858-queue-finalization-hotfix]
permissions:
  contents: read
concurrency:
  group: endlume-858-final-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final-gate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Restore embedded FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true

      - name: Apply exact production migrations and prove render core unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
          BEFORE="$(shasum -a 256 src-tauri/src/render.rs | awk '{print $1}')"
          python3 scripts/apply-queue-finalization-hotfix-8-58.py
          AFTER="$(shasum -a 256 src-tauri/src/render.rs | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          echo "RENDER_CORE_SHA256=$AFTER"
          grep -Fq 'const STRICT_857_MAX_GOP_FRAMES:u32=1800;' src-tauri/src/render.rs
          grep -Fq 'shortest=0:repeatlast=1:eof_action=repeat' src-tauri/src/render.rs
          grep -Fq 'STRICT_856_MIN_BYTES:u64=500_000_000' src-tauri/src/render.rs
          grep -Fq 'STRICT_856_MAX_BYTES:u64=700_000_000' src-tauri/src/render.rs
          grep -Fq 'applyProjectPatch(s.projects,id,patch)' src/store.ts
          grep -Fq 'progressPending.delete(p.id)' src/pages/App.tsx
          grep -Fq "status:'done',progress:100,stage:'Готово',etaSec:0" src/pages/App.tsx
          grep -Fq 'projects=applyProjectPatch(projects,next.id,compactPayload(next))' src/pages/App.tsx
          grep -Fq 'ENDLUME Studio 1.0.0-alpha.8.58' src/pages/SettingsPage.tsx
          grep -Fq "version:'1.0.0-alpha.8.58'" src/components/ReleaseHistory.tsx
          python3 - <<'PY'
          import json,re
          assert json.load(open('package.json'))['version']=='1.0.0-alpha.8.58'
          assert json.load(open('src-tauri/tauri.conf.json'))['version']=='1.0.0-alpha.8.58'
          assert re.search(r'^version\s*=\s*"1\.0\.0-alpha\.8\.58"$',open('src-tauri/Cargo.toml').read(),re.M)
          PY

      - name: Frontend compile and exact 97-percent race regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          rm -rf .queue-test-dist
          ./node_modules/.bin/tsc src/queue-state.ts --target ES2022 --module ES2022 --moduleResolution Bundler --skipLibCheck --outDir .queue-test-dist --noEmit false
          node scripts/test-queue-finalization-8-58.mjs "$GITHUB_WORKSPACE/.queue-test-dist/queue-state.js"
          npm run build

      - name: Rust and frozen-regression gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml mp4_manifest::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture

      - name: Stage exact physical fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e858fixture.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          test -f "$SIDE"; test -f "$IMG"; test -f "$FX1"; test -f "$FX2"
          echo "REAL_FIXTURE project=$PROJECT_NAME audio=$AUDIO_COUNT effects=$EFFECT_COUNT active_subscribes=$SUBSCRIBE_COUNT duration_hours=$DURATION_HOURS"

      - name: Exact real master 3381 frames and packets
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          test -x "$FFM"; test -x "$FFP"
          TMP="$(mktemp -d /tmp/e858master.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          GRAPH="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          T0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$GRAPH" -map '[outv]' -frames:v 3381 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 1800 -tag:v hvc1 -pix_fmt yuv420p -fps_mode cfr -r 60 -video_track_timescale 60000 -y "$TMP/master.mp4"
          T1=$(python3 -c 'import time;print(time.time())')
          FRAMES="$($FFP -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$TMP/master.mp4")"
          PACKETS="$($FFP -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "$TMP/master.mp4")"
          DUR="$($FFP -v error -show_entries format=duration -of csv=p=0 "$TMP/master.mp4")"
          "$FFP" -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate -of json "$TMP/master.mp4" > "$TMP/stream.json"
          python3 - "$T0" "$T1" "$FRAMES" "$PACKETS" "$DUR" "$TMP/stream.json" <<'PY'
          import json,sys
          dt=float(sys.argv[2])-float(sys.argv[1]); frames=int(sys.argv[3]); packets=int(sys.argv[4]); dur=float(sys.argv[5]); s=json.load(open(sys.argv[6]))['streams'][0]
          data={'seconds':round(dt,3),'frames':frames,'packets':packets,'duration':dur,'stream':s,'gop':1800,'quality':'q:v 100'}
          print('REAL_858_MASTER',json.dumps(data,ensure_ascii=False))
          assert frames==3381 and packets==3381,data
          assert s.get('width')==1920 and s.get('height')==1080,data
          assert s.get('avg_frame_rate')=='60/1' and s.get('codec_name')=='hevc' and s.get('pix_fmt')=='yuv420p',data
          assert 56.34<=dur<=56.37,data
          assert dt<=24.0,data
          PY

      - name: Precompile sample-table expander
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml external_prefix_cycle_manifest_if_requested --no-run

      - name: Full physical Subscribe-OFF media E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-857-real-e2e.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/858-real-e2e.json"
          cat 858-real-e2e.json

      - name: Physical real Subscribe-ON E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/858-subscribe-preset.json"
          cat 858-subscribe-preset.json
          python3 scripts/run-endlume-857-subscribe-on.py "$SIDE" 858-subscribe-preset.json "$FFM" "$FFP" "$GITHUB_WORKSPACE/858-subscribe-on.json"
          cat 858-subscribe-on.json

      - name: Final 8.58 release assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          off=json.load(open('858-real-e2e.json'))
          on=json.load(open('858-subscribe-on.json'))
          print('SUBSCRIBE_OFF',off)
          print('SUBSCRIBE_ON',on)
          assert off.get('status')=='success',off
          assert on.get('status')=='success',on
          PY
          echo 'PASS: ENDLUME 8.58 final gate — queue race + compile + Rust + real master + Subscribe OFF + Subscribe ON'
