name: ENDLUME Loop Mode 100x smoke

# Manual diagnostic only. The production updater workflow already runs the
# Loop Mode regression suite, so running this again on every release push
# only duplicated macOS minutes and sent duplicate failure emails.
on:
  workflow_dispatch:

concurrency:
  group: endlume-loop-mode-manual
  cancel-in-progress: true

jobs:
  loop-mode-100x:
    runs-on: macos-15
    steps:
      - name: Checkout ENDLUME
        uses: actions/checkout@v7
      - name: Install FFmpeg
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Run 100 Loop Mode renders
        run: bash scripts/loop-mode-smoke.sh
