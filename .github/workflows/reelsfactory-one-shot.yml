name: ReelsFactory one-shot M1 validation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: reelsfactory-one-shot-m1
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout isolated ReelsFactory branch
        uses: actions/checkout@v4
        with:
          ref: reelsfactory-bootstrap
          fetch-depth: 0

      - name: Guard already verified build
        id: guard
        shell: bash
        run: |
          if ls build-artifacts/ReelsFactory-0.1.0-aarch64.dmg >/dev/null 2>&1; then
            echo 'run=no' >> "$GITHUB_OUTPUT"
            echo 'Verified DMG already exists.'
          else
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode current ReelsFactory source
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ReelsFactory-v0.1.0
          cat reelsfactory-source.part*.b64 | base64 --decode > /tmp/reelsfactory-source.zip
          unzip -q /tmp/reelsfactory-source.zip
          test -f ReelsFactory-v0.1.0/package.json

      - name: Verify Apple Silicon runner
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Setup Node 22
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        if: steps.guard.outputs.run == 'yes'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: npm install --no-audit --no-fund

      - name: Install FFmpeg smoke tools
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q h264_videotoolbox

      - name: Build native AVFoundation exporter
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: ./scripts/build-native-macos.sh

      - name: Generate icons
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Verify UI and translations
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: npm run check

      - name: Verify Rust/Tauri
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Native smoke suite 100 passes
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        run: ./scripts/validate-native-macos.sh

      - name: Build signed updater app + DMG
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Validate bundle and collect artifacts
        if: steps.guard.outputs.run == 'yes'
        working-directory: ReelsFactory-v0.1.0
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "0.1.0"
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          TAR="$(find "$APP_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "$APP"
          test -f "$DMG"
          test -f "$TAR"
          test -f "$TAR.sig"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "ai.reelsfactory.desktop"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          find "$APP/Contents" -name 'reels-exporter*' -type f -print -quit | grep -q .
          rm -rf ../build-artifacts
          mkdir -p ../build-artifacts
          cp "$DMG" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.dmg"
          cp "$TAR" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.app.tar.gz"
          cp "$TAR.sig" "../build-artifacts/ReelsFactory-${VERSION}-aarch64.app.tar.gz.sig"
          cat > ../build-artifacts/BUILD_RECEIPT.json <<JSON
          {
            "version": "$VERSION",
            "status": "verified",
            "platform": "macos-arm64",
            "native_smoke_checks": 100,
            "bundle_id": "ai.reelsfactory.desktop",
            "source_sha": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID"
          }
          JSON
          cd ..
          shasum -a 256 build-artifacts/* > build-artifacts/SHA256SUMS.txt
          ls -lh build-artifacts

      - name: Persist verified build to isolated branch
        if: steps.guard.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ReelsFactory Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build-artifacts
          git commit -m 'ci: ReelsFactory 0.1.0 M1 verified 100/100 [skip ci]'
          git push origin HEAD:reelsfactory-bootstrap
