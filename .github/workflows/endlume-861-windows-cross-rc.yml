name: ENDLUME 8.61 Windows Cross RC

on:
  push:
    branches: [windows/endlume-861-managed-access]
    paths:
      - '.github/workflows/endlume-861-windows-cross-rc.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-861-windows-cross-rc
  cancel-in-progress: true

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  ENDLUME_VERSION: 1.0.0-alpha.8.61
  FINAL_INSTALLER: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
  RELEASE_TAG: endlume-v1.0.0-alpha.8.61-windows-rc
  RC_ARTIFACT: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64-RC-cross

jobs:
  windows-cross-rc:
    name: Windows x64 • Cross-build • NSIS RC
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120

    steps:
      - name: Checkout current branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify source and Windows product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = json.loads(Path('package.json').read_text())
          base = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          win = json.loads(Path('src-tauri/tauri.windows.conf.json').read_text())

          expected_version = '1.0.0-alpha.8.61'
          expected_name = 'ENDLUME YT Studio PEISOV'
          expected_id = 'studio.endlume.desktop'

          assert pkg['version'] == expected_version, pkg['version']
          assert base['version'] == expected_version, base['version']
          assert base['identifier'] == expected_id, base['identifier']
          assert win['identifier'] == expected_id, win['identifier']
          assert win['productName'] == expected_name, win['productName']
          assert win['mainBinaryName'] == expected_name, win['mainBinaryName']
          assert win['bundle']['targets'] == ['nsis'], win['bundle']['targets']
          assert win['bundle']['windows']['nsis']['installerIcon'] == 'icons/icon.ico'
          assert base['bundle']['createUpdaterArtifacts'] is True
          print('WINDOWS_PRODUCT_CONTRACT_GREEN')
          print('PRODUCTION_UPDATER_ARTIFACTS_REMAIN_ENABLED=true')
          PY

      - name: Install cross-build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v brew >/dev/null
          command -v rustup >/dev/null
          command -v cargo >/dev/null
          command -v npm >/dev/null

          brew list nsis >/dev/null 2>&1 || brew install nsis
          brew list llvm >/dev/null 2>&1 || brew install llvm

          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          export PATH="$LLVM_BIN:$PATH"

          rustup target add "$WINDOWS_TARGET"
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          fi

          makensis -VERSION
          cargo xwin --version

      - name: Stage pinned Windows FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_TAG='autobuild-2026-09-14-13-17'
          ARCHIVE='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          CACHE="$RUNNER_TEMP/endlume-ffmpeg-cross"
          ZIP="$CACHE/$ARCHIVE"
          EXTRACT="$CACHE/extract"
          DEST='src-tauri/binaries'

          rm -rf "$EXTRACT"
          mkdir -p "$CACHE" "$EXTRACT" "$DEST"
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --output "$ZIP" "$URL"
          fi
          ditto -x -k "$ZIP" "$EXTRACT"

          FFMPEG="$(find "$EXTRACT" -type f -name ffmpeg.exe -print -quit)"
          FFPROBE="$(find "$EXTRACT" -type f -name ffprobe.exe -print -quit)"
          test -n "$FFMPEG"
          test -n "$FFPROBE"

          cp "$FFMPEG" "$DEST/ffmpeg-$WINDOWS_TARGET.exe"
          cp "$FFPROBE" "$DEST/ffprobe-$WINDOWS_TARGET.exe"

          python3 - <<'PY'
          from pathlib import Path
          target = 'x86_64-pc-windows-msvc'
          for name in ('ffmpeg', 'ffprobe'):
              p = Path('src-tauri/binaries') / f'{name}-{target}.exe'
              assert p.is_file(), p
              assert p.stat().st_size > 1_000_000, (p, p.stat().st_size)
              with p.open('rb') as f:
                  assert f.read(2) == b'MZ', f'{p} is not a PE executable'
              print(f'{p}: {p.stat().st_size} bytes, PE/MZ OK')
          print('WINDOWS_SIDECARS_STRUCTURAL_GREEN')
          print('Runtime encoder capability remains a native-Windows hardware gate.')
          PY

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: TypeScript check
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check

      - name: Queue finalization regression
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          ./node_modules/.bin/tsc src/queue-state.ts \
            --target ES2022 \
            --module ES2022 \
            --moduleResolution Bundler \
            --skipLibCheck \
            --outDir "$TMP" \
            --noEmit false
          node scripts/test-queue-finalization-8-58.mjs "$TMP/queue-state.js"

      - name: Frontend production build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Windows production contract gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/test-windows-861-strict-port.py
          python3 scripts/test-windows-861-release-surface.py
          python3 scripts/test-local-scratch-stability-8-61.py
          python3 scripts/test-managed-license-render-gate.py
          python3 scripts/test-render-speed-stability-8-60.py

      - name: Stage host sidecars for Rust validation
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          mkdir -p src-tauri/binaries
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Rust check
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cross-build Windows x64 NSIS Release Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          LLVM_BIN="$(brew --prefix llvm)/bin"
          export PATH="$LLVM_BIN:$PATH"

          # RC-only workspace override. Production source remains updater-enabled;
          # native Windows promotion is still responsible for updater signing.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          assert cfg['bundle']['createUpdaterArtifacts'] is True
          cfg['bundle']['createUpdaterArtifacts'] = False
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          print('CROSS_RC_UPDATER_ARTIFACTS_DISABLED=true')
          PY

          npm run tauri build -- \
            --runner cargo-xwin \
            --target "$WINDOWS_TARGET" \
            --bundles nsis \
            --config src-tauri/tauri.windows.conf.json

      - name: Normalize and verify exact RC installer
        shell: bash
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"
          mkdir -p "$NSIS_DIR"

          if [ ! -s "$FINAL" ]; then
            CANDIDATE="$(find "$NSIS_DIR" -maxdepth 1 -type f -name '*.exe' ! -name "$FINAL_INSTALLER" -print -quit)"
            test -n "$CANDIDATE"
            cp "$CANDIDATE" "$FINAL"
          fi

          test -s "$FINAL"
          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.stat().st_size > 1_000_000
          with p.open('rb') as f:
              assert f.read(2) == b'MZ', 'NSIS installer is not PE/MZ'
          print(f'RC installer: {p}')
          print(f'RC installer bytes: {p.stat().st_size}')
          PY

          shasum -a 256 "$FINAL" | tee "$FINAL.sha256"
          echo 'BUILD_VERIFIED_CROSS_RC_GREEN'
          echo 'HARDWARE_E2E_VERIFIED=false'

      - name: Upload Windows NSIS Release Candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-rc:
    name: Windows x64 • GitHub-hosted • Publish RC
    needs: windows-cross-rc
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download verified Windows RC
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RC_ARTIFACT }}
          path: rc

      - name: Reverify exact installer after handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL="rc/$FINAL_INSTALLER"
          SHA_FILE="$FINAL.sha256"
          test -s "$FINAL"
          test -s "$SHA_FILE"

          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.stat().st_size > 1_000_000
          with p.open('rb') as f:
              assert f.read(2) == b'MZ', 'installer is not PE/MZ'
          print(f'HOSTED_PUBLISH_INSTALLER_BYTES={p.stat().st_size}')
          PY

          EXPECTED="$(awk '{print $1; exit}' "$SHA_FILE")"
          ACTUAL="$(sha256sum "$FINAL" | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          echo "HOSTED_PUBLISH_SHA256=$ACTUAL"
          echo 'HOSTED_PUBLISH_REVERIFY_GREEN'

      - name: Publish Windows Release Candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          FINAL="rc/$FINAL_INSTALLER"
          SHA_FILE="$FINAL.sha256"
          NOTES="$RUNNER_TEMP/endlume-windows-rc-notes.md"

          cat > "$NOTES" <<EOF
          # ENDLUME YT Studio PEISOV — Windows 8.61 Release Candidate

          Source commit: $GITHUB_SHA

          BUILD VERIFIED (cross-RC):
          - Windows x64 MSVC application compiled with cargo-xwin;
          - NSIS installer bundled;
          - product name / identifier / PEISOV icon contract checked;
          - Windows FFmpeg / ffprobe sidecars structurally verified as PE/MZ;
          - TypeScript, frontend production build, queue regression, Windows production contract gates, Rust check and Rust tests passed;
          - exact installer filename and SHA-256 generated and reverified after Actions handoff.

          HARDWARE E2E VERIFIED: false

          Native Windows install/uninstall smoke, console-flash proof, hardware encoder proof (NVENC/QSV/AMF), and real installed-app production render/license/updater E2E remain native acceptance gates before promotion to final production release.
          EOF

          # A cancelled direct upload can leave a draft for this exact tag.
          DRAFT_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")"
          if [ -n "$DRAFT_IDS" ]; then
            while IFS= read -r DRAFT_ID; do
              [ -n "$DRAFT_ID" ] || continue
              echo "Removing stale draft release id=$DRAFT_ID"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
            done <<< "$DRAFT_IDS"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$FINAL" "$SHA_FILE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              "$FINAL" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" \
              --notes-file "$NOTES" \
              --prerelease
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,tagName,isPrerelease,isDraft
          echo 'WINDOWS_RC_PUBLISHED_GREEN'
