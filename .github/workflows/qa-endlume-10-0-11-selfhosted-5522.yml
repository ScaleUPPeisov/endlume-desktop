name: QA ENDLUME 10.0.11 exact final self-hosted

on:
  push:
    branches:
      - qa/endlume-10.0.11-stale-effect-gate-5522f7
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 804468ebc9bfa77c740c2d89f9536d2fc1118ded

jobs:
  apple-silicon-exact:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1
      - name: Prove exact product checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$PRODUCT_SHA"
          test "$(git status --porcelain)" = ""
      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          sw_vers
          node --version
          npm --version
          rustc --version
          cargo --version
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Stage real Apple Silicon FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_bin="$(command -v ffmpeg)"
          ffprobe_bin="$(command -v ffprobe)"
          test -x "$ffmpeg_bin"
          test -x "$ffprobe_bin"
          mkdir -p src-tauri/binaries
          cp "$ffmpeg_bin" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$ffprobe_bin" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          file src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          file src-tauri/binaries/ffprobe-aarch64-apple-darwin
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tauri packaged macOS app
        run: npm run tauri -- build --bundles app
      - name: Prove packaged app exists
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 2 -type d -name '*.app' -print -quit)"
          echo "PACKAGED_APP=$app"
          test -n "$app"
