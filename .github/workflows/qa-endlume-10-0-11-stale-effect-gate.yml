name: QA ENDLUME 10.0.11 stale-effect exact product gate

on:
  push:
    branches:
      - qa/endlume-10.0.11-stale-effect-gate-538cdb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-product-macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PRODUCT_SHA: 538cdb10675639990c8041e927bcc104c2161eed
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove exact product checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "PRODUCT_SHA=$PRODUCT_SHA"
          echo "CHECKED_OUT_SHA=$actual"
          test "$actual" = "$PRODUCT_SHA"
          test "$(git status --porcelain)" = ""

      - name: Toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          sw_vers
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript and Vite production build
        run: npm run build

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Tauri packaged macOS app
        run: npm run tauri -- build --bundles app

      - name: Prove packaged app exists
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/target/release/bundle/macos -maxdepth 2 -type d -name '*.app' -print
          test -n "$(find src-tauri/target/release/bundle/macos -maxdepth 2 -type d -name '*.app' -print -quit)"
