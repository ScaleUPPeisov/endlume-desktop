name: ENDLUME privileged runner inventory

on:
  push:
    branches: [endlume-8.64-turbo]
    paths:
      - '.github/workflows/endlume-privileged-runner-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 5
    env:
      ADMIN_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
    steps:
      - name: Enumerate repository runners without exposing token
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$ADMIN_TOKEN"
          export GH_TOKEN="$ADMIN_TOKEN"
          echo RUNNER_INVENTORY_START
          gh api "/repos/ScaleUPPeisov/endlume-desktop/actions/runners" --jq '.runners[] | {id,name,os,status,busy,labels:[.labels[].name]}'
          echo RUNNER_INVENTORY_END
