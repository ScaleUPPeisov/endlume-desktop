name: ENDLUME macOS production 3h fast-path acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/endlume-macos-3h-acceptance.yml'

permissions:
  contents: read

jobs:
  production-fast-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert Apple Silicon and stable ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor e2896da7702891a5b760ecd4daad4fd54bc90b82 HEAD
          echo "HEAD=$(git rev-parse HEAD)"
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
      - name: Frontend and Rust compile gates
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features acceptance-harness
      - name: Build actual acceptance app bundle
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Generate exact 3-hour production-profile media
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/endlume-3h-fast"
          MEDIA="$ROOT/project"; OUT="$ROOT/out"
          mkdir -p "$MEDIA" "$OUT"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$MEDIA/cover.png"
          for i in $(seq -w 1 12); do
            n=$((10#$i)); hz=$((180+n*23))
            ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$MEDIA/track-${i}.mp3"
          done
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"; echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Create fast-path QueueJob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,glob
          root=os.environ['ROOT']; media=os.environ['MEDIA']; out=os.environ['OUT']
          job={
            'project':{'id':'acceptance-fast-3h','name':'ENDLUME 3H Fast Acceptance','path':media,'media':[os.path.join(media,'cover.png')],'audio':sorted(glob.glob(os.path.join(media,'track-*.mp3'))),'valid':True,'error':None},
            'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':30.0,'durationHours':3.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':out,'preset':'fast','encoderPreference':'auto'},
            'effects':[],'subscribes':[],'ambient':None,
          }
          json.dump(job,open(os.path.join(root,'job.json'),'w'),indent=2)
          PY
      - name: Run actual built ENDLUME app
        shell: bash
        run: |
          set +e
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          BIN="$APP/Contents/MacOS/endlume"
          echo "APP=$APP"; echo "BIN=$BIN"
          test -x "$BIN" || { echo ACTUAL_APP_BINARY_NOT_FOUND | tee "$ROOT/app.log"; exit 0; }
          ENDLUME_ACCEPTANCE_JOB="$ROOT/job.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/receipt.json" ENDLUME_SOURCE_HEAD="$GITHUB_SHA" "$BIN" > "$ROOT/app.log" 2>&1
          echo "APP_EXIT_CODE=$?" >> "$ROOT/app.log"
          test -f "$ROOT/receipt.json" && cat "$ROOT/receipt.json" || true
          exit 0
      - name: Hard-gate actual output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          p=os.path.join(os.environ['ROOT'],'receipt.json')
          if not os.path.exists(p): print('ACCEPTANCE=FAIL no receipt'); sys.exit(1)
          d=json.load(open(p));
          if d.get('status')!='ok': print('ACCEPTANCE=FAIL',d); sys.exit(1)
          r=d['result']; streams=r['probe']['streams']; v=next(x for x in streams if x.get('codec_type')=='video'); a=next(x for x in streams if x.get('codec_type')=='audio')
          mb=r['output_bytes']/1_000_000; seeks=all(x.get('ok') for x in r['seek_checks']); decode=bool(r['full_decode']['ok'])
          checks={
            'FAST_PATH_USED':bool(r.get('fast_path_used')),
            'DURATION':abs(r['output_duration']-10800.0)<=0.1,
            'SIZE_400_600_MB':400<=mb<=600,
            'HEVC':v.get('codec_name')=='hevc',
            'RESOLUTION':(v.get('width'),v.get('height'))==(1920,1080),
            'FPS':(v.get('avg_frame_rate') or v.get('r_frame_rate'))=='60/1',
            'MP3_COPY':a.get('codec_name')=='mp3',
            'FULL_DECODE':decode,
            'SEEKS':seeks,
            'TEN_SECONDS':r['export_seconds']<=10.0,
          }
          print(f"EXPORT_SECONDS={r['export_seconds']:.6f}"); print(f"OUTPUT_BYTES={r['output_bytes']}"); print(f"OUTPUT_MB={mb:.3f}"); print(f"OUTPUT_DURATION={r['output_duration']:.6f}")
          for k,vv in checks.items(): print(f"{k}={'PASS' if vv else 'FAIL'}")
          if not all(checks.values()): sys.exit(1)
          print('PRODUCTION_FAST_3H=PASS')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-production-fast-3h-evidence
          path: |
            ${{ env.ROOT }}/receipt.json
            ${{ env.ROOT }}/app.log
            ${{ env.ROOT }}/job.json
          if-no-files-found: warn
          retention-days: 30
