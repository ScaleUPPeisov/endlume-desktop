name: VYRON PR67 6.1.28 physical M1 postinstall readback
on:
  push:
    branches: [diagnostics/vyron-m1-connection-20261118]
    paths: [scripts/vyron-628-postinstall-trigger.txt]
permissions:
  contents: read
concurrency:
  group: vyron-physical-m1-exclusive-install
  cancel-in-progress: false
jobs:
  readback:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - name: Verify real installed bundle SHA, 33 channels, SQLite, runway and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = kirill-mac-endlume
          test "$(uname -m)" = arm64
          APP=/Applications/VYRON.app
          BASE="$HOME/.vyron-owner-rollback"
          test -d "$APP" && test ! -L "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = studio.channelflow.desktop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = 6.1.28
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/pgrep -x channelflow >/dev/null
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          INSTALLED="$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')"
          STAGE_COUNT="$(find "$BASE" -mindepth 1 -maxdepth 1 -type d -name 'staged-628-pr67-hosted-*' | wc -l | tr -d ' ')"
          test "$STAGE_COUNT" = 1
          MARK="$(find "$BASE" -mindepth 2 -maxdepth 2 -type f -path '*/staged-628-pr67-hosted-*/VERIFIED' -print -quit)"
          test -f "$MARK"
          grep -Fxq 'source=270f0b66d71b7a4c9f91984f98a48d0d8374e237' "$MARK"
          grep -Fxq 'version=6.1.28' "$MARK"
          grep -Fxq "executable_sha256=$INSTALLED" "$MARK"
          echo 'INSTALLED_VERSION=6.1.28'
          echo 'INSTALLED_SOURCE_SHA=270f0b66d71b7a4c9f91984f98a48d0d8374e237'
          echo "INSTALLED_EXECUTABLE_SHA256=$INSTALLED"
          # Native inventory hydrates asynchronously; verify persisted v4 proof after initialization.
          sleep 35
          /usr/bin/python3 - <<'PY'
          import json,sqlite3,datetime
          from pathlib import Path
          from urllib.parse import quote
          home=Path.home()
          data=home/'Library'/'Application Support'/'studio.channelflow.desktop'
          web=home/'Library'/'WebKit'/'studio.channelflow.desktop'
          state=json.loads((data/'state.json').read_text())
          chans=state.get('channels',[])
          assert isinstance(chans,list) and len(chans)==33,'POSTINSTALL_CHANNELS_NOT_33'
          print('POSTINSTALL_CHANNELS=33')
          databases=[]
          for root in (data,web):
            for p in root.rglob('*'):
              if p.is_symlink() or not p.is_file() or p.suffix.lower() not in ('.db','.sqlite','.sqlite3') or p.stat().st_size>512*1024*1024:continue
              databases.append(p)
          good=0
          immutable_checked=0
          records={}
          for p in databases:
            db=None
            immutable=False
            source_hash=None
            try:
              db=sqlite3.connect('file:'+quote(str(p))+'?mode=ro',uri=True,timeout=3)
              assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
            except sqlite3.OperationalError as e:
              if db:db.close()
              if p.name!='analytics-v1.sqlite3' or str(e)!='unable to open database file':raise
              if any(Path(str(p)+ext).exists() for ext in ('-wal','-shm')):
                raise RuntimeError('POSTINSTALL_ANALYTICS_WAL_NOT_ABSENT')
              import hashlib
              source_hash=hashlib.sha256(p.read_bytes()).hexdigest()
              db=sqlite3.connect('file:'+quote(str(p))+'?mode=ro&immutable=1',uri=True,timeout=3)
              assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              immutable=True
            try:
              good+=1
              if db.execute("SELECT name FROM sqlite_master WHERE name='ItemTable'").fetchone():
                for (value,) in db.execute("SELECT value FROM ItemTable WHERE key='vyron:channel-runway:v1'"):
                  candidates=[value.decode('utf-16le','ignore'),value.decode('utf-8','ignore')] if isinstance(value,bytes) else [str(value)]
                  for item in candidates:
                    try:d=json.loads(item)
                    except (ValueError,TypeError):continue
                    if isinstance(d,dict) and isinstance(d.get('channels'),dict) and len(d['channels'])>len(records):records=d['channels']
            finally:db.close()
            if immutable:
              if any(Path(str(p)+ext).exists() for ext in ('-wal','-shm')):
                raise RuntimeError('POSTINSTALL_ANALYTICS_WAL_APPEARED')
              if hashlib.sha256(p.read_bytes()).hexdigest()!=source_hash:
                raise RuntimeError('POSTINSTALL_ANALYTICS_CHANGED_DURING_VERIFICATION')
              immutable_checked+=1
          print('POSTINSTALL_IMMUTABLE_SQLITE_CHECKED='+str(immutable_checked))
          print('POSTINSTALL_SQLITE_CHECKED='+str(good))
          print('POSTINSTALL_RUNWAY_RECORDS='+str(len(records)))
          assert good>=5,'POSTINSTALL_SQLITE_CHECKED_LT_5'
          assert len(records)==33,'POSTINSTALL_RUNWAY_RECORDS_NOT_33'
          inventory=data/'youtube-inventory'
          today=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=7)).date()
          statuses={}
          for c in chans:
            if not isinstance(c,dict):continue
            cid=str(c.get('id',''))
            name=str(c.get('name','')).replace('\n',' ')[:100]
            rec=records.get(cid,{})
            state_code=str(rec.get('dataState','UNKNOWN'))
            statuses[state_code]=statuses.get(state_code,0)+1
            date=str(rec.get('scheduledUntil') or '')
            try:
              remaining=max(0,(datetime.date.fromisoformat(date)-today).days)
            except ValueError:remaining=None
            native={}
            p=inventory/(cid+'.json')
            if p.is_file() and not p.is_symlink():
              try: native=json.loads(p.read_text()).get('syncInfo') or {}
              except (ValueError,OSError):native={}
            verified=(native.get('scheduledCoverageVerified') is True)
            if state_code in ('CONFIRMED_SCHEDULE','CONFIRMED_EMPTY'):
              assert verified, 'FALSE_CONFIRMED_OWNER_COVERAGE '+name
              assert rec.get('independentScheduleEvidenceVersion')==4, 'UNVERSIONED_CONFIRMED '+name
            info={'channel':name,'independentProof':verified,'evidenceVersion':rec.get('independentScheduleEvidenceVersion'),'savedScheduled':rec.get('scheduledVideoCount'),'savedUntil':date or None,'remainingDaysFromSavedDate':remaining,'lastScheduleSync':rec.get('lastScheduleSync'),'state':state_code,'lastObservedScheduled':rec.get('lastObservedScheduledCount'),'lastObservedAt':rec.get('lastObservedAt'),'source':'LOCAL_POSTINSTALL_SNAPSHOT','playlistReportedTotal':native.get('playlistReportedTotal'),'playlistItemsFetched':native.get('playlistItemsFetched'),'uniqueVideoIds':native.get('uniqueVideoIds'),'playlistDuplicateCount':native.get('playlistDuplicateCount'),'searchExhausted':native.get('searchExhausted')}
            print('POSTINSTALL_CHANNEL '+json.dumps(info,ensure_ascii=False,sort_keys=True))
          print('POSTINSTALL_STATES '+json.dumps(statuses,sort_keys=True))
          assert sum(statuses.values())==33,'EXPECTED_33_TOTAL'
          assert statuses.get('API_FAILED',0)==0,'UNEXPECTED_API_FAILED'
          print('POSTINSTALL_FALSE_CONFIRMED=0')
          print('POSTINSTALL_INDEPENDENT_COVERAGE_POLICY=PASS')
          print('POSTINSTALL_READBACK_GOOGLE_API_CALLS=0')
          print('OAUTH_TOKENS_READ=0')
          print('UPLOAD_QUEUE_MUTATIONS=0')
          print('PRODUCTION_FEED_MODIFICATIONS=0')
          PY
          # The known-ID checks are historical owner evidence, not exhaustive coverage.
          # This is a historical readback, NOT a new YouTube owner verification.
          /usr/bin/python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from urllib.parse import quote
          home=Path.home()
          web=home/'Library'/'WebKit'/'studio.channelflow.desktop'
          data=home/'Library'/'Application Support'/'studio.channelflow.desktop'
          channels=json.loads((data/'state.json').read_text()).get('channels',[])
          names={str(c.get('id')):str(c.get('name')) for c in channels if isinstance(c,dict)}
          evidence={}
          for p in web.rglob('*'):
            if p.is_symlink() or not p.is_file() or p.suffix.lower() not in ('.db','.sqlite','.sqlite3') or p.stat().st_size>50_000_000:continue
            try:
              con=sqlite3.connect('file:'+quote(str(p))+'?mode=ro',uri=True,timeout=2)
              try:
                if not con.execute("SELECT name FROM sqlite_master WHERE name='ItemTable'").fetchone():continue
                for key,value in con.execute("SELECT key,value FROM ItemTable WHERE key LIKE 'vyron:p0-owner-evidence:625:%'"):
                  cid=str(key).split(':')[-1]
                  if cid not in names:continue
                  values=[value.decode('utf-16le','ignore'),value.decode('utf-8','ignore')] if isinstance(value,bytes) else [str(value)]
                  for v in values:
                    try:row=json.loads(v)
                    except (ValueError,TypeError):continue
                    if isinstance(row,dict) and isinstance(row.get('result'),dict):
                      result=row['result']
                      if result.get('channelId')==cid and result.get('coverage')=='KNOWN_IDS_ONLY':
                        evidence[cid]=result
                      break
              finally:con.close()
            except (OSError,sqlite3.Error):pass
          general=search=0
          for cid,r in evidence.items():
            general+=int(r.get('generalCalls') or 0)
            search+=int(r.get('searchCalls') or 0)
            print('P0_OWNER_READBACK '+json.dumps({
              'channel':names[cid],
              'verifiedAt':r.get('verifiedAt'),
              'knownIds':r.get('knownIds'),
              'hydratedIds':r.get('hydratedIds'),
              'currentFutureVerifiedMinimum':r.get('confirmedFutureScheduled'),
              'latestVerifiedPublishAt':r.get('latestVerifiedPublishAt'),
              'notReturned':r.get('notReturned'),
              'coverage':r.get('coverage'),
              'generalCalls':r.get('generalCalls'),
              'searchCalls':r.get('searchCalls')
            },ensure_ascii=False,sort_keys=True))
          print('P0_OWNER_READBACK_SOURCE=HISTORICAL_6_1_25_KNOWN_IDS_ONLY')
          print('P0_OWNER_READBACK_CHANNELS='+str(len(evidence)))
          print('P0_OWNER_READBACK_GENERAL_CALLS='+str(general))
          print('P0_OWNER_READBACK_SEARCH_CALLS='+str(search))
          print('P0_OWNER_READBACK_COMPLETE_COVERAGE_CLAIM=NO')
          print('P0_OWNER_VIDEO_IDS_IN_PUBLIC_LOG=NO')
          PY
          echo 'PHYSICAL_M1_POSTINSTALL_READBACK=PASS'

  publish-readback-marker:
    name: Publish non-secret 6.1.28 readback marker
    needs: readback
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record successful physical readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          printf '{"status":"SUCCESS","version":"6.1.28","source":"270f0b66d71b7a4c9f91984f98a48d0d8374e237","readbackRunId":%s,"falseConfirmed":0}\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/vyron-628-readback.json"
          CONTENT="$(base64 < "$RUNNER_TEMP/vyron-628-readback.json" | tr -d '\n')"
          gh api --method PUT repos/ScaleUPPeisov/endlume-desktop/contents/status/vyron-628-readback.json \
            -f message="verify(vyron): record successful physical 6.1.28 readback" \
            -f content="$CONTENT" \
            -f branch="diagnostics/vyron-m1-connection-20261118" >/dev/null
