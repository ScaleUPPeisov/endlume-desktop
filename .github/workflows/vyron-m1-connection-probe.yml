name: VYRON physical Mac read-only connection probe

on:
  push:
    branches:
      - diagnostics/vyron-m1-connection-20261118
    paths:
      - .github/workflows/vyron-m1-connection-probe.yml

permissions:
  contents: read

jobs:
  probe-physical-vyron-mac:
    name: Physical VYRON M1 connection (read-only)
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 5
    steps:
      - name: Verify Mac and VYRON without accessing user data
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PROBE_MODE=READ_ONLY"
          if [ "$(uname -m)" = "arm64" ]; then
            echo "PHYSICAL_MAC_ARM64=PASS"
          else
            echo "PHYSICAL_MAC_ARM64=FAIL"
            exit 1
          fi
          installed=no
          for bundle in "/Applications/VYRON.app" "$HOME/Applications/VYRON.app"; do
            if [ -f "$bundle/Contents/Info.plist" ]; then
              installed=yes
              version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" 2>/dev/null || printf 'unknown')
              case "$version" in
                *[!0-9A-Za-z._-]*) version=redacted ;;
              esac
              echo "VYRON_APP_VERSION=$version"
              break
            fi
          done
          echo "VYRON_INSTALLED_STANDARD_LOCATION=$installed"
          if /usr/bin/pgrep -x channelflow >/dev/null 2>&1; then
            echo "VYRON_PROCESS_RUNNING=YES"
          else
            echo "VYRON_PROCESS_RUNNING=NO_OR_DIFFERENT_NAME"
          fi
          echo "VYRON_MAC_READ_ONLY_CONNECTION=PASS"
      - name: Read-only aggregate of VYRON local inventory (never print video data)
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path.home()/"Library"/"Application Support"/"studio.channelflow.desktop"/"youtube-inventory"
          print("VYRON_INVENTORY_DIR_PRESENT="+("YES" if root.is_dir() else "NO"))
          if root.is_dir():
              files=[x for x in root.iterdir() if x.is_file() and x.suffix==".json"]
              counts={"files":len(files),"valid":0,"corrupt":0,"schema_mismatch":0,
                  "schedule_complete_true":0,"schedule_complete_false":0,
                  "video_entries":0,"entries_with_publishAt":0,"with_last_complete_at":0,
                  "large_files_skipped":0}
              for p in files:
                  try:
                      if p.stat().st_size>20_000_000:
                          counts["large_files_skipped"]+=1
                          continue
                      d=json.loads(p.read_text(encoding="utf-8"))
                      if not isinstance(d,dict):
                          counts["corrupt"]+=1
                          continue
                      counts["valid"]+=1
                      if d.get("schemaVersion")!=2:
                          counts["schema_mismatch"]+=1
                      s=d.get("syncInfo")
                      if isinstance(s,dict) and s.get("scheduleComplete") is True:
                          counts["schedule_complete_true"]+=1
                      else:
                          counts["schedule_complete_false"]+=1
                      if d.get("lastCompleteAt"):
                          counts["with_last_complete_at"]+=1
                      videos=d.get("videos")
                      if isinstance(videos,list):
                          counts["video_entries"]+=len(videos)
                          counts["entries_with_publishAt"]+=sum(1 for v in videos if isinstance(v,dict) and v.get("publishAt"))
                  except (OSError,ValueError,UnicodeError):
                      counts["corrupt"]+=1
              for k,v in counts.items():
                  print("INVENTORY_"+k.upper()+"="+str(v))
          print("VYRON_LOCAL_INVENTORY_READ_ONLY=PASS")
          PY
