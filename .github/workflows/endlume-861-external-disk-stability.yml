name: ENDLUME 8.61 External Disk Stability

on:
  push:
    branches: [candidate/endlume-861-local-scratch-stability]
  workflow_dispatch:

concurrency:
  group: endlume-861-external-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-stability:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Apply 8.61 exact production migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
          python3 scripts/apply-queue-finalization-hotfix-8-58.py
          python3 scripts/apply-render-speed-stability-8-60.py
          python3 scripts/apply-local-scratch-stability-8-61.py
          python3 scripts/test-render-speed-stability-8-60.py .
          python3 scripts/test-local-scratch-stability-8-61.py .
          python3 scripts/apply-e2e-harness-8-60.py
          test "$(node -p "require('./package.json').version")" = '1.0.0-alpha.8.61'

      - name: Compile and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture

      - name: Stage real TOSHIBA fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e861-final.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/e861-subscribe.json"
          test -s e861-subscribe.json
          VOLUME="/Volumes/TOSHIBA EXT"
          test -d "$VOLUME"
          echo "TOSHIBA_VOLUME=$VOLUME" >> "$GITHUB_ENV"
          echo "REAL_FIXTURE=$SIDE"

      - name: Wait for exclusive FFmpeg VideoToolbox
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 180); do
            if ! pgrep -af '[f]fmpeg' >/tmp/e861-live.txt 2>/dev/null; then
              echo "FFMPEG_IDLE after $i checks"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/e861-live.txt || true
          exit 3

      - name: Five sequential real strict masters
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-860-five-masters.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e861-five.json"
          cat e861-five.json
          python3 - <<'PY'
          import json
          x=json.load(open('e861-five.json'))
          assert x['status']=='passed' and len(x['times'])==5,x
          assert max(x['times'])<=30.0,x
          assert x['times'][-1] <= x['times'][0] + 5.0,x
          PY

      - name: Five sustained 500 MB final writes to TOSHIBA
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/run-endlume-861-external-copy.py "$TOSHIBA_VOLUME" "$GITHUB_WORKSPACE/e861-external.json"
          cat e861-external.json

      - name: Full real two-hour Subscribe OFF E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-857-real-e2e.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e861-off.json"
          python3 - <<'PY'
          import json
          x=json.load(open('e861-off.json'))
          assert x.get('status')=='passed' and x.get('release_gate') is True,x
          assert x.get('master_seconds',999)<=30.0,x
          assert x.get('audio_count')==15 and x.get('whole_track') is True and x.get('mp3_packet_copy') is True,x
          assert x.get('seek_begin') and x.get('seek_middle') and x.get('seek_tail'),x
          assert x.get('final_bytes')==500_000_000,x
          PY
          cat e861-off.json

      - name: Full real two-hour Subscribe ON E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-860-real-subscribe.py "$SIDE" "$GITHUB_WORKSPACE/e861-subscribe.json" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e861-on.json"
          python3 - <<'PY'
          import json
          x=json.load(open('e861-on.json'))
          assert x.get('status')=='passed' and x.get('release_gate') is True and x.get('subscribe_on_gate') is True,x
          assert x.get('master_seconds',999)<=30.0,x
          assert x.get('whole_track') is True and x.get('in_place_manifest') is True,x
          assert x.get('final_bytes')==500_000_000,x
          PY
          cat e861-on.json

      - name: Final 8.61 verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'ENDLUME_861_EXTERNAL_DISK_GREEN'
          echo "SHA=$GITHUB_SHA"
          echo 'PASS: internal Mac scratch + 5 sequential masters + 5 sustained TOSHIBA final writes + full Subscribe OFF/ON E2E'
