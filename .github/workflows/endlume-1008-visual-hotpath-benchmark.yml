name: ENDLUME 10.0.8 Visual Hotpath Benchmark

on:
  push:
    branches: [hotfix/endlume-10.0.8-performance-visual]
    paths:
      - ".github/workflows/endlume-1008-visual-hotpath-benchmark.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1008-visual-hotpath-benchmark
  cancel-in-progress: true

jobs:
  bench:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - name: Benchmark Round Equalizer scale-before-key hotpath
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          FF="$(command -v ffmpeg)"; FP="$(command -v ffprobe)"
          ROOT="$RUNNER_TEMP/e1008-scale-first"; rm -rf "$ROOT"; mkdir -p "$ROOT"

          LIB=""
          while IFS= read -r p; do
            if python3 - "$p" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except:raise SystemExit(1)
          ok=any(isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()) for x in d.get("effects",[]))
          raise SystemExit(0 if ok else 1)
          PY
            then LIB="$p"; break; fi
          done < <(find "$HOME/Library/Application Support" "$HOME/Library/Containers" -type f -name library.json 2>/dev/null)
          test -n "$LIB"
          python3 - "$LIB" "$ROOT/e.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for x in d.get("effects",[]):
            if isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()):
              json.dump(x,open(sys.argv[2],"w"),ensure_ascii=False);break
          PY
          SRC="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source"])' "$ROOT/e.json")"; test -f "$SRC"
          read SCALE X Y OP KEY DSP <<<"$(python3 - "$ROOT/e.json" <<'PY'
          import json,sys
          e=json.load(open(sys.argv[1]));print(e.get("scale",.25),e.get("x",.5),e.get("y",.5),e.get("opacity",1),str(e.get("keyColor","#00ff00")).lstrip("#"),e.get("despill",1))
          PY
          )"
          TARGET="$(python3 -c 'import sys;x=round(1920*float(sys.argv[1]));print(max(2,x if x%2==0 else x+1))' "$SCALE")"
          "$FF" -hide_banner -loglevel error -f lavfi -i "gradients=s=1920x1080:r=1:c0=0x10182a:c1=0x334866" -frames:v 1 -y "$ROOT/base.png"
          "$FP" -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 "$SRC" | sed 's/^/SOURCE_/'
          echo "TARGET=$TARGET SCALE=$SCALE OP=$OP DSP=$DSP"

          XEX="max(0,min(W-w,W*$X-w/2))"; YEX="max(0,min(H-h,H*$Y-h/2))"
          CUR="[0:v]fps=30,setsar=1[b0];[1:v]fps=30,format=rgba,colorkey=0x$KEY:0.6:0.35,despill=type=green:mix=$DSP:expand=0.20,scale=$TARGET:-2:flags=lanczos,colorchannelmixer=aa=$OP[fx];[b0]format=rgba[base0];[base0][fx]overlay=x='$XEX':y='$YEX':shortest=1:eof_action=repeat:format=auto[b1];[b1]format=yuv420p[outv]"
          FAST="[0:v]fps=30,setsar=1[b0];[1:v]fps=30,scale=$TARGET:-2:flags=lanczos,format=rgba,colorkey=0x$KEY:0.6:0.35,despill=type=green:mix=$DSP:expand=0.20,colorchannelmixer=aa=$OP[fx];[b0]format=rgba[base0];[base0][fx]overlay=x='$XEX':y='$YEX':shortest=1:eof_action=repeat:format=auto[b1];[b1]format=yuv420p[outv]"

          run(){
            name="$1"; graph="$2"
            /usr/bin/time -p "$FF" -hide_banner -loglevel error -filter_complex_threads 6 -loop 1 -framerate 30 -i "$ROOT/base.png" -stream_loop -1 -i "$SRC" \
              -filter_complex "$graph" -map "[outv]" -frames:v 1200 -an \
              -c:v hevc_videotoolbox -realtime 1 -prio_speed 1 -power_efficient 0 -constant_bit_rate 1 -b:v 22M -g 1 -bf 0 -tag:v hvc1 -pix_fmt yuv420p \
              -fps_mode cfr -r 30 -video_track_timescale 60000 -y "$ROOT/$name.mp4" 2>"$ROOT/$name.time"
            awk '/^real /{print "'"$name"'_SEC="$2}' "$ROOT/$name.time"
          }
          run current "$CUR"
          run scale_first "$FAST"

          "$FF" -hide_banner -loglevel error -ss 20 -i "$ROOT/current.mp4" -frames:v 1 -y "$ROOT/current.png"
          "$FF" -hide_banner -loglevel error -ss 20 -i "$ROOT/scale_first.mp4" -frames:v 1 -y "$ROOT/scale_first.png"

          python3 - "$ROOT" "$FF" <<'PY'
          import os,re,subprocess,sys
          root,ff=sys.argv[1:]
          def sec(n):
            m=re.search(r"real\s+([0-9.]+)",open(os.path.join(root,n+".time")).read());return float(m.group(1))
          def metric(kind):
            p=subprocess.run([ff,"-hide_banner","-nostats","-loglevel","info","-i",os.path.join(root,"current.png"),"-i",os.path.join(root,"scale_first.png"),"-lavfi",f"[0:v][1:v]{kind}","-f","null","-"],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
            if kind=="ssim":
              m=re.findall(r"All:([0-9.]+)",p.stderr);return float(m[-1]) if m else 0
            m=re.findall(r"average:([0-9.]+)",p.stderr);return float(m[-1]) if m else 0
          c,s=sec("current"),sec("scale_first")
          print(f"VISUAL_SCALE_FIRST|current={c:.3f}|scaleFirst={s:.3f}|speedup={c/max(s,.001):.3f}|ssim={metric('ssim'):.8f}|psnr={metric('psnr'):.5f}")
          PY
          echo ENDLUME_1008_VISUAL_SCALE_FIRST_GREEN
