name: ENDLUME 10.0.13 Candidate Compile Gate (retired compatibility)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  retired:
    name: Retired — use Windows 10.0.13 candidate pipeline
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Compatibility workflow retired
        shell: pwsh
        run: |
          Write-Host 'This compatibility workflow no longer runs automatically.'
          Write-Host 'Use .github/workflows/endlume-1013-windows-candidate.yml for ENDLUME 10.0.13.'
