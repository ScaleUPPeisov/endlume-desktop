name: ENDLUME VYRON Final Bridge Validation

on:
  push:
    branches: [endlume-vyron-batch-import-final]
    paths: ['endlume-vyron-final-validate-trigger.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify surgical diff from current release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release
          git diff --name-only origin/release...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          allowed={
            'src-tauri/src/lib.rs','src-tauri/src/vyron_bridge.rs','src-tauri/src/vyron_bridge_tests.rs',
            'src/components/VyronBatchBridge.tsx','src/tauri.ts','src/pages/App.tsx',
            '.github/workflows/endlume-vyron-final-validate.yml','endlume-vyron-final-validate-trigger.txt'
          }
          extra=changed-allowed
          assert not extra, f'unexpected files changed: {sorted(extra)}'
          required={'src-tauri/src/vyron_bridge.rs','src-tauri/src/vyron_bridge_tests.rs','src/components/VyronBatchBridge.tsx'}
          assert required <= changed, f'missing bridge files: {sorted(required-changed)}'
          print('Surgical diff from release: PASS')
          PY
      - name: Verify protected identity and bridge contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('src-tauri/tauri.conf.json'))
          assert c['identifier']=='studio.endlume.desktop'
          print('ENDLUME identifier preserved: PASS')
          PY
          grep -q 'mod vyron_bridge' src-tauri/src/lib.rs
          grep -q 'mod vyron_bridge_tests' src-tauri/src/lib.rs
          grep -q 'consume_vyron_batch_request' src-tauri/src/lib.rs
          grep -q 'load_vyron_batch_manifest' src-tauri/src/lib.rs
          grep -q 'report_vyron_render' src-tauri/src/lib.rs
          grep -q 'VYRON Inbox' src-tauri/src/vyron_bridge.rs
          grep -q 'project_paths' src-tauri/src/vyron_bridge.rs
          grep -q 'statusPath' src-tauri/src/vyron_bridge.rs
          grep -q 'vyron_manifest_import_and_status_roundtrip' src-tauri/src/vyron_bridge_tests.rs
          grep -q 'VyronBatchBridge' src/pages/App.tsx
          grep -q '<VyronBatchBridge/>' src/pages/App.tsx
          grep -q 'consumeVyronBatch' src/tauri.ts
          grep -q 'loadVyronBatch' src/tauri.ts
          grep -q 'reportVyronRender' src/tauri.ts
          ! grep -RniE 'youtube|googleapis|openai|claude|gemini' src/components/VyronBatchBridge.tsx src-tauri/src/vyron_bridge.rs
          echo 'VYRON local bridge contracts: PASS'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare existing FFmpeg sidecars
        shell: bash
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          echo 'ENDLUME FFmpeg sidecars: PASS'
      - name: Apply exact proven ENDLUME 8.25 to 8.39 stack
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG="$PWD/src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
          FFPROBE="$PWD/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          python3 -m py_compile \
            scripts/apply-render-stability-8-25.py scripts/apply-release-ui-8-25.py \
            scripts/apply-smart-repeat-8-26.py scripts/apply-ui-version-8-26.py \
            scripts/apply-original-fidelity-8-27.py scripts/apply-original-fidelity-ui-8-27.py \
            scripts/apply-hybrid-fidelity-8-28.py scripts/apply-hybrid-fidelity-ui-8-28.py \
            scripts/repair-hybrid-patcher-8-29.py scripts/apply-version-8-30.py \
            scripts/apply-runtime-ux-8-31.py scripts/apply-version-8-31.py \
            scripts/apply-queue-updater-8-32.py scripts/apply-version-8-32.py \
            scripts/repair-speed-workdir-8-33.py scripts/apply-speed-fidelity-8-33.py scripts/apply-version-8-33.py \
            scripts/apply-stability-8-34.py scripts/apply-version-8-34.py \
            scripts/apply-strict-fidelity-8-35.py scripts/apply-version-8-35.py scripts/repair-strict-store-8-35.py \
            scripts/apply-fidelity-1080p-8-36.py scripts/apply-version-8-36.py \
            scripts/repair-settings-updater-8-37.py scripts/apply-remote-updater-8-37.py scripts/apply-version-8-37.py \
            scripts/apply-youtube-fill-8-38.py scripts/apply-version-8-38.py \
            scripts/apply-performance-fidelity-8-39.py scripts/apply-hybrid-updater-8-39.py scripts/apply-version-8-39.py
          python3 scripts/repair-hybrid-patcher-8-29.py
          python3 -m py_compile scripts/apply-hybrid-fidelity-8-28.py
          python3 scripts/apply-render-stability-8-25.py
          python3 scripts/apply-release-ui-8-25.py
          python3 scripts/apply-smart-repeat-8-26.py
          python3 scripts/apply-ui-version-8-26.py
          python3 scripts/apply-original-fidelity-8-27.py
          python3 scripts/apply-original-fidelity-ui-8-27.py
          python3 scripts/apply-hybrid-fidelity-8-28.py
          python3 scripts/apply-hybrid-fidelity-ui-8-28.py
          python3 scripts/apply-version-8-30.py
          python3 scripts/apply-runtime-ux-8-31.py
          python3 scripts/apply-version-8-31.py
          python3 scripts/apply-queue-updater-8-32.py
          python3 scripts/apply-version-8-32.py
          chmod +x scripts/validate-release-8-32.sh
          scripts/validate-release-8-32.sh
          python3 scripts/repair-speed-workdir-8-33.py
          python3 scripts/apply-speed-fidelity-8-33.py
          python3 scripts/apply-version-8-33.py
          python3 scripts/apply-stability-8-34.py
          python3 scripts/apply-version-8-34.py
          python3 scripts/apply-strict-fidelity-8-35.py
          python3 scripts/apply-version-8-35.py
          python3 scripts/repair-strict-store-8-35.py
          chmod +x scripts/validate-release-8-33.sh scripts/validate-release-8-34.sh
          scripts/validate-release-8-33.sh "$FFMPEG" "$FFPROBE"
          scripts/validate-release-8-34.sh "$FFMPEG" "$FFPROBE"
          python3 scripts/apply-fidelity-1080p-8-36.py
          python3 scripts/apply-version-8-36.py
          chmod +x scripts/validate-release-8-36.sh
          scripts/validate-release-8-36.sh "$FFMPEG" "$FFPROBE"
          python3 scripts/repair-settings-updater-8-37.py
          python3 scripts/apply-remote-updater-8-37.py
          python3 scripts/apply-version-8-37.py
          chmod +x scripts/validate-release-8-37.sh
          scripts/validate-release-8-37.sh
          python3 scripts/apply-youtube-fill-8-38.py
          python3 scripts/apply-version-8-38.py
          chmod +x scripts/validate-release-8-38.sh
          scripts/validate-release-8-38.sh "$FFMPEG" "$FFPROBE"
          python3 scripts/apply-performance-fidelity-8-39.py
          python3 scripts/apply-hybrid-updater-8-39.py
          python3 scripts/apply-version-8-39.py
          chmod +x scripts/validate-release-8-39.sh
          scripts/validate-release-8-39.sh "$FFMPEG" "$FFPROBE"
          python3 - <<'PY'
          import json
          p=json.load(open('package.json'));c=json.load(open('src-tauri/tauri.conf.json'))
          assert p['version']=='1.0.0-alpha.8.39',p['version']
          assert c['version']=='1.0.0-alpha.8.39',c['version']
          assert c['identifier']=='studio.endlume.desktop'
          print('Exact ENDLUME 8.39 stack: PASS')
          PY
      - name: Verify bridge survived exact release stack
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mod vyron_bridge' src-tauri/src/lib.rs
          grep -q 'mod vyron_bridge_tests' src-tauri/src/lib.rs
          grep -q 'VyronBatchBridge' src/pages/App.tsx
          grep -q '<VyronBatchBridge/>' src/pages/App.tsx
          grep -q 'consumeVyronBatch' src/tauri.ts
          grep -q 'loadVyronBatch' src/tauri.ts
          grep -q 'reportVyronRender' src/tauri.ts
          echo 'VYRON bridge survived exact release stack: PASS'
      - name: TypeScript production build
        run: npm run build
      - name: Rust tests including VYRON roundtrip
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture
      - name: Cargo check ARM64
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
      - name: Existing manual workflow regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'scan::scan_root' src-tauri/src/lib.rs
          grep -q 'queue::enqueue_projects' src-tauri/src/lib.rs
          grep -q 'preview::generate_preview' src-tauri/src/lib.rs
          grep -q 'live_preview::prepare_live_preview' src-tauri/src/lib.rs
          grep -q 'assets::import_library_asset' src-tauri/src/lib.rs
          grep -q 'license::activate_license' src-tauri/src/lib.rs
          grep -q 'cache::clear_effect_cache' src-tauri/src/lib.rs
          grep -q 'ProjectPage' src/pages/App.tsx
          grep -q 'RenderPage' src/pages/App.tsx
          grep -q 'LibraryPage' src/pages/App.tsx
          grep -q 'SettingsPage' src/pages/App.tsx
          echo 'Existing ENDLUME manual mode contracts: PASS'
