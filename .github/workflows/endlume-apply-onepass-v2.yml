name: ENDLUME apply one-pass Subscribe candidate v2

on:
  push:
    branches:
      - perf/endlume-subscribe-onepass-mux

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_onepass_subscribe.py
          git diff --check

      - name: Commit product patch when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/fast_render.rs; then
            echo ONEPASS_NO_PRODUCT_DIFF=1
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/fast_render.rs
          git commit -m 'perf: one-pass Subscribe HEVC encode and MP3 packet copy'
          git push origin HEAD:perf/endlume-subscribe-onepass-mux

      - name: Compile when product patch already present
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'encode_subscribe_mux_audio' src-tauri/src/fast_render.rs; then
            echo 'Patch was committed in this run; compile happens on the follow-up push.'
            exit 0
          fi
          sudo apt-get update >/dev/null
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg >/dev/null
          npm install --no-audit --no-fund
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --features acceptance-harness
          echo ONEPASS_PORTABLE_COMPILE=PASS
