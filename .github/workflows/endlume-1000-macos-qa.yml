name: ENDLUME 10.0.0 macOS QA

on:
  push:
    branches: [release-prep/endlume-10.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-1000-macos-qa
  cancel-in-progress: true

jobs:
  qa:
    name: macOS ARM64 • compile • real fixture
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact 8.67 ancestry and 10.0 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor b91b5f9fb27e2c284a3400a41e2382ed2cdf57fa HEAD
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          expected='10.0.0'
          assert json.loads(Path('package.json').read_text())['version']==expected
          assert json.loads(Path('package-lock.json').read_text())['version']==expected
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert cfg['version']==expected
          assert cfg['productName']=='ENDLUME YT Studio PEISOV'
          assert cfg['identifier']=='studio.endlume.desktop'
          assert cfg['plugins']['updater']['endpoints']==['https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/latest.json']
          assert re.search(r'^version\s*=\s*"10\.0\.0"$',Path('src-tauri/Cargo.toml').read_text(),re.M)
          r=Path('src-tauri/src/render.rs').read_text()
          for token in ['visual-master-v10','subscribe-master-v10','visualCache":"HIT','subscribeCache":"HIT','usage_mode','show_duration_sec','AUDIO BLOCKER','audio-audibility']:
              assert token in r,token
          print('ENDLUME_1000_IDENTITY_GREEN')
          PY

      - name: Stage native Apple Silicon FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          test -x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          test -x src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Frontend and Rust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1000"
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Stage real 15-track fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e1000fixture.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          test -f "$SIDE"
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/e1000-subscribe.json"
          test -s "$GITHUB_WORKSPACE/e1000-subscribe.json"

      - name: Build audit-only 10.0 render_job app
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1000"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          d=json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          npm run tauri build -- --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          echo "E1000_E2E_BIN=$APP/Contents/MacOS/$EXE" >> "$GITHUB_ENV"
          echo ENDLUME_1000_E2E_BUILD_GREEN

      - name: Cold + warm real render_job physical gate
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -d "/Volumes/TOSHIBA EXT" ]; then
            /usr/sbin/diskutil list || true
            DISK_ID="$(/usr/sbin/diskutil list 2>/dev/null | awk '/TOSHIBA EXT/{print $NF; exit}')"
            if [[ "$DISK_ID" =~ ^disk[0-9]+s[0-9]+$ ]]; then /usr/sbin/diskutil mount "$DISK_ID" || true; fi
          fi
          if [ -d "/Volumes/TOSHIBA EXT" ]; then
            STORAGE="TOSHIBA_EXT"
            OUT="/Volumes/TOSHIBA EXT/ENDLUME-1000-QA"
          else
            STORAGE="LOCAL_FALLBACK"
            OUT="$HOME/.endlume-ci-fixtures/ENDLUME-1000-QA"
            echo "PARTIAL_TOSHIBA_EXT_NOT_MOUNTED — running engine/audio/cache gate locally; stable release remains blocked"
          fi
          rm -rf "$OUT"
          mkdir -p "$OUT"
          find "$HOME/Library/Caches" -type d \( -name 'visual-master-v10' -o -name 'subscribe-master-v10' \) -prune -exec rm -rf {} + 2>/dev/null || true
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg-aarch64-apple-darwin' -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe-aarch64-apple-darwin' -print -quit)"
          mkdir -p "$GITHUB_WORKSPACE/e1000-qa"
          ENDLUME_1000_OUTPUT_DIR="$OUT" python3 scripts/run-endlume-1000-render-job-e2e.py "$SIDE" "$GITHUB_WORKSPACE/e1000-subscribe.json" "$E1000_E2E_BIN" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e1000-qa/metrics.json"
          cat "$GITHUB_WORKSPACE/e1000-qa/metrics.json"
          STORAGE="$STORAGE" python3 - <<'PY'
          import json,os
          x=json.load(open('e1000-qa/metrics.json'))
          assert x['status']=='passed' and x['release_gate'] is True,x
          assert x['cold_seconds']<=35,x
          assert max(x['warm_seconds'])<=15,x
          assert all(max(r['peaks_db'])>-55 for r in x['results']),x
          assert all(500_000_000<=r['bytes']<=700_000_000 for r in x['results']),x
          storage=os.environ['STORAGE']
          x['storage']=storage
          json.dump(x,open('e1000-qa/metrics.json','w'),ensure_ascii=False,indent=2)
          print('ENDLUME_1000_RENDER_AUDIO_GREEN',storage,x['cold_seconds'],x['warm_seconds'])
          if storage!='TOSHIBA_EXT':
              print('PARTIAL_TOSHIBA_RELEASE_GATE_BLOCKED')
          PY
          rm -rf "$OUT"

      - name: Build macOS application candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1000"
          npm run tauri build -- --bundles app
          APP="$(find "$CARGO_TARGET_DIR/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.endlume.desktop'
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '10.0.0'
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          if strings "$APP/Contents/MacOS/$EXE" | grep -q 'ENDLUME_E2E_RENDER_JOB'; then
            echo 'E2E marker leaked into production binary'
            exit 43
          fi
          echo ENDLUME_1000_MAC_BUILD_GREEN

      - name: Prepare signed macOS updater candidate without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1000"
          APP="$(find "$CARGO_TARGET_DIR/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          CAND="$GITHUB_WORKSPACE/e1000-candidate"
          rm -rf "$CAND"; mkdir -p "$CAND"
          ASSET="ENDLUME-YT-Studio-PEISOV-10.0.0-macOS-ARM64.app.tar.gz"
          /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/tar -czf "$CAND/$ASSET" -C "$(dirname "$APP")" "$(basename "$APP")"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$HOME/.endlume-updater/endlume.key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          unset TAURI_SIGNING_PRIVATE_KEY || true
          test -s "$TAURI_SIGNING_PRIVATE_KEY_PATH"
          npx --yes @tauri-apps/cli@2.10.1 signer sign "$CAND/$ASSET"
          test -s "$CAND/$ASSET.sig"
          SHA="$(shasum -a 256 "$CAND/$ASSET" | awk '{print $1}')"
          SIG="$(tr -d '\r\n' < "$CAND/$ASSET.sig")"
          python3 - "$CAND/latest-macos-candidate.json" "$ASSET" "$SHA" "$SIG" <<'PY'
          import datetime,json,sys
          out,asset,sha,sig=sys.argv[1:]
          data={
            "version":"10.0.0",
            "notes":"ENDLUME 10.0.0 macOS candidate. Stable publication is blocked until the physical TOSHIBA EXT gate is green and Windows compatibility is preserved.",
            "pub_date":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
            "platforms":{
              "darwin-aarch64":{
                "url":f"CANDIDATE_ONLY/{asset}",
                "signature":sig,
                "sha256":sha
              }
            }
          }
          json.dump(data,open(out,"w"),ensure_ascii=False,indent=2)
          PY
          echo "$SHA  $ASSET" > "$CAND/SHA256SUMS.txt"
          echo ENDLUME_1000_MAC_CANDIDATE_SIGNED_GREEN

      - name: Upload macOS candidate artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.0-macOS-ARM64-candidate
          path: e1000-candidate/
          if-no-files-found: error
          retention-days: 7
