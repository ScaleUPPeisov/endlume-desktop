name: ENDLUME 10.0.13 Phase 4 Prepare

on:
  push:
    branches:
      - release-endlume-10.0.13
    paths:
      - '.github/workflows/endlume-1013-phase4-prepare.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-endlume-10.0.13
          fetch-depth: 0
          token: ${{ secrets.ENDLUME_RELEASE_TOKEN }}

      - name: Prove frozen product input
        shell: bash
        run: |
          set -euo pipefail
          BASE='e4a07972b1566ed73b11c4eb758d59f4dc839e71'
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          BAD="$(git diff --name-only "$BASE" HEAD | grep -Ev '^(\.github/workflows/endlume-1013-phase4-prepare\.yml|scripts/phase4_prepare_1013\.py)$' || true)"
          if [ -n "$BAD" ]; then
            printf '%s\n' "$BAD" >&2
            exit 21
          fi
          echo 'PREP_INPUT_FUNCTIONAL_DIFF=0'

      - name: Apply metadata-only 10.0.13 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase4_prepare_1013.py
          git diff --check

      - name: Prove functional source freeze
        shell: bash
        run: |
          set -euo pipefail
          BASE='e4a07972b1566ed73b11c4eb758d59f4dc839e71'
          git diff --quiet "$BASE" -- src-tauri/src
          git diff --quiet "$BASE" -- src-tauri/icons
          BAD_SRC="$(git diff --name-only "$BASE" -- src | grep -Ev '^src/components/ReleaseHistory\.tsx$' || true)"
          test -z "$BAD_SRC"
          BAD_ALL="$(git diff --name-only "$BASE" | grep -Ev '^(package\.json|package-lock\.json|src-tauri/Cargo\.toml|src-tauri/Cargo\.lock|src-tauri/tauri\.conf\.json|src/components/ReleaseHistory\.tsx|RELEASE_NOTES\.md|release/ENDLUME_10\.0\.13_RELEASE\.md|scripts/phase4_prepare_1013\.py|\.github/workflows/endlume-1013-phase4-prepare\.yml)$' || true)"
          if [ -n "$BAD_ALL" ]; then
            printf '%s\n' "$BAD_ALL" >&2
            exit 22
          fi
          echo 'FAST_ENGINE_FUNCTIONAL_DIFF=0'
          echo 'PROJECT_UI_FUNCTIONAL_DIFF=0'
          echo 'EFFECTS_FUNCTIONAL_DIFF=0'
          echo 'SUBSCRIBE_FUNCTIONAL_DIFF=0'
          echo 'PREVIEW_FUNCTIONAL_DIFF=0'
          echo 'RENDER_CENTER_FUNCTIONAL_DIFF=0'
          echo 'ICON_DIFF=0'

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ENDLUME Release Bot'
          git config user.email 'peisov.business@gmail.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src/components/ReleaseHistory.tsx RELEASE_NOTES.md release/ENDLUME_10.0.13_RELEASE.md
          git commit -m 'release: set ENDLUME 10.0.13 metadata and history'
          git push origin HEAD:release-endlume-10.0.13
          echo 'PHASE4_METADATA_PREP=PASS'
