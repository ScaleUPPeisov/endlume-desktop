name: ENDLUME 10.0.11 Real Settings Update

on:
  push:
    branches: [release-endlume-10.0.11]
    paths:
      - ".github/workflows/endlume-1011-real-settings-update.yml"

permissions:
  contents: write

concurrency:
  group: endlume-1011-real-settings-update
  cancel-in-progress: true

env:
  VERSION: "10.0.11"
  SOURCE_REPO: "ScaleUPPeisov/endlume-desktop"
  SOURCE_TAG: "endlume-v10.0.11"
  MANIFEST_BRANCH: "release"
  STABLE_REPO: "ScaleUPPeisov/scaleup-site"
  STABLE_TAG: "endlume-stable"
  NEW_ZIP: "ENDLUME-YT-Studio-PEISOV-10.0.11-macOS-ARM64.zip"
  OLD_ZIP: "ENDLUME-YT-Studio-PEISOV-10.0.10-macOS-ARM64.zip"
  LEGACY_ZIP: "ENDLUME-YT-Studio-PEISOV-10.0.11-macOS-ARM64-settings-updater.zip"

jobs:
  real-settings-update:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 45
    env:
      RELEASE_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Build legacy-compatible 10.0.11 updater package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test -n "${RELEASE_TOKEN:-}"
          ROOT="$RUNNER_TEMP/e1011-real-update"
          rm -rf "$ROOT"; mkdir -p "$ROOT/new" "$ROOT/legacy" "$ROOT/old"
          BASE="https://github.com/$STABLE_REPO/releases/download/$STABLE_TAG"
          curl -fsSL --retry 5 "$BASE/$NEW_ZIP" -o "$ROOT/$NEW_ZIP"
          curl -fsSL --retry 5 "$BASE/$OLD_ZIP" -o "$ROOT/$OLD_ZIP"
          /usr/bin/ditto -x -k "$ROOT/$NEW_ZIP" "$ROOT/new"
          NEW_APP="$(find "$ROOT/new" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$NEW_APP" -a -d "$NEW_APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$NEW_APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$NEW_APP/Contents/Info.plist")" = "$VERSION"
          /usr/bin/codesign --verify --deep --strict "$NEW_APP"
          /usr/bin/ditto "$NEW_APP" "$ROOT/legacy/ENDLUME Studio.app"
          /usr/bin/codesign --verify --deep --strict "$ROOT/legacy/ENDLUME Studio.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$ROOT/legacy/ENDLUME Studio.app" "$ROOT/$LEGACY_ZIP"
          (cd "$ROOT" && /usr/bin/shasum -a 256 "$LEGACY_ZIP" > "$LEGACY_ZIP.sha256")
          gh release view "$SOURCE_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1 || gh release create "$SOURCE_TAG" --repo "$SOURCE_REPO" --title "ENDLUME 10.0.11" --notes "ENDLUME 10.0.11 signed Settings updater package."
          gh release upload "$SOURCE_TAG" "$ROOT/$LEGACY_ZIP" "$ROOT/$LEGACY_ZIP.sha256" --clobber --repo "$SOURCE_REPO"
          VERIFY="$ROOT/re-download"; mkdir -p "$VERIFY"
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --dir "$VERIFY" --pattern "$LEGACY_ZIP" --pattern "$LEGACY_ZIP.sha256" --clobber
          (cd "$VERIFY" && /usr/bin/shasum -a 256 -c "$LEGACY_ZIP.sha256")
          echo "E1011_REAL_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo ENDLUME_1011_LEGACY_PACKAGE_GREEN

      - name: Install and launch exact public 10.0.10 before manifest switch
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$E1011_REAL_ROOT"
          /usr/bin/ditto -x -k "$ROOT/$OLD_ZIP" "$ROOT/old"
          OLD_APP="$(find "$ROOT/old" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$OLD_APP" -a -d "$OLD_APP"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OLD_APP/Contents/Info.plist")" = "10.0.10"
          /usr/bin/codesign --verify --deep --strict "$OLD_APP"
          /usr/bin/osascript -e 'tell application id "studio.endlume.desktop" to quit' >/dev/null 2>&1 || true
          /bin/sleep 1
          rm -rf "/Applications/ENDLUME Studio.app" "/Applications/ENDLUME YT Studio PEISOV.app"
          /usr/bin/ditto "$OLD_APP" "/Applications/ENDLUME YT Studio PEISOV.app"
          /usr/bin/codesign --verify --deep --strict "/Applications/ENDLUME YT Studio PEISOV.app"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "/Applications/ENDLUME YT Studio PEISOV.app/Contents/Info.plist")" = "10.0.10"
          /usr/bin/open -n "/Applications/ENDLUME YT Studio PEISOV.app"
          for I in $(seq 1 80); do
            /usr/bin/osascript -e 'tell application "System Events" to exists (first application process whose bundle identifier is "studio.endlume.desktop")' 2>/dev/null | grep -q true && break
            /bin/sleep 0.25
          done
          echo ENDLUME_1011_REAL_10010_LAUNCHED

      - name: Publish 10.0.11 Settings manifest LAST
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ROOT="$E1011_REAL_ROOT"
          MANIFEST="$ROOT/settings-latest.json"
          python3 - "$MANIFEST" "$LEGACY_ZIP" <<'PY'
          import json,sys
          out,asset=sys.argv[1:]
          d={
            "version":"10.0.11",
            "date":"02.10.2026",
            "channel":"remote-binary",
            "candidateRevision":11,
            "builder":"endlume-1011-production",
            "ciBuilder":"endlume-1011-production",
            "releaseTag":"endlume-v10.0.11",
            "asset":asset,
            "checksumAsset":asset+".sha256",
            "notes":"ENDLUME 10.0.11: cold Preview, final Effects, cache invalidation, progress/ETA and production render acceptance."
          }
          json.dump(d,open(out,"w"),ensure_ascii=False,indent=2)
          PY
          CUR="$(gh api "repos/$SOURCE_REPO/contents/updates/latest.json?ref=$MANIFEST_BRANCH" --jq .sha)"
          B64="$(python3 - "$MANIFEST" <<'PY'
          import base64,sys
          print(base64.b64encode(open(sys.argv[1],"rb").read()).decode())
          PY
          )"
          gh api --method PUT "repos/$SOURCE_REPO/contents/updates/latest.json" -f message="release: ENDLUME 10.0.11 Settings manifest" -f content="$B64" -f sha="$CUR" -f branch="$MANIFEST_BRANCH" >/dev/null
          gh api -H "Accept: application/vnd.github.raw+json" "repos/$SOURCE_REPO/contents/updates/latest.json?ref=$MANIFEST_BRANCH" > "$ROOT/public-settings-latest.json"
          python3 - "$ROOT/public-settings-latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["version"]=="10.0.11",d
          assert d["channel"]=="remote-binary",d
          assert d["releaseTag"]=="endlume-v10.0.11",d
          assert d["asset"].endswith("settings-updater.zip"),d
          print("ENDLUME_1011_SETTINGS_MANIFEST_GREEN")
          PY

      - name: Real Settings UI 10.0.10 to 10.0.11
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          # Public Settings updater does not require a user's local GitHub CLI session.
          # Release publishing above is authenticated by github.token; the app consumes published assets.
          ACCESS="$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || true)"
          if [ "$ACCESS" != "true" ]; then
            echo "ENDLUME_REAL_BLOCKER=MACOS_ACCESSIBILITY_DISABLED"
            exit 73
          fi
          cat > "$RUNNER_TEMP/e1011-settings.applescript" <<'APPLESCRIPT'
          on focusedName()
            tell application "System Events"
              set ps to application processes whose bundle identifier is "studio.endlume.desktop"
              if (count of ps) is 0 then return ""
              tell item 1 of ps
                set frontmost to true
                try
                  set el to value of attribute "AXFocusedUIElement"
                  try
                    return name of el as text
                  on error
                    return ""
                  end try
                on error
                  return ""
                end try
              end tell
            end tell
          end focusedName

          on focusAndPress(targetName, maxTabs)
            repeat with i from 1 to maxTabs
              set currentName to my focusedName()
              if currentName is targetName then
                tell application "System Events" to key code 36
                delay 0.25
                return true
              end if
              tell application "System Events" to key code 48
              delay 0.08
            end repeat
            return false
          end focusAndPress

          tell application id "studio.endlume.desktop" to activate
          delay 0.4
          -- The global auto-update watcher may already have opened the update modal.
          -- Dismiss it if present, then explicitly exercise Settings -> Updates -> Check.
          if my focusAndPress("ПОЗЖЕ", 70) then delay 0.25
          if my focusAndPress("Настройки", 70) is false then error "SETTINGS_FOCUS_NOT_FOUND"
          delay 0.35
          if my focusAndPress("ОБНОВЛЕНИЯ", 70) is false then error "UPDATES_TAB_FOCUS_NOT_FOUND"
          delay 0.25
          if my focusAndPress("ПРОВЕРИТЬ ОБНОВЛЕНИЯ", 70) is false then error "CHECK_UPDATE_FOCUS_NOT_FOUND"
          delay 1.2
          if my focusAndPress("ОБНОВИТЬ", 70) is false then error "UPDATE_MODAL_FOCUS_NOT_FOUND"
          APPLESCRIPT
          /usr/bin/osascript "$RUNNER_TEMP/e1011-settings.applescript"
          STATE="$HOME/Library/Caches/studio.endlume.desktop/update-center/state.json"
          LOG="$HOME/Library/Caches/studio.endlume.desktop/update-center/update.log"
          for I in $(seq 1 300); do
            if [ -s "$STATE" ]; then
              S="$(python3 - "$STATE" <<'PY'
          import json,sys
          try: print(str(json.load(open(sys.argv[1])).get("state","")).lower())
          except Exception: print("")
          PY
              )"
              if [ "$S" = "success" ] || [ "$S" = "restart_required" ]; then break; fi
              if [ "$S" = "failed" ]; then cat "$STATE"; cat "$LOG" || true; exit 74; fi
            fi
            /bin/sleep 0.5
          done
          test -s "$STATE"
          python3 - "$STATE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert str(d.get("state","")).lower() in ("success","restart_required"),d
          print("ENDLUME_1011_SETTINGS_INSTALL_GREEN")
          PY
          STATE_VALUE="$(python3 - "$STATE" <<'PY'
          import json,sys
          print(str(json.load(open(sys.argv[1])).get("state","")).lower())
          PY
          )"
          if [ "$STATE_VALUE" = "restart_required" ]; then
            cat > "$RUNNER_TEMP/e1011-restart.applescript" <<'APPLESCRIPT'
          on focusedName()
            tell application "System Events"
              set ps to application processes whose bundle identifier is "studio.endlume.desktop"
              if (count of ps) is 0 then return ""
              tell item 1 of ps
                set frontmost to true
                try
                  set el to value of attribute "AXFocusedUIElement"
                  try
                    return name of el as text
                  on error
                    return ""
                  end try
                on error
                  return ""
                end try
              end tell
            end tell
          end focusedName

          tell application id "studio.endlume.desktop" to activate
          delay 0.5
          repeat with i from 1 to 50
            if my focusedName() is "RESTART ENDLUME" then
              tell application "System Events" to key code 36
              return
            end if
            tell application "System Events" to key code 48
            delay 0.08
          end repeat
          error "RESTART_ENDLUME_FOCUS_NOT_FOUND"
          APPLESCRIPT
            /usr/bin/osascript "$RUNNER_TEMP/e1011-restart.applescript"
          fi

      - name: Verify normalized relaunch and post-update runtime smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          CANON="/Applications/ENDLUME YT Studio PEISOV.app"
          LEGACY="/Applications/ENDLUME Studio.app"
          for I in $(seq 1 160); do
            V="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$CANON/Contents/Info.plist" 2>/dev/null || true)"
            if [ "$V" = "10.0.11" ]; then break; fi
            /bin/sleep 0.25
          done
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$CANON/Contents/Info.plist")" = "10.0.11"
          test ! -d "$LEGACY"
          /usr/bin/codesign --verify --deep --strict "$CANON"
          for I in $(seq 1 80); do
            /usr/bin/osascript -e 'tell application "System Events" to exists (first application process whose bundle identifier is "studio.endlume.desktop")' 2>/dev/null | grep -q true && break
            /bin/sleep 0.25
          done
          ENDLUME_APP_PATH="$CANON" node scripts/verify-macos-ffmpeg-bundle.mjs | tee "$E1011_REAL_ROOT/post-update-runtime.log"
          grep -q EFFECTS_LIVE_PREVIEW_RUNTIME_PASS "$E1011_REAL_ROOT/post-update-runtime.log"
          grep -q SUBSCRIBE_LIVE_PREVIEW_RUNTIME_PASS "$E1011_REAL_ROOT/post-update-runtime.log"
          grep -q ENDLUME_MACOS_FFMPEG_RUNTIME_PASS "$E1011_REAL_ROOT/post-update-runtime.log"
          echo VERSION_10_0_11_GREEN
          echo UPDATE_10010_TO_10011_GREEN
          echo POST_UPDATE_EFFECTS_RUNTIME_GREEN
          echo POST_UPDATE_SUBSCRIBE_RUNTIME_GREEN
          echo ENDLUME_1011_REAL_SETTINGS_UPDATE_GREEN
