name: VYRON Source Locator

on:
  push:
    branches:
      - diag/vyron-source-locator-20260910

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Inspect installed VYRON bundle metadata
        shell: bash
        run: |
          set -u
          echo "=== VYRON BUNDLE INSPECTION ==="
          apps="$RUNNER_TEMP/vyron-apps.txt"
          : > "$apps"
          for base in /Applications "$HOME/Applications"; do
            [[ -d "$base" ]] || continue
            find "$base" -maxdepth 2 -type d -iname '*vyron*.app' -print 2>/dev/null >> "$apps" || true
          done
          sort -u "$apps" -o "$apps"

          if [[ ! -s "$apps" ]]; then
            echo "installed_vyron_app=none"
            exit 0
          fi

          while IFS= read -r app; do
            echo "APP=$app"
            plist="$app/Contents/Info.plist"
            if [[ -f "$plist" ]]; then
              echo "bundle_name=$(defaults read "$plist" CFBundleName 2>/dev/null || true)"
              echo "bundle_id=$(defaults read "$plist" CFBundleIdentifier 2>/dev/null || true)"
              echo "version=$(defaults read "$plist" CFBundleShortVersionString 2>/dev/null || true)"
              echo "build=$(defaults read "$plist" CFBundleVersion 2>/dev/null || true)"
              exe_name=$(defaults read "$plist" CFBundleExecutable 2>/dev/null || true)
              echo "executable=$exe_name"
              exe="$app/Contents/MacOS/$exe_name"
              if [[ -f "$exe" ]]; then
                echo "binary_arch=$(file "$exe" 2>/dev/null || true)"
                echo "binary_sha256=$(shasum -a 256 "$exe" 2>/dev/null | awk '{print $1}')"
                echo "release/update URL strings:"
                strings "$exe" 2>/dev/null | grep -Eo 'https://[^[:space:]"<>]+' | grep -Ei 'github|latest\.json|releases|update' | sort -u > "$RUNNER_TEMP/vyron-urls.txt" || true
                sed -n '1,80p' "$RUNNER_TEMP/vyron-urls.txt"
              fi
            fi
            echo "resource metadata files:"
            find "$app/Contents/Resources" -maxdepth 3 -type f \( -name '*.json' -o -name '*.map' -o -name '*.toml' \) -print 2>/dev/null | sort > "$RUNNER_TEMP/vyron-resource-meta.txt" || true
            sed -n '1,100p' "$RUNNER_TEMP/vyron-resource-meta.txt"
          done < "$apps"
          echo "=== END BUNDLE INSPECTION ==="
