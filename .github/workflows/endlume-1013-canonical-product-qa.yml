name: ENDLUME Canonical Good Product QA

on:
  workflow_dispatch:
  push:
    branches:
      - release-fix/endlume-10.0.13-canonical-product-reconstruction
    paths:
      - .github/workflows/endlume-1013-canonical-product-qa.yml

permissions:
  contents: read

concurrency:
  group: endlume-canonical-product-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Canonical source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove reconstruction boundary and exact product delta
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=750623fde68ef73a58429a5fdef1b85d541c7e12
          FAST=a7a399e83de8b9248e2065c6dda1f9079ded6565
          git merge-base --is-ancestor 1954afb0632f05316aa7be493599a2c90d25dfe3 HEAD
          git merge-base --is-ancestor "$BASE" HEAD
          if git merge-base --is-ancestor "$FAST" HEAD 2>/dev/null; then
            echo 'FAST ENGINE lineage unexpectedly became an ancestor of canonical product.' >&2
            exit 31
          fi
          git diff --name-only "$BASE"...HEAD | grep -Ev '^(CANONICAL_PRODUCT_DELTA_MAP\.md|CANONICAL_GOOD_PRODUCT_MATRIX\.md|\.github/workflows/endlume-1013-canonical-product-qa\.yml)$' | sort > /tmp/product-changed.txt
          cat >/tmp/expected.txt <<'EOF'
          scripts/sign-macos-ffmpeg-runtime.mjs
          scripts/tauri-cli.mjs
          src-tauri/src/assets.rs
          src-tauri/src/cache.rs
          src-tauri/src/model.rs
          src-tauri/src/persistence.rs
          src-tauri/src/queue.rs
          src-tauri/src/render.rs
          src-tauri/src/scan.rs
          src/cinematic-ui-polish.css
          src/components/recovery.tsx
          src/loopforge-reference.css
          src/main.tsx
          src/pages/App.tsx
          src/pages/LibraryPage.tsx
          src/pages/ProjectPage.tsx
          src/store.ts
          src/types.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/product-changed.txt
          echo CANONICAL_PRODUCT_DELTA_EXACT=PASS

      - name: Prove visual, icon, changelog and UI contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/cinematic-ui-polish.css)" = '65033dcb913767944340a178f5cae0c71d5f8ae8'
          test "$(git rev-parse HEAD:src/loopforge-reference.css)" = '0703486098241dc1b1a58d93fadcc50577dd0cd7'
          test "$(git rev-parse HEAD:src-tauri/icons/icon.icns)" = '1475287a7780c467e5e7a9dbca5d4a2fc4633e0f'
          if git ls-tree -r HEAD | grep -q 'd550b4e67431911140fd6f3c0f3eac3488eb4fce'; then
            echo 'OLD_INFINITY_ICON_PRESENT' >&2
            exit 32
          fi
          grep -Fq "import './cinematic-ui-polish.css';" src/main.tsx
          grep -Fq "import './loopforge-reference.css';" src/main.tsx
          grep -Fq "ReleaseHistory" src/pages/SettingsPage.tsx
          grep -Fq "10.0.10" src/components/ReleaseHistory.tsx
          grep -Fq "10.0.0" src/components/ReleaseHistory.tsx
          grep -Fq "type Tab='general'|'engine'|'updates'|'about'" src/pages/SettingsPage.tsx
          grep -Fq "FAST ENGINE" src/pages/SettingsPage.tsx
          grep -Fq "ОБНОВЛЕНИЯ" src/pages/SettingsPage.tsx
          grep -Fq "О ПРОГРАММЕ" src/pages/SettingsPage.tsx
          grep -Fq "EffectsEditor" src/pages/Editors.tsx
          grep -Fq "SubscribeEditor" src/pages/Editors.tsx
          grep -Fq "mode==='off'?'ВЫКЛ':mode==='always'?'ВСЕГДА':'ПО ИНТЕРВАЛУ'" src/pages/Editors.tsx
          grep -Fq "chromakey / luma / screen" src/pages/Editors.tsx
          grep -Fq "toggleEffectEnabled" src/pages/Editors.tsx
          grep -Fq "toggleSubscribeEnabled" src/pages/Editors.tsx
          grep -Fq "saveLibrary" src/pages/Editors.tsx
          grep -Fq "featureKey='endlume-feature-flags-v2'" src/pages/ProjectPage.tsx
          grep -Fq "repair-required" src/pages/ProjectPage.tsx
          grep -Fq "selectedEffectByPath" src/pages/ProjectPage.tsx
          grep -Fq "Рассчитываю…" src/pages/RenderPage.tsx
          grep -Fq "РЕСУРСЫ" src/pages/RenderPage.tsx
          grep -Fq "ОСТАНОВИТЬ ТЕКУЩИЙ" src/pages/RenderPage.tsx
          grep -Fq "Открыть видео" src/pages/RenderPage.tsx
          grep -Fq "ВЕРНУТЬСЯ К ПРОЕКТУ" src/pages/RenderPage.tsx
          test "$(git rev-parse HEAD:src-tauri/src/mp4_manifest.rs)" = 'aa018754811c67d10cea59cde437145d025c5304'
          echo MODERN_ICON=PASS
          echo OLD_INFINITY_ICON=ABSENT
          echo OCTOBER_HISTORY_PRESENT=PASS
          echo MODERN_RENDER_CENTER=PASS
          echo EFFECTS_SUBSCRIBE_UI=PASS
          echo FAST_ENGINE_MERGED=NO

  macos-arm64-qa:
    name: macOS ARM64 build + product regression + isolated launch
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare native Apple Silicon FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin
          TMP="$(mktemp -d)"
          curl -fL --retry 4 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip' -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip' -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          src-tauri/binaries/ffmpeg-aarch64-apple-darwin -version | head -1
          rm -rf "$TMP"

      - name: TypeScript and Rust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/endlume-canonical-target"
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          echo TYPESCRIPT_RUST_REGRESSION=PASS

      - name: Build isolated production-like ARM64 app
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/endlume-canonical-target"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          c=json.loads(p.read_text())
          c['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app
          APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          test "$BID" = studio.endlume.desktop
          test "$VER" = 10.0.11
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p "$RUNNER_TEMP/canonical-artifact"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/canonical-artifact/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          shasum -a 256 "$RUNNER_TEMP/canonical-artifact/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip" > "$RUNNER_TEMP/canonical-artifact/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip.sha256"
          echo "BUILT_APP=$APP" >> "$GITHUB_ENV"
          echo "BUILT_EXE=$APP/Contents/MacOS/$EXE" >> "$GITHUB_ENV"
          echo ARM64_BUILD=PASS

      - name: 12-track Effects + Subscribe product E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/endlume-canonical-e2e-target"
          ROOT="$RUNNER_TEMP/canonical-e2e"
          FFMPEG="$GITHUB_WORKSPACE/src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
          FFPROBE="$GITHUB_WORKSPACE/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          rm -rf "$ROOT"; mkdir -p "$ROOT/project" "$ROOT/output" "$ROOT/effects"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'color=c=0x142039:size=1920x1080:rate=1' -frames:v 1 -y "$ROOT/project/base.png"
          for i in $(seq 1 12); do
            freq=$((180 + i * 35))
            "$FFMPEG" -hide_banner -loglevel error -f lavfi -i "sine=frequency=${freq}:sample_rate=48000:duration=30" -c:a libmp3lame -b:a 192k -ar 48000 -ac 2 -y "$ROOT/project/track-$(printf '%02d' "$i").mp3"
          done
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'color=c=0x00ff00:size=640x360:rate=30' -t 2 -vf 'drawbox=x=60:y=70:w=360:h=160:color=red@1:t=fill' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -y "$ROOT/effects/effect.mp4"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'color=c=0x00ff00:size=640x360:rate=30' -t 2 -vf 'drawbox=x=110:y=135:w=420:h=110:color=magenta@1:t=fill' -c:v libx264 -preset ultrafast -pix_fmt yuv420p -y "$ROOT/effects/subscribe.mp4"
          python3 - "$ROOT" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); tracks=sorted(str(x) for x in (root/'project').glob('track-*.mp3'))
          assert len(tracks)==12
          def fx(eid,name,src,x,y,scale):
            return {'id':eid,'name':name,'source':str(src),'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.10,'blend':0.06,'despill':0.35,'lumaThreshold':0.03,'lumaTolerance':0.08,'saturation':1.0,'x':x,'y':y,'scale':scale,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':False,'usageMode':'always','intervalSec':240.0,'usageDurationSec':30.0,'target':None,'offsetX':None,'offsetY':None,'opacity':1.0}
          effect=fx('canonical-fx','Canonical Effect',root/'effects/effect.mp4',0.28,0.34,0.32)
          sub=fx('canonical-sub','Canonical Subscribe',root/'effects/subscribe.mp4',0.50,0.82,0.40)
          sub.update({'usageMode':'interval','intervalSec':240.0,'usageDurationSec':8.0,'firstAtSec':0.0,'secondAtSec':240.0,'repeatEverySec':240.0,'firstAppearance':'immediate','customFirstAtSec':0.0,'showDurationSec':8.0})
          settings={'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':8.0,'durationHours':2.0,'durationMode':'exact','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':str(root/'output'),'preset':'fast','encoderPreference':'auto'}
          project={'id':'canonical-product','name':'CANONICAL 12 TRACK','path':str(root/'project'),'media':[str(root/'project/base.png')],'audio':tracks,'valid':True,'error':None,'anchors':{}}
          payload={'jobs':[{'project':project,'settings':settings,'effects':[effect],'subscribes':[sub],'ambient':None,'ambientSettings':{'volumePct':18.0,'bassDb':0.0,'midDb':0.0,'trebleDb':0.0}}]}
          (root/'render-jobs.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json'); c=json.loads(p.read_text()); c['bundle']['createUpdaterArtifacts']=False; p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          E2E_APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$E2E_APP" -a -d "$E2E_APP"
          E2E_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$E2E_APP/Contents/Info.plist")"
          export ENDLUME_E2E_RENDER_JOB="$ROOT/render-jobs.json"
          export ENDLUME_E2E_RESULT="$ROOT/render-result.json"
          "$E2E_APP/Contents/MacOS/$E2E_EXE" >"$ROOT/app.stdout" 2>"$ROOT/app.stderr"
          python3 - "$ROOT" "$FFPROBE" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1]); ffprobe=sys.argv[2]
          raw=json.loads((root/'render-result.json').read_text()); assert raw.get('status')=='passed',raw
          rows=raw.get('results',[]); assert len(rows)==1,rows; row=rows[0]; assert row.get('status')=='passed',row
          out=Path(row['outputPath']); assert out.is_file(),out
          meta=json.loads(subprocess.run([ffprobe,'-v','error','-show_entries','stream=codec_type,codec_name,width,height,avg_frame_rate,sample_rate,channels:format=duration,size','-of','json',str(out)],check=True,stdout=subprocess.PIPE,text=True).stdout)
          v=next(x for x in meta['streams'] if x.get('codec_type')=='video'); a=next(x for x in meta['streams'] if x.get('codec_type')=='audio')
          duration=float(meta['format']['duration']); mib=out.stat().st_size/1048576.0
          assert v['codec_name']=='hevc' and int(v['width'])==1920 and int(v['height'])==1080 and v['avg_frame_rate']=='60/1',v
          assert a['codec_name']=='aac' and int(a['sample_rate'])==48000 and int(a['channels'])==2,a
          assert abs(duration-7200.0)<=1.0,duration
          assert out.stat().st_size>0,out
          report={'status':'PASS','tracks':12,'effects':True,'subscribe':True,'duration':duration,'mib':mib,'wallSeconds':row.get('wallSeconds'),'fastPath':row.get('fastPath'),'encoder':row.get('encoder'),'sizeGate':'nonempty-only; Phase 2 has no release-size target'}
          (root/'product-e2e-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('PRODUCT_E2E='+json.dumps(report,ensure_ascii=False,sort_keys=True))
          print('TWELVE_TRACK_EFFECTS_SUBSCRIBE_E2E=PASS')
          out.unlink(missing_ok=True)
          PY
          cp "$ROOT/product-e2e-report.json" "$RUNNER_TEMP/canonical-artifact/"
          cp "$ROOT/render-result.json" "$RUNNER_TEMP/canonical-artifact/"

      - name: Launch exact QA app from isolated mounted volume
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/canonical-artifact"
          DMG="$RUNNER_TEMP/ENDLUME-CANONICAL-QA.dmg"
          VOL='/Volumes/ENDLUME_CANONICAL_QA'
          if test -e '/Applications/ENDLUME YT Studio PEISOV.app'; then
            echo 'Unexpected pre-existing canonical app on hosted runner; refusing to touch it.' >&2
            exit 71
          fi
          hdiutil create -quiet -size 180m -fs APFS -volname ENDLUME_CANONICAL_QA "$DMG"
          mkdir -p "$VOL"
          hdiutil attach -quiet "$DMG" -mountpoint "$VOL"
          QA_APP="$VOL/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app"
          ditto "$BUILT_APP" "$QA_APP"
          codesign --force --deep --sign - --timestamp=none "$QA_APP"
          codesign --verify --deep --strict "$QA_APP"
          ICON="$QA_APP/Contents/Resources/icon.icns"
          test -f "$ICON"
          sips -s format png "$ICON" --out "$REPORT/application-icon.png" >/dev/null
          open -n "$QA_APP"
          sleep 7
          pgrep -f "$QA_APP/Contents/MacOS" >/dev/null
          test ! -e '/Applications/ENDLUME YT Studio PEISOV.app'
          /usr/sbin/screencapture -x "$REPORT/isolated-launch.png" || true
          /usr/bin/osascript <<'APPLESCRIPT' > "$REPORT/accessibility.txt" 2>&1 || true
          tell application "System Events"
            set ps to application processes whose bundle identifier is "studio.endlume.desktop"
            if (count of ps) is 0 then
              log "PROCESS_NOT_FOUND"
            else
              tell item 1 of ps
                set frontmost to true
                log "PROCESS_FOUND"
                try
                  log "WINDOW_COUNT=" & (count of windows)
                  repeat with w in windows
                    try
                      log "WINDOW=" & (name of w as text)
                    end try
                  end repeat
                end try
              end tell
            end if
          end tell
          APPLESCRIPT
          cat "$REPORT/accessibility.txt" || true
          cat > "$REPORT/physical-ui-status.txt" <<'EOF'
          ISOLATED_LAUNCH=PASS
          ISOLATED_PATH_PREFIX=/Volumes/ENDLUME_CANONICAL_QA
          OWNER_APPLICATIONS_APP_MODIFIED=NO
          APPLICATION_ICON_CAPTURE=PASS
          FULL_MULTI_SCREEN_QA=BLOCKED
          BLOCKER=Clean hosted macOS has no valid ENDLUME GUI QA license/session and product source has no authorized frontend license-bypass path. Adding a bypass is forbidden because it would mutate security/product behavior.
          EOF
          pkill -f "$QA_APP/Contents/MacOS" || true
          sleep 1
          hdiutil detach -quiet "$VOL" || true
          test ! -e '/Applications/ENDLUME YT Studio PEISOV.app'
          echo ISOLATED_QA_LAUNCH=PASS
          echo FULL_MULTI_SCREEN_QA=BLOCKED_NO_AUTHORIZED_QA_LICENSE

      - name: Upload canonical QA artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/canonical-artifact/
          if-no-files-found: error
          retention-days: 14