name: ENDLUME 10.0.6 Full Production QA

on:
  push:
    branches:
      - candidate/endlume-10.0.6-production-freeze
    paths:
      - ".github/workflows/endlume-1006-full-production-qa.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1006-full-production-freeze-qa
  cancel-in-progress: true

jobs:
  hosted-macos:
    name: macOS ARM64 • Source • UI • Effects • Launch • Render
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Version and production surface contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          v='10.0.6'
          assert json.loads(Path('package.json').read_text())['version']==v
          assert json.loads(Path('package-lock.json').read_text())['version']==v
          t=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert t['version']==v
          assert t['app']['windows'] and any(w.get('label')=='main' for w in t['app']['windows'])
          cargo=Path('src-tauri/Cargo.toml').read_text()
          assert re.search(r'^version\s*=\s*"10[.]0[.]6"$',cargo,re.M)
          lock=Path('src-tauri/Cargo.lock').read_text()
          assert 'name = "endlume"\nversion = "10.0.6"' in lock
          settings=Path('src/pages/SettingsPage.tsx').read_text()
          assert "api.appVersion().then(setAppVersion)" in settings
          assert "{PRODUCT_NAME} {appVersion||'…'}" in settings
          assert "update.current||appVersion||'…'" in settings
          assert "<ReleaseHistory currentVersion={appVersion}/>" in settings
          assert "<span>Версия <b>{appVersion||'…'}</b></span>" in settings
          history=Path('src/components/ReleaseHistory.tsx').read_text()
          assert "release.version===currentVersion" in history
          render_page=Path('src/pages/RenderPage.tsx').read_text()
          queue=Path('src-tauri/src/queue.rs').read_text()
          assert "Рендер завершён с ошибкой" in render_page
          assert "ОШИБКА РЕНДЕРА" in render_page
          assert "Не удалось запустить внутренний видео-движок FFmpeg." in queue
          print('ENDLUME_1006_VERSION_UI_GREEN')
          PY

      - name: Effect Studio contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          types=Path('src/types.ts').read_text()
          store=Path('src/store.ts').read_text()
          editors=Path('src/pages/Editors.tsx').read_text()
          live=Path('src/components/LiveCompositePreview.tsx').read_text()
          model=Path('src-tauri/src/model.rs').read_text()
          render=Path('src-tauri/src/render.rs').read_text()
          for token in ['AnchorPoint','SceneAnchors','opacity?: number','offsetX?: number','offsetY?: number']:
            assert token in types,token
          assert 'sceneAnchorsByPath' in store and 'setSceneAnchor' in store
          for token in ['anchorMode','onAnchorPick','Target / anchor','Opacity','offsetX','offsetY']:
            assert token in editors,token
          assert 'requestAnimationFrame(draw)' in live
          assert 'effect.opacity??1' in live
          assert 'api.prepareLivePreview' in editors
          assert 'offset_x' in model and 'offset_y' in model and 'opacity' in model
          assert 'resolve_effect_for_project' in render
          assert 'effect_opacity' in render
          assert 'all_opacity={opacity}' in render
          assert 'colorchannelmixer=aa={opacity}' in render
          print('ENDLUME_1006_EFFECT_STUDIO_GREEN')
          PY

      - name: Frontend and Rust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          mkdir -p src-tauri/binaries
          cp -L "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp -L "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --lib -- --nocapture

      - name: Resolve production Apple signing identity
        shell: bash
        run: |
          set -Eeuo pipefail
          IDENTITIES="$(/usr/bin/security find-identity -v -p codesigning 2>&1 || true)"
          IDENTITY="$(printf '%s\n' "$IDENTITIES" | grep 'Developer ID Application:' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$IDENTITY" || { echo "Developer ID Application identity not found" >&2; exit 41; }
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$IDENTITY" >> "$GITHUB_ENV"
          echo "ENDLUME_1006_DEVELOPER_ID_GREEN"

      - name: Build exact app candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          d=json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts']=False
          assert d['app']['windows'] and any(w.get('label')=='main' for w in d['app']['windows'])
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          export CARGO_TARGET_DIR="$RUNNER_TEMP/e1006-hosted"
          npm run tauri build -- --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR" -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "10.0.6"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          echo "E1006_APP=$APP" >> "$GITHUB_ENV"

      - name: Production codesign + notarization + Gatekeeper
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p e1006-qa
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$E1006_APP"
          /usr/bin/codesign -dv --verbose=4 "$E1006_APP" 2>e1006-qa/codesign.txt || true
          grep -q 'Authority=Developer ID Application:' e1006-qa/codesign.txt
          if ! /usr/bin/xcrun stapler validate "$E1006_APP" >e1006-qa/stapler-before.txt 2>&1; then
            NOTARY_ZIP="$RUNNER_TEMP/endlume-1006-notary.zip"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$E1006_APP" "$NOTARY_ZIP"
            if test -n "${APPLE_ID:-}" && test -n "${APPLE_PASSWORD:-}" && test -n "${APPLE_TEAM_ID:-}"; then
              /usr/bin/xcrun notarytool submit "$NOTARY_ZIP" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            elif test -n "${APPLE_API_KEY_PATH:-}" && test -n "${APPLE_API_KEY:-}" && test -n "${APPLE_API_ISSUER:-}"; then
              /usr/bin/xcrun notarytool submit "$NOTARY_ZIP" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            else
              echo "Notarization credentials are not available on the production QA runner" >&2
              exit 42
            fi
            /usr/bin/xcrun stapler staple "$E1006_APP"
          fi
          /usr/bin/xcrun stapler validate "$E1006_APP" | tee e1006-qa/stapler.txt
          /usr/sbin/spctl -a -vv "$E1006_APP" 2>&1 | tee e1006-qa/gatekeeper.txt
          echo "ENDLUME_1006_SIGNING_NOTARY_GATEKEEPER_GREEN"

      - name: Exact ZIP • real UI launch • crash • signing
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/e1006-qa"
          mkdir -p "$OUT"
          ZIP="$OUT/ENDLUME-10.0.6-production-candidate.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$E1006_APP" "$ZIP"
          /usr/bin/shasum -a 256 "$ZIP" | tee "$OUT/ENDLUME-10.0.6-production-candidate.zip.sha256"
          UNPACK="$RUNNER_TEMP/e1006-unpack"
          rm -rf "$UNPACK"; mkdir -p "$UNPACK"
          /usr/bin/ditto -x -k "$ZIP" "$UNPACK"
          APP="$(find "$UNPACK" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "10.0.6"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test -x "$APP/Contents/MacOS/$EXE"
          test -x "$APP/Contents/MacOS/ffmpeg"
          test -x "$APP/Contents/MacOS/ffprobe"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/xcrun stapler validate "$APP"
          /usr/sbin/spctl -a -vv "$APP" 2>&1 | tee "$OUT/exact-zip-gatekeeper.txt"

          MARKER="$RUNNER_TEMP/e1006-launch.json"
          STAMP="$RUNNER_TEMP/e1006-launch-start.stamp"
          SHOT="$OUT/ENDLUME-10.0.6-main-ui-smoke.png"
          rm -f "$MARKER" "$SHOT"; touch "$STAMP"
          /bin/launchctl setenv ENDLUME_LAUNCH_SMOKE_MARKER "$MARKER"
          cleanup_env(){ /bin/launchctl unsetenv ENDLUME_LAUNCH_SMOKE_MARKER >/dev/null 2>&1 || true; }
          trap cleanup_env EXIT
          /usr/bin/open -n "$APP"
          for I in $(seq 1 80); do test -s "$MARKER" && break; sleep 0.25; done
          cleanup_env
          test -s "$MARKER"
          cat "$MARKER" | tee "$OUT/frontend-main.json"
          PID="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["label"]=="main";assert d["frontendLoaded"] is True;print(d["pid"])' "$MARKER")"
          kill -0 "$PID"
          sleep 2
          kill -0 "$PID"
          WINDOW_COUNT="$(/usr/bin/osascript <<OSA
          tell application "System Events"
            set p to first application process whose unix id is $PID
            set frontmost of p to true
            return count of windows of p
          end tell
          OSA
          )"
          test "$WINDOW_COUNT" -ge 1
          /usr/sbin/screencapture -x "$SHOT"
          test -s "$SHOT"
          test "$(stat -f '%z' "$SHOT")" -gt 10000
          if test -d "$HOME/Library/Logs/DiagnosticReports"; then
            if find "$HOME/Library/Logs/DiagnosticReports" -type f -newer "$STAMP" -iname '*endlume*' -print | grep -q .; then
              echo "ENDLUME crash report detected after exact ZIP launch" >&2
              exit 43
            fi
          fi
          kill "$PID" >/dev/null 2>&1 || true
          echo "E1006_UNPACKED_APP=$APP" >> "$GITHUB_ENV"
          echo "E1006_APP_BIN=$APP/Contents/MacOS/$EXE" >> "$GITHUB_ENV"
          echo "ENDLUME_1006_EXACT_ZIP_UI_LAUNCH_GREEN windows=$WINDOW_COUNT"

      - name: FFmpeg Live Preview runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ENDLUME_APP_PATH="$E1006_UNPACKED_APP" node scripts/verify-macos-ffmpeg-bundle.mjs | tee e1006-qa/runtime.log
          grep -q EFFECTS_LIVE_PREVIEW_RUNTIME_PASS e1006-qa/runtime.log
          grep -q SUBSCRIBE_LIVE_PREVIEW_RUNTIME_PASS e1006-qa/runtime.log
          grep -q ENDLUME_MACOS_FFMPEG_RUNTIME_PASS e1006-qa/runtime.log

      - name: Normal render smoke and output validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/qa-endlume-1005-normal-render-smoke.py             "$E1006_UNPACKED_APP"             "$E1006_UNPACKED_APP/Contents/MacOS/ffmpeg"             "$E1006_UNPACKED_APP/Contents/MacOS/ffprobe"             e1006-qa/normal-render.json
          grep -q 'ENDLUME_1005_EXACT_ZIP_NORMAL_RENDER_PASS' e1006-qa/normal-render.json
          python3 - <<'PY'
          import json
          d=json.load(open('e1006-qa/normal-render.json'))
          assert d, d
          print('ENDLUME_1006_NORMAL_RENDER_GREEN',d)
          PY

      - name: Two-track crossfade + HQ320 real render
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/qa-endlume-1006-crossfade-hq320.py \
            "$E1006_UNPACKED_APP" \
            e1006-qa/crossfade-hq320.json
          grep -q 'ENDLUME_1006_CROSSFADE_HQ320_RUNTIME_GREEN' e1006-qa/crossfade-hq320.json

      - name: Effect anchor + opacity final render smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/qa-endlume-1006-effect-anchor-smoke.py \
            "$E1006_UNPACKED_APP" \
            "$E1006_UNPACKED_APP/Contents/MacOS/ffmpeg" \
            "$E1006_UNPACKED_APP/Contents/MacOS/ffprobe" \
            e1006-qa/effect-anchor-render.json
          grep -q 'ENDLUME_1006_EFFECT_ANCHOR_RENDER_PASS' e1006-qa/effect-anchor-render.json

      - name: Verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ENDLUME_1006_HOSTED_FULL_QA_GREEN"
          echo "HEAD=$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.6-hosted-full-qa
          path: e1006-qa/
          if-no-files-found: warn
          retention-days: 7
