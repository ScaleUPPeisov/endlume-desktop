name: ENDLUME 10.0.0 macOS QA

on:
  push:
    branches: [release-prep/endlume-10.0.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-1000-macos-qa
  cancel-in-progress: true

jobs:
  qa:
    name: macOS ARM64 • compile • real fixture
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact 8.67 ancestry and 10.0 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor b91b5f9fb27e2c284a3400a41e2382ed2cdf57fa HEAD
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          expected='10.0.0'
          assert json.loads(Path('package.json').read_text())['version']==expected
          assert json.loads(Path('package-lock.json').read_text())['version']==expected
          cfg=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          assert cfg['version']==expected
          assert cfg['productName']=='ENDLUME YT Studio PEISOV'
          assert cfg['identifier']=='studio.endlume.desktop'
          assert cfg['plugins']['updater']['endpoints']==['https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/latest.json']
          assert re.search(r'^version\s*=\s*"10\.0\.0"$',Path('src-tauri/Cargo.toml').read_text(),re.M)
          r=Path('src-tauri/src/render.rs').read_text()
          for token in ['visual-master-v10','subscribe-master-v10','visualCache":"HIT','subscribeCache":"HIT','usage_mode','show_duration_sec']:
              assert token in r,token
          print('ENDLUME_1000_IDENTITY_GREEN')
          PY

      - name: Stage native Apple Silicon FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          test -x src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          test -x src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Frontend and Rust regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Stage real 15-track fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e1000fixture.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          test -f "$SIDE"
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/e1000-subscribe.json"
          test -s "$GITHUB_WORKSPACE/e1000-subscribe.json"

      - name: Real fidelity regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg-aarch64-apple-darwin' -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe-aarch64-apple-darwin' -print -quit)"
          python3 scripts/run-endlume-860-five-masters.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e1000-five.json"
          python3 scripts/run-endlume-857-real-e2e.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e1000-off.json"
          python3 scripts/run-endlume-860-real-subscribe.py "$SIDE" "$GITHUB_WORKSPACE/e1000-subscribe.json" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e1000-on.json"
          python3 - <<'PY'
          import json
          five=json.load(open('e1000-five.json')); off=json.load(open('e1000-off.json')); on=json.load(open('e1000-on.json'))
          assert five.get('status')=='passed' and max(five.get('times') or [999])<=30.0,five
          assert off.get('status')=='passed' and off.get('release_gate') is True,off
          assert on.get('status')=='passed' and on.get('subscribe_on_gate') is True,on
          assert off.get('resolution')=='1920x1080' and off.get('fps')=='60/1',off
          assert off.get('audio_codec')=='mp3' and off.get('mp3_packet_copy') is True,off
          assert 500_000_000<=off.get('final_bytes',0)<=700_000_000,off
          assert 500_000_000<=on.get('final_bytes',0)<=700_000_000,on
          print('ENDLUME_1000_REAL_FIXTURE_GREEN')
          PY

      - name: Build macOS application candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run tauri build -- --bundles app
          APP="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.endlume.desktop'
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = '10.0.0'
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          echo ENDLUME_1000_MAC_BUILD_GREEN
