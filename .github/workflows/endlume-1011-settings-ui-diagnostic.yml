name: ENDLUME 10.0.11 Settings UI Diagnostic
on:
  push:
    branches: [release-endlume-10.0.11]
    paths: [".github/workflows/endlume-1011-settings-ui-diagnostic.yml"]
permissions:
  contents: read
concurrency:
  group: endlume-1011-settings-ui-diagnostic
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 8
    steps:
      - name: Probe Settings keyboard focus path
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$APP"
          echo "INSTALLED_VERSION=$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/open -n "$APP" || true
          /bin/sleep 2
          /usr/bin/osascript -e 'tell application id "studio.endlume.desktop" to activate'
          /bin/sleep 1
          /usr/bin/osascript <<'APPLESCRIPT'
          on focusedInfo(stepName)
            tell application "System Events"
              set ps to application processes whose bundle identifier is "studio.endlume.desktop"
              if (count of ps) is 0 then return stepName & "|PROCESS_NOT_FOUND"
              tell item 1 of ps
                set frontmost to true
                try
                  set el to value of attribute "AXFocusedUIElement"
                  set rr to ""
                  set nn to ""
                  try
                    set rr to role of el as text
                  end try
                  try
                    set nn to name of el as text
                  end try
                  return stepName & "|role=" & rr & "|name=" & nn
                on error errText
                  return stepName & "|ERROR=" & errText
                end try
              end tell
            end tell
          end focusedInfo
          tell application "System Events"
            set ps to application processes whose bundle identifier is "studio.endlume.desktop"
            tell item 1 of ps to set frontmost to true
            repeat with i from 1 to 4
              key code 48
              delay 0.1
            end repeat
            log my focusedInfo("SETTINGS_FOCUS")
            key code 36
            delay 0.5
            log my focusedInfo("AFTER_SETTINGS_ENTER")
            repeat with i from 1 to 12
              key code 48
              delay 0.12
              log my focusedInfo("S_TAB" & i)
            end repeat
          end tell
          APPLESCRIPT
