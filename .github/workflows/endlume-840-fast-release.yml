name: ENDLUME 8.40 Direct Release

on:
  push:
    branches: [release]
    paths: ['endlume-840-fast-release-trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-840-direct-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 1.0.0-alpha.8.40
      TAG: endlume-v1.0.0-alpha.8.40
      ASSET: ENDLUME-Studio-1.0.0-alpha.8.40-macos-arm64.zip
      CHECKSUM: ENDLUME-Studio-1.0.0-alpha.8.40-macos-arm64.zip.sha256
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Verify candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('updates/release-candidate.json'))
          assert x['version']=='1.0.0-alpha.8.40'
          assert x['releaseTag']=='endlume-v1.0.0-alpha.8.40'
          assert x['asset']=='ENDLUME-Studio-1.0.0-alpha.8.40-macos-arm64.zip'
          print('8.40 release candidate: PASS')
          PY
          test -s scripts/build-endlume-840-fast-ci.sh
          bash -n scripts/build-endlume-840-fast-ci.sh

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1

      - name: Build and test ENDLUME 8.40
        shell: bash
        env:
          ENDLUME_CI_ARTIFACT_DIR: ${{ github.workspace }}/release-out
          ENDLUME_CI_ASSET_NAME: ${{ env.ASSET }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-endlume-840-fast-ci.sh
          scripts/build-endlume-840-fast-ci.sh

      - name: Verify final package
        shell: bash
        run: |
          set -euo pipefail
          cd release-out
          shasum -a 256 -c "$CHECKSUM"
          TMP="$(mktemp -d)"
          ditto -x -k "$ASSET" "$TMP"
          APP="$(find "$TMP" -maxdepth 4 -type d -name 'ENDLUME Studio.app' -print -quit)"
          test -n "$APP" && test -d "$APP/Contents"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'studio.endlume.desktop'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$APP"
          BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$BIN"
          file "$BIN" | grep -q 'arm64'
          rm -rf "$TMP"
          echo 'ENDLUME 8.40 ZIP/identity/codesign/arm64: PASS'

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "release-out/$ASSET" "release-out/$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "release-out/$ASSET" "release-out/$CHECKSUM" --repo "$GITHUB_REPOSITORY" --title "ENDLUME Studio $VERSION" --notes "ENDLUME 8.40: VYRON Batch Bridge поверх проверенного 8.39 render stack. Local-only integration, без YouTube API."
          fi

      - name: Promote live in-app updater
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release
          git reset --hard origin/release
          cp updates/release-candidate.json updates/latest.json
          git config user.name 'ENDLUME Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Promote ENDLUME $VERSION to in-app latest"
            git push origin HEAD:release
          fi

      - name: Verify published release and live updater
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > /tmp/endlume-release.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/endlume-release.json'))
          assert x['tagName']==os.environ['TAG']
          assert x['isDraft'] is False and x['isPrerelease'] is False
          names={a['name'] for a in x['assets']}
          assert os.environ['ASSET'] in names and os.environ['CHECKSUM'] in names
          print('GitHub Release assets: PASS')
          PY
          git fetch origin release
          git show origin/release:updates/latest.json > /tmp/endlume-latest.json
          python3 - <<'PY'
          import json,os
          x=json.load(open('/tmp/endlume-latest.json'))
          assert x['version']==os.environ['VERSION']
          assert x['releaseTag']==os.environ['TAG']
          assert x['asset']==os.environ['ASSET']
          assert x['channel']=='remote-binary'
          print('ENDLUME live updater 8.40: PASS')
          PY

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-1.0.0-alpha.8.40-macos-arm64
          path: release-out/*
          if-no-files-found: error
