name: ENDLUME 8.67 VideoToolbox Profile Probe
on:
  push:
    branches: [hotfix/endlume-8.67-render-perf-staging]
    paths: ['.github/workflows/endlume-867-videotoolbox-profile-probe.yml']
permissions: {contents: read}
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - name: Benchmark exact Effects master encoder profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ffmpeg -hide_banner -h encoder=hevc_videotoolbox 2>&1 | grep -E 'prio_speed|constant_bit_rate|realtime|q:v|power_efficient' || true
          python3 - <<'PY'
          import json,subprocess,time,tempfile,re,os
          from pathlib import Path
          side=Path('/Volumes/TOSHIBA EXT/ВАЙРОН/Render/First Pour Jazz/logs/005 — Ready Videos — project.json')
          d=json.loads(side.read_text(errors='replace'))
          image=Path(d['project']['media'][0]); assert image.is_file()
          caches=[
            Path.home()/'Library/Caches/studio.endlume.desktop/strict-effects-856/dd8446163b22cd85f0f04c3e.mov',
            Path.home()/'Library/Caches/studio.endlume.desktop/strict-effects-856/40fadf87ddc1297403bf34e8.mov',
          ]
          assert all(p.is_file() for p in caches),caches
          def run(a,capture=False):
              return subprocess.run([str(x) for x in a],check=True,capture_output=capture,text=capture)
          def probe(p):
              return json.loads(run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,pix_fmt,avg_frame_rate,bit_rate:format=duration,size,bit_rate','-of','json',p],True).stdout)
          with tempfile.TemporaryDirectory(prefix='e867-vtb-') as td:
              root=Path(td); base=root/'base.png'
              run(['ffmpeg','-hide_banner','-loglevel','error','-i',image,'-vf','scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1','-frames:v','1','-compression_level','1','-y',base])
              graph="[0:v]fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834122934888241-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
              profiles={
                'current':['-realtime','1','-prio_speed','0','-power_efficient','0','-q:v','100','-b:v','500k','-maxrate','12M','-bufsize','64M'],
                'fast_q100':['-realtime','1','-prio_speed','1','-power_efficient','0','-q:v','100','-b:v','500k','-maxrate','12M','-bufsize','64M'],
                'fast_8m':['-realtime','1','-prio_speed','1','-power_efficient','0','-b:v','8M','-maxrate','10M','-bufsize','20M'],
                'fast_14m':['-realtime','1','-prio_speed','1','-power_efficient','0','-b:v','14M','-maxrate','16M','-bufsize','32M'],
              }
              rows={}
              for name,enc in profiles.items():
                  out=root/(name+'.mp4')
                  a=['ffmpeg','-hide_banner','-loglevel','error','-filter_complex_threads','8','-loop','1','-framerate','30','-i',base,'-stream_loop','-1','-i',caches[0],'-stream_loop','-1','-i',caches[1],'-filter_complex',graph,'-map','[outv]','-frames:v','600','-an','-c:v','hevc_videotoolbox',*enc,'-g','600','-tag:v','hvc1','-pix_fmt','yuv420p','-fps_mode','cfr','-r','60','-video_track_timescale','60000','-y',out]
                  t=time.perf_counter();run(a);sec=time.perf_counter()-t
                  pr=probe(out); rows[name]={'seconds':round(sec,3),'bytes':out.stat().st_size,'probe':pr}
                  print('VTB_PROFILE',name,json.dumps(rows[name],ensure_ascii=False),flush=True)
              ref=root/'current.mp4'
              for name in profiles:
                  if name=='current':continue
                  p=root/(name+'.mp4')
                  q=subprocess.run(['ffmpeg','-hide_banner','-i',ref,'-i',p,'-lavfi','ssim','-f','null','-'],capture_output=True,text=True)
                  m=re.findall(r'All:([0-9.]+)',q.stderr)
                  print('VTB_SSIM',name,(m[-1] if m else 'NA'),flush=True)
          PY
