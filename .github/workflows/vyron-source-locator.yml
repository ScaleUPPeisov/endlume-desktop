name: VYRON Source Locator

on:
  push:
    branches:
      - diag/vyron-source-locator-20260910

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Locate VYRON 2.0.13 source and archives safely
        shell: bash
        run: |
          set -euo pipefail

          echo "=== VYRON 2.0.13 SOURCE LOCATOR / PASS 2 ==="
          echo "runner=$RUNNER_NAME arch=$RUNNER_ARCH"

          roots=(
            "$HOME/.endlume-local-builder"
            "$(dirname "$RUNNER_WORKSPACE")"
            "$RUNNER_WORKSPACE"
            "$HOME/Desktop"
            "$HOME/Documents"
            "$HOME/Downloads"
            "$HOME/Developer"
            "$HOME/Projects"
            "$HOME/code"
            "$HOME/dev"
          )

          echo "--- exact-ish filename/archive candidates ---"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 10 \
              \( -name Library -o -name .Trash -o -name node_modules -o -name target -o -name dist -o -name build -o -name .git -o -name Pods \) -prune -o \
              -type f \( \
                -iname '*vyron*' -o \
                -iname '*2.0.13*' -o \
                -iname '*2_0_13*' -o \
                -iname '*2-0-13*' -o \
                -iname '*source*.tar.gz' -o \
                -iname '*source*.tgz' -o \
                -iname '*source*.zip' \
              \) -print 2>/dev/null || true
          done | sort -u | head -n 500

          echo "--- directories named like VYRON ---"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 9 \
              \( -name Library -o -name .Trash -o -name node_modules -o -name target -o -name dist -o -name build -o -name .git -o -name Pods \) -prune -o \
              -type d -iname '*vyron*' -print 2>/dev/null || true
          done | sort -u | head -n 300

          echo "--- Tauri manifests identifying VYRON / 2.0.13 ---"
          manifests="$RUNNER_TEMP/vyron-manifests.txt"
          : > "$manifests"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            find "$root" -maxdepth 10 \
              \( -name Library -o -name .Trash -o -name node_modules -o -name target -o -name dist -o -name build -o -name .git -o -name Pods \) -prune -o \
              -type f \( -name package.json -o -name tauri.conf.json -o -name Cargo.toml \) -print 2>/dev/null || true
          done | sort -u > "$manifests"

          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            if grep -Eiq 'vyron|2\.0\.13|com\..*vyron|studio\..*vyron' "$f" 2>/dev/null; then
              case "$(basename "$f")" in
                package.json)
                  meta=$(node -e 'const fs=require("fs"); try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(`name=${p.name||""} version=${p.version||""}`)}catch(e){console.log("unparseable")}' "$f" 2>/dev/null || true)
                  ;;
                tauri.conf.json)
                  meta=$(node -e 'const fs=require("fs"); try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); console.log(`productName=${p.productName||p.package?.productName||""} version=${p.version||p.package?.version||""} identifier=${p.identifier||p.tauri?.bundle?.identifier||""}`)}catch(e){console.log("unparseable")}' "$f" 2>/dev/null || true)
                  ;;
                *) meta="contains VYRON/2.0.13 marker" ;;
              esac
              printf '%s | %s\n' "$f" "$meta"
            fi
          done < "$manifests"

          echo "--- marker source files (paths only) ---"
          for root in "${roots[@]}"; do
            [[ -d "$root" ]] || continue
            grep -RIlE \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.rs' --include='*.json' \
              --exclude='*.env' --exclude='.env*' --exclude='*.pem' --exclude='*.key' --exclude='*.p12' --exclude='*.cer' \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=build --exclude-dir=Library \
              'getChannelScheduleState|humanizeError\(|publishAt|Shorts Factory|Error Center' \
              "$root" 2>/dev/null || true
          done | sort -u | head -n 500

          echo "=== END LOCATOR ==="
