name: ENDLUME 10.0.13 Windows 20-WAV Raw FFmpeg RCA

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1013-windows-20wav-raw-ffmpeg-rca
  cancel-in-progress: true

jobs:
  notice:
    name: Diagnostic RCA only — authoritative gate is Windows Candidate
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: RCA workflow retained for manual diagnostics
        shell: pwsh
        run: |
          Write-Host 'This raw FFmpeg RCA no longer auto-triggers on the 10.0.13 hotfix branch.'
          Write-Host 'Authoritative product gate: endlume-1013-windows-candidate.yml'
