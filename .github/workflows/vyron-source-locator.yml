name: VYRON Source Locator

on:
  push:
    branches:
      - diag/vyron-source-locator-20260910

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4

      - name: Inspect dedicated VYRON workspace
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/Documents/VYRON"
          echo "=== VYRON WORKSPACE INSPECTION ==="
          if [[ ! -d "$ROOT" ]]; then
            echo "VYRON_DIR_MISSING"
            exit 2
          fi

          echo "root=$ROOT"
          echo "--- file tree (safe names only) ---"
          find "$ROOT" -maxdepth 6 \
            \( -name node_modules -o -name target -o -name dist -o -name build -o -name .git -o -name .env -o -name '.env.*' -o -name secrets -o -name credentials \) -prune -o \
            -type f \
            ! -name '*.pem' ! -name '*.key' ! -name '*.p12' ! -name '*.cer' ! -name '*.mobileprovision' \
            -print 2>/dev/null | sort | head -n 1000

          echo "--- git roots ---"
          while IFS= read -r gd; do
            repo="${gd%/.git}"
            printf '%s | branch=%s | head=%s\n' "$repo" "$(git -C "$repo" branch --show-current 2>/dev/null || true)" "$(git -C "$repo" rev-parse HEAD 2>/dev/null || true)"
          done < <(find "$ROOT" -maxdepth 6 -type d -name .git -print 2>/dev/null || true)

          echo "--- package/tauri metadata ---"
          while IFS= read -r f; do
            case "$(basename "$f")" in
              package.json)
                node -e 'const fs=require("fs"); const f=process.argv[1]; try{const p=JSON.parse(fs.readFileSync(f,"utf8")); console.log(`${f} | name=${p.name||""} version=${p.version||""}`)}catch(e){console.log(`${f} | unparseable`)}' "$f" || true
                ;;
              tauri.conf.json)
                node -e 'const fs=require("fs"); const f=process.argv[1]; try{const p=JSON.parse(fs.readFileSync(f,"utf8")); console.log(`${f} | productName=${p.productName||p.package?.productName||""} version=${p.version||p.package?.version||""} identifier=${p.identifier||p.tauri?.bundle?.identifier||""}`)}catch(e){console.log(`${f} | unparseable`)}' "$f" || true
                ;;
              Cargo.toml)
                pkg=$(awk 'BEGIN{s=0} /^\[package\]/{s=1;next} /^\[/{if(s)exit} s && ($1=="name" || $1=="version") {gsub(/^[^=]*=[[:space:]]*/,""); gsub(/\"/,""); printf "%s ",$0}' "$f" 2>/dev/null || true)
                printf '%s | package=%s\n' "$f" "$pkg"
                ;;
            esac
          done < <(find "$ROOT" -maxdepth 8 -type f \( -name package.json -o -name tauri.conf.json -o -name Cargo.toml \) \
            ! -path '*/node_modules/*' ! -path '*/target/*' ! -path '*/dist/*' ! -path '*/build/*' 2>/dev/null | sort)

          echo "--- source markers with line snippets (non-secret source files only) ---"
          matches="$RUNNER_TEMP/vyron-marker-files.txt"
          grep -RIlE \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.rs' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude-dir=build \
            'getChannelScheduleState|humanizeError\(|publishAt|Shorts Factory|Error Center|shorts' \
            "$ROOT" 2>/dev/null | sort -u > "$matches" || true
          cat "$matches"

          echo "--- archive inventory ---"
          find "$ROOT" -maxdepth 8 -type f \( -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.zip' -o -iname '*.tar' \) -print 2>/dev/null | sort | while IFS= read -r a; do
            printf '%s | bytes=%s | sha256=%s\n' "$a" "$(stat -f%z "$a" 2>/dev/null || echo '?')" "$(shasum -a 256 "$a" 2>/dev/null | awk '{print $1}')"
          done

          echo "=== END VYRON WORKSPACE INSPECTION ==="
