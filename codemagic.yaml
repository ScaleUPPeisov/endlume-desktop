workflows:
  endlume-1011-candidate-d76e45f:
    name: ENDLUME 10.0.11 candidate d76e45f macOS Gate A
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'qa/endlume-10.0.11-d76e45f-codemagic'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      node: 22
      xcode: latest
      vars:
        ENDLUME_PRODUCT_HEAD: d76e45f50f7bd474bfa14a9aa6191ccd4344c426
    scripts:
      - name: Prove exact candidate and QA-only delta
        script: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD "$ENDLUME_PRODUCT_HEAD")" = "$ENDLUME_PRODUCT_HEAD"
          while read -r changed; do
            [ -z "$changed" ] && continue
            test "$changed" = "codemagic.yaml" || { echo "ERROR unexpected post-product change: $changed" >&2; exit 1; }
          done < <(git diff --name-only "$ENDLUME_PRODUCT_HEAD"..HEAD)
          echo PRODUCT_HEAD=$ENDLUME_PRODUCT_HEAD

      - name: Stage Apple Silicon FFmpeg sidecars
        script: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Frontend gates
        script: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build

      - name: Rust gates
        script: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build packaged candidate
        script: |
          set -Eeuo pipefail
          export ENDLUME_TAURI_TARGET=aarch64-apple-darwin
          node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          codesign --verify --deep --strict "$APP"
          EXE="$(plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test -x "$APP/Contents/MacOS/$EXE"
          test -x "$APP/Contents/MacOS/ffmpeg"
          test -x "$APP/Contents/MacOS/ffprobe"
          echo PACKAGED_APP=PASS

      - name: Static integration contracts
        script: |
          set -Eeuo pipefail
          grep -F 'selected_effect_id' src-tauri/src/model.rs
          grep -F 'duplicate effect ID' src-tauri/src/queue.rs
          grep -F 'legacy recovery' src-tauri/src/queue.rs
          grep -F 'selectedEffectId' src/pages/ProjectPage.tsx
          grep -F 'selectedEffectByPath' src/store.ts
          grep -F 'despill:e.despill??0.35' src/store.ts
          grep -F 'fast_path_decision(job).reason=="FAST_MULTI_STILL"' src-tauri/src/render.rs
          grep -F 'ambientSettings:st.ambientSettings' src/pages/App.tsx
          grep -F 'ambientSettings})' src/pages/LibraryPage.tsx
          grep -F "recovery-effect-contract" src/components/recovery.tsx
          echo EFFECT_AMBIENT_RECOVERY_CONTRACTS=PASS

    artifacts:
      - src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
