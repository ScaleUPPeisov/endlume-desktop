name: ENDLUME 10.0.14 Publish Stable

on:
  push:
    branches:
      - release-endlume-10.0.14
    paths:
      - 'release/ENDLUME_10.0.14_SIGNED_PASS.json'
      - 'release/ENDLUME_10.0.14_PUBLISH_TRIGGER.md'

permissions:
  contents: write
  actions: read

concurrency:
  group: endlume-1014-publish-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze and exact signed run proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          BASE='55372b94a35ef76ee160347783cf8c62e003fa4e'
          RELEASE_COMMIT='b2d3ea03a3c5ecd0293df83260d0c35f2a54bcc9'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin release-endlume-10.0.14
          test "$(git rev-parse origin/release-endlume-10.0.14)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          git diff --quiet "$BASE" HEAD -- src src-tauri/src
          git diff --quiet "$BASE" HEAD -- src-tauri/icons
          git diff --quiet "$RELEASE_COMMIT" HEAD -- package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          SIGNED_RUN_ID="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_SIGNED_PASS.json"))["signedRunId"])')"
          SIGNED_HEAD="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_SIGNED_PASS.json"))["signedHead"])')"
          SENTINEL_RELEASE_COMMIT="$(python3 -c 'import json;print(json.load(open("release/ENDLUME_10.0.14_SIGNED_PASS.json"))["releaseCommit"])')"
          python3 - release/ENDLUME_10.0.14_SIGNED_PASS.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['version']=='10.0.14' and d['status']=='PASS' and d['packagedSmoke']=='PASS',d
          assert d['functionalSource']=='55372b94a35ef76ee160347783cf8c62e003fa4e',d
          assert d['releaseCommit']=='b2d3ea03a3c5ecd0293df83260d0c35f2a54bcc9',d
          assert d['signatureVerify']=='PASS' and d['vyron']=='PASS' and d['effectsPreview']=='PASS' and d['subscribePreview']=='PASS' and d['realRender']=='PASS',d
          print('SIGNED_SENTINEL=PASS')
          PY
          test "$SENTINEL_RELEASE_COMMIT" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$SIGNED_HEAD" HEAD
          STATUS="$(gh api repos/ScaleUPPeisov/endlume-desktop/actions/runs/$SIGNED_RUN_ID --jq '.status+":"+.conclusion')"
          test "$STATUS" = 'completed:success'
          RUN_HEAD="$(gh api repos/ScaleUPPeisov/endlume-desktop/actions/runs/$SIGNED_RUN_ID --jq .head_sha)"
          test "$RUN_HEAD" = "$SIGNED_HEAD"
          echo "SIGNED_RUN_ID=$SIGNED_RUN_ID" >> "$GITHUB_ENV"
          echo "SIGNED_HEAD=$SIGNED_HEAD" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          echo FUNCTIONAL_PRODUCT_DIFF=0
          echo SIGNED_RUN_EXACT=PASS

      - name: Download exact signed candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ART="$RUNNER_TEMP/endlume-1014-signed"
          RB="$RUNNER_TEMP/ENDLUME-10.0.13-STABLE-ROLLBACK"
          mkdir -p "$ART" "$RB"
          gh run download "$SIGNED_RUN_ID" --repo ScaleUPPeisov/endlume-desktop --name 'ENDLUME-10.0.14-PHASE4-SIGNED-MACOS-ARM64' --dir "$ART"
          test -s "$ART/ENDLUME-10.0.14-release.json"
          python3 - "$ART/ENDLUME-10.0.14-release.json" "$SIGNED_HEAD" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); head=sys.argv[2]
          assert d['releaseHead']==head,(d.get('releaseHead'),head)
          assert d['releaseVersion']=='10.0.14'
          assert d['functionalSourceHead']=='55372b94a35ef76ee160347783cf8c62e003fa4e'
          assert d['functionalProductDiff']==0
          assert d['signatureVerify']=='PASS' and d['packagedSmoke']=='PASS'
          print('SIGNED_ARTIFACT_RELEASE_HEAD=PASS')
          PY
          echo "PHASE4_ARTIFACT_DIR=$ART" >> "$GITHUB_ENV"
          echo "ROLLBACK_DIR=$RB" >> "$GITHUB_ENV"

      - name: Back up live state and publish 10.0.14 rollback-safe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          bash scripts/phase4_publish_1014_recovery.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.13-STABLE-ROLLBACK
          path: ${{ env.ROLLBACK_DIR }}
          if-no-files-found: error
          retention-days: 60

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ENDLUME-10.0.14-PUBLISH-EVIDENCE
          path: |
            ${{ env.PHASE4_ARTIFACT_DIR }}/live-latest.json
            ${{ env.PHASE4_ARTIFACT_DIR }}/LIVE_ARTIFACT_SHA256.txt
            ${{ env.PHASE4_ARTIFACT_DIR }}/ENDLUME-10.0.14-release.json
          if-no-files-found: error
          retention-days: 60

      - name: Publish live-stable sentinel for real updater gate
        if: success()
        shell: bash
        env:
          CHAIN_TOKEN: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${CHAIN_TOKEN:-}"
          LIVE_SHA="$(cat "$PHASE4_ARTIFACT_DIR/LIVE_ARTIFACT_SHA256.txt")"
          cat > release/ENDLUME_10.0.14_PUBLISH_PASS.json <<EOF
          {
            "version": "10.0.14",
            "functionalSource": "55372b94a35ef76ee160347783cf8c62e003fa4e",
            "releaseCommit": "$RELEASE_COMMIT",
            "signedRunId": "$SIGNED_RUN_ID",
            "publishRunId": "$GITHUB_RUN_ID",
            "publishHead": "$GITHUB_SHA",
            "liveArtifactSha256": "$LIVE_SHA",
            "liveLatestVersion": "10.0.14",
            "status": "PASS_PENDING_REAL_UPDATER"
          }
          EOF
          git config user.name 'ENDLUME Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add release/ENDLUME_10.0.14_PUBLISH_PASS.json
          git commit -m 'release(10.0.14): stable published pending updater acceptance'
          git remote set-url origin "https://x-access-token:${CHAIN_TOKEN}@github.com/ScaleUPPeisov/endlume-desktop.git"
          git push origin HEAD:release-endlume-10.0.14
          echo PUBLISH_RUN_ID="$GITHUB_RUN_ID"
          echo LIVE_ARTIFACT_SHA256="$LIVE_SHA"
