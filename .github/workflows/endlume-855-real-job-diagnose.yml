name: ENDLUME 8.55 Real Job Diagnose
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Probe exact overlay schedule and render sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          FFP="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          if ! test -x "$FFP"; then FFP="$(command -v ffprobe)"; fi
          ROOT="$(find /Volumes -maxdepth 10 -type d -path "*${UUID}*/Neon Drive FM_BATCH_2026-09-05_001" -print -quit 2>/dev/null || true)"
          echo "ROOT=$ROOT"
          if test -n "$ROOT"; then
            SIDE="$(find "$ROOT/Rendered/logs" -type f -name '*project.json' -print -quit 2>/dev/null || true)"
            echo "SIDECAR=$SIDE"
            if test -f "$SIDE"; then cat "$SIDE"; fi
          fi
          LIB="$HOME/Library/Application Support/studio.endlume.desktop/library.json"
          test -f "$LIB"
          python3 - "$LIB" "$FFP" <<'PY'
          import json,subprocess,sys,os
          lib,ffp=sys.argv[1:]
          d=json.load(open(lib))
          for kind in ('effects','subscribes'):
              print('---',kind,'---')
              for x in d.get(kind,[]):
                  e=x.get('effect',x)
                  if not e.get('enabled'): continue
                  src=e.get('source','')
                  q=subprocess.run([ffp,'-v','error','-show_entries','format=duration:stream=avg_frame_rate,width,height,codec_name','-of','json',src],capture_output=True,text=True)
                  print(json.dumps({'kind':kind,'name':e.get('name'),'mode':e.get('mode'),'start':e.get('startSec'),'end':e.get('endSec'),'repeat':x.get('repeatEverySec'),'first':x.get('firstAtSec'),'second':x.get('secondAtSec'),'src':src,'probe':json.loads(q.stdout or '{}')},ensure_ascii=False))
          PY
