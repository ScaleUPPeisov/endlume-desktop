name: ENDLUME self-hosted Cloudflare release

on:
  push:
    branches: [release]
    paths:
      - 'updates/cloudflare/build-request.json'
  workflow_dispatch:

jobs:
  macos:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, 'updates/cloudflare/build-request.json') || contains(github.event.head_commit.added, 'updates/cloudflare/build-request.json') }}
    runs-on: [self-hosted, endlume, macos, arm64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Read request
        id: request
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('updates/cloudflare/build-request.json'))
          print(f"enabled={str(bool(p.get('enabled'))).lower()}")
          print(f"version={p.get('version','')}")
          print(f"builder={p.get('builder','')}")
          print(f"platform={'true' if 'darwin-aarch64' in p.get('platforms',[]) else 'false'}")
          PY
      - name: Build and publish macOS
        if: ${{ steps.request.outputs.enabled == 'true' && steps.request.outputs.platform == 'true' }}
        shell: bash
        run: bash scripts/selfhosted-release-macos.sh

  windows:
    runs-on: [self-hosted, endlume, windows, x64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Read request
        id: request
        shell: pwsh
        run: |
          $r = Get-Content 'updates/cloudflare/build-request.json' -Raw | ConvertFrom-Json
          "enabled=$($r.enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$($r.version)" >> $env:GITHUB_OUTPUT
          "builder=$($r.builder)" >> $env:GITHUB_OUTPUT
          $has = $r.platforms -contains 'windows-x86_64'
          "platform=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Build and publish Windows
        if: ${{ steps.request.outputs.enabled == 'true' && steps.request.outputs.platform == 'true' }}
        shell: pwsh
        run: ./scripts/selfhosted-release-windows.ps1
