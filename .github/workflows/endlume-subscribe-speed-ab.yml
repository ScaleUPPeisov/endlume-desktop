name: ENDLUME Subscribe 3h same-runner speed A/B

on:
  push:
    branches: [qa/endlume-a7a-speed-only]

permissions:
  contents: read

jobs:
  speed-ab:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Assert exact a7a candidate and add QA-only early receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD^)" = a7a399e83de8b9248e2065c6dda1f9079ded6565
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/acceptance.rs');s=p.read_text()
          anchor='''let output_duration=metadata.get("format").and_then(|v|v.get("duration")).and_then(|v|v.as_str()).and_then(|v|v.parse::<f64>().ok()).unwrap_or(0.0);let decode=full_decode(app,&result).await?;'''
          insert='''let output_duration=metadata.get("format").and_then(|v|v.get("duration")).and_then(|v|v.as_str()).and_then(|v|v.parse::<f64>().ok()).unwrap_or(0.0);\n  if env_enabled("ENDLUME_ACCEPTANCE_SPEED_ONLY"){let captured=events.lock().clone();let fallback=captured.iter().rev().find(|e|e.get("event").and_then(Value::as_str)==Some("engine-fast-fallback")).and_then(|e|e.get("payload")).cloned();let final_fast=captured.iter().rev().find(|e|e.get("event").and_then(Value::as_str)==Some("engine-fast-path")&&e.get("payload").and_then(|p|p.get("totalMs")).is_some()).and_then(|e|e.get("payload")).cloned();return Ok(json!({"source_head":std::env::var("ENDLUME_SOURCE_HEAD").unwrap_or_default(),"platform":std::env::consts::OS,"arch":std::env::consts::ARCH,"project_id":job.project.id,"track_count":job.project.audio.len(),"fast_path_used":fast_used,"legacy_fallback_used":!fast_used,"fallback":fallback,"fast_metrics":final_fast,"events":captured,"export_seconds":export_seconds,"output_path":result,"output_bytes":bytes,"output_duration":output_duration,"probe":metadata}));}\n  let decode=full_decode(app,&result).await?;'''
          assert s.count(anchor)==1,s.count(anchor)
          p.write_text(s.replace(anchor,insert))
          PY
          git diff --check
          git diff -- src-tauri/src/acceptance.rs

      - name: Prepare toolchain and sidecars
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm run build

      - name: Build baseline actual app
        shell: bash
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"; test -d "$APP"
          cp -R "$APP" "$RUNNER_TEMP/ENDLUME-baseline.app"
          test -x "$RUNNER_TEMP/ENDLUME-baseline.app/Contents/MacOS/endlume"

      - name: Patch only realtime flag and incrementally build A/B app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/fast_render.rs');s=p.read_text()
          old='"-c:v","hevc_videotoolbox","-realtime","1","-prio_speed","1","-power_efficient","0"'
          new='"-c:v","hevc_videotoolbox","-realtime","0","-prio_speed","1","-power_efficient","0"'
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- src-tauri/src/fast_render.rs
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"; test -d "$APP"
          cp -R "$APP" "$RUNNER_TEMP/ENDLUME-rt0.app"
          test -x "$RUNNER_TEMP/ENDLUME-rt0.app/Contents/MacOS/endlume"

      - name: Generate physical 3-hour workload quickly
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/speed-ab"; MEDIA="$ROOT/project"; FX="$ROOT/effects"; mkdir -p "$MEDIA" "$FX" "$ROOT/out-rt0" "$ROOT/out-base"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"; echo "FX=$FX" >> "$GITHUB_ENV"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$MEDIA/cover.png"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$MEDIA/track-01.mp3"
          for i in $(seq -w 2 12); do cp "$MEDIA/track-01.mp3" "$MEDIA/track-${i}.mp3"; done
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x00ff00:s=640x360:r=60:d=3" -f lavfi -i "color=c=white:s=180x100:r=60:d=3" -filter_complex "[0:v][1:v]overlay=x='70+300*t/3':y='120+45*sin(2*PI*t/3)':eval=frame:shortest=1" -an -c:v libx264 -preset ultrafast -g 180 -pix_fmt yuv420p -r 60 -y "$FX/subscribe.mp4"
          python3 - <<'PY'
          import glob,json,os
          r=os.environ['ROOT'];m=os.environ['MEDIA'];f=os.environ['FX']
          sub={'id':'subscribe','name':'Subscribe Animated 3s','source':os.path.join(f,'subscribe.mp4'),'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.12,'blend':0.08,'despill':1.0,'lumaThreshold':0.10,'lumaTolerance':0.05,'saturation':1.0,'x':0.15,'y':0.65,'scale':0.30,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':None,'firstAtSec':600.0,'secondAtSec':3600.0,'repeatEverySec':3600.0}
          base={'project':{'id':'speed-ab','name':'Speed AB','path':m,'media':[os.path.join(m,'cover.png')],'audio':sorted(glob.glob(os.path.join(m,'track-*.mp3'))),'valid':True,'error':None},'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':30.0,'durationHours':3.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':'','preset':'fast','encoderPreference':'auto'},'effects':[],'subscribes':[sub],'ambient':None}
          for kind in ['rt0','base']:
            j=json.loads(json.dumps(base));j['project']['id']='speed-'+kind;j['project']['name']='Speed '+kind;j['settings']['outputDir']=os.path.join(r,'out-'+kind);json.dump(j,open(os.path.join(r,'job-'+kind+'.json'),'w'),indent=2)
          PY
          du -sh "$MEDIA"

      - name: Run realtime0 first on cold workload
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/ENDLUME-rt0.app/Contents/MacOS/endlume"
          ENDLUME_ACCEPTANCE_SPEED_ONLY=1 ENDLUME_ACCEPTANCE_JOB="$ROOT/job-rt0.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/rt0.json" ENDLUME_SOURCE_HEAD="a7a399e+realtime0" "$BIN" > "$ROOT/rt0.log" 2>&1
          cat "$ROOT/rt0.json"

      - name: Run baseline second with warm-cache advantage
        shell: bash
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/ENDLUME-baseline.app/Contents/MacOS/endlume"
          ENDLUME_ACCEPTANCE_SPEED_ONLY=1 ENDLUME_ACCEPTANCE_JOB="$ROOT/job-base.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/base.json" ENDLUME_SOURCE_HEAD="a7a399e-baseline" "$BIN" > "$ROOT/base.log" 2>&1
          cat "$ROOT/base.json"

      - name: Same-runner A/B verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          r=os.environ['ROOT'];rt=json.load(open(os.path.join(r,'rt0.json')))['result'];ba=json.load(open(os.path.join(r,'base.json')))['result']
          def valid(x):
            ss=x['probe']['streams'];v=next(q for q in ss if q.get('codec_type')=='video');a=next(q for q in ss if q.get('codec_type')=='audio');return x.get('fast_path_used') is True and not x.get('legacy_fallback_used') and abs(x['output_duration']-10800)<=.1 and 400<=x['output_bytes']/1e6<=600 and v.get('codec_name')=='hevc' and (v.get('width'),v.get('height'))==(1920,1080) and v.get('r_frame_rate')=='60/1' and a.get('codec_name')=='mp3'
          report={'rt0_seconds':rt['export_seconds'],'baseline_seconds':ba['export_seconds'],'rt0_fast_ms':rt.get('fast_metrics',{}).get('totalMs'),'baseline_fast_ms':ba.get('fast_metrics',{}).get('totalMs'),'rt0_valid':valid(rt),'baseline_valid':valid(ba),'rt0_under_10':rt['export_seconds']<=10.0,'baseline_under_10':ba['export_seconds']<=10.0,'rt0_faster':rt['export_seconds']<ba['export_seconds']}
          print(json.dumps(report,indent=2));json.dump(report,open(os.path.join(r,'verdict.json'),'w'),indent=2)
          assert report['rt0_valid'] and report['baseline_valid'],report
          print('SAME_RUNNER_AB_COMPLETE=1')
          PY

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscribe-3h-speed-ab
          path: |
            ${{ env.ROOT }}/rt0.json
            ${{ env.ROOT }}/base.json
            ${{ env.ROOT }}/verdict.json
            ${{ env.ROOT }}/rt0.log
            ${{ env.ROOT }}/base.log
          retention-days: 7
