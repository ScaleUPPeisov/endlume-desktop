name: Build MusicForge AI v0.3 for Mac M1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/musicforge-v03-mac.yml'
      - 'musicforge-v02-build/**'

jobs:
  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild v0.2 source
        run: |
          cat musicforge-v02-build/chunks/*.txt > /tmp/musicforge-source.b64
          python3 - <<'PY'
          import base64, pathlib
          src=pathlib.Path('/tmp/musicforge-source.b64').read_text().strip()
          pathlib.Path('/tmp/musicforge-v02.zip').write_bytes(base64.b64decode(src, validate=True))
          PY
          unzip -q /tmp/musicforge-v02.zip
      - name: Apply v0.3 source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('musicforge-v0.2-src')
          p=root/'package.json'; s=p.read_text(); p.write_text(s.replace('"version": "0.2.0"','"version": "0.3.0"'))
          p=root/'preload.js'; s=p.read_text(); s=s.replace("  openEngineFolder: () => ipcRenderer.invoke('open:engine-folder')\n", "  openEngineFolder: () => ipcRenderer.invoke('open:engine-folder'),\n  checkUpdate: () => ipcRenderer.invoke('update:check'),\n  downloadUpdate: () => ipcRenderer.invoke('update:download'),\n  installUpdate: () => ipcRenderer.invoke('update:install'),\n  onUpdateEvent: (callback) => { const listener = (_event, payload) => callback(payload); ipcRenderer.on('update:event', listener); return () => ipcRenderer.removeListener('update:event', listener); }\n") ; p.write_text(s)
          p=root/'main.js'; s=p.read_text()
          s=s.replace("const { app, BrowserWindow, ipcMain, dialog, shell, net } = require('electron');", "const { app, BrowserWindow, ipcMain, dialog, shell, net, Notification } = require('electron');")
          s=s.replace("const ACE_URL = `https://github.com/ace-step/ACE-Step-1.5/archive/${ACE_COMMIT}.zip`;", "const ACE_URL = `https://github.com/ace-step/ACE-Step-1.5/archive/${ACE_COMMIT}.zip`;\nconst UPDATE_MANIFEST_URL = 'https://raw.githubusercontent.com/ScaleUPPeisov/scaleup-dashboards/main/musicforge-updates/latest.json';")
          s=s.replace("let currentInstall = { stage: 'idle', progress: 0, message: '' };", "let currentInstall = { stage: 'idle', progress: 0, message: '' };\nlet latestUpdate = null; let downloadedUpdate = null; let updateCheckTimer = null;")
          s=s.replace("function generationEvent(stage, progress, message, detail = '') {\n  send('generation:event', { stage, progress, message, detail });\n}\n", "function generationEvent(stage, progress, message, detail = '') { send('generation:event', { stage, progress, message, detail }); }\nfunction updateEvent(stage, progress, message, detail = '', payload = {}) { send('update:event', { stage, progress, message, detail, ...payload }); }\nfunction parseVersion(v='0.0.0'){return String(v).replace(/^v/i,'').split('.').slice(0,3).map(n=>Number(String(n).replace(/\\D.*$/,''))||0)}\nfunction isNewerVersion(remote,local){const a=parseVersion(remote),b=parseVersion(local);for(let i=0;i<3;i++){if(a[i]!==b[i]) return a[i]>b[i]}return false}\nfunction updateDir(){const dir=path.join(rootDir(),'updates');fs.mkdirSync(dir,{recursive:true});return dir}\n")
          s=s.replace("      installEvent('starting', 92, 'Запускаем локальный AI-сервер…');\n      await startEngine();\n      installEvent('ready', 100, 'AI-движок готов', 'Первая генерация докачает модель (~5–10 ГБ)');", "      installEvent('starting', 90, 'Запускаем локальный AI-сервер…'); await startEngine();\n      installEvent('warmup', 94, 'Подготавливаем быстрый Preview…', 'Один раз загружаем и прогреваем музыкальную модель.');\n      try { await warmupFastPreview(); } catch (e) { installEvent('warmup', 98, 'AI установлен', 'Preview прогреется при первом запуске: ' + String(e.message || e).slice(0, 140)); }\n      installEvent('ready', 100, 'AI-движок готов', 'Быстрый Preview 10–15 сек доступен без Terminal');")
          marker="async function generateSong(input = {}) {\n"
          helpers="""function quickPreviewProfile(){const lowMemory=ramGB()<=9;return {duration:lowMemory?10:15,steps:lowMemory?3:4}}\nfunction makePreviewLyrics(prompt=''){const topic=safeName(prompt.split(/[,.!?]/)[0]).slice(0,42)||'эта ночь';return `[Verse]\\n${topic}, я слышу этот ритм внутри\\nИ город держит свет до самой зари\\n\\n[Chorus]\\n${topic}, веди меня вперёд\\nПусть эта музыка сегодня оживёт`;}\nasync function warmupFastPreview(){const marker=path.join(engineRoot(),'preview-ready.json');if(exists(marker)) return true;await startEngine();const created=await postJson('/release_task',{prompt:'clean modern pop instrumental, warm synths, tight drums, original melody',model:'acestep-v15-turbo',audio_format:'mp3',audio_duration:10,inference_steps:1,use_random_seed:true,batch_size:1,lyrics:'',thinking:false,use_cot_caption:false,use_cot_language:false,vocal_language:'ru'});const taskId=created?.data?.task_id;if(!taskId) throw new Error('Не удалось запустить прогрев модели.');await waitTask(taskId,1,1);writeJSON(marker,{ready:true,at:new Date().toISOString()});return true;}\n\n"""
          s=s.replace(marker,helpers+marker)
          s=s.replace("  const requestedDuration = Math.max(20, Math.min(600, Number(input.duration || 60)));\n  const requestedVariants = Math.max(1, Math.min(4, Number(input.variants || 1)));", "  const preview=!!input.preview; const previewProfile=quickPreviewProfile();\n  const requestedDuration=preview?previewProfile.duration:Math.max(20,Math.min(600,Number(input.duration||60)));\n  const requestedVariants=preview?1:Math.max(1,Math.min(4,Number(input.variants||1)));")
          s=s.replace("      inference_steps: 8,", "      inference_steps: preview ? previewProfile.steps : 8,")
          old="""    if (input.lyricsMode === 'instrumental') {\n      body.prompt += '. Instrumental only, absolutely no singing or spoken voice.';\n      body.lyrics = '';\n      body.thinking = false;\n    } else if (input.lyricsMode === 'custom') {\n      body.lyrics = String(input.lyrics || '').trim();\n      if (!body.lyrics) throw new Error('Добавь текст песни или выбери «Создать AI».');\n      body.use_format = true;\n      body.thinking = true;\n    } else {\n      body.sample_query = `${prompt}. ${input.vocal === 'male' ? 'Мужской вокал.' : input.vocal === 'female' ? 'Женский вокал.' : ''} Напиши оригинальный русский текст и создай полноценную песню по этому описанию.`;\n      body.thinking = true;\n    }\n"""
          new="""    if (preview) {\n      body.thinking=false; body.use_cot_caption=false; body.use_cot_language=false;\n      if(input.lyricsMode==='instrumental'){body.prompt += '. Instrumental only, absolutely no singing or spoken voice.';body.lyrics='';}\n      else {body.lyrics=input.lyricsMode==='custom'&&String(input.lyrics||'').trim()?String(input.lyrics).trim().split('\\n').slice(0,10).join('\\n'):makePreviewLyrics(prompt);body.prompt += '. Short preview with a clear vocal hook and immediate chorus energy.';}\n    } else if (input.lyricsMode === 'instrumental') {\n      body.prompt += '. Instrumental only, absolutely no singing or spoken voice.'; body.lyrics=''; body.thinking=false;\n    } else if (input.lyricsMode === 'custom') {\n      body.lyrics=String(input.lyrics||'').trim(); if(!body.lyrics) throw new Error('Добавь текст песни или выбери «Создать AI».'); body.use_format=true; body.thinking=true;\n    } else {\n      body.sample_query=`${prompt}. ${input.vocal==='male'?'Мужской вокал.':input.vocal==='female'?'Женский вокал.':''} Напиши оригинальный русский текст и создай полноценную песню по этому описанию.`; body.thinking=true;\n    }\n"""
          s=s.replace(old,new)
          updater="""\nasync function checkForUpdates({notify=false}={}){try{const response=await net.fetch(`${UPDATE_MANIFEST_URL}?t=${Date.now()}`,{headers:{'Cache-Control':'no-cache'}});if(!response.ok) throw new Error(`HTTP ${response.status}`);const manifest=await response.json();if(!manifest?.version) throw new Error('Некорректный manifest обновления.');const available=isNewerVersion(manifest.version,app.getVersion());latestUpdate=available?manifest:null;if(available){updateEvent('available',0,`Доступна версия ${manifest.version}`,manifest.notes||'Есть новое обновление.',{manifest});if(notify&&Notification.isSupported()){const n=new Notification({title:'MusicForge AI — доступно обновление',body:`Версия ${manifest.version}. Открой приложение и нажми «Обновить».`});n.show();}}else updateEvent('current',100,'Установлена последняя версия',`MusicForge AI ${app.getVersion()}`);return {available,currentVersion:app.getVersion(),manifest:available?manifest:null};}catch(error){updateEvent('error',0,'Не удалось проверить обновления',String(error.message||error));return {available:false,currentVersion:app.getVersion(),error:String(error.message||error)}}}\nasync function downloadLatestUpdate(){if(!latestUpdate){const c=await checkForUpdates();if(!c.available) throw new Error(c.error||'Новых обновлений нет.');}const manifest=latestUpdate,parts=Array.isArray(manifest.parts)?manifest.parts:[];if(!parts.length) throw new Error('В manifest нет файлов обновления.');const dir=path.join(updateDir(),`v${manifest.version}`);await fsp.rm(dir,{recursive:true,force:true});fs.mkdirSync(dir,{recursive:true});const zipPath=path.join(dir,'MusicForge-update.zip'),out=fs.createWriteStream(zipPath),hash=crypto.createHash('sha256');let done=0;try{for(let i=0;i<parts.length;i++){updateEvent('downloading',Math.round((i/parts.length)*90),`Скачиваем обновление ${manifest.version}`,`Файл ${i+1}/${parts.length}`);const response=await net.fetch(parts[i],{redirect:'follow'});if(!response.ok) throw new Error(`Не удалось скачать часть ${i+1}: HTTP ${response.status}`);const buf=Buffer.from(await response.arrayBuffer());hash.update(buf);if(!out.write(buf)) await new Promise(r=>out.once('drain',r));done+=buf.length;updateEvent('downloading',Math.round(((i+1)/parts.length)*90),`Скачиваем обновление ${manifest.version}`,`${(done/1024/1024).toFixed(1)} МБ`);}}finally{await new Promise(r=>out.end(r));}const digest=hash.digest('hex');if(manifest.sha256&&digest!==manifest.sha256){await fsp.rm(zipPath,{force:true});throw new Error('Контрольная сумма обновления не совпала.');}const extractDir=path.join(dir,'extracted');fs.mkdirSync(extractDir,{recursive:true});updateEvent('extracting',94,'Распаковываем обновление…','Проверяем приложение');await run('/usr/bin/ditto',['-x','-k',zipPath,extractDir]);const appPath=path.join(extractDir,'MusicForge AI.app');if(!exists(appPath)) throw new Error('В обновлении не найден MusicForge AI.app.');await stripQuarantine(appPath);downloadedUpdate={version:manifest.version,appPath,zipPath};updateEvent('ready',100,`Версия ${manifest.version} готова`,'Нажми «Установить и перезапустить»');return {ok:true,version:manifest.version};}\nasync function installDownloadedUpdate(){if(!downloadedUpdate?.appPath||!exists(downloadedUpdate.appPath)) throw new Error('Сначала скачай обновление.');const currentApp=path.resolve(path.dirname(process.execPath),'../../..');if(!currentApp.endsWith('.app')) throw new Error('Автоустановка доступна только из установленного .app.');const helper=path.join(os.tmpdir(),`musicforge-update-${Date.now()}.sh`);const script=`#!/bin/bash\\nset -e\\nsleep 2\\nCURRENT=${JSON.stringify(currentApp)}\\nNEWAPP=${JSON.stringify(downloadedUpdate.appPath)}\\nBACKUP=\\"${currentApp}.old\\"\\nrm -rf \\"$BACKUP\\"\\nif [ -e \\"$CURRENT\\" ]; then mv \\"$CURRENT\\" \\"$BACKUP\\"; fi\\n/usr/bin/ditto \\"$NEWAPP\\" \\"$CURRENT\\"\\n/usr/bin/xattr -cr \\"$CURRENT\\" 2>/dev/null || true\\n/usr/bin/open \\"$CURRENT\\"\\nsleep 2\\nrm -rf \\"$BACKUP\\"\\nrm -- \\"$0\\"\\n`;await fsp.writeFile(helper,script,{mode:0o755});const child=spawn('/bin/bash',[helper],{detached:true,stdio:'ignore'});child.unref();setTimeout(()=>app.quit(),250);return {ok:true};}\n\n"""
          s=s.replace("function createWindow() {\n",updater+"function createWindow() {\n")
          s=s.replace("  mainWindow.loadFile(path.join(__dirname, 'renderer', 'index.html'));\n  mainWindow.setMenuBarVisibility(false);", "  mainWindow.loadFile(path.join(__dirname, 'renderer', 'index.html')); mainWindow.webContents.once('did-finish-load',()=>setTimeout(()=>checkForUpdates({notify:true}),1800));\n  mainWindow.setMenuBarVisibility(false);")
          s=s.replace("  createWindow();\n  app.on('activate'", "  createWindow(); updateCheckTimer=setInterval(()=>checkForUpdates({notify:true}),30*60*1000);\n  app.on('activate'")
          s=s.replace("app.on('before-quit', () => {\n  try", "app.on('before-quit', () => { if(updateCheckTimer) clearInterval(updateCheckTimer);\n  try")
          s += "\nipcMain.handle('update:check',()=>checkForUpdates()); ipcMain.handle('update:download',()=>downloadLatestUpdate()); ipcMain.handle('update:install',()=>installDownloadedUpdate());\n"
          p.write_text(s)
          p=root/'renderer/index.html'; s=p.read_text(); s=s.replace('<div class="top-actions"><span class="chip">Apple Silicon</span><span class="chip accent">∞ без кредитов</span></div>','<div class="top-actions"><button class="update-chip hidden" id="updateTopBtn">↻ Обновление</button><span class="chip">Apple Silicon</span><span class="chip accent">∞ без кредитов</span></div>'); s=s.replace('<button class="generate" id="generateBtn"><span>✦</span><div><b>Создать песню</b><small>локальная генерация • без кредитов</small></div></button>','<div class="generate-actions"><button class="preview-generate" id="previewBtn"><span>▶</span><div><b>Быстрый Preview</b><small>10–15 сек • Turbo • быстрее на M1</small></div></button><button class="generate" id="generateBtn"><span>✦</span><div><b>Создать полную песню</b><small>максимальное качество • локально</small></div></button></div>'); s=s.replace('Версия <b id="appVersion">0.2.0</b>','Версия <b id="appVersion">0.3.0</b>'); s=s.replace('<span class="badge">v0.2</span>','<span class="badge">v0.3</span>');
          old='<section class="page" id="page-settings"><div class="settings-grid"><div class="glass settings-card"><h3>Генерация</h3><label>Формат экспорта<select id="settingFormat"><option value="wav">WAV</option><option value="mp3">MP3</option></select></label><label>Длительность по умолчанию<select id="settingDuration"><option value="60">1 минута</option><option value="120">2 минуты</option><option value="180">3 минуты</option><option value="240">4 минуты</option></select></label><label class="toggle-line"><span>Автосохранение проектов</span><input id="settingAutosave" type="checkbox" checked></label><button class="primary" id="saveSettings">Сохранить настройки</button></div><div class="glass settings-card"><h3>Хранилище</h3><p>Проекты и настройки сохраняются локально в папке приложения.</p><button class="ghost" id="openData">Открыть папку данных</button></div></div></section>'
          new='<section class="page" id="page-settings"><div class="settings-grid"><div class="glass settings-card"><h3>Генерация</h3><label>Формат экспорта<select id="settingFormat"><option value="wav">WAV</option><option value="mp3">MP3</option></select></label><label>Длительность по умолчанию<select id="settingDuration"><option value="60">1 минута</option><option value="120">2 минуты</option><option value="180">3 минуты</option><option value="240">4 минуты</option></select></label><label class="toggle-line"><span>Автосохранение проектов</span><input id="settingAutosave" type="checkbox" checked></label><button class="primary" id="saveSettings">Сохранить настройки</button></div><div class="glass settings-card"><h3>Обновления</h3><p id="updateText">Проверка выполняется автоматически при запуске.</p><div class="mini-progress hidden" id="updateProgress"><i id="updateProgressBar"></i></div><div class="update-actions"><button class="ghost" id="checkUpdate">Проверить</button><button class="primary hidden" id="downloadUpdate">Скачать обновление</button><button class="primary hidden" id="installUpdate">Установить и перезапустить</button></div></div><div class="glass settings-card"><h3>Хранилище</h3><p>Проекты и настройки сохраняются локально в папке приложения.</p><button class="ghost" id="openData">Открыть папку данных</button></div></div></section>'
          s=s.replace(old,new); p.write_text(s)
          p=root/'renderer/styles.css'; s=p.read_text()+"\n.generate-actions{display:grid;grid-template-columns:.82fr 1.18fr;gap:10px;margin-top:18px}.preview-generate{min-height:64px;border:1px solid rgba(141,93,255,.5);border-radius:15px;background:linear-gradient(135deg,rgba(114,62,218,.22),rgba(32,34,44,.85));color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left;cursor:pointer}.preview-generate b{display:block}.preview-generate small{display:block;color:var(--muted);font-size:10px}.update-chip{border:1px solid rgba(154,102,255,.55);background:rgba(122,68,220,.16);color:#e9dcff;border-radius:999px;padding:8px 12px;font-size:11px;cursor:pointer}.update-actions{display:flex;gap:8px;flex-wrap:wrap}.update-actions button{flex:1;min-width:110px}\n"; p.write_text(s)
          p=root/'renderer/app.js'; s=p.read_text(); s=s.replace("async function generate() {","async function generate(preview=false) {"); s=s.replace("  const params = generationParams();","  const params = { ...generationParams(), preview };"); s=s.replace("  $('#generateBtn').disabled = true;\n  $('#generateBtn').classList.add('busy');","  $('#generateBtn').disabled=true; $('#previewBtn').disabled=true;\n  $('#generateBtn').classList.add('busy');"); s=s.replace("  generationStatus(true, 'Подготавливаем генерацию…', 'Локальный ACE-Step запускается', 2);","  generationStatus(true, preview?'Готовим быстрый Preview…':'Подготавливаем полную генерацию…', preview?'10–15 секунд • Turbo • облегчённый режим для M1':'Локальный ACE-Step запускается', 2);"); s=s.replace("    $('#generateBtn').disabled = false;\n    $('#generateBtn').classList.remove('busy');","    $('#generateBtn').disabled=false; $('#previewBtn').disabled=false;\n    $('#generateBtn').classList.remove('busy');"); s=s.replace("  $('#generateBtn').addEventListener('click', generate);","  $('#generateBtn').addEventListener('click',()=>generate(false)); $('#previewBtn').addEventListener('click',()=>generate(true));\n  $('#checkUpdate').addEventListener('click',()=>window.musicforge.checkUpdate()); $('#updateTopBtn').addEventListener('click',()=>navigate('settings')); $('#downloadUpdate').addEventListener('click',()=>window.musicforge.downloadUpdate()); $('#installUpdate').addEventListener('click',()=>window.musicforge.installUpdate());"); s=s.replace("['uv-download','uv-extract','repo-download','repo-extract','python','dependencies','starting']","['uv-download','uv-extract','repo-download','repo-extract','python','dependencies','starting','warmup']"); s=s.replace("  window.musicforge.onGenerationEvent(evt => {\n    generationStatus(true, evt.message || 'Генерация…', evt.detail || '', evt.progress || 0);\n  });","  window.musicforge.onGenerationEvent(evt=>generationStatus(true,evt.message||'Генерация…',evt.detail||'',evt.progress||0));\n  window.musicforge.onUpdateEvent(evt=>{if(evt.manifest) state.updateManifest=evt.manifest; const a=evt.stage==='available',r=evt.stage==='ready'; $('#updateTopBtn').classList.toggle('hidden',!(a||r||state.updateManifest)); $('#updateText').textContent=evt.detail||evt.message||''; $('#updateProgress').classList.toggle('hidden',!['downloading','extracting'].includes(evt.stage)); $('#updateProgressBar').style.width=`${evt.progress||0}%`; $('#downloadUpdate').classList.toggle('hidden',!a); $('#installUpdate').classList.toggle('hidden',!r); if(a) toast(`Доступно обновление ${evt.manifest?.version||''}`,4000);});"); s=s.replace("    $('#appVersion').textContent = info.version || '0.2.0';","    $('#appVersion').textContent = info.version || '0.3.0';"); p.write_text(s)
          PY
      - name: Verify JavaScript syntax
        working-directory: musicforge-v0.2-src
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: musicforge-v0.2-src
        run: npm install --no-audit --no-fund
      - name: Build macOS icon
        working-directory: musicforge-v0.2-src
        run: |
          python3 -m venv /tmp/musicforge-icon-venv
          /tmp/musicforge-icon-venv/bin/python -m pip install --disable-pip-version-check cairosvg
          /tmp/musicforge-icon-venv/bin/python scripts/make_icon.py
          iconutil -c icns assets/AppIcon.iconset -o assets/icon.icns
      - name: Package app
        working-directory: musicforge-v0.2-src
        run: npm run package:mac
      - name: Verify ARM64 and sign
        working-directory: musicforge-v0.2-src
        run: |
          APP_PATH="dist/MusicForge AI-darwin-arm64/MusicForge AI.app"
          file "$APP_PATH/Contents/MacOS/MusicForge AI" | grep -q arm64
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Zip
        working-directory: musicforge-v0.2-src
        run: |
          cd "dist/MusicForge AI-darwin-arm64"
          ditto -c -k --sequesterRsrc --keepParent "MusicForge AI.app" "../MusicForge-AI-v0.3-Mac-M1.zip"
          shasum -a 256 "../MusicForge-AI-v0.3-Mac-M1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicForge-AI-v0.3-Mac-M1
          path: musicforge-v0.2-src/dist/MusicForge-AI-v0.3-Mac-M1.zip
          retention-days: 14
