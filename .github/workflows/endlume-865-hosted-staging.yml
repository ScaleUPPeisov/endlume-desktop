name: ENDLUME 8.65 Hosted Staging Build

on:
  push:
    branches: [endlume-8.64-turbo]
    paths:
      - '.github/workflows/endlume-865-hosted-staging.yml'
      - '.github/workflows/endlume-865-finalize-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-865-hosted-staging
  cancel-in-progress: true

env:
  VERSION: 1.0.0-alpha.8.65
  STAGING_TAG: endlume-v1.0.0-alpha.8.65-staging
  WINDOWS_ASSET: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.65-x64.exe
  MAC_ASSET: ENDLUME-YT-Studio-PEISOV-1.0.0-alpha.8.65-macOS-ARM64-UNSIGNED.app.tar.gz
  MAC_E2E_ASSET: ENDLUME-YT-Studio-PEISOV-1.0.0-alpha.8.65-macOS-ARM64-E2E.app.tar.gz

jobs:
  windows:
    name: Hosted Windows x64 • compile • tests • NSIS
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Frontend and source contracts
        shell: pwsh
        run: |
          npm ci
          npm run check
          npm run build
          python scripts/test-endlume-865-contract.py
          Remove-Item -Recurse -Force .queue-test-dist -ErrorAction SilentlyContinue
          .\node_modules\.bin\tsc.cmd src/queue-state.ts --target ES2022 --module ES2022 --moduleResolution Bundler --skipLibCheck --outDir .queue-test-dist --noEmit false
          node scripts/test-queue-finalization-8-58.mjs "$PWD/.queue-test-dist/queue-state.js"

      - name: Stage pinned Windows FFmpeg
        id: ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='autobuild-2026-09-14-13-17'
          $archive='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          $url="https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$archive"
          $zip=Join-Path $env:RUNNER_TEMP $archive
          $extract=Join-Path $env:RUNNER_TEMP 'ffmpeg-865-hosted'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $ffmpeg=(Get-ChildItem $extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe=(Get-ChildItem $extract -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if(-not $ffmpeg -or -not $ffprobe){throw 'FFmpeg sidecars missing'}
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $ffmpeg src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item $ffprobe src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          "ffmpeg=$ffmpeg" >> $env:GITHUB_OUTPUT
          "ffprobe=$ffprobe" >> $env:GITHUB_OUTPUT

      - name: Rust native Windows regression
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Build Windows NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cfg=Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if($cfg.version -ne $env:VERSION){throw "wrong version"}
          $cfg.bundle.createUpdaterArtifacts=$false
          $cfg | ConvertTo-Json -Depth 30 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.windows.conf.json
          $dir='src-tauri/target/release/bundle/nsis'
          $exe=Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 1
          if(-not $exe){throw 'NSIS installer missing'}
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $final=Join-Path (Resolve-Path staging) $env:WINDOWS_ASSET
          Copy-Item $exe.FullName $final -Force
          $bytes=[IO.File]::ReadAllBytes($final)
          if($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a){throw 'invalid PE/MZ'}
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLower()
          "$sha  $env:WINDOWS_ASSET" | Set-Content "$final.sha256"
          Write-Host "ENDLUME_865_HOSTED_WINDOWS_GREEN bytes=$($bytes.Length) sha256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: endlume-865-windows-staging
          path: |
            staging/*.exe
            staging/*.sha256
          retention-days: 7

  macos-arm64:
    name: Hosted macOS • cross-build ARM64 production + E2E
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0

      - name: Toolchain and source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          python3 scripts/test-endlume-865-contract.py
          rustup target add aarch64-apple-darwin

      - name: Reuse proven ARM64 FFmpeg sidecars from stable 8.64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p src-tauri/binaries "$RUNNER_TEMP/e864"
          URL='https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/ENDLUME-YT-Studio-PEISOV-1.0.0-alpha.8.64-macOS-ARM64.app.tar.gz'
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/e864/app.tar.gz"
          tar -xzf "$RUNNER_TEMP/e864/app.tar.gz" -C "$RUNNER_TEMP/e864"
          FFMPEG="$(find "$RUNNER_TEMP/e864" -type f -name 'ffmpeg*' -perm +111 -print -quit)"
          FFPROBE="$(find "$RUNNER_TEMP/e864" -type f -name 'ffprobe*' -perm +111 -print -quit)"
          test -n "$FFMPEG" -a -n "$FFPROBE"
          file "$FFMPEG" | grep -E 'arm64|Mach-O'
          file "$FFPROBE" | grep -E 'arm64|Mach-O'
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Build ARM64 E2E app
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json');c=json.loads(p.read_text())
          assert c['version']=='1.0.0-alpha.8.65'
          c['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          npm run tauri build -- --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          mkdir -p staging
          tar -czf "staging/$MAC_E2E_ASSET" -C "$(dirname "$APP")" "$(basename "$APP")"
          shasum -a 256 "staging/$MAC_E2E_ASSET" > "staging/$MAC_E2E_ASSET.sha256"

      - name: Build clean ARM64 production app
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          npm run tauri build -- --target aarch64-apple-darwin --bundles app
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test "$VER" = "$VERSION"
          test "$BID" = 'studio.endlume.desktop'
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          if strings "$APP/Contents/MacOS/$EXE" | grep -q 'ENDLUME_E2E_RENDER_JOB'; then
            echo 'production binary contains E2E marker'; exit 41
          fi
          tar -czf "staging/$MAC_ASSET" -C "$(dirname "$APP")" "$(basename "$APP")"
          shasum -a 256 "staging/$MAC_ASSET" > "staging/$MAC_ASSET.sha256"
          echo "ENDLUME_865_HOSTED_MAC_ARM64_GREEN"

      - uses: actions/upload-artifact@v4
        with:
          name: endlume-865-mac-staging
          path: staging/*
          retention-days: 7

  publish-staging:
    name: Publish immutable 8.65 staging artifacts
    runs-on: ubuntu-latest
    needs: [windows, macos-arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging-artifacts
          merge-multiple: true

      - name: Verify and publish staging release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ls -lah staging-artifacts
          test -s "staging-artifacts/$WINDOWS_ASSET"
          test -s "staging-artifacts/$MAC_ASSET"
          test -s "staging-artifacts/$MAC_E2E_ASSET"
          python3 - <<'PY'
          from pathlib import Path
          import os
          w=Path('staging-artifacts')/os.environ['WINDOWS_ASSET']
          assert w.read_bytes()[:2]==b'MZ'
          assert w.stat().st_size>1_000_000
          for n in (os.environ['MAC_ASSET'],os.environ['MAC_E2E_ASSET']):
              p=Path('staging-artifacts')/n
              assert p.stat().st_size>1_000_000
          PY
          NOTES="$RUNNER_TEMP/endlume-865-staging.md"
          cat > "$NOTES" <<EOF
          ENDLUME YT Studio PEISOV 1.0.0-alpha.8.65 staging

          Source: $GITHUB_SHA
          Hosted Windows x64 compile/tests/NSIS: PASS
          Hosted macOS ARM64 production + E2E cross-build: PASS
          Updater signatures are intentionally NOT published here.
          Stable promotion requires physical Apple Silicon render_job E2E and local updater signing key.
          EOF
          if gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$STAGING_TAG" staging-artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.65 staging" --notes-file "$NOTES" --prerelease
          else
            gh release create "$STAGING_TAG" staging-artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.65 staging" --notes-file "$NOTES" --prerelease
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STAGING_TAG" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          assert r['target_commitish']==os.environ['GITHUB_SHA'],(r['target_commitish'],os.environ['GITHUB_SHA'])
          names={a['name']:a for a in r['assets']}
          for n in (os.environ['WINDOWS_ASSET'],os.environ['MAC_ASSET'],os.environ['MAC_E2E_ASSET']):
              assert n in names,n
              assert names[n].get('state')=='uploaded',names[n]
              assert int(names[n].get('size',0))>1_000_000,names[n]
          print('ENDLUME_865_STAGING_GREEN')
          PY
