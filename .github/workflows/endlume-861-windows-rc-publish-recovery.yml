name: ENDLUME 8.61 Windows RC Publish Recovery

on:
  push:
    branches: [windows/endlume-861-managed-access]
    paths:
      - '.github/workflows/endlume-861-windows-rc-publish-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  FINAL_INSTALLER: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
  RELEASE_TAG: endlume-v1.0.0-alpha.8.61-windows-rc

concurrency:
  group: endlume-861-windows-rc-publish-recovery
  cancel-in-progress: true

jobs:
  publish-recovery:
    name: Windows x64 • RC asset publish recovery
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 60

    steps:
      - name: Checkout current branch HEAD without deleting verified build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: false

      - name: Reuse verified installer when present
        id: reuse
        shell: bash
        run: |
          set -Eeuo pipefail
          FINAL="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis/$FINAL_INSTALLER"
          if [ -s "$FINAL" ]; then
            python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.stat().st_size > 1_000_000
          with p.open('rb') as f:
              assert f.read(2) == b'MZ'
          print(f'REUSING_VERIFIED_INSTALLER_BYTES={p.stat().st_size}')
          PY
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare cross-build toolchain and pinned sidecars
        if: steps.reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v brew >/dev/null
          command -v rustup >/dev/null
          command -v cargo >/dev/null
          command -v npm >/dev/null
          command -v gh >/dev/null 2>&1 || brew install gh
          brew list nsis >/dev/null 2>&1 || brew install nsis
          brew list llvm >/dev/null 2>&1 || brew install llvm

          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          export PATH="$LLVM_BIN:$PATH"

          rustup target add "$WINDOWS_TARGET"
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          fi

          RELEASE='autobuild-2026-09-14-13-17'
          ARCHIVE='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${RELEASE}/${ARCHIVE}"
          CACHE="$RUNNER_TEMP/endlume-ffmpeg-cross"
          ZIP="$CACHE/$ARCHIVE"
          EXTRACT="$CACHE/extract"
          DEST='src-tauri/binaries'

          rm -rf "$EXTRACT"
          mkdir -p "$CACHE" "$EXTRACT" "$DEST"
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --output "$ZIP" "$URL"
          fi
          ditto -x -k "$ZIP" "$EXTRACT"

          FFMPEG="$(find "$EXTRACT" -type f -name ffmpeg.exe -print -quit)"
          FFPROBE="$(find "$EXTRACT" -type f -name ffprobe.exe -print -quit)"
          test -n "$FFMPEG"
          test -n "$FFPROBE"
          cp "$FFMPEG" "$DEST/ffmpeg-$WINDOWS_TARGET.exe"
          cp "$FFPROBE" "$DEST/ffprobe-$WINDOWS_TARGET.exe"

          HOST_FFMPEG="$(command -v ffmpeg)"
          HOST_FFPROBE="$(command -v ffprobe)"
          cp "$HOST_FFMPEG" "$DEST/ffmpeg-aarch64-apple-darwin"
          cp "$HOST_FFPROBE" "$DEST/ffprobe-aarch64-apple-darwin"
          chmod +x "$DEST/ffmpeg-aarch64-apple-darwin" "$DEST/ffprobe-aarch64-apple-darwin"

      - name: Install frontend dependencies
        if: steps.reuse.outputs.reuse != 'true'
        shell: bash
        run: npm ci

      - name: Rebuild installer only if verified build is absent
        if: steps.reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          LLVM_BIN="$(brew --prefix llvm)/bin"
          export PATH="$LLVM_BIN:$PATH"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(p.read_text())
          assert cfg['bundle']['createUpdaterArtifacts'] is True
          cfg['bundle']['createUpdaterArtifacts'] = False
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          print('RC_RECOVERY_UPDATER_ARTIFACTS_DISABLED=true')
          PY

          npm run tauri build -- \
            --runner cargo-xwin \
            --target "$WINDOWS_TARGET" \
            --bundles nsis \
            --config src-tauri/tauri.windows.conf.json

      - name: Normalize and verify installer
        shell: bash
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"

          if [ ! -s "$FINAL" ]; then
            CANDIDATE="$(find "$NSIS_DIR" -maxdepth 1 -type f -name '*.exe' ! -name "$FINAL_INSTALLER" -print -quit)"
            test -n "$CANDIDATE"
            cp "$CANDIDATE" "$FINAL"
          fi

          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.is_file() and p.stat().st_size > 1_000_000
          with p.open('rb') as f:
              assert f.read(2) == b'MZ'
          print(f'RC_INSTALLER_BYTES={p.stat().st_size}')
          PY

          shasum -a 256 "$FINAL" | tee "$FINAL.sha256"

      - name: Publish RC assets through GitHub uploads API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"
          SHA_FILE="$FINAL.sha256"
          NOTES="$RUNNER_TEMP/endlume-windows-rc-notes.md"

          cat > "$NOTES" <<EOF
          ENDLUME YT Studio PEISOV
          Windows x64
          Version 1.0.0-alpha.8.61
          Release Candidate

          BUILD VERIFIED: YES
          NSIS VERIFIED: YES
          HARDWARE E2E VERIFIED: NO

          Pending:
          - native installed Windows hardware E2E;
          - NVENC/QSV/AMF real hardware proof;
          - full installed-app render/no-console validation.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" \
              --notes-file "$NOTES" \
              --prerelease
          fi

          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
          test -n "$RELEASE_ID"

          delete_asset_if_present() {
            local name="$1"
            local id
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id" | head -1)"
            if [ -n "$id" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            fi
          }

          upload_asset() {
            local file="$1"
            local name="$2"
            local out="$RUNNER_TEMP/upload-${name}.json"
            curl --http1.1 --fail-with-body --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 600 \
              --speed-time 60 --speed-limit 1024 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              > "$out"
            python3 - "$out" "$file" "$name" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          local = Path(sys.argv[2])
          expected_name = sys.argv[3]
          assert payload.get('name') == expected_name, payload
          assert payload.get('state') == 'uploaded', payload
          assert payload.get('size') == local.stat().st_size, (payload.get('size'), local.stat().st_size)
          print(f"UPLOAD_GREEN={expected_name}:{payload.get('size')}")
          PY
          }

          delete_asset_if_present "$FINAL_INSTALLER"
          delete_asset_if_present "$FINAL_INSTALLER.sha256"
          upload_asset "$FINAL" "$FINAL_INSTALLER"
          upload_asset "$SHA_FILE" "$FINAL_INSTALLER.sha256"

          LOCAL_SIZE="$(stat -f%z "$FINAL")"
          EXPECTED_SHA="$(awk '{print $1; exit}' "$SHA_FILE")"
          EXE_ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq ".[] | select(.name == \"$FINAL_INSTALLER\") | .id" | head -1)"
          REMOTE_SIZE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq ".[] | select(.name == \"$FINAL_INSTALLER\") | .size" | head -1)"
          SHA_ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq ".[] | select(.name == \"$FINAL_INSTALLER.sha256\") | .id" | head -1)"
          test -n "$EXE_ASSET_ID"
          test -n "$SHA_ASSET_ID"
          test "$LOCAL_SIZE" = "$REMOTE_SIZE"

          VERIFY="$RUNNER_TEMP/$FINAL_INSTALLER"
          rm -f "$VERIFY"
          curl --http1.1 --fail-with-body --show-error --silent --location \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 600 \
            --speed-time 60 --speed-limit 1024 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$EXE_ASSET_ID" \
            --output "$VERIFY"

          ACTUAL_SHA="$(shasum -a 256 "$VERIFY" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '{name: .name, tag: .tag_name, draft: .draft, prerelease: .prerelease, assets: [.assets[] | {name, size, browser_download_url}]}'

          echo "FINAL_HEAD=$GITHUB_SHA"
          echo "FINAL_SIZE=$LOCAL_SIZE"
          echo "FINAL_SHA256=$EXPECTED_SHA"
          echo 'WINDOWS_RC_PUBLISHED'
