name: ENDLUME 10.0.15 VYRON Auto-Discovery Probe

on:
  push:
    branches:
      - hotfix/endlume-10.0.15-render-destination-routing
    paths:
      - '.github/workflows/endlume-1015-vyron-autodiscovery-probe.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1015-vyron-autodiscovery-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify VYRON persisted discovery of exact hotfix physical outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/Library/Application Support/studio.channelflow.desktop/state.json"
          test -f "$STATE"
          pgrep -f '/Applications/VYRON.app/Contents/MacOS/channelflow' >/dev/null
          python3 - "$STATE" <<'PY'
          import json,sys
          from pathlib import Path
          state_path=Path(sys.argv[1])
          data=json.loads(state_path.read_text(encoding='utf-8'))
          targets=[
            ('Aegean Afterglow','ENDLUME Routing QA 10.0.15 1 — Ready Videos.mp4'),
            ('Aether Riff','ENDLUME Routing QA 10.0.15 2 — Ready Videos.mp4'),
            ('Afterglow Highway','ENDLUME Routing QA 10.0.15 3 — Ready Videos.mp4'),
          ]
          hits=[]
          def walk(x,path='$'):
            if isinstance(x,dict):
              blob=json.dumps(x,ensure_ascii=False)
              for channel,name in targets:
                if name in blob and '/Render/'+channel+'/' in blob:
                  hits.append((channel,name,path,x))
              for k,v in x.items(): walk(v,path+'.'+str(k))
            elif isinstance(x,list):
              for i,v in enumerate(x): walk(v,path+f'[{i}]')
          walk(data)
          ok={}
          for channel,name in targets:
            rows=[]
            for ch,n,path,obj in hits:
              if ch!=channel or n!=name: continue
              text=json.dumps(obj,ensure_ascii=False)
              discovered=('RENDER_DISCOVERED' in text or 'render-complete:' in text)
              success=('SUCCESS' in text or 'Completed' in text or 'COMPLETED' in text)
              rows.append((path,discovered,success,obj))
            good=[r for r in rows if r[1] and r[2]]
            ok[channel]=bool(good)
            print(f'CHANNEL={channel}')
            print(f'FILE={name}')
            print(f'DISCOVERY_RECORDS={len(rows)}')
            print(f'SUCCESS_RECORDS={len(good)}')
            for path,disc,success,obj in good[:3]:
              print('STATE_PATH='+path)
              print('STATE_RECORD='+json.dumps(obj,ensure_ascii=False)[:2500])
          missing=[ch for ch,v in ok.items() if not v]
          if missing:
            print('VYRON_AUTO_DISCOVERY=NOT_YET_PROVEN')
            print('MISSING_CHANNELS='+','.join(missing))
            raise SystemExit(2)
          print('VYRON_AUTO_DISCOVERY=PASS')
          print('VYRON_EXACT_PHYSICAL_OUTPUT_DISCOVERY=PASS')
          PY
