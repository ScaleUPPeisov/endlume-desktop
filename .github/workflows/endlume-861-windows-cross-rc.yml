name: ENDLUME 8.61 Windows Cross RC

on:
  push:
    branches: [windows/endlume-861-managed-access]
    paths:
      - '.github/workflows/endlume-861-windows-cross-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-861-windows-cross-rc
  cancel-in-progress: true

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  ENDLUME_VERSION: 1.0.0-alpha.8.61
  FINAL_INSTALLER: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe

jobs:
  windows-cross-rc:
    name: Windows x64 • Cross-build • NSIS RC
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 120

    steps:
      - name: Checkout current branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify source and Windows product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg = json.loads(Path('package.json').read_text())
          base = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          win = json.loads(Path('src-tauri/tauri.windows.conf.json').read_text())

          expected_version = '1.0.0-alpha.8.61'
          expected_name = 'ENDLUME YT Studio PEISOV'
          expected_id = 'studio.endlume.desktop'

          assert pkg['version'] == expected_version, pkg['version']
          assert base['version'] == expected_version, base['version']
          assert base['identifier'] == expected_id, base['identifier']
          assert win['identifier'] == expected_id, win['identifier']
          assert win['productName'] == expected_name, win['productName']
          assert win['mainBinaryName'] == expected_name, win['mainBinaryName']
          assert win['bundle']['targets'] == ['nsis'], win['bundle']['targets']
          assert win['bundle']['windows']['nsis']['installerIcon'] == 'icons/icon.ico'
          print('WINDOWS_PRODUCT_CONTRACT_GREEN')
          PY

      - name: Install cross-build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v brew >/dev/null
          command -v rustup >/dev/null
          command -v cargo >/dev/null
          command -v npm >/dev/null

          brew list nsis >/dev/null 2>&1 || brew install nsis
          brew list llvm >/dev/null 2>&1 || brew install llvm

          LLVM_BIN="$(brew --prefix llvm)/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          export PATH="$LLVM_BIN:$PATH"

          rustup target add "$WINDOWS_TARGET"
          if ! command -v cargo-xwin >/dev/null 2>&1; then
            cargo install --locked cargo-xwin
          fi

          makensis -VERSION
          cargo xwin --version

      - name: Stage pinned Windows FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_TAG='autobuild-2026-09-14-13-17'
          ARCHIVE='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${RELEASE_TAG}/${ARCHIVE}"
          CACHE="$RUNNER_TEMP/endlume-ffmpeg-cross"
          ZIP="$CACHE/$ARCHIVE"
          EXTRACT="$CACHE/extract"
          DEST='src-tauri/binaries'

          rm -rf "$EXTRACT"
          mkdir -p "$CACHE" "$EXTRACT" "$DEST"
          if [ ! -s "$ZIP" ]; then
            curl --fail --location --retry 3 --output "$ZIP" "$URL"
          fi
          ditto -x -k "$ZIP" "$EXTRACT"

          FFMPEG="$(find "$EXTRACT" -type f -name ffmpeg.exe -print -quit)"
          FFPROBE="$(find "$EXTRACT" -type f -name ffprobe.exe -print -quit)"
          test -n "$FFMPEG"
          test -n "$FFPROBE"

          cp "$FFMPEG" "$DEST/ffmpeg-$WINDOWS_TARGET.exe"
          cp "$FFPROBE" "$DEST/ffprobe-$WINDOWS_TARGET.exe"

          python3 - <<'PY'
          from pathlib import Path
          target = 'x86_64-pc-windows-msvc'
          for name in ('ffmpeg', 'ffprobe'):
              p = Path('src-tauri/binaries') / f'{name}-{target}.exe'
              assert p.is_file(), p
              assert p.stat().st_size > 1_000_000, (p, p.stat().st_size)
              with p.open('rb') as f:
                  assert f.read(2) == b'MZ', f'{p} is not a PE executable'
              print(f'{p}: {p.stat().st_size} bytes, PE/MZ OK')
          print('WINDOWS_SIDECARS_STRUCTURAL_GREEN')
          print('Runtime encoder capability remains a native-Windows hardware gate.')
          PY

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: TypeScript check
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check

      - name: Queue finalization regression
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          ./node_modules/.bin/tsc src/queue-state.ts \
            --target ES2022 \
            --module ES2022 \
            --moduleResolution Bundler \
            --skipLibCheck \
            --outDir "$TMP" \
            --noEmit false
          node scripts/test-queue-finalization-8-58.mjs "$TMP/queue-state.js"

      - name: Frontend production build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Windows production contract gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/test-windows-861-strict-port.py
          python3 scripts/test-windows-861-release-surface.py
          python3 scripts/test-local-scratch-stability-8-61.py
          python3 scripts/test-managed-license-render-gate.py
          python3 scripts/test-render-speed-stability-8-60.py

      - name: Stage host sidecars for Rust validation
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          mkdir -p src-tauri/binaries
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Rust check
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cross-build Windows x64 NSIS Release Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          LLVM_BIN="$(brew --prefix llvm)/bin"
          export PATH="$LLVM_BIN:$PATH"
          npm run tauri build -- \
            --runner cargo-xwin \
            --target "$WINDOWS_TARGET" \
            --bundles nsis \
            --config src-tauri/tauri.windows.conf.json

      - name: Normalize and verify exact RC installer
        shell: bash
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"
          mkdir -p "$NSIS_DIR"

          if [ ! -s "$FINAL" ]; then
            CANDIDATE="$(find "$NSIS_DIR" -maxdepth 1 -type f -name '*.exe' ! -name "$FINAL_INSTALLER" -print -quit)"
            test -n "$CANDIDATE"
            cp "$CANDIDATE" "$FINAL"
          fi

          test -s "$FINAL"
          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert p.stat().st_size > 0
          with p.open('rb') as f:
              assert f.read(2) == b'MZ', 'NSIS installer is not PE/MZ'
          print(f'RC installer: {p}')
          print(f'RC installer bytes: {p.stat().st_size}')
          PY

          shasum -a 256 "$FINAL" | tee "$FINAL.sha256"
          echo 'BUILD_VERIFIED_CROSS_RC_GREEN'
          echo 'HARDWARE_E2E_VERIFIED=false'

      - name: Upload Windows NSIS Release Candidate
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64-RC-cross
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
