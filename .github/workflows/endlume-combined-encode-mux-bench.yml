name: ENDLUME combined Subscribe encode plus 3h MP3 mux benchmark

on:
  workflow_dispatch:
  push:
    branches: [qa/endlume-d91-combined-encode-mux]

permissions:
  contents: read

jobs:
  combined-bench:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d91ae43391b7b8773c37444a4002c713e4d17b52
      - name: Prepare exact 3h fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin; test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = d91ae43391b7b8773c37444a4002c713e4d17b52
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ROOT="$RUNNER_TEMP/combined-encode-mux"; mkdir -p "$ROOT/media" "$ROOT/fx"; echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$ROOT/media/cover.png"
          : > "$ROOT/audio-concat.txt"
          for i in $(seq -w 1 12); do
            n=$((10#$i)); hz=$((180+n*23)); p="$ROOT/media/track-${i}.mp3"
            ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -metadata title="Combined Track ${i}" -y "$p"
            printf "file '%s'\n" "$p" >> "$ROOT/audio-concat.txt"
          done
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "color=c=0x00ff00:s=640x360:r=60:d=3" \
            -f lavfi -i "color=c=white:s=180x100:r=60:d=3" \
            -filter_complex "[0:v][1:v]overlay=x='70+300*t/3':y='120+45*sin(2*PI*t/3)':eval=frame:shortest=1" \
            -an -c:v libx264 -preset ultrafast -g 180 -pix_fmt yuv420p -r 60 -y "$ROOT/fx/subscribe.mp4"

      - name: Benchmark one-process encode plus audio copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,statistics,subprocess,time
          root=os.environ['ROOT']
          graph="[0:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,fps=60,setsar=1[base];[base]split=2[stillbase][subbase];[1:v]fps=60,format=rgba,chromakey=0x00ff00:0.12:0.08,scale=iw*0.3:ih*0.3[fx0];[subbase][fx0]overlay=x='(W-w)*0.15':y='(H-h)*0.65':shortest=1:eof_action=repeat[b1];[stillbase]trim=end_frame=1,setpts=PTS-STARTPTS[still];[b1]trim=end_frame=180,setpts=PTS-STARTPTS[subseg];[still][subseg]concat=n=2:v=1:a=0,format=yuv420p[outv]"
          base=['ffmpeg','-hide_banner','-loglevel','error','-loop','1','-framerate','60','-i',root+'/media/cover.png','-stream_loop','-1','-i',root+'/fx/subscribe.mp4','-f','concat','-safe','0','-i',root+'/audio-concat.txt','-filter_complex',graph,'-map','[outv]','-map','2:a:0','-c:v','hevc_videotoolbox','-realtime','1','-prio_speed','1','-power_efficient','0','-q:v','75','-b:v','8M','-maxrate','20M','-bufsize','80M','-g','1','-tag:v','hvc1','-fps_mode','cfr','-r','60','-video_track_timescale','60000','-c:a','copy']
          rows=[]
          for i in range(3):
              out=f'{root}/combined-{i}.mp4'; t=time.perf_counter(); subprocess.run(base+['-y',out],check=True); ms=(time.perf_counter()-t)*1000
              p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',out],text=True))
              v=next(x for x in p['streams'] if x['codec_type']=='video'); a=next(x for x in p['streams'] if x['codec_type']=='audio')
              rows.append({'run':i,'ms':ms,'bytes':os.path.getsize(out),'video_frames':int(v.get('nb_frames','0')),'video_duration':float(v.get('duration','0')),'audio_duration':float(a.get('duration','0')),'format_duration':float(p['format']['duration']),'video_codec':v.get('codec_name'),'audio_codec':a.get('codec_name'),'fps':v.get('avg_frame_rate')})
          report={'runs':rows,'median_ms':statistics.median(x['ms'] for x in rows),'max_ms':max(x['ms'] for x in rows),'min_ms':min(x['ms'] for x in rows)}
          json.dump(report,open(root+'/combined-bench.json','w'),indent=2); print(json.dumps(report,indent=2))
          checks=[]
          for x in rows:
              checks += [x['video_frames']==181, abs(x['video_duration']-181/60)<0.05, abs(x['audio_duration']-10800.023021)<0.1, x['video_codec']=='hevc', x['audio_codec']=='mp3', x['fps']=='60/1', 430_000_000<x['bytes']<445_000_000]
          if not all(checks): raise SystemExit('combined output metadata mismatch')
          if report['max_ms']>7000: raise SystemExit('combined path lacks performance margin')
          print('COMBINED_ENCODE_MUX_POC=PASS')
          PY
      - name: Prove MP3 packet copy on best final sample
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os,subprocess
          root=os.environ['ROOT']
          def hashes(path):
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_packets','-show_entries','packet=data_hash','-show_data_hash','sha256','-of','json',path],text=True)); return [p['data_hash'] for p in d.get('packets',[]) if p.get('data_hash')]
          src=[]
          for p in sorted(glob.glob(root+'/media/track-*.mp3')): src.extend(hashes(p))
          dst=hashes(root+'/combined-2.mp4')
          report={'source_packets':len(src),'output_packets':len(dst),'packet_perfect':src==dst}
          json.dump(report,open(root+'/audio-copy.json','w'),indent=2); print(json.dumps(report,indent=2))
          if src!=dst: raise SystemExit(1)
          PY
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: endlume-combined-encode-mux-bench
          path: |
            ${{ env.ROOT }}/combined-bench.json
            ${{ env.ROOT }}/audio-copy.json
          retention-days: 7