name: ENDLUME macOS Subscribe 3h acceptance

on:
  workflow_dispatch:
  push:
    branches: [perf/endlume-macos-subscribe-3h-fastpath]

concurrency:
  group: endlume-subscribe-3h-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-subscribe-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert Apple Silicon and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor e2896da7702891a5b760ecd4daad4fd54bc90b82 HEAD
          git diff --exit-code e2896da7702891a5b760ecd4daad4fd54bc90b82 -- src-tauri/tauri.conf.json
          git diff --exit-code e2896da7702891a5b760ecd4daad4fd54bc90b82 -- src-tauri/src/license.rs

      - name: Build actual ENDLUME app
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features acceptance-harness
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          BIN="$APP/Contents/MacOS/endlume"; test -x "$BIN"
          ROOT="$RUNNER_TEMP/endlume-subscribe-3h"; MEDIA="$ROOT/project"; FX="$ROOT/effects"; OUT="$ROOT/out"
          mkdir -p "$MEDIA" "$FX" "$OUT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"; echo "FX=$FX" >> "$GITHUB_ENV"; echo "OUT=$OUT" >> "$GITHUB_ENV"; echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Generate physical 3-hour production workload
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$MEDIA/cover.png"
          for i in $(seq -w 1 12); do n=$((10#$i)); hz=$((180+n*23)); ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -metadata title="Subscribe Track ${i}" -y "$MEDIA/track-${i}.mp3"; done
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x00ff00:s=640x360:r=60:d=3" -vf "drawbox=x=190:y=105:w=260:h=150:color=white:t=fill" -an -c:v libx264 -preset ultrafast -g 180 -pix_fmt yuv420p -r 60 -y "$FX/subscribe.mp4"

      - name: Create 3-hour Subscribe QueueJob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          media=os.environ['MEDIA']; fx=os.environ['FX']; out=os.environ['OUT']; root=os.environ['ROOT']
          sub={'id':'subscribe','name':'Subscribe 3s','source':os.path.join(fx,'subscribe.mp4'),'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.12,'blend':0.08,'despill':1.0,'lumaThreshold':0.10,'lumaTolerance':0.05,'saturation':1.0,'x':0.15,'y':0.65,'scale':0.30,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':None,'firstAtSec':600.0,'secondAtSec':3600.0,'repeatEverySec':3600.0}
          job={'project':{'id':'acceptance-subscribe-3h','name':'ENDLUME Subscribe 3H Acceptance','path':media,'media':[os.path.join(media,'cover.png')],'audio':sorted(glob.glob(os.path.join(media,'track-*.mp3'))),'valid':True,'error':None},'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':30.0,'durationHours':3.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':out,'preset':'fast','encoderPreference':'auto'},'effects':[],'subscribes':[sub],'ambient':None}
          json.dump(job,open(os.path.join(root,'job.json'),'w'),indent=2)
          PY

      - name: Launch actual app export and preview
        shell: bash
        run: |
          set +e
          ENDLUME_ACCEPTANCE_JOB="$ROOT/job.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/receipt.json" ENDLUME_SOURCE_HEAD="$GITHUB_SHA" ENDLUME_ACCEPTANCE_PREVIEW_TIMES="599,600.5,603.5,3599,3600.5,3603.5,7199,7200.5,7203.5,10799" "$BIN" > "$ROOT/app.log" 2>&1
          rc=$?; echo "APP_EXIT_CODE=$rc" >> "$ROOT/app.log"; test -f "$ROOT/receipt.json" && cat "$ROOT/receipt.json"; exit 0

      - name: Validate Subscribe visibility position and preview parity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,sys
          root=os.environ['ROOT']; d=json.load(open(os.path.join(root,'receipt.json')))
          if d.get('status')!='ok':sys.exit(str(d))
          r=d['result']; out=r['output_path']; W,H=480,270; N=W*H
          def frame(path,t):
              q=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',str(t),'-i',path,'-frames:v','1','-an','-vf',f'scale={W}:{H},format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
              assert len(q.stdout)>=N,(path,t,len(q.stdout)); return q.stdout[:N]
          def contrast(x):return max(x)-min(x)
          def mae(a,b):return sum(abs(x-y) for x,y in zip(a,b))/N
          off_times=[599.0,603.5,3599.0,3603.5,7199.0,7203.5,10799.0]; on_times=[600.5,3600.5,7200.5]
          checks={}
          checks['off']=all(contrast(frame(out,t))<15 for t in off_times)
          checks['on']=all(contrast(frame(out,t))>20 for t in on_times)
          off=frame(out,599.0); on=frame(out,600.5); delta=[abs(a-b) for a,b in zip(on,off)]; pts=[(i%W,i//W) for i,v in enumerate(delta) if v>15]
          cx=sum(x for x,y in pts)/len(pts) if pts else 999; cy=sum(y for x,y in pts)/len(pts) if pts else -1
          checks['position_lower_left']=bool(pts) and cx<W*0.5 and cy>H*0.4
          rows=[]
          for item in r.get('preview_outputs',[]):
              t=float(item['at']); diff=mae(frame(out,t),frame(item['path'],0.0)); rows.append({'at':t,'mae':diff,'pass':diff<12.0})
          checks['preview_export']=len(rows)==10 and all(x['pass'] for x in rows)
          report={'checks':checks,'centroid':[cx,cy],'preview':rows}; json.dump(report,open(os.path.join(root,'visual-gate.json'),'w'),indent=2); print(json.dumps(report,indent=2))
          if not all(checks.values()):sys.exit(1)
          PY

      - name: Prove MP3 packet preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os,subprocess,sys
          r=json.load(open(os.path.join(os.environ['ROOT'],'receipt.json')))['result']; out=r['output_path']
          def hashes(path):
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_packets','-show_entries','packet=data_hash','-show_data_hash','sha256','-of','json',path],text=True)); return [p['data_hash'] for p in d.get('packets',[]) if p.get('data_hash')]
          src=[]
          for p in sorted(glob.glob(os.path.join(os.environ['MEDIA'],'track-*.mp3'))):src.extend(hashes(p))
          dst=hashes(out); report={'source_packets':len(src),'output_packets':len(dst),'packet_perfect':src==dst,'last_packet':bool(src and dst and src[-1]==dst[-1])}; json.dump(report,open(os.path.join(os.environ['ROOT'],'audio-gate.json'),'w'),indent=2); print(json.dumps(report,indent=2))
          if not report['packet_perfect']:sys.exit(1)
          PY

      - name: Hard gate 3-hour Subscribe production output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          root=os.environ['ROOT']; d=json.load(open(os.path.join(root,'receipt.json')))
          if d.get('status')!='ok':sys.exit(str(d))
          r=d['result']; m=r.get('fast_metrics') or {}; streams=r['probe']['streams']; v=next(x for x in streams if x.get('codec_type')=='video'); a=next(x for x in streams if x.get('codec_type')=='audio'); mb=r['output_bytes']/1_000_000; visual=json.load(open(os.path.join(root,'visual-gate.json'))); audio=json.load(open(os.path.join(root,'audio-gate.json')); total_ms=r['export_seconds']*1000.0; expected=float(r['input_audio_duration'])
          checks={'FAST_PATH':r.get('fast_path_used') is True,'NO_LEGACY':not bool(r.get('legacy_fallback_used')),'MODE':m.get('mode')=='static-subscribe-hevc-mp3-packet-copy','TEN_SECONDS':total_ms<=10000.0,'DURATION':abs(r['output_duration']-expected)<=0.10,'SIZE_400_600_MB':400<=mb<=600,'HEVC':v.get('codec_name')=='hevc','RESOLUTION':(v.get('width'),v.get('height'))==(1920,1080),'FPS':v.get('r_frame_rate')=='60/1' and v.get('avg_frame_rate')=='60/1','MP3':a.get('codec_name')=='mp3','PACKET_COPY':audio.get('packet_perfect') is True,'FULL_DECODE':r.get('full_decode',{}).get('ok') is True,'DTS_CLEAN':'non monotonically increasing dts' not in r.get('full_decode',{}).get('stderr','').lower(),'SEEKS':all(x.get('ok') for x in r.get('seek_checks',[])),'VISUAL':all(visual.get('checks',{}).values())}
          print(f"TOTAL_MS={total_ms:.3f} OUTPUT_MB={mb:.3f} DURATION={r['output_duration']:.6f}")
          print(json.dumps(m,indent=2))
          for k,vv in checks.items():print(f"{k}={'PASS' if vv else 'FAIL'}")
          json.dump({'checks':checks,'total_ms':total_ms,'fast_metrics':m},open(os.path.join(root,'gate.json'),'w'),indent=2)
          if not all(checks.values()):sys.exit(1)
          print('SUBSCRIBE_PRODUCTION_3H=PASS')
          PY

      - name: Upload Subscribe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-subscribe-3h-evidence
          path: |
            ${{ env.ROOT }}/job.json
            ${{ env.ROOT }}/receipt.json
            ${{ env.ROOT }}/app.log
            ${{ env.ROOT }}/visual-gate.json
            ${{ env.ROOT }}/audio-gate.json
            ${{ env.ROOT }}/gate.json
          if-no-files-found: warn
          retention-days: 30