name: ENDLUME 8.61 Windows Production

on:
  push:
    branches:
      - windows/endlume-861-managed-access
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-861:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stage pinned FFmpeg sidecars
        shell: pwsh
        run: ./scripts/prepare-windows-sidecars.ps1

      - name: Verify source version and identity
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.0.0-alpha.8.61') { throw "package version drift: $($pkg.version)" }
          if ($tauri.version -ne '1.0.0-alpha.8.61') { throw "tauri version drift: $($tauri.version)" }
          if ($tauri.identifier -ne 'studio.endlume.desktop') { throw "identifier drift: $($tauri.identifier)" }

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Frontend production build
        run: npm run build

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $target = 'x86_64-pc-windows-msvc'
          foreach ($b in @('ffmpeg','ffprobe')) {
            $p = "src-tauri/binaries/$b-$target.exe"
            if (!(Test-Path $p)) { throw "Missing Tauri sidecar $p" }
          }
          $installer = Get-ChildItem "src-tauri/target/$target/release/bundle/nsis" -Filter '*-setup.exe' -File
          if (-not $installer) { throw 'NSIS installer missing' }
          if ($installer.Count -ne 1) { throw "Expected one NSIS installer, found $($installer.Count)" }
          Write-Host "Installer: $($installer[0].FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-Studio-1.0.0-alpha.8.61-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
            src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 14
