name: Cancel stale ENDLUME equalizer scan
on:
  push:
    branches: [hotfix/endlume-10.0.15-multi-effect-live-preview]
    paths: ['.github/workflows/cancel-stale-eq-scan.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale broad scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ScaleUPPeisov/endlume-desktop/actions/runs/38333908571/cancel
          echo STALE_SCAN_CANCEL_REQUESTED=PASS
