name: ENDLUME Phase2 Physical UI V18 Native Field Picker
on:
  push:
    branches: [release-fix/endlume-10.0.13-canonical-product-reconstruction]
    paths:
      - .github/workflows/endlume-1013-phase2-ui-v5.yml
      - qa/phase2-ui-v5.sh
      - qa/phase2-ui-v8.sh
      - qa/phase2-ui-v9.sh
      - qa/phase2-ui-v18-native-field-picker.sh
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: endlume-1013-phase2-physical-ui
  cancel-in-progress: true
jobs:
  ui:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore local accepted artifact
        id: local_artifact
        shell: bash
        env:
          EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/phase2-v5-source"
          NAME="ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          CACHE="$HOME/Library/Caches/endlume-phase2/$NAME"
          mkdir -p "$SRC" "$(dirname "$CACHE")"
          for candidate in "$CACHE" "$SRC/$NAME"; do
            if [ -f "$candidate" ] && [ "$(shasum -a 256 "$candidate" | awk '{print $1}')" = "$EXPECTED_APP_ZIP_SHA256" ]; then
              if [ "$candidate" != "$SRC/$NAME" ]; then cp -f "$candidate" "$SRC/$NAME"; fi
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "LOCAL_ARTIFACT_CACHE=HIT"
              exit 0
            fi
          done
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "LOCAL_ARTIFACT_CACHE=MISS"
      - uses: actions/download-artifact@v4
        if: steps.local_artifact.outputs.hit != 'true'
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/phase2-v5-source
          github-token: ${{ github.token }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38030777284
      - name: Persist local accepted artifact
        if: steps.local_artifact.outputs.hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250
        run: |
          set +e
          ROOT="${{ runner.temp }}/phase2-v5-source"
          SRC="$ROOT/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          CACHE="$HOME/Library/Caches/endlume-phase2/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          if [ ! -f "$SRC" ]; then echo "LOCAL_ARTIFACT_CACHE=SKIP_FILE_MISSING"; exit 0; fi
          ACTUAL="$(shasum -a 256 "$SRC" | awk '{print $1}')"
          echo "DOWNLOADED_APP_ZIP_SHA256=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_APP_ZIP_SHA256" ]; then echo "LOCAL_ARTIFACT_CACHE=SKIP_SHA_MISMATCH"; exit 0; fi
          mkdir -p "$(dirname "$CACHE")"
          cp -f "$SRC" "$CACHE"
          echo "LOCAL_ARTIFACT_CACHE=SEEDED"
      - name: Physical UI V18 Native Field Picker
        shell: bash
        env:
          EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250
          EXPECTED_APP_BIN_SHA256: 4d208994181c5ca21b20c2e01dd06bda25e82a16bb1405379e79cc4da3026436
          OWNER_APP_BIN_SHA256: 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7
        run: bash qa/phase2-ui-v18-native-field-picker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-PHASE2-PHYSICAL-UI-V18-NATIVE-FIELD
          path: ${{ runner.temp }}/endlume-phase2-v5
          if-no-files-found: warn
          retention-days: 14
