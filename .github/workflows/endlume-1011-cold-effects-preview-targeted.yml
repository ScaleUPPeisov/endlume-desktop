name: ENDLUME 10.0.11 Cold Effects Preview Targeted

on:
  push:
    branches: [hotfix/endlume-10.0.11-cold-preview-decode]
    paths:
      - ".github/workflows/endlume-1011-cold-effects-preview-targeted.yml"
      - "src-tauri/src/live_preview.rs"
      - "scripts/qa-endlume-1011-cold-effects-preview.py"

permissions:
  contents: read

concurrency:
  group: endlume-1011-cold-effects-preview-targeted
  cancel-in-progress: true

jobs:
  cold-effects-preview:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Stage packaged FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          TMP="$(mktemp -d)"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          cp "$(find "$TMP/fm" -type f -name ffmpeg -print -quit)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(find "$TMP/fp" -type f -name ffprobe -print -quit)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          echo TARGETED_SIDECARS_GREEN

      - name: Compile targeted Preview path
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml live_preview::tests -- --nocapture
          grep -q "ENDLUME_PREVIEW_REAL_FRAME_DECODE_GREEN" src-tauri/src/live_preview.rs
          grep -q "resolve_bundled_ffmpeg" src-tauri/src/live_preview.rs
          grep -q "RESOLVED_FFMPEG_PATH" src-tauri/src/live_preview.rs
          echo TARGETED_COMPILE_GREEN

      - name: Build packaged QA app
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$HOME/.endlume-build-cache/target-1011-cold-preview-targeted"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("src-tauri/tauri.conf.json")
          d=json.loads(p.read_text())
          d["bundle"]["createUpdaterArtifacts"]=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          test -x "$APP/Contents/MacOS/$EXE"
          echo "PACKAGED_APP_BUNDLE=$APP"
          echo "PACKAGED_FFMPEG_CANDIDATES_BEGIN"
          find "$APP/Contents" -maxdepth 6 -type f \( -name 'ffmpeg' -o -name 'ffmpeg-*' \) -perm -111 -print || true
          echo "PACKAGED_FFMPEG_CANDIDATES_END"
          printf '%s' "$APP/Contents/MacOS/$EXE" > "$RUNNER_TEMP/e1011-targeted-bin.txt"
          echo TARGETED_PACKAGED_APP_GREEN

      - name: Cold Effects Preview only
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          BIN="$(cat "$RUNNER_TEMP/e1011-targeted-bin.txt")"
          python3 scripts/qa-endlume-1011-cold-effects-preview.py "$BIN" "$(command -v ffmpeg)" "$(command -v ffprobe)"
          echo ENDLUME_1011_COLD_EFFECTS_TARGETED_GREEN
