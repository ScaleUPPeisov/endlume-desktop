name: ENDLUME 10.0.15 Owner Build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/endlume-1015-owner-build.yml'

permissions:
  contents: read

jobs:
  build-owner-macos-arm64:
    name: Build clean ENDLUME 10.0.15
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30

    env:
      PRODUCT_COMMIT: eaa6eb0a022f184f533338e9ff778328cfe29717

    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          ref: eaa6eb0a022f184f533338e9ff778328cfe29717
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact product source
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "EXPECTED=$PRODUCT_COMMIT"
          echo "ACTUAL=$ACTUAL"
          test "$ACTUAL" = "$PRODUCT_COMMIT"
          test "$(node -p "require('./package.json').version")" = "10.0.15"
          test "$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" = "10.0.15"
          echo "SOURCE_COMMIT=PASS"
          echo "VERSION_SOURCE=PASS"

      - name: Prepare isolated owner target
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET="$RUNNER_TEMP/../_endlume-cache/target-1015-owner-eaa6-clean"
          SEED="$RUNNER_TEMP/../_endlume-cache/target-1015-equalizer-eaa6-exact"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          if [ -d "$SEED" ]; then
            echo "Seeding dependency cache from exact eaa6 target"
            cp -cR "$SEED"/. "$TARGET"/ 2>/dev/null || rsync -a "$SEED"/ "$TARGET"/
          else
            echo "Exact seed cache unavailable; compiling dependencies fresh"
          fi
          rm -rf "$TARGET/aarch64-apple-darwin/release/bundle"
          rm -rf node_modules dist
          echo "CARGO_TARGET_DIR=$TARGET" >> "$GITHUB_ENV"
          echo "ISOLATED_TARGET=$TARGET"

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund

      - name: Prepare FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          mkdir -p src-tauri/binaries
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*

      - name: Frontend production build check
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build

      - name: Force product crate relink from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo clean --manifest-path src-tauri/Cargo.toml -p endlume --release --target aarch64-apple-darwin

      - name: Build clean macOS ARM64 app
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/endlume-owner-tauri-build.log"
          set +e
          npx tauri build --target aarch64-apple-darwin --bundles app 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e
          BUNDLE_DIR="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: app bundle was not produced (tauri rc=$RC)"
            exit "${RC:-1}"
          fi
          if [ "$RC" -ne 0 ]; then
            if grep -q "A public key has been found, but no private key" "$LOG"; then
              echo "Updater signing skipped intentionally; owner .app was built successfully"
            else
              echo "ERROR: unexpected Tauri build failure after app bundling"
              exit "$RC"
            fi
          fi
          echo "APP_BUNDLE_BUILD=PASS"

      - name: Locate and verify app
        id: app
        shell: bash
        run: |
          set -Eeuo pipefail
          BUNDLE_DIR="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test "$VERSION" = "10.0.15"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "APP=$APP"
          echo "VERSION=$VERSION"
          echo "VERSION_10_0_15=PASS"

      - name: Verify QA instrumentation is absent
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="${{ steps.app.outputs.app_path }}"
          MARKERS='FRONTEND_PAYLOAD_BYTES|PIXEL_READBACK|PREVIEW_APPLIED|BROWSER_VISIBLE|paintedNonBlack'
          if grep -RIE "$MARKERS" "$APP/Contents/Resources" >/tmp/endlume-owner-qa-markers.txt 2>/dev/null; then
            echo "ERROR: QA instrumentation leaked into owner build"
            cat /tmp/endlume-owner-qa-markers.txt
            exit 1
          fi
          echo "QA_INSTRUMENTATION=ABSENT"

      - name: Verify or apply local test signature
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="${{ steps.app.outputs.app_path }}"
          if ! codesign --verify --deep --strict "$APP"; then
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          echo "CODESIGN=PASS"

      - name: Package owner test build
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="${{ steps.app.outputs.app_path }}"
          OUT="$RUNNER_TEMP/ENDLUME-10.0.15-OWNER-TEST-ARM64.zip"
          HASH="$RUNNER_TEMP/ENDLUME-10.0.15-OWNER-TEST-ARM64.sha256"
          rm -f "$OUT" "$HASH"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT"
          test -s "$OUT"
          shasum -a 256 "$OUT" | tee "$HASH"
          ls -lh "$OUT"

      - name: Final owner build status
        shell: bash
        run: |
          echo 'CANDIDATE_COMMIT=eaa6eb0a022f184f533338e9ff778328cfe29717'
          echo 'VERSION=10.0.15'
          echo 'CLEAN_ISOLATED_BUILD=PASS'
          echo 'QA_INSTRUMENTATION=ABSENT'
          echo 'PUBLISH=NOT_RUN'
          echo 'RELEASE=NOT_RUN'
          echo 'OWNER_BUILD=READY'

      - name: Upload ENDLUME 10.0.15 owner test build
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.15-OWNER-TEST-ARM64
          path: |
            ${{ runner.temp }}/ENDLUME-10.0.15-OWNER-TEST-ARM64.zip
            ${{ runner.temp }}/ENDLUME-10.0.15-OWNER-TEST-ARM64.sha256
          if-no-files-found: error
          retention-days: 7
