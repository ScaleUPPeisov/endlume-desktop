name: ENDLUME 10.0.13 Phase 2 Manual Keychain Authorization

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-canonical-product-reconstruction
    paths:
      - .github/workflows/endlume-1013-phase2-manual-keychain-auth.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase2-manual-keychain-auth
  cancel-in-progress: true

env:
  CANONICAL_PRODUCT_SHA: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  SOURCE_BUILD_RUN: '38030777284'
  EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250
  EXPECTED_APP_BIN_SHA256: 4d208994181c5ca21b20c2e01dd06bda25e82a16bb1405379e79cc4da3026436
  OWNER_APP_BIN_SHA256: 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7

jobs:
  manual-keychain-auth:
    name: Owner Mac manual Keychain authorization gate
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          test "$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || echo false)" = true
          REPORT="$RUNNER_TEMP/endlume-manual-keychain"
          rm -rf "$REPORT" && mkdir -p "$REPORT"
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER_APP"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist")"
          OWNER_BIN="$OWNER_APP/Contents/MacOS/$OWNER_EXE"
          OWNER_SHA="$(shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          test "$OWNER_SHA" = "$OWNER_APP_BIN_SHA256"
          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then
            echo BLOCKED_OWNER_PRODUCTION_APP_ALREADY_RUNNING=true >&2
            exit 73
          fi
          printf 'OWNER_VERSION=%s\nOWNER_BIN_SHA256=%s\n' "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist")" "$OWNER_SHA" > "$REPORT/owner-before.txt"
          echo SAFETY_GATE=PASS

      - name: Download exact accepted canonical QA artifact
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/manual-keychain-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38030777284

      - name: Verify mount and launch exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-manual-keychain"
          SRC="$RUNNER_TEMP/manual-keychain-source"
          UNPACK="$RUNNER_TEMP/manual-keychain-unpack"
          DMG="$RUNNER_TEMP/manual-keychain.dmg"
          rm -rf "$UNPACK" && mkdir -p "$UNPACK"
          ZIP="$SRC/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          test -f "$ZIP"
          test "$(shasum -a 256 "$ZIP" | awk '{print $1}')" = "$EXPECTED_APP_ZIP_SHA256"
          ditto -x -k "$ZIP" "$UNPACK"
          BUILT_APP="$(find "$UNPACK" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -d "$BUILT_APP"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$BUILT_APP/Contents/Info.plist")"
          BUILT_BIN="$BUILT_APP/Contents/MacOS/$EXE"
          test "$(shasum -a 256 "$BUILT_BIN" | awk '{print $1}')" = "$EXPECTED_APP_BIN_SHA256"
          /usr/bin/codesign --verify --deep --strict "$BUILT_APP"

          rm -f "$DMG"
          hdiutil create -quiet -size 350m -fs APFS -volname ENDLUME_CANONICAL_QA "$DMG"
          hdiutil attach -nobrowse -plist "$DMG" > "$RUNNER_TEMP/manual-keychain-attach.plist"
          VOL="$(python3 - "$RUNNER_TEMP/manual-keychain-attach.plist" <<'PY'
          import plistlib,sys
          p=plistlib.load(open(sys.argv[1],'rb'))
          xs=[x.get('mount-point') for x in p.get('system-entities',[]) if isinstance(x.get('mount-point'),str)]
          if not xs: raise SystemExit(1)
          print(xs[-1])
          PY
          )"
          case "$VOL" in /Volumes/ENDLUME_CANONICAL_QA*) ;; *) exit 74;; esac
          QA_APP="$VOL/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app"
          ditto "$BUILT_APP" "$QA_APP"
          QA_BIN="$QA_APP/Contents/MacOS/$EXE"
          test "$(shasum -a 256 "$QA_BIN" | awk '{print $1}')" = "$EXPECTED_APP_BIN_SHA256"
          /usr/bin/codesign --verify --deep --strict "$QA_APP"
          printf '%s' "$QA_BIN" > "$RUNNER_TEMP/manual-keychain-bin"
          printf '%s' "$VOL" > "$RUNNER_TEMP/manual-keychain-vol"
          /usr/bin/open -n "$QA_APP"

          PID=""
          for second in $(seq 0 30); do
            PIDS="$(pgrep -f "$QA_BIN" || true)"
            COUNT="$(printf '%s\n' "$PIDS" | awk 'NF{n++} END{print n+0}')"
            if [ "$COUNT" -eq 1 ]; then PID="$(printf '%s\n' "$PIDS" | awk 'NF{print;exit}')"; break; fi
            [ "$COUNT" -le 1 ] || exit 75
            sleep 1
          done
          test -n "$PID"
          /usr/sbin/lsof -a -p "$PID" -d txt -Fn 2>/dev/null | grep -Fxq "n$QA_BIN"
          printf '%s' "$PID" > "$RUNNER_TEMP/manual-keychain-pid"
          printf 'CANDIDATE_PID=%s\nCANDIDATE_PATH_PROVEN=YES\nAPP_SHA256=%s\n' "$PID" "$EXPECTED_APP_BIN_SHA256" > "$REPORT/candidate.txt"
          echo CANDIDATE_LAUNCHED=PASS

      - name: Wait for owner manual Keychain authorization and prove product UI
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-manual-keychain"
          PID="$(cat "$RUNNER_TEMP/manual-keychain-pid")"
          echo MANUAL_ACTION_REQUIRED=CLICK_ALLOW_NOT_ALWAYS_ALLOW
          echo MANUAL_PASSWORD_POLICY=ENTER_ONLY_LOCALLY_IF_MACOS_REQUIRES_IT
          : > "$REPORT/probe-attempts.txt"

          cat > "$REPORT/nav-probe.js" <<'JXA'
          function run(argv) {
            const pid = Number(argv[0]);
            const se = Application('System Events');
            const ps = se.applicationProcesses.whose({unixId: pid})();
            if (ps.length !== 1) throw new Error('candidate process not uniquely found');
            const p = ps[0];
            p.frontmost = true;
            delay(0.2);
            const wins = p.windows();
            if (wins.length < 1) return 'WINDOW=false\nNAV_COUNT=0\nACTIVATION=false';
            const flags = {project:false,render:false,library:false,settings:false,activation:false};
            let nodes = 0;
            const maxNodes = 3000;
            const maxDepth = 14;
            function str(fn){try{const v=fn();return v==null?'':String(v);}catch(_){return '';}}
            function walk(el,d){
              if(d>maxDepth||nodes>=maxNodes)return;
              nodes++;
              const name=str(()=>el.name());
              const desc=str(()=>el.description());
              const hay=name+'\n'+desc;
              if(name==='Проект'||desc==='Проект')flags.project=true;
              if(name==='Рендер'||desc==='Рендер')flags.render=true;
              if(name==='Библиотека'||desc==='Библиотека')flags.library=true;
              if(name==='Настройки'||desc==='Настройки')flags.settings=true;
              if(hay.indexOf('АКТИВИРОВАТЬ')>=0||hay.indexOf('Активация ENDLUME')>=0||hay.indexOf('Нужна активация')>=0)flags.activation=true;
              let kids=[];try{kids=el.uiElements();}catch(_){kids=[];}
              for(let i=0;i<kids.length&&nodes<maxNodes;i++)walk(kids[i],d+1);
            }
            walk(wins[0],0);
            const nav=[flags.project,flags.render,flags.library,flags.settings].filter(Boolean).length;
            return [
              'WINDOW=true',
              `NODE_COUNT=${nodes}`,
              `NAV_PROJECT=${flags.project}`,
              `NAV_RENDER=${flags.render}`,
              `NAV_LIBRARY=${flags.library}`,
              `NAV_SETTINGS=${flags.settings}`,
              `NAV_COUNT=${nav}`,
              `ACTIVATION=${flags.activation}`
            ].join('\n');
          }
          JXA

          RESULT=UNKNOWN
          for second in $(seq 0 180); do
            if ! kill -0 "$PID" >/dev/null 2>&1; then
              echo "SECOND=$second PID_ALIVE=NO" >> "$REPORT/probe-attempts.txt"
              RESULT=CANDIDATE_DIED
              break
            fi
            set +e
            OUT=$(/usr/bin/osascript -l JavaScript "$REPORT/nav-probe.js" "$PID" 2>"$REPORT/nav-probe.raw.err")
            RC=$?
            set -e
            NAV_COUNT="$(printf '%s\n' "$OUT" | awk -F= '$1=="NAV_COUNT"{print $2}')"
            ACTIVATION="$(printf '%s\n' "$OUT" | awk -F= '$1=="ACTIVATION"{print $2}')"
            NODES="$(printf '%s\n' "$OUT" | awk -F= '$1=="NODE_COUNT"{print $2}')"
            printf 'SECOND=%s RC=%s NODE_COUNT=%s NAV_COUNT=%s ACTIVATION=%s\n' "$second" "$RC" "${NODES:-UNKNOWN}" "${NAV_COUNT:-UNKNOWN}" "${ACTIVATION:-UNKNOWN}" >> "$REPORT/probe-attempts.txt"
            if [ "$RC" -eq 0 ] && [ "${ACTIVATION:-false}" = true ]; then
              printf '%s\n' "$OUT" > "$REPORT/final-probe.txt"
              RESULT=ACTIVATION_REQUIRED
              break
            fi
            if [ "$RC" -eq 0 ] && [ "${NAV_COUNT:-0}" -eq 4 ] 2>/dev/null; then
              printf '%s\n' "$OUT" > "$REPORT/final-probe.txt"
              RESULT=LICENSED_NAV
              break
            fi
            sleep 1
          done
          rm -f "$REPORT/nav-probe.js"
          sed -E 's#/(Users|Volumes)/[^[:space:]]+#<PATH>#g; s/ENDLUME-[A-Z2-9-]+/<LICENSE_REDACTED>/g; s/(Bearer )[A-Za-z0-9._-]+/\1<REDACTED>/g' "$REPORT/nav-probe.raw.err" | head -40 > "$REPORT/nav-probe.err" || true
          rm -f "$REPORT/nav-probe.raw.err"

          if [ "$RESULT" = LICENSED_NAV ]; then
            printf 'KEYCHAIN_MANUAL_AUTH=COMPLETED\nACTIVATION_STATE=LICENSED\nNORMAL_NAVIGATION=PASS\nLICENSED_SESSION=PASS\n' > "$REPORT/gate-status.txt"
            echo LICENSED_SESSION=PASS
          elif [ "$RESULT" = ACTIVATION_REQUIRED ]; then
            printf 'KEYCHAIN_MANUAL_AUTH=COMPLETED_OR_NOT_BLOCKING\nACTIVATION_STATE=ACTIVATION_REQUIRED\nNORMAL_NAVIGATION=FAIL\nLICENSED_SESSION=FAIL\n' > "$REPORT/gate-status.txt"
            echo LICENSED_SESSION=FAIL
            exit 75
          elif [ "$RESULT" = CANDIDATE_DIED ]; then
            printf 'KEYCHAIN_MANUAL_AUTH=UNKNOWN\nACTIVATION_STATE=UNKNOWN\nNORMAL_NAVIGATION=UNKNOWN\nLICENSED_SESSION=UNKNOWN\nBLOCKER=CANDIDATE_DIED\n' > "$REPORT/gate-status.txt"
            echo LICENSED_SESSION=UNKNOWN
            exit 85
          else
            printf 'KEYCHAIN_MANUAL_AUTH=TIMEOUT\nACTIVATION_STATE=UNKNOWN\nNORMAL_NAVIGATION=UNKNOWN\nLICENSED_SESSION=UNKNOWN\nBLOCKER=MANUAL_AUTH_NOT_OBSERVED\n' > "$REPORT/gate-status.txt"
            echo LICENSED_SESSION=UNKNOWN
            exit 89
          fi

          set +e
          GEOM=$(/usr/bin/osascript - "$PID" 2>/dev/null <<'OSA'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              set ps to every application process whose unix id is targetPid
              if (count of ps) is not 1 then error "missing candidate"
              tell item 1 of ps
                if (count of windows) is 0 then error "no window"
                set p to position of window 1
                set s to size of window 1
                return (item 1 of p as text) & "," & (item 2 of p as text) & "," & (item 1 of s as text) & "," & (item 2 of s as text)
              end tell
            end tell
          end run
          OSA
          )
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            IFS=',' read -r X Y W H <<EOF
          $GEOM
          EOF
            CROP_H=220
            [ "$H" -ge "$CROP_H" ] || CROP_H="$H"
            /usr/sbin/screencapture -x -R"$X,$Y,$W,$CROP_H" "$REPORT/top-nav-after-manual-auth.png"
            test -s "$REPORT/top-nav-after-manual-auth.png"
            printf 'SAFE_CROP=TOP_220PX_ONLY\nLICENSE_SECRET_REGION_CAPTURED=NO_BY_GEOMETRY\n' > "$REPORT/screenshot-safety.txt"
          fi

      - name: Cleanup and verify owner application unchanged
        if: always()
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/endlume-manual-keychain"
          QA_BIN="$(cat "$RUNNER_TEMP/manual-keychain-bin" 2>/dev/null || true)"
          QA_VOL="$(cat "$RUNNER_TEMP/manual-keychain-vol" 2>/dev/null || true)"
          [ -z "$QA_BIN" ] || pkill -f "$QA_BIN" >/dev/null 2>&1 || true
          sleep 2
          [ -z "$QA_VOL" ] || hdiutil detach -quiet "$QA_VOL" >/dev/null 2>&1 || true
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)"
          OWNER_SHA="$(shasum -a 256 "$OWNER_APP/Contents/MacOS/$OWNER_EXE" 2>/dev/null | awk '{print $1}')"
          printf 'OWNER_VERSION=%s\nOWNER_BIN_SHA256=%s\n' "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)" "$OWNER_SHA" > "$REPORT/owner-after.txt"
          cmp -s "$REPORT/owner-before.txt" "$REPORT/owner-after.txt"
          echo OWNER_APPLICATION_REPLACED=NO

      - name: Upload non-secret manual authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE2-MANUAL-KEYCHAIN-AUTH
          path: |
            ${{ runner.temp }}/endlume-manual-keychain/candidate.txt
            ${{ runner.temp }}/endlume-manual-keychain/probe-attempts.txt
            ${{ runner.temp }}/endlume-manual-keychain/final-probe.txt
            ${{ runner.temp }}/endlume-manual-keychain/nav-probe.err
            ${{ runner.temp }}/endlume-manual-keychain/gate-status.txt
            ${{ runner.temp }}/endlume-manual-keychain/screenshot-safety.txt
            ${{ runner.temp }}/endlume-manual-keychain/top-nav-after-manual-auth.png
            ${{ runner.temp }}/endlume-manual-keychain/owner-before.txt
            ${{ runner.temp }}/endlume-manual-keychain/owner-after.txt
          if-no-files-found: warn
          retention-days: 14
