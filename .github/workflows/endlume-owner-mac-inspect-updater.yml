name: ENDLUME owner Mac inspect installed updater wiring

on:
  push:
    branches: [release]
    paths: ['.github/workflows/endlume-owner-mac-inspect-updater.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Inspect exact installed ENDLUME binary
        shell: bash
        run: |
          set -euo pipefail
          APP='/Applications/ENDLUME YT Studio PEISOV.app'
          INFO="$APP/Contents/Info.plist"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          BIN="$APP/Contents/MacOS/$EXE"
          echo CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          echo CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          echo BINARY_SHA256=$(shasum -a 256 "$BIN" | awk '{print $1}')
          echo '--- MATCHING STRINGS ---'
          strings -a "$BIN" | grep -Ei 'endlume-(stable|test12)|scaleup-site/releases/download|endlume-updates\.vercel\.app|api/update' || true
