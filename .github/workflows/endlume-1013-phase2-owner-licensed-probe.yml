name: ENDLUME 10.0.13 Phase 2 Owner Licensed Probe

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-canonical-product-reconstruction
    paths:
      - .github/workflows/endlume-1013-phase2-owner-licensed-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase2-owner-licensed-probe
  cancel-in-progress: true

env:
  CANONICAL_PRODUCT_SHA: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  SOURCE_BUILD_RUN: '38030777284'
  SOURCE_ARTIFACT_ID: '11661604955'
  EXPECTED_APP_ZIP_SHA256: 0b374fffa3dbf057620d2f3a5b7919306df474767494ef2daead3bb319afb250

jobs:
  licensed-probe:
    name: Owner Mac licensed canonical UI probe
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Hard owner-runner and TCC gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          echo "RUNNER_NAME_OK=true"
          echo "CONSOLE_USER=$(stat -f '%Su' /dev/console)"
          UI=$(/usr/bin/osascript -e 'tell application "System Events" to return UI elements enabled' 2>/dev/null || echo false)
          echo "UI_ELEMENTS_ENABLED=$UI"
          test "$UI" = "true"
          rm -f "$RUNNER_TEMP/endlume-tcc-probe.png"
          /usr/sbin/screencapture -x "$RUNNER_TEMP/endlume-tcc-probe.png"
          test -s "$RUNNER_TEMP/endlume-tcc-probe.png"
          rm -f "$RUNNER_TEMP/endlume-tcc-probe.png"
          echo "SCREEN_CAPTURE_ALLOWED=true"

      - name: Snapshot owner state metadata before candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="$RUNNER_TEMP/endlume-phase2-probe"
          rm -rf "$REPORT"
          mkdir -p "$REPORT"
          APP_DATA="$HOME/Library/Application Support/studio.endlume.desktop"
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER_APP"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist")"
          OWNER_BIN="$OWNER_APP/Contents/MacOS/$OWNER_EXE"
          test -f "$OWNER_BIN"
          OWNER_VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist")"
          OWNER_BIN_SHA="$(shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          OWNER_INFO_SHA="$(shasum -a 256 "$OWNER_APP/Contents/Info.plist" | awk '{print $1}')"
          printf 'OWNER_APP_EXISTS=YES\nOWNER_APP_VERSION=%s\nOWNER_APP_BINARY_SHA256=%s\nOWNER_APP_INFO_SHA256=%s\n' "$OWNER_VER" "$OWNER_BIN_SHA" "$OWNER_INFO_SHA" > "$REPORT/owner-app-before.txt"

          snapshot() {
            local out="$1"
            : > "$out"
            for n in license.json device.json library.json queue.json recovery.json session.json settings.json; do
              p="$APP_DATA/$n"
              if [ -f "$p" ]; then
                sz="$(stat -f '%z' "$p")"
                sha="$(shasum -a 256 "$p" | awk '{print $1}')"
                printf '%s\tEXISTS\t%s\t%s\n' "$n" "$sz" "$sha" >> "$out"
              else
                printf '%s\tABSENT\t0\t-\n' "$n" >> "$out"
              fi
            done
          }
          snapshot "$REPORT/state-before.tsv"
          echo "APP_DATA_PATH=$APP_DATA" > "$REPORT/state-path.txt"
          echo "KEYCHAIN_SESSION_CONTENT=NOT_READ" >> "$REPORT/state-path.txt"
          echo "OWNER_STATE_BEFORE=PASS"
          echo "OWNER_APP_VERSION=$OWNER_VER"
          echo "OWNER_APP_BINARY_SHA256=$OWNER_BIN_SHA"

          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then
            echo "BLOCKED_OWNER_PRODUCTION_APP_ALREADY_RUNNING=true" >&2
            exit 73
          fi

      - name: Download exact accepted canonical QA artifact
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-CANONICAL-GOOD-PRODUCT-QA
          path: ${{ runner.temp }}/canonical-source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38030777284

      - name: Verify exact candidate and mount isolated volume
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/canonical-source-artifact"
          UNPACK="$RUNNER_TEMP/canonical-owner-unpacked"
          DMG="$RUNNER_TEMP/ENDLUME-CANONICAL-OWNER-QA.dmg"
          REPORT="$RUNNER_TEMP/endlume-phase2-probe"
          rm -rf "$UNPACK"
          mkdir -p "$UNPACK"
          ZIP="$SRC/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app.zip"
          test -f "$ZIP"
          ZIP_SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          test "$ZIP_SHA" = "$EXPECTED_APP_ZIP_SHA256"
          ditto -x -k "$ZIP" "$UNPACK"
          BUILT_APP="$(find "$UNPACK" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$BUILT_APP" -a -d "$BUILT_APP"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$BUILT_APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$BUILT_APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$BUILT_APP/Contents/Info.plist")"
          test "$BID" = studio.endlume.desktop
          test "$VER" = 10.0.11
          /usr/bin/lipo -archs "$BUILT_APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$BUILT_APP"
          APP_BIN_SHA="$(shasum -a 256 "$BUILT_APP/Contents/MacOS/$EXE" | awk '{print $1}')"

          rm -f "$DMG"
          hdiutil create -quiet -size 350m -fs APFS -volname ENDLUME_CANONICAL_QA "$DMG"
          hdiutil attach -nobrowse -plist "$DMG" > "$RUNNER_TEMP/endlume-canonical-attach.plist"
          VOL="$(python3 - "$RUNNER_TEMP/endlume-canonical-attach.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: p=plistlib.load(f)
          xs=[x.get('mount-point') for x in p.get('system-entities',[]) if isinstance(x.get('mount-point'),str)]
          if not xs: raise SystemExit('no mount point')
          print(xs[-1])
          PY
          )"
          case "$VOL" in /Volumes/ENDLUME_CANONICAL_QA*) ;; *) echo "bad mount: $VOL" >&2; exit 74;; esac
          QA_APP="$VOL/ENDLUME-CANONICAL-GOOD-PRODUCT-QA.app"
          ditto "$BUILT_APP" "$QA_APP"
          /usr/bin/codesign --verify --deep --strict "$QA_APP"
          QA_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$QA_APP/Contents/Info.plist")"
          QA_BIN="$QA_APP/Contents/MacOS/$QA_EXE"
          QA_BIN_SHA="$(shasum -a 256 "$QA_BIN" | awk '{print $1}')"
          test "$QA_BIN_SHA" = "$APP_BIN_SHA"
          printf 'CANDIDATE_PRODUCT_SHA=%s\nAPP_PATH=%s\nAPP_SHA256=%s\nAPP_ZIP_SHA256=%s\nVERSION=%s\nBUNDLE_ID=%s\n' "$CANONICAL_PRODUCT_SHA" "$QA_APP" "$QA_BIN_SHA" "$ZIP_SHA" "$VER" "$BID" > "$REPORT/candidate.txt"
          printf 'QA_APP=%s\nQA_BIN=%s\nQA_VOL=%s\n' "$QA_APP" "$QA_BIN" "$VOL" > "$RUNNER_TEMP/endlume-canonical-env"
          echo "CANDIDATE_PRODUCT_SHA=$CANONICAL_PRODUCT_SHA"
          echo "APP_PATH=$QA_APP"
          echo "APP_SHA256=$QA_BIN_SHA"
          echo "APP_ZIP_SHA256=$ZIP_SHA"

      - name: Launch exact candidate and prove PID path window accessibility license state
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/endlume-canonical-env"
          REPORT="$RUNNER_TEMP/endlume-phase2-probe"
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER_APP"

          if pgrep -f "$QA_BIN" >/dev/null 2>&1; then
            echo "AUTOMATION_STATUS=BLOCKED_PREEXISTING_CANDIDATE_PROCESS" | tee "$REPORT/probe-status.txt"
            exit 80
          fi

          set +e
          /usr/bin/open -n "$QA_APP" >"$REPORT/open.stdout.txt" 2>"$REPORT/open.stderr.raw"
          OPEN_RC=$?
          set -e
          printf 'OPEN_EXIT_CODE=%s\n' "$OPEN_RC" > "$REPORT/open-status.txt"
          if [ "$OPEN_RC" -ne 0 ]; then
            sed -E 's#/(Users|Volumes)/[^[:space:]]+#<PATH>#g; s/ENDLUME-[A-Z2-9-]+/<LICENSE_REDACTED>/g; s/(Bearer )[A-Za-z0-9._-]+/\1<REDACTED>/g' "$REPORT/open.stderr.raw" | head -40 > "$REPORT/open.stderr.txt" || true
            rm -f "$REPORT/open.stderr.raw"
            echo "AUTOMATION_STATUS=OPEN_FAILED" | tee "$REPORT/probe-status.txt"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 81
          fi
          rm -f "$REPORT/open.stderr.raw"

          CANDIDATE_PID=""
          for second in $(seq 0 30); do
            PIDS="$(pgrep -f "$QA_BIN" || true)"
            COUNT="$(printf '%s\n' "$PIDS" | awk 'NF{n++} END{print n+0}')"
            if [ "$COUNT" -eq 1 ]; then
              CANDIDATE_PID="$(printf '%s\n' "$PIDS" | awk 'NF{print; exit}')"
              break
            fi
            if [ "$COUNT" -gt 1 ]; then
              printf 'CANDIDATE_PID_COUNT=%s\n' "$COUNT" > "$REPORT/candidate-process.txt"
              echo "AUTOMATION_STATUS=BLOCKED_MULTIPLE_CANDIDATE_PIDS" | tee "$REPORT/probe-status.txt"
              echo "LICENSED_SESSION=UNKNOWN"
              exit 82
            fi
            sleep 1
          done
          if [ -z "$CANDIDATE_PID" ]; then
            echo "AUTOMATION_STATUS=CANDIDATE_PROCESS_NOT_FOUND" | tee "$REPORT/probe-status.txt"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 83
          fi

          printf '%s\n' "$CANDIDATE_PID" > "$REPORT/candidate-pid.txt"
          kill -0 "$CANDIDATE_PID"
          if ! /usr/sbin/lsof -a -p "$CANDIDATE_PID" -d txt -Fn 2>/dev/null | grep -Fxq "n$QA_BIN"; then
            printf 'CANDIDATE_PID=%s\nCANDIDATE_PATH_PROVEN=NO\n' "$CANDIDATE_PID" > "$REPORT/candidate-process.txt"
            echo "AUTOMATION_STATUS=CANDIDATE_PATH_MISMATCH" | tee "$REPORT/probe-status.txt"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 84
          fi
          printf 'CANDIDATE_PID=%s\nCANDIDATE_PATH_PROVEN=YES\nCANDIDATE_APP_PATH=%s\n' "$CANDIDATE_PID" "$QA_APP" > "$REPORT/candidate-process.txt"
          echo "CANDIDATE_PID=PASS"
          echo "CANDIDATE_PATH=PASS"

          READY=0
          : > "$REPORT/window-readiness.txt"
          for second in $(seq 0 60); do
            if ! kill -0 "$CANDIDATE_PID" >/dev/null 2>&1; then
              printf 'SECOND=%s PID_ALIVE=NO\n' "$second" >> "$REPORT/window-readiness.txt"
              echo "AUTOMATION_STATUS=BLOCKED_CANDIDATE_DIED" | tee "$REPORT/probe-status.txt"
              echo "LICENSED_SESSION=UNKNOWN"
              exit 85
            fi

            set +e
            WC=$(/usr/bin/osascript - "$CANDIDATE_PID" 2>"$REPORT/window-ready.raw.err" <<'OSA'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              set ps to every application process whose unix id is targetPid
              if (count of ps) is not 1 then return "0"
              tell item 1 of ps
                return (count of windows) as text
              end tell
            end tell
          end run
          OSA
            )
            READY_RC=$?
            set -e
            printf 'SECOND=%s PID_ALIVE=YES OSASCRIPT_RC=%s WINDOW_COUNT=%s\n' "$second" "$READY_RC" "${WC:-UNKNOWN}" >> "$REPORT/window-readiness.txt"
            if [ "$READY_RC" -eq 0 ] && [ "${WC:-0}" -gt 0 ] 2>/dev/null; then
              READY=1
              echo "WINDOW_READY_AFTER_SECONDS=$second"
              break
            fi
            sleep 1
          done
          sed -E 's#/(Users|Volumes)/[^[:space:]]+#<PATH>#g; s/ENDLUME-[A-Z2-9-]+/<LICENSE_REDACTED>/g; s/(Bearer )[A-Za-z0-9._-]+/\1<REDACTED>/g' "$REPORT/window-ready.raw.err" | head -40 > "$REPORT/window-ready.err" || true
          rm -f "$REPORT/window-ready.raw.err"

          if [ "$READY" -ne 1 ]; then
            echo "AUTOMATION_STATUS=BLOCKED_WINDOW_NOT_READY" | tee "$REPORT/probe-status.txt"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 86
          fi
          echo "WINDOW=PASS"

          cat > "$REPORT/ui-probe.js" <<'JXA'
          function run(argv) {
            const pid = Number(argv[0]);
            const se = Application('System Events');
            const matches = se.applicationProcesses.whose({unixId: pid})();
            if (matches.length !== 1) throw new Error('candidate process not uniquely found by PID');
            const p = matches[0];
            p.frontmost = true;
            delay(0.5);
            const wins = p.windows();
            if (wins.length < 1) throw new Error('candidate window not found');

            const flags = {
              project:false, render:false, library:false, settings:false,
              activation:false
            };
            let nodes = 0;
            const maxNodes = 2500;
            const maxDepth = 12;

            function textOf(fn) {
              try {
                const v = fn();
                if (v === null || v === undefined) return '';
                return String(v);
              } catch (_) { return ''; }
            }

            function walk(el, depth) {
              if (depth > maxDepth || nodes >= maxNodes) return;
              nodes += 1;
              const role = textOf(() => el.role());
              const name = textOf(() => el.name());
              const desc = textOf(() => el.description());
              const hay = `${name}\n${desc}`;
              if (role === 'AXButton' || role === 'AXStaticText' || role === 'AXHeading' ||
                  role === 'AXCheckBox' || role === 'AXRadioButton' || role === 'AXGroup') {
                if (name === 'Проект' || desc === 'Проект') flags.project = true;
                if (name === 'Рендер' || desc === 'Рендер') flags.render = true;
                if (name === 'Библиотека' || desc === 'Библиотека') flags.library = true;
                if (name === 'Настройки' || desc === 'Настройки') flags.settings = true;
                if (hay.indexOf('АКТИВИРОВАТЬ') >= 0 ||
                    hay.indexOf('Активация ENDLUME') >= 0 ||
                    hay.indexOf('Нужна активация') >= 0) flags.activation = true;
              }
              let kids = [];
              try { kids = el.uiElements(); } catch (_) { kids = []; }
              for (let i = 0; i < kids.length && nodes < maxNodes; i++) walk(kids[i], depth + 1);
            }

            walk(wins[0], 0);
            return [
              'WINDOW_READY=true',
              `NODE_COUNT=${nodes}`,
              `NAV_PROJECT=${flags.project}`,
              `NAV_RENDER=${flags.render}`,
              `NAV_LIBRARY=${flags.library}`,
              `NAV_SETTINGS=${flags.settings}`,
              `ACTIVATION_VISIBLE=${flags.activation}`
            ].join('\n');
          }
          JXA

          set +e
          /usr/bin/osascript -l JavaScript "$REPORT/ui-probe.js" "$CANDIDATE_PID" > "$REPORT/ui-probe.txt" 2> "$REPORT/ui-probe.raw.err"
          OSA_RC=$?
          set -e
          printf 'OSASCRIPT_EXIT_CODE=%s\n' "$OSA_RC" > "$REPORT/osascript-status.txt"
          sed -E 's#/(Users|Volumes)/[^[:space:]]+#<PATH>#g; s/ENDLUME-[A-Z2-9-]+/<LICENSE_REDACTED>/g; s/(Bearer )[A-Za-z0-9._-]+/\1<REDACTED>/g' "$REPORT/ui-probe.raw.err" | head -60 > "$REPORT/ui-probe.err" || true
          rm -f "$REPORT/ui-probe.raw.err" "$REPORT/ui-probe.js"

          if [ "$OSA_RC" -ne 0 ]; then
            echo "AUTOMATION_STATUS=FAIL_OSASCRIPT" | tee "$REPORT/probe-status.txt"
            echo "ACCESSIBILITY=FAIL"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 87
          fi

          echo "ACCESSIBILITY=PASS"
          UI="$REPORT/ui-probe.txt"
          ACTIVATION="$(awk -F= '$1=="ACTIVATION_VISIBLE"{print $2}' "$UI")"
          NP="$(awk -F= '$1=="NAV_PROJECT"{print $2}' "$UI")"
          NR="$(awk -F= '$1=="NAV_RENDER"{print $2}' "$UI")"
          NL="$(awk -F= '$1=="NAV_LIBRARY"{print $2}' "$UI")"
          NS="$(awk -F= '$1=="NAV_SETTINGS"{print $2}' "$UI")"

          if [ "$ACTIVATION" = "true" ]; then
            printf 'AUTOMATION_STATUS=PASS\nACTIVATION_STATE=ACTIVATION_REQUIRED\nNORMAL_NAVIGATION=FAIL\nLICENSED_SESSION=FAIL\n' > "$REPORT/probe-status.txt"
            echo "ACTIVATION_STATE=ACTIVATION_REQUIRED"
            echo "NORMAL_NAVIGATION=FAIL"
            echo "LICENSED_SESSION=FAIL"
            echo "LICENSE_BYPASS=NO"
            echo "PRODUCTION_LICENSE_SECRET_EXPOSED=NO"
            exit 75
          fi

          if [ "$NP" = "true" ] && [ "$NR" = "true" ] && [ "$NL" = "true" ] && [ "$NS" = "true" ]; then
            printf 'AUTOMATION_STATUS=PASS\nACTIVATION_STATE=LICENSED\nNORMAL_NAVIGATION=PASS\nLICENSED_SESSION=PASS\n' > "$REPORT/probe-status.txt"
            echo "ACTIVATION_STATE=LICENSED"
            echo "NORMAL_NAVIGATION=PASS"
            echo "LICENSED_SESSION=PASS"
            echo "LICENSE_BYPASS=NO"
            echo "PRODUCTION_LICENSE_SECRET_EXPOSED=NO"
            /usr/sbin/screencapture -x "$REPORT/project-licensed.png"
            test -s "$REPORT/project-licensed.png"
          else
            printf 'AUTOMATION_STATUS=PASS\nACTIVATION_STATE=UNKNOWN\nNORMAL_NAVIGATION=UNKNOWN\nLICENSED_SESSION=UNKNOWN\n' > "$REPORT/probe-status.txt"
            echo "ACTIVATION_STATE=UNKNOWN"
            echo "NORMAL_NAVIGATION=UNKNOWN"
            echo "LICENSED_SESSION=UNKNOWN"
            exit 88
          fi

      - name: Snapshot state after probe and verify owner app immutability
        if: always()
        shell: bash
        run: |
          set -u
          REPORT="$RUNNER_TEMP/endlume-phase2-probe"
          APP_DATA="$HOME/Library/Application Support/studio.endlume.desktop"
          OWNER_APP="/Applications/ENDLUME YT Studio PEISOV.app"
          if [ -f "$RUNNER_TEMP/endlume-canonical-env" ]; then
            source "$RUNNER_TEMP/endlume-canonical-env"
            pkill -f "$QA_BIN" >/dev/null 2>&1 || true
            sleep 2
            hdiutil detach -quiet "$QA_VOL" >/dev/null 2>&1 || true
          fi

          snapshot() {
            local out="$1"
            : > "$out"
            for n in license.json device.json library.json queue.json recovery.json session.json settings.json; do
              p="$APP_DATA/$n"
              if [ -f "$p" ]; then
                sz="$(stat -f '%z' "$p")"
                sha="$(shasum -a 256 "$p" | awk '{print $1}')"
                printf '%s\tEXISTS\t%s\t%s\n' "$n" "$sz" "$sha" >> "$out"
              else
                printf '%s\tABSENT\t0\t-\n' "$n" >> "$out"
              fi
            done
          }
          snapshot "$REPORT/state-after.tsv"

          if [ -d "$OWNER_APP" ]; then
            OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)"
            OWNER_BIN="$OWNER_APP/Contents/MacOS/$OWNER_EXE"
            OWNER_VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$OWNER_APP/Contents/Info.plist" 2>/dev/null || true)"
            OWNER_BIN_SHA="$(shasum -a 256 "$OWNER_BIN" 2>/dev/null | awk '{print $1}')"
            OWNER_INFO_SHA="$(shasum -a 256 "$OWNER_APP/Contents/Info.plist" 2>/dev/null | awk '{print $1}')"
            printf 'OWNER_APP_EXISTS=YES\nOWNER_APP_VERSION=%s\nOWNER_APP_BINARY_SHA256=%s\nOWNER_APP_INFO_SHA256=%s\n' "$OWNER_VER" "$OWNER_BIN_SHA" "$OWNER_INFO_SHA" > "$REPORT/owner-app-after.txt"
          else
            printf 'OWNER_APP_EXISTS=NO\n' > "$REPORT/owner-app-after.txt"
          fi

          if [ -f "$REPORT/owner-app-before.txt" ] && cmp -s "$REPORT/owner-app-before.txt" "$REPORT/owner-app-after.txt"; then
            echo "OWNER_APPLICATION_REPLACED=NO"
          else
            echo "OWNER_APPLICATION_REPLACED=FAIL" >&2
            exit 78
          fi
          echo "STATE_METADATA_AFTER=PASS"
          echo "KEYCHAIN_SESSION_CONTENT=NOT_READ"

      - name: Upload non-secret probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE2-OWNER-LICENSED-PROBE
          path: |
            ${{ runner.temp }}/endlume-phase2-probe/candidate.txt
            ${{ runner.temp }}/endlume-phase2-probe/candidate-pid.txt
            ${{ runner.temp }}/endlume-phase2-probe/candidate-process.txt
            ${{ runner.temp }}/endlume-phase2-probe/open-status.txt
            ${{ runner.temp }}/endlume-phase2-probe/open.stderr.txt
            ${{ runner.temp }}/endlume-phase2-probe/window-readiness.txt
            ${{ runner.temp }}/endlume-phase2-probe/window-ready.err
            ${{ runner.temp }}/endlume-phase2-probe/osascript-status.txt
            ${{ runner.temp }}/endlume-phase2-probe/ui-probe.txt
            ${{ runner.temp }}/endlume-phase2-probe/ui-probe.err
            ${{ runner.temp }}/endlume-phase2-probe/probe-status.txt
            ${{ runner.temp }}/endlume-phase2-probe/owner-app-before.txt
            ${{ runner.temp }}/endlume-phase2-probe/owner-app-after.txt
            ${{ runner.temp }}/endlume-phase2-probe/state-before.tsv
            ${{ runner.temp }}/endlume-phase2-probe/state-after.tsv
            ${{ runner.temp }}/endlume-phase2-probe/state-path.txt
            ${{ runner.temp }}/endlume-phase2-probe/project-licensed.png
          if-no-files-found: warn
          retention-days: 14
