name: ENDLUME 8.57 Master Frame Hotfix
on:
  push:
    branches: [candidate/endlume-857-master-frame-hotfix]
permissions:
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/endlume-857-master-frame-hotfix
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Restore embedded FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true
      - name: Apply 8.56 then 8.57 hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
      - name: Prove frozen contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=23cb01908604cf7583843c1b1bf74eafa7205a69
          git diff --exit-code "$BASE" -- src-tauri/src/vyron_bridge.rs src-tauri/src/vyron_bridge_tests.rs src/components/VyronBatchBridge.tsx src/tauri.ts src/pages/App.tsx src/pages/ProjectPage.tsx src/pages/RenderPage.tsx src/store.ts
          grep -Fq 'shortest=0:repeatlast=1:eof_action=repeat' src-tauri/src/render.rs
          ! grep -Fq "strict-prealpha" src-tauri/src/render.rs || true
          grep -Fq 'let max_attempts=if smart_repeat_project(job){1}else{2};' src-tauri/src/render.rs
          grep -Fq 'software fallback отключён' src-tauri/src/render.rs
          grep -Fq 'resolved_job.settings.duration_mode="whole-track".into();' src-tauri/src/render.rs
          grep -Fq 'resolved_job.settings.crossfade_sec=0.0;' src-tauri/src/render.rs
          grep -Fq 'STRICT_856_MIN_BYTES:u64=400_000_000' src-tauri/src/render.rs
          grep -Fq 'STRICT_856_MAX_BYTES:u64=700_000_000' src-tauri/src/render.rs
          grep -Fq 'source_manifest_path' src-tauri/src/vyron_bridge.rs
          grep -Fq 'selected_project_ids' src-tauri/src/vyron_bridge.rs
          grep -Fq '<VyronBatchBridge/>' src/pages/App.tsx
          grep -Fq 'ENDLUME Studio 1.0.0-alpha.8.57' src/pages/SettingsPage.tsx
          grep -Fq "version:'1.0.0-alpha.8.57'" src/components/ReleaseHistory.tsx
          grep -Fq 'current:true' src/components/ReleaseHistory.tsx
          python3 - <<'PY'
          import json,re,subprocess
          assert json.load(open('package.json'))['version']=='1.0.0-alpha.8.57'
          assert json.load(open('src-tauri/tauri.conf.json'))['version']=='1.0.0-alpha.8.57'
          c=open('src-tauri/Cargo.toml').read(); assert re.search(r'^version\s*=\s*"1\.0\.0-alpha\.8\.57"$',c,re.M)
          a=subprocess.check_output(['/usr/bin/sips','-g','hasAlpha','src-tauri/icons/icon.png'],text=True).lower(); assert 'yes' in a,a
          PY
      - name: Compile and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml mp4_manifest::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture
      - name: Reproduce exact real master and require 3381 frames
        shell: bash
        run: |
          set -Eeuo pipefail
          METRICS="$GITHUB_WORKSPACE/857-master-metrics.json"
          rm -f "$METRICS"
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          BASE="$(find /Volumes -type d -name "$UUID" -print -quit 2>/dev/null || true)"; test -d "$BASE"
          SIDE="$(find "$BASE" -type f -path '*/Rendered/logs/*' -name '*project.json' -print -quit 2>/dev/null || true)"; test -f "$SIDE"
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"; FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          TMP="$(mktemp -d /tmp/e857frames.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          python3 - "$SIDE" "$TMP/env" <<'PY'
          import json,shlex,sys
          d=json.load(open(sys.argv[1])); assert len(d['project']['media'])==1 and len(d['project']['audio'])==15
          fx=[x for x in d['effects'] if x.get('enabled')]; assert len(fx)>=2
          open(sys.argv[2],'w').write('\n'.join(['IMG='+shlex.quote(d['project']['media'][0]),'FX1='+shlex.quote(fx[0]['source']),'FX2='+shlex.quote(fx[1]['source'])]))
          PY
          source "$TMP/env"
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          GRAPH="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          t0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$GRAPH" -map '[outv]' -frames:v 3381 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 3381 -tag:v hvc1 -pix_fmt yuv420p -fps_mode cfr -r 60 -video_track_timescale 60000 -y "$TMP/master.mp4"
          t1=$(python3 -c 'import time;print(time.time())')
          FRAMES="$($FFP -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$TMP/master.mp4")"
          RATE="$($FFP -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of csv=p=0 "$TMP/master.mp4")"
          DUR="$($FFP -v error -show_entries format=duration -of csv=p=0 "$TMP/master.mp4")"
          python3 - "$t0" "$t1" "$FRAMES" "$RATE" "$DUR" "$METRICS" <<'PY'
          import json,sys
          dt=float(sys.argv[2])-float(sys.argv[1]); frames=int(sys.argv[3]); rate=sys.argv[4]; dur=float(sys.argv[5]); path=sys.argv[6]
          data={'seconds':round(dt,3),'frames':frames,'rate':rate,'duration':round(dur,6)}
          json.dump(data,open(path,'w'),indent=2)
          print('REAL_857_MASTER_SEC',round(dt,3),'FRAMES',frames,'RATE',rate,'DURATION',round(dur,3))
          assert frames==3381,frames
          assert rate=='1920,1080,60/1',rate
          assert 56.34<=dur<=56.37,dur
          assert dt<=24.0,dt
          PY
          echo 'PASS: exact real Strict master is 3381 frames, 1920x1080/60 and within render budget'
      - name: Upload exact-master metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-857-master-metrics
          path: 857-master-metrics.json
          if-no-files-found: warn
