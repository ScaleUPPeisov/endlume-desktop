name: ENDLUME 8.61 Windows Cross RC Publisher

on:
  push:
    branches: [windows/endlume-861-managed-access]
    paths:
      - '.github/workflows/endlume-861-windows-cross-rc-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-861-windows-cross-rc-publisher
  cancel-in-progress: true

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  FINAL_INSTALLER: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
  RELEASE_TAG: endlume-v1.0.0-alpha.8.61-windows-rc

jobs:
  publish-cross-rc:
    name: Windows x64 • Hosted Linux Cross NSIS • Publish RC
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout current branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify RC source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path('package.json').read_text())
          base = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          win = json.loads(Path('src-tauri/tauri.windows.conf.json').read_text())
          assert pkg['version'] == '1.0.0-alpha.8.61'
          assert base['version'] == '1.0.0-alpha.8.61'
          assert base['identifier'] == 'studio.endlume.desktop'
          assert win['identifier'] == 'studio.endlume.desktop'
          assert win['productName'] == 'ENDLUME YT Studio PEISOV'
          assert win['mainBinaryName'] == 'ENDLUME YT Studio PEISOV'
          assert win['bundle']['targets'] == ['nsis']
          assert win['bundle']['windows']['nsis']['installerIcon'] == 'icons/icon.ico'
          assert base['bundle']['createUpdaterArtifacts'] is True
          print('WINDOWS_RC_SOURCE_CONTRACT_GREEN')
          PY

      - name: Prepare Linux cross-build toolchain and Windows sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm nsis unzip curl ca-certificates
          rustup target add "$WINDOWS_TARGET"
          command -v cargo-xwin >/dev/null 2>&1 || cargo install --locked cargo-xwin

          RELEASE_TAG_FFMPEG='autobuild-2026-09-14-13-17'
          ARCHIVE='ffmpeg-N-126549-ga51bb69b09-win64-gpl.zip'
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${RELEASE_TAG_FFMPEG}/${ARCHIVE}"
          CACHE="$RUNNER_TEMP/endlume-ffmpeg-cross-publish"
          ZIP="$CACHE/$ARCHIVE"
          EXTRACT="$CACHE/extract"
          DEST='src-tauri/binaries'
          rm -rf "$EXTRACT"
          mkdir -p "$CACHE" "$EXTRACT" "$DEST"
          curl --fail --location --retry 3 --output "$ZIP" "$URL"
          unzip -q "$ZIP" -d "$EXTRACT"
          FFMPEG="$(find "$EXTRACT" -type f -name ffmpeg.exe -print -quit)"
          FFPROBE="$(find "$EXTRACT" -type f -name ffprobe.exe -print -quit)"
          test -n "$FFMPEG" && test -n "$FFPROBE"
          cp "$FFMPEG" "$DEST/ffmpeg-$WINDOWS_TARGET.exe"
          cp "$FFPROBE" "$DEST/ffprobe-$WINDOWS_TARGET.exe"
          python3 - <<'PY'
          from pathlib import Path
          for name in ('ffmpeg','ffprobe'):
              p=Path('src-tauri/binaries')/f'{name}-x86_64-pc-windows-msvc.exe'
              assert p.stat().st_size > 1_000_000
              assert p.read_bytes()[:2] == b'MZ'
          print('WINDOWS_SIDECARS_STRUCTURAL_GREEN')
          PY

      - name: Re-run source-level release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          python3 scripts/test-windows-861-strict-port.py
          python3 scripts/test-windows-861-release-surface.py
          python3 scripts/test-local-scratch-stability-8-61.py
          python3 scripts/test-managed-license-render-gate.py
          python3 scripts/test-render-speed-stability-8-60.py

      - name: Build exact Windows x64 NSIS RC
        shell: bash
        env:
          CC_x86_64_pc_windows_msvc: clang-cl
          CXX_x86_64_pc_windows_msvc: clang-cl
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          cfg=json.loads(p.read_text())
          assert cfg['bundle']['createUpdaterArtifacts'] is True
          cfg['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2)+'\n')
          print('CROSS_RC_UPDATER_ARTIFACTS_DISABLED=true')
          PY
          npm run tauri build -- --runner cargo-xwin --target "$WINDOWS_TARGET" --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Normalize, hash and publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          NSIS_DIR="src-tauri/target/$WINDOWS_TARGET/release/bundle/nsis"
          FINAL="$NSIS_DIR/$FINAL_INSTALLER"
          if [ ! -s "$FINAL" ]; then
            CANDIDATE="$(find "$NSIS_DIR" -maxdepth 1 -type f -name '*.exe' ! -name "$FINAL_INSTALLER" -print -quit)"
            test -n "$CANDIDATE"
            cp "$CANDIDATE" "$FINAL"
          fi
          test -s "$FINAL"
          python3 - "$FINAL" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          assert p.stat().st_size > 0
          with p.open('rb') as f: assert f.read(2) == b'MZ'
          print(f'RC_INSTALLER_BYTES={p.stat().st_size}')
          PY
          sha256sum "$FINAL" | tee "$FINAL.sha256"

          NOTES="$RUNNER_TEMP/endlume-windows-rc-notes.md"
          cat > "$NOTES" <<EOF
          # ENDLUME YT Studio PEISOV — Windows 8.61 Release Candidate

          Source commit: $GITHUB_SHA

          BUILD VERIFIED (cross-RC): Windows x64 MSVC application compiled with cargo-xwin; NSIS installer bundled; branding/icon/identifier contract checked; Windows FFmpeg/ffprobe sidecars structurally verified; frontend and Windows source-level release gates passed; exact installer filename and SHA-256 generated.

          HARDWARE E2E VERIFIED: false

          Native Windows install/uninstall smoke, zero-console proof, hardware encoder proof (NVENC/QSV/AMF), and real installed-app production render/license/updater E2E remain required before promotion to final production release.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$FINAL" "$FINAL.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" --notes-file "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" "$FINAL" "$FINAL.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ENDLUME YT Studio PEISOV 1.0.0-alpha.8.61 Windows RC" --notes-file "$NOTES" --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,targetCommitish,assets
          echo 'BUILD_VERIFIED_CROSS_RC_GREEN'
          echo 'HARDWARE_E2E_VERIFIED=false'
          echo 'WINDOWS_RC_PUBLISHED_GREEN'

      - name: Upload Actions artifact (best effort only)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64-RC-cross
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ENDLUME-YT-Studio-PEISOV-Setup-1.0.0-alpha.8.61-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30
