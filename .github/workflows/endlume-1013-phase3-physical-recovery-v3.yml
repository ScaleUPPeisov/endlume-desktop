name: ENDLUME 10.0.13 Phase 3 Physical Recovery V3

on:
  push:
    branches:
      - release-fix/endlume-10.0.13-fast-engine-transplant
    paths:
      - '.github/workflows/endlume-1013-phase3-physical-recovery-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: endlume-1013-phase3-physical-recovery-v3
  cancel-in-progress: true

env:
  PHASE_3_PRODUCT_HEAD: e4a07972b1566ed73b11c4eb758d59f4dc839e71
  PRODUCT_BASE: 3f06c7329bd3821bc160e6d88c5b294fc0d82c2b
  FAST_ENGINE_SOURCE: a7a399e83de8b9248e2065c6dda1f9079ded6565
  SOURCE_RUN_ID: '38071201778'
  SOURCE_ARTIFACT_ID: '11677270291'
  OWNER_BINARY_SHA256: 2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7

jobs:
  qa-diff-gate:
    name: QA-only V3 diff gate — product frozen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Prove PRODUCT_FILES_CHANGED=0
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "$PHASE_3_PRODUCT_HEAD^{commit}"
          git merge-base --is-ancestor "$PHASE_3_PRODUCT_HEAD" HEAD
          git diff --name-only "$PHASE_3_PRODUCT_HEAD" HEAD | tee "$RUNNER_TEMP/qa-v3-files.txt"
          BAD="$(git diff --name-only "$PHASE_3_PRODUCT_HEAD" HEAD | grep -Ev '^(\.github/workflows/|scripts/phase3_physical_acceptance\.py$|QA_PHASE3_.*\.md$)' || true)"
          test -z "$BAD" || { printf '%s\n' "$BAD" >&2; exit 31; }
          git diff --quiet "$PHASE_3_PRODUCT_HEAD" HEAD -- src src-tauri package.json package-lock.json public || exit 32
          python3 -m py_compile scripts/phase3_physical_acceptance.py
          echo PRODUCT_FILES_CHANGED=0
          echo "PHASE_3_PRODUCT_HEAD=$PHASE_3_PRODUCT_HEAD"
          echo "QA_HARNESS_HEAD=$(git rev-parse HEAD)"
          echo RELEASE=BLOCKED

  physical:
    name: SAME e4a07972 candidate — full V3 physical QA
    needs: qa-diff-gate
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-source
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize and prove owner binary start state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = kirill-mac-endlume
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          ROOT="$RUNNER_TEMP/endlume-1013-phase3-recovery-v3"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/download" "$ROOT/unpacked" "$ROOT/acceptance/results" "$ROOT/acceptance/logs" "$ROOT/evidence"
          echo "PHYSICAL_ROOT=$ROOT" >> "$GITHUB_ENV"
          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          test -d "$OWNER"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          OWNER_BIN="$OWNER/Contents/MacOS/$OWNER_EXE"
          test -x "$OWNER_BIN"
          if pgrep -f "$OWNER_BIN" >/dev/null 2>&1; then echo 'owner app is running' >&2; exit 41; fi
          PRE_SHA="$(/usr/bin/shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          test "$PRE_SHA" = "$OWNER_BINARY_SHA256"
          printf '%s\n' "$PRE_SHA" > "$ROOT/evidence/owner-binary-before.sha256"
          test "$(df -k "$RUNNER_TEMP" | tail -1 | awk '{print $4}')" -ge 8000000
          echo OWNER_APPLICATION_REPLACED=NO
          echo RELEASE=BLOCKED

      - name: Download exact original candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE3-FAST-ENGINE-CANDIDATE
          path: ${{ runner.temp }}/endlume-1013-phase3-recovery-v3/download
          github-token: ${{ github.token }}
          repository: ScaleUPPeisov/endlume-desktop
          run-id: 38071201778

      - name: Robust artifact discovery and exact product verification
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"
          find "$ROOT/download" -maxdepth 4 -type f -print
          META="$(find "$ROOT/download" -type f -name PHASE3_HOSTED_BUILD.json -print -quit)"
          ZIP="$(find "$ROOT/download" -type f -name ENDLUME-10.0.13-PHASE3-FAST-ENGINE-CANDIDATE.zip -print -quit)"
          ARTIFACT_HARNESS="$(find "$ROOT/download" -type f -name phase3_physical_acceptance.py -print -quit)"
          test -n "$META"; test -f "$META"
          test -n "$ZIP"; test -f "$ZIP"
          test -n "$ARTIFACT_HARNESS"; test -f "$ARTIFACT_HARNESS"
          python3 - "$META" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1]))
          e={'phase3Head':os.environ['PHASE_3_PRODUCT_HEAD'],'productBase':os.environ['PRODUCT_BASE'],'fastEngineSource':os.environ['FAST_ENGINE_SOURCE'],'release':'BLOCKED','stable':'UNTOUCHED','liveUpdater':'UNTOUCHED'}
          for k,v in e.items():
              assert d.get(k)==v,(k,d.get(k),v)
          assert d.get('ownerApplicationReplaced')=='NO'
          print('EXACT_PRODUCT_METADATA=PASS')
          PY
          cp "$META" "$ROOT/evidence/PHASE3_HOSTED_BUILD.json"
          /usr/bin/shasum -a 256 "$ZIP" > "$ROOT/evidence/candidate-archive.sha256"
          /usr/bin/ditto -x -k "$ZIP" "$ROOT/unpacked"
          APP="$(find "$ROOT/unpacked" -maxdepth 5 -type d -name '*.app' -print -quit)"
          test -n "$APP"; test -d "$APP"
          case "$APP" in /Applications/*) exit 51;; esac
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          BIN="$APP/Contents/MacOS/$EXE"
          test "$BID" = studio.endlume.desktop
          /usr/bin/lipo -archs "$BIN" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP"
          CANDIDATE_SHA="$(/usr/bin/shasum -a 256 "$BIN" | awk '{print $1}')"
          printf '%s\n' "$CANDIDATE_SHA" > "$ROOT/evidence/candidate-binary.sha256"
          echo "PHASE3_APP=$APP" >> "$GITHUB_ENV"
          echo "CANDIDATE_BINARY_SHA256=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          cp "$GITHUB_WORKSPACE/qa-source/scripts/phase3_physical_acceptance.py" "$ROOT/phase3_physical_acceptance.py"
          python3 - "$ROOT/phase3_physical_acceptance.py" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          old='''    preview_cases = [make_preview_case(f"periodic-{i}", media, periodic_src, t, [periodic_fx], [])\n                     for i,t in enumerate([0.0,1.0,4.983333333,5.0,5.016666667,10.0,30.0,60.0])]\n'''
          new='''    periodic_preview_times = [0.0,1.0,4.983333333,5.0,5.016666667,10.0,30.0,60.0]\n    preview_cases = []\n    for i,t in enumerate(periodic_preview_times):\n        preview_fx=dict(periodic_fx); preview_fx["previewFrameTime"]=t % 5.0\n        preview_cases.append(make_preview_case(f"periodic-{i}", media, periodic_src, t, [preview_fx], []))\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='''    sub_preview_times = [599.9,600.0,600.5,602.983333333,603.0,4200.5,7800.5]\n    sub_preview_cases = [make_preview_case(f"subscribe-{i}", media, subscribe_src, t, [], [subscribe])\n                         for i,t in enumerate(sub_preview_times)]\n'''
          new='''    sub_preview_times = [600.75,601.5,602.983333333,4200.75,4201.5,7800.75,7801.5]\n    sub_preview_cases=[]\n    for i,t in enumerate(sub_preview_times):\n        preview_sub=dict(subscribe); preview_sub["previewFrameTime"]=(t-600.0) % 3600.0\n        sub_preview_cases.append(make_preview_case(f"subscribe-{i}", media, subscribe_src, t, [], [preview_sub]))\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          chmod 755 "$ROOT/phase3_physical_acceptance.py"
          python3 -m py_compile "$ROOT/phase3_physical_acceptance.py"
          /usr/bin/shasum -a 256 "$GITHUB_WORKSPACE/qa-source/scripts/phase3_physical_acceptance.py" > "$ROOT/evidence/qa-source-harness.sha256"
          /usr/bin/shasum -a 256 "$ROOT/phase3_physical_acceptance.py" > "$ROOT/evidence/qa-v3-harness-used.sha256"
          python3 - "$ROOT/evidence/candidate.json" "$APP" "$BID" "$VER" "$CANDIDATE_SHA" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          out={'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],'qaHarnessHead':sys.argv[6],'candidateAppPath':sys.argv[2],'bundleId':sys.argv[3],'bundleVersion':sys.argv[4],'candidateBinarySha256':sys.argv[5],'architecture':'arm64','codesign':'PASS','installed':False}
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n')
          PY
          echo CANDIDATE_INSTALL=NO
          echo RELEASE=BLOCKED

      - name: Snapshot owner state and keychain immediately before candidate execution
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"; STATE="$HOME/Library/Application Support/studio.endlume.desktop"
          python3 - "$STATE" "$ROOT/evidence/owner-state-before.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows={}
          if root.is_dir():
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  b=p.read_bytes(); rows[str(p.relative_to(root))]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          Path(sys.argv[2]).write_text(json.dumps({'root':str(root),'files':rows},indent=2)+'\n')
          PY
          TOKEN="$(/usr/bin/security find-generic-password -s studio.endlume.desktop -a managed-session -w 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then printf '%s' "$TOKEN" | /usr/bin/shasum -a 256 | awk '{print $1}' > "$ROOT/evidence/keychain-before.sha256"; else printf 'MISSING\n' > "$ROOT/evidence/keychain-before.sha256"; fi
          unset TOKEN

      - name: Run all physical acceptance cases
        shell: bash
        run: |
          set -u
          ROOT="$PHYSICAL_ROOT"; set +e
          python3 "$ROOT/phase3_physical_acceptance.py" --app "$PHASE3_APP" --root "$ROOT/acceptance" --head "$PHASE_3_PRODUCT_HEAD"
          RC=$?; set -e
          printf '%s\n' "$RC" > "$ROOT/evidence/acceptance-exit-code.txt"
          echo "ACCEPTANCE_RC=$RC" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_RC=$RC"

      - name: Snapshot owner safety immediately after candidate execution
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"; STATE="$HOME/Library/Application Support/studio.endlume.desktop"
          python3 - "$STATE" "$ROOT/evidence/owner-state-after.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); rows={}
          if root.is_dir():
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  b=p.read_bytes(); rows[str(p.relative_to(root))]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          Path(sys.argv[2]).write_text(json.dumps({'root':str(root),'files':rows},indent=2)+'\n')
          PY
          TOKEN="$(/usr/bin/security find-generic-password -s studio.endlume.desktop -a managed-session -w 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then printf '%s' "$TOKEN" | /usr/bin/shasum -a 256 | awk '{print $1}' > "$ROOT/evidence/keychain-after.sha256"; else printf 'MISSING\n' > "$ROOT/evidence/keychain-after.sha256"; fi
          unset TOKEN
          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          OWNER_BIN="$OWNER/Contents/MacOS/$OWNER_EXE"
          POST_SHA="$(/usr/bin/shasum -a 256 "$OWNER_BIN" | awk '{print $1}')"
          printf '%s\n' "$POST_SHA" > "$ROOT/evidence/owner-binary-after.sha256"
          python3 - "$ROOT/evidence/owner-state-before.json" "$ROOT/evidence/owner-state-after.json" "$ROOT/evidence/owner-state-diff.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))['files']; b=json.load(open(sys.argv[2]))['files']
          added=sorted(set(b)-set(a)); removed=sorted(set(a)-set(b)); changed=[{'path':k,'before':a[k],'after':b[k]} for k in sorted(set(a)&set(b)) if a[k]!=b[k]]
          out={'preserved':not added and not removed and not changed,'added':[{'path':k,**b[k]} for k in added],'removed':[{'path':k,**a[k]} for k in removed],'changed':changed}
          open(sys.argv[3],'w').write(json.dumps(out,indent=2)+'\n')
          print('OWNER_STATE_PRESERVED='+('YES' if out['preserved'] else 'NO'))
          for kind in ('added','removed','changed'):
              for row in out[kind]: print('OWNER_STATE_'+kind.upper(),row)
          PY
          STATE_OK="$(python3 -c 'import json,sys;print("YES" if json.load(open(sys.argv[1]))["preserved"] else "NO")' "$ROOT/evidence/owner-state-diff.json")"
          KEYCHAIN_OK=NO; cmp -s "$ROOT/evidence/keychain-before.sha256" "$ROOT/evidence/keychain-after.sha256" && KEYCHAIN_OK=YES
          OWNER_OK=NO; [ "$POST_SHA" = "$OWNER_BINARY_SHA256" ] && cmp -s "$ROOT/evidence/owner-binary-before.sha256" "$ROOT/evidence/owner-binary-after.sha256" && OWNER_OK=YES
          echo "OWNER_STATE_PRESERVED=$STATE_OK" >> "$GITHUB_ENV"
          echo "KEYCHAIN_SESSION_PRESERVED=$KEYCHAIN_OK" >> "$GITHUB_ENV"
          echo "OWNER_APPLICATION_PRESERVED=$OWNER_OK" >> "$GITHUB_ENV"
          echo "OWNER_STATE_PRESERVED=$STATE_OK"
          echo "KEYCHAIN_SESSION_PRESERVED=$KEYCHAIN_OK"
          echo "OWNER_APPLICATION_REPLACED=$([ "$OWNER_OK" = YES ] && echo NO || echo YES)"

      - name: Build summary before evidence upload
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$PHYSICAL_ROOT"; mkdir -p "$ROOT/evidence" "$ROOT/acceptance/results" "$ROOT/acceptance/logs"
          : "${ACCEPTANCE_RC:=99}"; : "${OWNER_STATE_PRESERVED:=NO}"; : "${KEYCHAIN_SESSION_PRESERVED:=NO}"; : "${OWNER_APPLICATION_PRESERVED:=NO}"
          python3 - "$ROOT/evidence/PHASE3_QA_RECOVERY_V3_SUMMARY.json" "$ACCEPTANCE_RC" "$OWNER_STATE_PRESERVED" "$KEYCHAIN_SESSION_PRESERVED" "$OWNER_APPLICATION_PRESERVED" "$GITHUB_SHA" <<'PY'
          import json,os,sys
          rp=os.path.join(os.environ['PHYSICAL_ROOT'],'acceptance','PHASE3_PHYSICAL_REPORT.json'); r={}
          try:r=json.load(open(rp))
          except Exception:pass
          out={'phase3ProductHead':os.environ['PHASE_3_PRODUCT_HEAD'],'qaHarnessHead':sys.argv[6],'productFilesChanged':0,'sourceRunId':int(os.environ['SOURCE_RUN_ID']),'sourceArtifactId':int(os.environ['SOURCE_ARTIFACT_ID']),'candidateBinarySha256':os.environ.get('CANDIDATE_BINARY_SHA256'),'acceptanceExitCode':int(sys.argv[2]),'acceptanceStatus':r.get('status'),'ownerStatePreserved':sys.argv[3]=='YES','keychainSessionPreserved':sys.argv[4]=='YES','ownerApplicationPreserved':sys.argv[5]=='YES','release':'BLOCKED','stable':'UNTOUCHED','liveUpdater':'UNTOUCHED'}
          out['pass']=out['acceptanceExitCode']==0 and out['acceptanceStatus']=='PASS' and out['ownerStatePreserved'] and out['keychainSessionPreserved'] and out['ownerApplicationPreserved']
          open(sys.argv[1],'w').write(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY

      - name: Upload V3 evidence before hard gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.13-PHASE3-PHYSICAL-EVIDENCE-V3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/endlume-1013-phase3-recovery-v3/acceptance/PHASE3_PHYSICAL_REPORT.json
            ${{ runner.temp }}/endlume-1013-phase3-recovery-v3/acceptance/results/*.json
            ${{ runner.temp }}/endlume-1013-phase3-recovery-v3/acceptance/logs/*.log
            ${{ runner.temp }}/endlume-1013-phase3-recovery-v3/evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Final V3 hard gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${ACCEPTANCE_RC:-99}" = 0
          test "${OWNER_APPLICATION_PRESERVED:-NO}" = YES
          test "${OWNER_STATE_PRESERVED:-NO}" = YES
          test "${KEYCHAIN_SESSION_PRESERVED:-NO}" = YES
          python3 - "$PHYSICAL_ROOT/acceptance/PHASE3_PHYSICAL_REPORT.json" "$PHYSICAL_ROOT/evidence/PHASE3_QA_RECOVERY_V3_SUMMARY.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1])); s=json.load(open(sys.argv[2]))
          assert r.get('phase3Head')=='e4a07972b1566ed73b11c4eb758d59f4dc839e71'
          assert r.get('status')=='PASS',r
          assert s.get('pass') is True,s
          assert s.get('productFilesChanged')==0
          print('PHASE_3_PHYSICAL_GATE=PASS')
          print('PRODUCT_FILES_CHANGED=0')
          print('OWNER_APPLICATION_REPLACED=NO')
          print('OWNER_STATE_PRESERVED=YES')
          print('KEYCHAIN_SESSION_PRESERVED=YES')
          print('RELEASE=BLOCKED')
          PY

      - name: Cleanup and final owner binary proof
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER="/Applications/ENDLUME YT Studio PEISOV.app"
          OWNER_EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$OWNER/Contents/Info.plist")"
          FINAL_SHA="$(/usr/bin/shasum -a 256 "$OWNER/Contents/MacOS/$OWNER_EXE" | awk '{print $1}')"
          echo "OWNER_BINARY_FINAL_SHA256=$FINAL_SHA"
          test "$FINAL_SHA" = "$OWNER_BINARY_SHA256"
          if [ -n "${PHYSICAL_ROOT:-}" ]; then test "$PHYSICAL_ROOT" != /; rm -rf "$PHYSICAL_ROOT"; fi
          echo OWNER_APPLICATION_REPLACED=NO
          echo RELEASE=BLOCKED
