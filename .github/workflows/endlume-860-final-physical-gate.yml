name: ENDLUME 8.60 Final Physical Release Gate

on:
  push:
    branches: [candidate/endlume-860-render-speed-stability]
  workflow_dispatch:

concurrency:
  group: endlume-860-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-physical:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact production migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
          python3 scripts/apply-queue-finalization-hotfix-8-58.py
          python3 scripts/apply-render-speed-stability-8-60.py
          python3 scripts/test-render-speed-stability-8-60.py .
          python3 scripts/apply-e2e-harness-8-60.py
          test "$(node -p "require('./package.json').version")" = '1.0.0-alpha.8.60'

      - name: Full compile and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture

      - name: Stage real TOSHIBA fixture and Subscribe
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e860-final.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/e860-subscribe.json"
          test -s e860-subscribe.json
          echo "REAL_FIXTURE=$SIDE"

      - name: Prove round equalizer is bright and other Effect unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          python3 - "$SIDE" "$FFM" <<'PY'
          import json,subprocess,sys
          d=json.load(open(sys.argv[1])); ffm=sys.argv[2]
          fx=[x for x in d.get('effects',[]) if isinstance(x,dict) and x.get('enabled')]
          eq=next(x for x in fx if x.get('id')=='825dd7a4-f0cf-4032-a3c9-64290cb5756d')
          other=next(x for x in fx if x.get('id')!='825dd7a4-f0cf-4032-a3c9-64290cb5756d')
          src=eq['source'];key=str(eq.get('keyColor') or '00ff00').lstrip('#')
          def stat(sim,blend):
            vf=f'fps=60,format=rgba,colorkey=0x{key}:{sim}:{blend},format=rgba'
            raw=subprocess.check_output([ffm,'-hide_banner','-loglevel','error','-ss','18.597','-i',src,'-frames:v','1','-vf',vf,'-f','rawvideo','-pix_fmt','rgba','pipe:1'])
            a=raw[3::4];nz=[v for v in a if v>0]
            return {'nonzero_pct':100*len(nz)/len(a),'opaque_pct':100*sum(v>=250 for v in a)/len(a),'mean_alpha':sum(nz)/len(nz) if nz else 0}
          old=stat(.60,.184);new=stat(.18,.03)
          print('EQUALIZER_OLD',old);print('EQUALIZER_860',new);print('OTHER_EFFECT_UNCHANGED',other.get('id'),other.get('similarity'),other.get('blend'))
          assert new['mean_alpha']>235,new
          assert new['opaque_pct']>2.0,new
          assert new['nonzero_pct']>old['nonzero_pct']*1.8,(old,new)
          PY

      - name: Wait for exclusive VideoToolbox
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 120); do
            if ! pgrep -af '[f]fmpeg' >/tmp/e860-final-live.txt 2>/dev/null; then
              echo "FFMPEG_IDLE after $i checks"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/e860-final-live.txt || true
          exit 3

      - name: Five sequential real strict masters
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-860-five-masters.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e860-five.json"
          cat e860-five.json
          python3 - <<'PY'
          import json
          x=json.load(open('e860-five.json'))
          assert x.get('status')=='passed' and x.get('release_gate') is True,x
          assert len(x.get('times',[]))==5 and max(x['times'])<=30.0,x
          PY

      - name: Full real two-hour Subscribe OFF E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-857-real-e2e.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e860-off.json"
          cat e860-off.json
          python3 - <<'PY'
          import json
          x=json.load(open('e860-off.json'))
          assert x.get('status')=='passed' and x.get('release_gate') is True,x
          assert x.get('master_seconds',999)<=30.0,x
          assert x.get('master_frames')==x.get('master_packets') and x.get('master_frames',0)>0,x
          assert x.get('resolution')=='1920x1080' and x.get('fps')=='60/1',x
          assert x.get('audio_codec')=='mp3' and x.get('whole_track') is True and x.get('mp3_packet_copy') is True,x
          assert x.get('seek_begin') and x.get('seek_middle') and x.get('seek_tail'),x
          assert 500_000_000<=x.get('final_bytes',0)<=700_000_000,x
          PY

      - name: Full real two-hour Subscribe ON E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/run-endlume-860-real-subscribe.py "$SIDE" "$GITHUB_WORKSPACE/e860-subscribe.json" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e860-on.json"
          cat e860-on.json
          python3 - <<'PY'
          import json
          x=json.load(open('e860-on.json'))
          assert x.get('status')=='passed' and x.get('release_gate') is True and x.get('subscribe_on_gate') is True,x
          assert x.get('master_seconds',999)<=30.0,x
          assert x.get('resolution')=='1920x1080' and x.get('fps')=='60/1' and x.get('audio_codec')=='mp3',x
          assert x.get('in_place_manifest') is True and x.get('whole_track') is True,x
          assert 500_000_000<=x.get('final_bytes',0)<=700_000_000,x
          PY

      - name: Final 8.60 verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'ENDLUME_860_FINAL_PHYSICAL_GREEN'
          echo "SHA=$GITHUB_SHA"
          echo 'PASS: compile + VYRON/queue regressions + equalizer + 5 sequential masters + Subscribe OFF + Subscribe ON + in-place manifest'
