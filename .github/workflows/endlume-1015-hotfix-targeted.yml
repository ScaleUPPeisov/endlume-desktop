name: ENDLUME 10.0.15 Equalizer Physical Repro

on:
  push:
    branches:
      - hotfix/endlume-10.0.15-multi-effect-live-preview
    paths:
      - '.github/workflows/endlume-1015-hotfix-targeted.yml'
      - 'scripts/qa-endlume-1015-equalizer-managed.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1015-equalizer-repro
  cancel-in-progress: true

jobs:
  repro:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5534ce47123777b698117a46473238381e37729
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "c5534ce47123777b698117a46473238381e37729"
          echo "PRODUCT_CANDIDATE_EXACT=$(git rev-parse HEAD)"

      - name: Resolve physical FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          FFMPEG="$(command -v ffmpeg || true)"
          FFPROBE="$(command -v ffprobe || true)"
          test -x "$FFMPEG" && test -x "$FFPROBE"
          echo "FFMPEG=$FFMPEG" >> "$GITHUB_ENV"
          echo "FFPROBE=$FFPROBE" >> "$GITHUB_ENV"

      - name: Physical Round Equalizer visibility repro
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-eq-visibility"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          git fetch origin "$GITHUB_SHA" --depth=1
          git show "${GITHUB_SHA}:scripts/qa-endlume-1015-equalizer-managed.py" > "$ROOT/probe.py"
          python3 "$ROOT/probe.py" "$FFMPEG" "$FFPROBE" "$ROOT" | tee "$ROOT/probe.log"
          test -s "$ROOT/metrics.json"
          grep -q 'PHYSICAL_EQUALIZER_PROBE=PASS' "$ROOT/probe.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.15-EQUALIZER-PHYSICAL-REPRO
          path: |
            ${{ runner.temp }}/endlume-1015-eq-visibility/**
          if-no-files-found: error
          retention-days: 14
