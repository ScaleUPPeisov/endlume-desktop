name: ENDLUME 8.52 Snapshot Effective Source
on:
  push:
    branches: [candidate/endlume-852-effective-source]
    paths: ['.github/workflows/endlume-852-snapshot-effective.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/endlume-852-effective-source
          clean: true
          fetch-depth: 1
      - name: Copy exact effective 8.51 workspace into branch
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -f "$WORK/src-tauri/src/render.rs"
          test -f "$WORK/src-tauri/src/cache.rs"
          mkdir -p src src-tauri/src
          rsync -a --delete "$WORK/src/" src/
          rsync -a --delete "$WORK/src-tauri/src/" src-tauri/src/
          for f in package.json package-lock.json tsconfig.json tsconfig.node.json vite.config.ts index.html; do
            if test -f "$WORK/$f"; then cp "$WORK/$f" "$f"; fi
          done
          for f in Cargo.toml Cargo.lock tauri.conf.json build.rs; do
            if test -f "$WORK/src-tauri/$f"; then cp "$WORK/src-tauri/$f" "src-tauri/$f"; fi
          done
          if test -d "$WORK/src-tauri/capabilities"; then mkdir -p src-tauri/capabilities; rsync -a --delete "$WORK/src-tauri/capabilities/" src-tauri/capabilities/; fi
          git status --short
          grep -F 'Smart Fidelity: Effects/Subscribe из оригиналов' src-tauri/src/render.rs
          grep -F '1.0.0-alpha.8.51' src-tauri/tauri.conf.json package.json || true
      - name: Commit exact effective source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ScaleUPPeisov'
          git config user.email 'peisov.business@gmail.com'
          git add src src-tauri/src src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/build.rs src-tauri/capabilities package.json package-lock.json tsconfig.json tsconfig.node.json vite.config.ts index.html 2>/dev/null || true
          if git diff --cached --quiet; then echo 'No source changes to snapshot'; exit 0; fi
          git commit -m 'snapshot(8.51): exact effective production source for 8.52'
          git push origin HEAD:candidate/endlume-852-effective-source
