name: ENDLUME 8.57 GOP Speed Benchmark
on:
  push:
    branches: [candidate/endlume-857-master-frame-hotfix]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/endlume-857-master-frame-hotfix
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Restore embedded FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true
      - name: Benchmark exact real master GOPs
        shell: bash
        run: |
          set -Eeuo pipefail
          METRICS="$GITHUB_WORKSPACE/857-gop-benchmark.json"
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          BASE="$(find /Volumes -type d -name "$UUID" -print -quit 2>/dev/null || true)"; test -d "$BASE"
          SIDE="$(find "$BASE" -type f -path '*/Rendered/logs/*' -name '*project.json' -print -quit 2>/dev/null || true)"; test -f "$SIDE"
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          TMP="$(mktemp -d /tmp/e857gop.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          python3 - "$SIDE" "$TMP/env" <<'PY'
          import json,shlex,sys
          d=json.load(open(sys.argv[1])); assert len(d['project']['media'])==1 and len(d['project']['audio'])==15
          fx=[x for x in d['effects'] if x.get('enabled')]; assert len(fx)>=2
          open(sys.argv[2],'w').write('\n'.join(['IMG='+shlex.quote(d['project']['media'][0]),'FX1='+shlex.quote(fx[0]['source']),'FX2='+shlex.quote(fx[1]['source'])]))
          PY
          source "$TMP/env"
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          GRAPH="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          : > "$TMP/results.tsv"
          for GOP in 3381 1800 1200; do
            OUT="$TMP/master-g${GOP}.mp4"
            T0=$(python3 -c 'import time;print(time.time())')
            "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$GRAPH" -map '[outv]' -frames:v 3381 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g "$GOP" -tag:v hvc1 -pix_fmt yuv420p -fps_mode cfr -r 60 -video_track_timescale 60000 -y "$OUT"
            T1=$(python3 -c 'import time;print(time.time())')
            FRAMES="$($FFP -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$OUT" || true)"
            PACKETS="$($FFP -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "$OUT" || true)"
            RATE="$($FFP -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of csv=p=0 "$OUT")"
            DUR="$($FFP -v error -show_entries format=duration -of csv=p=0 "$OUT")"
            SIZE="$(stat -f%z "$OUT")"
            SEC="$(python3 - "$T0" "$T1" <<'PY'
          import sys
          print(round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          )"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$GOP" "$SEC" "$FRAMES" "$PACKETS" "$RATE" "$DUR" "$SIZE" >> "$TMP/results.tsv"
            echo "GOP=$GOP SEC=$SEC FRAMES=$FRAMES PACKETS=$PACKETS RATE=$RATE DUR=$DUR SIZE=$SIZE"
          done
          python3 - "$TMP/results.tsv" "$METRICS" <<'PY'
          import json,sys
          rows=[]
          for line in open(sys.argv[1]):
              g,sec,frames,packets,rate,dur,size=line.rstrip('\n').split('\t')
              rows.append({'gop':int(g),'seconds':float(sec),'frames':int(frames or 0),'packets':int(packets or 0),'rate':rate,'duration':float(dur),'bytes':int(size)})
          json.dump({'results':rows},open(sys.argv[2],'w'),indent=2)
          valid=[r for r in rows if r['frames']==3381 and r['packets']==3381 and r['rate']=='1920,1080,60/1' and 56.34<=r['duration']<=56.37]
          assert valid, rows
          best=min(valid,key=lambda r:r['seconds'])
          print('BEST_VALID',best)
          assert best['seconds']<=24.0,best
          PY
      - name: Upload GOP benchmark metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-857-gop-benchmark
          path: 857-gop-benchmark.json
          if-no-files-found: error
