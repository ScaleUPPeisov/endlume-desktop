name: ENDLUME 8.55 Fast Bench
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  bench:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Restore known-good sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true
      - name: Lossless prealpha warm-path benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          BASE="$(find /Volumes -type d -name "$UUID" -print -quit 2>/dev/null || true)"; test -d "$BASE"
          SIDE="$(find "$BASE" -type f -path '*/Rendered/logs/*' -name '*project.json' -print -quit 2>/dev/null || true)"; test -f "$SIDE"
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"; FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 - "$SIDE" <<'PY' >/tmp/e855
          import json,shlex,sys
          d=json.load(open(sys.argv[1]));print('IMG='+shlex.quote(d['project']['media'][0]));print('FX1='+shlex.quote(d['effects'][0]['source']));print('FX2='+shlex.quote(d['effects'][1]['source']))
          PY
          source /tmp/e855
          TMP="$(mktemp -d /tmp/e855alpha.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          # Lossless ARGB cache with chromakey + exact final effect scale already applied.
          t0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          t1=$(python3 -c 'import time;print(time.time())'); python3 - "$t0" "$t1" <<'PY'
          import sys;print('CACHE_FX1_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          t0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          t1=$(python3 -c 'import time;print(time.time())'); python3 - "$t0" "$t1" <<'PY'
          import sys;print('CACHE_FX2_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          /bin/ls -lh "$TMP/fx1.mov" "$TMP/fx2.mov"
          REF="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=60,setsar=1[b0];[1:v]fps=60,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=60,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]format=yuv420p[outv]"
          WARM="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          run_ref(){ t0=$(python3 -c 'import time;print(time.time())'); "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 60 -i "$IMG" -stream_loop -1 -i "$FX1" -stream_loop -1 -i "$FX2" -filter_complex "$REF" -map '[outv]' -t 8 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 3381 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$TMP/ref.mp4"; t1=$(python3 -c 'import time;print(time.time())'); python3 - "$t0" "$t1" <<'PY'
          import sys;print('REF8_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          }
          run_warm(){ dur="$1"; out="$2"; label="$3"; t0=$(python3 -c 'import time;print(time.time())'); "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$WARM" -map '[outv]' -t "$dur" -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 3381 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$out"; t1=$(python3 -c 'import time;print(time.time())'); python3 - "$label" "$t0" "$t1" <<'PY'
          import sys;print(sys.argv[1]+'_SEC',round(float(sys.argv[3])-float(sys.argv[2]),3))
          PY
          }
          run_ref
          run_warm 8 "$TMP/w8.mp4" WARM8
          "$FFM" -hide_banner -i "$TMP/ref.mp4" -i "$TMP/w8.mp4" -lavfi '[0:v][1:v]ssim' -f null - 2>&1 | grep SSIM | tail -1 || true
          run_warm 56.355011 "$TMP/w56.mp4" WARM56
          "$FFP" -v error -show_entries format=duration,size,bit_rate:stream=avg_frame_rate,width,height,bit_rate -of json "$TMP/w56.mp4"
