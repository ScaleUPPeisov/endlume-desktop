name: ENDLUME 8.55 Real Job Diagnose
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Exact audio budget and visual performance benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          UUID='2e0e14ba-d97a-48d5-ab32-2fb2b27754bf'
          ROOT="$(find /Volumes -maxdepth 10 -type d -path "*${UUID}*/Neon Drive FM_BATCH_2026-09-05_001" -print -quit 2>/dev/null)"
          SIDE="$(find "$ROOT/Rendered/logs" -type f -name '*project.json' -print -quit)"
          FFM="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap/src-tauri/binaries/ffmpeg-aarch64-apple-darwin"
          FFP="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          test -x "$FFM"; test -x "$FFP"; test -f "$SIDE"
          echo '=== AUDIO EXACT ==='
          python3 -u - "$SIDE" "$FFP" <<'PY' || true
          import json,subprocess,sys,os,traceback
          side,ffp=sys.argv[1:]
          d=json.load(open(side)); tracks=d['project']['audio']; rows=[]
          for n,p in enumerate(tracks,1):
              try:
                  q=subprocess.run([ffp,'-v','error','-select_streams','a:0','-show_entries','format=duration,size:stream=codec_name,bit_rate,sample_rate,channels','-of','json',p],capture_output=True,text=True,timeout=12)
                  if q.returncode: raise RuntimeError(q.stderr.strip() or f'rc={q.returncode}')
                  x=json.loads(q.stdout); f=x.get('format',{}); s=(x.get('streams') or [{}])[0]
                  dur=float(f.get('duration') or 0); size=int(f.get('size') or os.path.getsize(p)); br=int(s.get('bit_rate') or 0)
                  rows.append((p,dur,size,br,s.get('codec_name'),s.get('sample_rate'),s.get('channels')))
                  print('TRACK',n,round(dur,3),size,br,s.get('codec_name'),s.get('sample_rate'),s.get('channels'),flush=True)
              except Exception as e: print('PROBE_FAIL',n,os.path.basename(p),repr(e),flush=True)
          if len(rows)==15:
              target=7200.0;t=0.0;i=0;bytes_est=0
              while t<target:
                  r=rows[i%len(rows)];t+=r[1];bytes_est+=r[2];i+=1
              print('TRACKS_PLAYED',i,'FINAL_WHOLE_TRACK_SECONDS',round(t,3),'OVERSHOOT',round(t-target,3),flush=True)
              print('SOURCE_AUDIO_BYTES_EST',bytes_est,'MiB',round(bytes_est/1048576,2),'MB',round(bytes_est/1e6,2),flush=True)
          else: print('AUDIO_ROWS',len(rows),'OF 15',flush=True)
          PY
          echo '=== VISUAL EXACT ==='
          python3 - "$SIDE" <<'PY' > /tmp/endlume855.env
          import json,sys,shlex
          d=json.load(open(sys.argv[1])); p=d['project']; fx=d['effects']
          print('IMG='+shlex.quote(p['media'][0]));print('FX1='+shlex.quote(fx[0]['source']));print('FX2='+shlex.quote(fx[1]['source']))
          PY
          source /tmp/endlume855.env
          TMP="$(mktemp -d /tmp/endlume855-bench.XXXXXX)"; trap 'rm -rf "$TMP"' EXIT
          REF="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=60,setsar=1[b0];[1:v]fps=60,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=60,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]format=yuv420p[outv]"
          CAND="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          echo '-- 8s reference/candidate --'
          T0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 4 -loop 1 -framerate 60 -i "$IMG" -stream_loop -1 -i "$FX1" -stream_loop -1 -i "$FX2" -filter_complex "$REF" -map '[outv]' -t 8 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 480 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$TMP/ref.mp4"
          T1=$(python3 -c 'import time;print(time.time())'); python3 - "$T0" "$T1" <<'PY'
          import sys;print('REF8_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          T0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 4 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$FX1" -stream_loop -1 -i "$FX2" -filter_complex "$CAND" -map '[outv]' -t 8 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 480 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$TMP/cand8.mp4"
          T1=$(python3 -c 'import time;print(time.time())'); python3 - "$T0" "$T1" <<'PY'
          import sys;print('CAND8_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          "$FFM" -hide_banner -i "$TMP/ref.mp4" -i "$TMP/cand8.mp4" -lavfi '[0:v][1:v]ssim' -f null - 2>&1 | grep 'SSIM' | tail -1 || true
          echo '-- full 56.355s candidate --'
          T0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 4 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$FX1" -stream_loop -1 -i "$FX2" -filter_complex "$CAND" -map '[outv]' -t 56.355011 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 3381 -tag:v hvc1 -pix_fmt yuv420p -r 60 -y "$TMP/cand56.mp4"
          T1=$(python3 -c 'import time;print(time.time())'); python3 - "$T0" "$T1" <<'PY'
          import sys;print('CAND56_SEC',round(float(sys.argv[2])-float(sys.argv[1]),3))
          PY
          "$FFP" -v error -show_entries format=size,duration:stream=bit_rate,avg_frame_rate,width,height -of json "$TMP/cand56.mp4"
