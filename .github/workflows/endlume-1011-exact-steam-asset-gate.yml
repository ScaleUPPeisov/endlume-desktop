name: ENDLUME 10.0.11 Exact Steam Asset Gate

on:
  push:
    branches:
      - qa/endlume-10.0.11-exact-steam-visual
    paths:
      - ".github/workflows/endlume-1011-exact-steam-asset-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1011-exact-steam-asset-gate
  cancel-in-progress: true

jobs:
  exact-asset:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact uploaded Steam asset
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1011-exact-steam"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          EXPECTED_SHA="d32262025aa7b7ebd2626cfb397b860150104b987957d1c2bf77395016e2cfb0"
          EXPECTED_BYTES="789147"
          FOUND=""

          echo "Searching local Mac by exact byte size + SHA256"
          {
            mdfind 'kMDItemFSSize == 789147' 2>/dev/null || true
            for base in "$HOME/Downloads" "$HOME/Desktop" "$HOME/Documents" "$HOME/Movies"; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 8 -type f -size 789147c -print 2>/dev/null || true
            done
            if [ -d "/Volumes/TOSHIBA EXT" ]; then
              find "/Volumes/TOSHIBA EXT" -maxdepth 9 -type f -size 789147c -print 2>/dev/null || true
            fi
          } | awk 'NF && !seen[$0]++' > "$ROOT/candidates.txt"

          while IFS= read -r p; do
            [ -f "$p" ] || continue
            sha="$(shasum -a 256 "$p" 2>/dev/null | awk '{print $1}' || true)"
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              FOUND="$p"
              echo "EXACT_LOCAL_SHA_MATCH=$p"
              break
            fi
          done < "$ROOT/candidates.txt"

          if [ -n "$FOUND" ]; then
            cp "$FOUND" "$ROOT/steam.mp4"
            echo "ASSET_SOURCE=LOCAL_SHA_MATCH"
          else
            echo "LOCAL_SHA_MATCH=NOT_FOUND"
            curl -fL --retry 4 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o "$ROOT/yt-dlp"
            chmod +x "$ROOT/yt-dlp"
            URL="https://www.youtube.com/watch?v=kMkfJTjkhuQ"
            OK=0
            for CLIENT in tv android_vr web_embedded android; do
              echo "TRY_PLAYER_CLIENT=$CLIENT"
              rm -f "$ROOT/steam.mp4" "$ROOT/steam.mp4.part"
              if "$ROOT/yt-dlp" --no-check-certificates --no-playlist --extractor-args "youtube:player_client=$CLIENT" -f "18/best[height=360][ext=mp4]/best[height<=360]" -o "$ROOT/steam.mp4" "$URL"; then
                [ -s "$ROOT/steam.mp4" ] && OK=1 && break
              fi
            done
            test "$OK" = "1"
            echo "ASSET_SOURCE=UPSTREAM"
          fi

          test -s "$ROOT/steam.mp4"
          ACTUAL_SHA="$(shasum -a 256 "$ROOT/steam.mp4" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -f '%z' "$ROOT/steam.mp4")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          echo "STEAM_PATH=$ROOT/steam.mp4" >> "$GITHUB_ENV"

      - name: Exact identity and media contract
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_SHA="d32262025aa7b7ebd2626cfb397b860150104b987957d1c2bf77395016e2cfb0"
          EXPECTED_BYTES="789147"
          ACTUAL_SHA="$(shasum -a 256 "$STEAM_PATH" | awk '{print $1}')"
          ACTUAL_BYTES="$(stat -f '%z' "$STEAM_PATH")"
          echo "EXPECTED_SHA256=$EXPECTED_SHA"
          echo "ACTUAL_SHA256=$ACTUAL_SHA"
          echo "EXPECTED_BYTES=$EXPECTED_BYTES"
          echo "ACTUAL_BYTES=$ACTUAL_BYTES"
          ffprobe -v error -count_frames -select_streams v:0             -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_read_frames             -show_entries format=duration,size             -of default=nw=1 "$STEAM_PATH"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          W="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$STEAM_PATH")"
          H="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$STEAM_PATH")"
          FPS="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$STEAM_PATH")"
          FRAMES="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$STEAM_PATH")"
          DUR="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$STEAM_PATH")"
          test "$W" = "640"
          test "$H" = "360"
          test "$FPS" = "30/1"
          test "$FRAMES" = "900"
          python3 - "$DUR" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert abs(d-30.000181)<0.002,d
          PY
          echo "EXACT_STEAM_SOURCE_FOUND=GREEN"
          echo "EXACT_STEAM_SHA256=GREEN"
          echo "EXACT_STEAM_MEDIA_CONTRACT=GREEN"
