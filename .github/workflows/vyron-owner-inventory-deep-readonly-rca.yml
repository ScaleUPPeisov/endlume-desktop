name: VYRON owner inventory RCA - immutable forensic read (zero API)

on:
  push:
    branches:
      - diagnostics/vyron-m1-connection-20261118
    paths:
      - .github/workflows/vyron-owner-inventory-deep-readonly-rca.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 5
    steps:
      - name: Inspect native cache vs 33 channel runway, no OAuth, no API, no writes
        shell: bash
        run: |
          set -Eeuo pipefail
          /usr/bin/python3 - <<'PY'
          import json,re,sqlite3,datetime
          from pathlib import Path
          from collections import Counter
          from urllib.parse import quote
          base=Path.home()/'Library'/'Application Support'/'studio.channelflow.desktop'
          state=json.loads((base/'state.json').read_text())
          channels=state.get('channels',[])
          assert isinstance(channels,list) and len(channels)==33
          allowed={'PLAYLIST_TOTAL_METADATA_MISMATCH','OWNER_SEARCH_FAILED','MISSING_VIDEO_HYDRATION','SCHEDULE_DATA_INCOMPLETE','SCHEDULE_EMPTY_NOT_INDEPENDENTLY_VERIFIED','OWNER_SEARCH_NOT_EXHAUSTED','OWNER_SEARCH_PAGE_LIMIT','UPLOADS_PLAYLIST_SCHEDULE_COVERAGE_MISMATCH','PLAYLIST_ITEM_WITHOUT_VIDEO_ID','OWNER_SUPPLEMENT_HYDRATION_MISSING','LIMIT_TRUNCATED','HYDRATION_BATCH_FAILED'}
          records={}
          for p in (Path.home()/'Library'/'WebKit'/'studio.channelflow.desktop').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in ('.sqlite3','.db') or p.stat().st_size>50_000_000:continue
            try:
              db=sqlite3.connect('file:'+quote(str(p))+'?mode=ro',uri=True,timeout=2)
              try:
                if not db.execute("SELECT 1 FROM sqlite_master WHERE name='ItemTable'").fetchone():continue
                for key,val in db.execute("SELECT key,value FROM ItemTable WHERE key='vyron:channel-runway:v1'"):
                  strings=[val.decode('utf-16le','ignore'),val.decode('utf-8','ignore')] if isinstance(val,bytes) else [str(val)]
                  for s in strings:
                    try:d=json.loads(s)
                    except (ValueError,TypeError):continue
                    if isinstance(d,dict) and isinstance(d.get('channels'),dict):records=d['channels'];break
              finally:db.close()
            except (OSError,ValueError,sqlite3.Error):pass
          assert len(records)==33
          root=base/'youtube-inventory'
          print('RCA_NATIVE_CACHE_ROOT_EXISTS='+str(root.exists()))
          print('RCA_NATIVE_CACHE_FILES='+str(len(list(root.glob('*.json'))) if root.exists() else 0))
          totals=Counter()
          def safe(v):
            return sorted({x for x in allowed if x in str(v or '')})
          for ch in channels:
            if not isinstance(ch,dict):continue
            cid=str(ch.get('id','')); name=str(ch.get('name','')).replace('\n',' ')[:90]
            rec=records.get(cid,{})
            rstate=str(rec.get('dataState','UNKNOWN'))
            p=root/(cid+'.json')
            row={'name':name,'state':rstate,'reasonCodes':safe(rec.get('lastRefreshError')),'attempt':rec.get('lastRefreshAttemptAt'),'observedAt':rec.get('lastObservedAt'),'observedScheduled':rec.get('lastObservedScheduledCount'),'historicalScheduled':rec.get('scheduledVideoCount'),'nativeExists':p.exists()}
            if p.is_file() and not p.is_symlink():
              try:
                inv=json.loads(p.read_text())
                info=inv.get('syncInfo') or {}
                row['nativeSchema']=inv.get('schemaVersion')
                row['nativeSavedAt']=inv.get('updatedAt')
                row['nativeLastCompleteAt']=inv.get('lastCompleteAt')
                row['nativeVideos']=len(inv.get('videos',[]))
                row['nativeSyncComplete']=info.get('syncComplete')
                row['nativeScheduleComplete']=info.get('scheduleComplete')
                row['nativeReasons']=safe(info.get('incompleteReasons'))
                row['nativePlaylistReported']=info.get('playlistReportedTotal')
                row['nativeUniqueIds']=info.get('uniqueVideoIds')
                row['nativeHydrated']=info.get('videosHydrated')
                row['nativeMissingHydration']=info.get('missingHydrationCount')
                row['nativeScheduleIncomplete']=info.get('scheduleDataIncompleteCount')
                row['nativePageMismatch']=info.get('pageInfoTotalMismatch')
                row['nativeSearchUsed']=info.get('searchUsed')
                row['nativeSearchErrorCategory']=('PRESENT' if info.get('searchError') else 'NONE')
                row['nativeSearchPages']=info.get('searchPagesFetched')
                row['nativeSearchExhausted']=info.get('searchExhausted')
                row['nativeKnownIdsChecked']=info.get('knownScheduledIdsChecked')
                row['nativeSearchSupplement']=info.get('searchSupplementCount')
                row['nativeSupplementMissing']=info.get('supplementalMissingCount')
                totals['native']+=1
              except (ValueError,OSError):row['nativeError']='INVALID_JSON'
            if rstate=='PARTIAL_DATA':totals['partial']+=1
            if 'OWNER_SEARCH_FAILED' in row['reasonCodes']:totals['search_failed']+=1
            if 'PLAYLIST_TOTAL_METADATA_MISMATCH' in row['reasonCodes']:totals['playlist_mismatch']+=1
            if 'MISSING_VIDEO_HYDRATION' in row['reasonCodes']:totals['missing_hydration']+=1
            print('RCA_CHANNEL '+json.dumps(row,ensure_ascii=False,sort_keys=True))

          # Sanitize an existing persisted error IN MEMORY. Do not print its raw
          # Google body, OAuth details, endpoint, video IDs or credentials.
          target=next((c for c in channels if isinstance(c,dict) and c.get('name')=='Afterglow Highway'),None)
          if target:
            rec=records.get(str(target.get('id','')),{})
            raw=str(rec.get('lastRefreshError') or '')
            upper=raw.upper()
            exact_methods={'CHANNELS_LIST':r'(?:CHANNELS\\.LIST|YOUTUBE CHANNEL|OWNER_INVENTORY_CHANNELS_LIST)',
                           'PLAYLIST_ITEMS_LIST':r'(?:PLAYLISTITEMS\\.LIST|YOUTUBE UPLOADS PAGE|OWNER_INVENTORY_PLAYLIST_ITEMS_LIST)',
                           'VIDEOS_LIST':r'(?:VIDEOS\\.LIST|AUTHORITATIVE VIDEOS|OWNER_INVENTORY_VIDEOS_LIST)',
                           'SEARCH_LIST':r'(?:SEARCH\\.LIST|OWNER_SEARCH_)'}
            method=next((key for key,pat in exact_methods.items() if re.search(pat,upper)),'UNKNOWN')
            codes=['OAUTH_INVALID_GRANT','OAUTH_CLIENT_MISMATCH','REFRESH_TOKEN_MISSING','KEYCHAIN_BLOCKED',
                   'KEYCHAIN_ERROR','OWNER_CHANNEL_MISMATCH','OWNER_CHANNEL_MISSING','OWNER_UPLOADS_MISSING',
                   'EXPECTED_CHANNEL_MISSING','OWNER_INVENTORY_UNCLASSIFIED_ERROR','AUTHORITATIVE_CHANNEL_ID_MISMATCH',
                   'NETWORK_ERROR','QUOTA_EXCEEDED','DAILY_LIMIT_EXCEEDED','RATE_LIMIT_EXCEEDED','INVALID_SEARCH_FILTER',
                   'INSUFFICIENT_PERMISSIONS','BACKEND_ERROR','FORBIDDEN','UNAUTHORIZED','CHANNEL_NOT_FOUND']
            reason=next((v for v in codes if v in upper),'UNKNOWN')
            # HTTP digits only when adjacent to a well-known HTTP/status marker.
            hm=re.search(r'(?:\\bHTTP[_\\s:=]*|\\bSTATUS\\s*(?:CODE)?[_\\s:=]*|\\bERROR\\s+)\(400|401|403|404|409|429|500|502|503|504)\\b',upper)
            status=int(hm.group(1)) if hm else None
            net='NETWORK_ERROR' in upper or bool(re.search(r'NETWORK|TIMED?\\s*OUT|ECONN|ENOTFOUND',upper))
            has_error=bool(raw.strip())
            out={'channel':'Afterglow Highway','errorPresent':has_error,'method':method,
                 'httpStatus':status,'allowlistedReason':reason,'networkSuspected':net,
                 'lastAttemptAt':rec.get('lastRefreshAttemptAt'),
                 'lastObservedAt':rec.get('lastObservedAt'),'historicalScheduled':rec.get('scheduledVideoCount'),
                 'state':rec.get('dataState')}
            print('RCA_AFTERGLOW_SAFE_ERROR '+json.dumps(out,sort_keys=True))
          # This action makes no requests and touches no app/SQLite data.
          print('RCA_TOTALS '+json.dumps(dict(totals),sort_keys=True))
          print('RCA_USER_DATA_MUTATIONS=0')
          print('RCA_API_REQUESTS=0')
          print('RCA_OAUTH_OR_VIDEO_IDS_EXPOSED=0')
          PY
