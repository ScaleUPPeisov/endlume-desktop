name: ENDLUME 10.0.11 Final Release Closure

on:
  push:
    branches: [hotfix/endlume-10.0.11-macos-render-assets-audio]
    paths:
      - ".github/workflows/endlume-1011-critical-hotfix-qa.yml"
      - ".github/workflows/endlume-1011-render-assets-audio-qa.yml"
  workflow_dispatch:
    inputs:
      physical_smoke:
        description: "Run short physical acceptance on kirill-mac-endlume after hosted build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: endlume-1011-final-release-closure
  cancel-in-progress: true

jobs:
  hosted-build-qa:
    name: Gate A — GitHub-hosted build / compile / package
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/endlume-1011-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Prove GitHub-hosted Apple Silicon runner
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
          uname -a
          sw_vers
          test "$(uname -m)" = "arm64"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo LOCAL_KIRILL_MAC_USED=NO

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stage Apple Silicon FFmpeg / FFprobe
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d)"
          TOOLS="$RUNNER_TEMP/endlume-1011-tools"
          mkdir -p "$TMP/fm" "$TMP/fp" "$TOOLS" src-tauri/binaries
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          FFMPEG="$(find "$TMP/fm" -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find "$TMP/fp" -type f -name ffprobe -print -quit)"
          test -n "$FFMPEG" -a -n "$FFPROBE"
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          cp "$FFMPEG" "$TOOLS/ffmpeg"
          cp "$FFPROBE" "$TOOLS/ffprobe"
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin "$TOOLS/ffmpeg" "$TOOLS/ffprobe"
          "$TOOLS/ffmpeg" -version | head -1
          "$TOOLS/ffprobe" -version | head -1

      - name: Compile and frozen-product regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml live_preview::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml cache::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo check --manifest-path src-tauri/Cargo.toml --features e2e-render --target aarch64-apple-darwin
          grep -q "api.generatePreviewPoster(projectPath" src/pages/Editors.tsx
          grep -q "api.prepareLivePreview(projectPath" src/pages/Editors.tsx
          grep -q "ENDLUME_PREVIEW_BASE SOURCE_IMAGE=" src-tauri/src/live_preview.rs
          grep -q "ENDLUME_PREVIEW_FFPROBE_FALLBACK" src-tauri/src/live_preview.rs
          grep -q 'BackgroundMusicSettings' src/types.ts
          grep -q 'bass=f=120' src-tauri/src/render.rs
          grep -q 'equalizer=f=1000' src-tauri/src/render.rs
          grep -q 'treble=f=8000' src-tauri/src/render.rs
          grep -q 'render-asset-recovered' src-tauri/src/render.rs
          echo COMPILE_REGRESSION=GREEN

      - name: Build packaged macOS QA app on GitHub-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("src-tauri/tauri.conf.json")
          d=json.loads(p.read_text())
          d["bundle"]["createUpdaterArtifacts"]=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          BID="$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")"
          VER="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")"
          test "$BID" = "studio.endlume.desktop"
          test "$VER" = "10.0.11"
          ZIP="$RUNNER_TEMP/ENDLUME-10.0.11-hosted-QA-app.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test -s "$ZIP"
          printf '{"version":"%s","bundleId":"%s","runner":"%s","environment":"%s","arch":"%s"}\n' "$VER" "$BID" "$RUNNER_NAME" "$RUNNER_ENVIRONMENT" "$(uname -m)" > "$RUNNER_TEMP/endlume-1011-hosted-build.json"
          echo PACKAGED_MACOS_APP=GREEN
          echo LOCAL_KIRILL_MAC_USED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.11-HOSTED-MACOS-QA-APP
          path: |
            ${{ runner.temp }}/ENDLUME-10.0.11-hosted-QA-app.zip
            ${{ runner.temp }}/endlume-1011-hosted-build.json
          if-no-files-found: error
          retention-days: 7

      - name: Hosted cleanup proof
        if: always()
        shell: bash
        run: |
          rm -rf "$CARGO_TARGET_DIR" "$RUNNER_TEMP/endlume-1011-tools"
          test ! -e "$CARGO_TARGET_DIR"
          echo PERSISTENT_HOME_BUILD_CACHE_USED=NO
          echo HOSTED_CLEANUP=GREEN

  physical-smoke:
    name: Gate B — optional physical Mac acceptance, NO BUILD
    needs: hosted-build-qa
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.physical_smoke }}
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - name: Assert physical runner does not compile
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "kirill-mac-endlume"
          echo "Physical runner receives a ready artifact only."
          echo "NO_NPM=YES"
          echo "NO_CARGO=YES"
          echo "NO_RUSTC=YES"
          echo "NO_TAURI_BUILD=YES"

      - uses: actions/download-artifact@v4
        with:
          name: ENDLUME-10.0.11-HOSTED-MACOS-QA-APP
          path: ${{ runner.temp }}/endlume-1011-physical

      - name: Verify downloaded hosted artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1011-physical"
          ZIP="$ROOT/ENDLUME-10.0.11-hosted-QA-app.zip"
          test -s "$ZIP"
          mkdir -p "$ROOT/unpacked"
          /usr/bin/ditto -x -k "$ZIP" "$ROOT/unpacked"
          APP="$(find "$ROOT/unpacked" -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "10.0.11"
          /usr/bin/codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")" | grep -q 'arm64'
          if [ -d "/Volumes/TOSHIBA EXT" ]; then
            echo TOSHIBA=MOUNTED
          else
            echo TOSHIBA=NOT_MOUNTED
          fi
          echo PHYSICAL_ARTIFACT_ACCEPTANCE=GREEN

      - name: Clean physical job temp
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/endlume-1011-physical"
          case "$ROOT" in
            "$RUNNER_TEMP"/*) rm -rf "$ROOT" ;;
            *) echo "REFUSE_CLEANUP_OUTSIDE_RUNNER_TEMP=$ROOT"; exit 1 ;;
          esac
          echo PHYSICAL_TEMP_CLEANUP=GREEN
