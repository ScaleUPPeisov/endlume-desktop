# Triggered after physical Round Equalizer repro confirmed destructive legacy chromakey.
name: ENDLUME 10.0.15 Apply Equalizer Visibility Hotfix
on:
  push:
    branches: [hotfix/endlume-10.0.15-multi-effect-live-preview]
    paths: ['.github/workflows/endlume-1015-equalizer-apply-hotfix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/endlume-10.0.15-equalizer-visibility
          fetch-depth: 0
          persist-credentials: true
      - name: Verify clean product base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'c5534ce47123777b698117a46473238381e37729'
          grep -q '"version": "10.0.15"' src-tauri/tauri.conf.json
      - name: Apply surgical hotfix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src-tauri/src/cache.rs'); s=p.read_text()
          old='''const ROUND_EQUALIZER_859_ID:&str="825dd7a4-f0cf-4032-a3c9-64290cb5756d";\nconst ROUND_EQUALIZER_859_SIMILARITY:f64=0.18;\nconst ROUND_EQUALIZER_859_BLEND:f64=0.03;'''
          new='''const ROUND_EQUALIZER_859_ID:&str="825dd7a4-f0cf-4032-a3c9-64290cb5756d";'''
          assert old in s; s=s.replace(old,new,1)
          old='''  if is_round_equalizer_859(e){\n    (ROUND_EQUALIZER_859_SIMILARITY,ROUND_EQUALIZER_859_BLEND)\n  }else if (e.similarity-0.60).abs()<0.000_001 && (e.blend-0.184).abs()<0.000_001{'''
          new='''  if (e.similarity-0.60).abs()<0.000_001 && (e.blend-0.184).abs()<0.000_001{'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('round-equalizer-859-s018-b003-name-safe','round-equalizer-1015-user-chromakey-safe-defaults',1)
          s=s.replace('assert_eq!(subscribe_chromakey_params_1011(&eq),(0.18,0.03));','assert_eq!(subscribe_chromakey_params_1011(&eq),(0.10,0.06));',1)
          old='''  fn round_equalizer_859_only_gets_protected_key(){\n    let eq=preset(ROUND_EQUALIZER_859_ID,"эквалайзер круглый");\n    assert_eq!(chromakey_params_859(&eq),(0.18,0.03));\n    let dust=preset("9951d1c3-5ff6-4a37-891f-1c323889a663","пыль и царапины 80-х");\n    assert_eq!(chromakey_params_859(&dust),(0.10,0.06));\n    let mut custom=dust.clone();custom.similarity=0.31;custom.blend=0.09;\n    assert_eq!(chromakey_params_859(&custom),(0.31,0.09));\n  }'''
          new='''  fn round_equalizer_1015_respects_user_chromakey_after_migration(){\n    let mut eq=preset(ROUND_EQUALIZER_859_ID,"эквалайзер круглый");\n    eq.similarity=0.10;eq.blend=0.06;\n    assert_eq!(chromakey_params_859(&eq),(0.10,0.06));\n    eq.similarity=0.31;eq.blend=0.09;\n    assert_eq!(chromakey_params_859(&eq),(0.31,0.09));\n    let dust=preset("9951d1c3-5ff6-4a37-891f-1c323889a663","пыль и царапины 80-х");\n    assert_eq!(chromakey_params_859(&dust),(0.10,0.06));\n  }'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/components/LiveCompositePreview.tsx'); s=p.read_text()
          old="""            const eq=e.id==='825dd7a4-f0cf-4032-a3c9-64290cb5756d'&&e.mode==='chromakey';\n            const destructiveSubscribe=assets?.previewType==='Subscribe'&&e.mode==='chromakey'&&Math.abs(e.similarity-.60)<.000001&&Math.abs(e.blend-.35)<.000001;\n            const sim=eq?0.18:destructiveSubscribe?0.10:e.similarity,blend=eq?0.03:destructiveSubscribe?0.06:e.blend;"""
          new="""            const destructiveSubscribe=assets?.previewType==='Subscribe'&&e.mode==='chromakey'&&Math.abs(e.similarity-.60)<.000001&&Math.abs(e.blend-.35)<.000001;\n            const sim=destructiveSubscribe?0.10:e.similarity,blend=destructiveSubscribe?0.06:e.blend;"""
          assert old in s; s=s.replace(old,new,1)
          old="""const e=effectRef.current,[r,g,b]=hexRgb(e.keyColor);const eq=e.id==='825dd7a4-f0cf-4032-a3c9-64290cb5756d'&&e.mode==='chromakey';const destructiveSubscribe=assets?.previewType==='Subscribe'&&e.mode==='chromakey'&&Math.abs(e.similarity-.60)<.000001&&Math.abs(e.blend-.35)<.000001;const sim=eq ? 0.18 : destructiveSubscribe ? 0.10 : e.similarity;const blend=eq ? 0.03 : destructiveSubscribe ? 0.06 : e.blend;"""
          new="""const e=effectRef.current,[r,g,b]=hexRgb(e.keyColor);const destructiveSubscribe=assets?.previewType==='Subscribe'&&e.mode==='chromakey'&&Math.abs(e.similarity-.60)<.000001&&Math.abs(e.blend-.35)<.000001;const sim=destructiveSubscribe ? 0.10 : e.similarity;const blend=destructiveSubscribe ? 0.06 : e.blend;"""
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src-tauri/src/persistence.rs'); s=p.read_text()
          anchor='''fn migrate_library(app:&AppHandle,v:&mut Value)->bool{\n  let Some(obj)=v.as_object_mut() else{return false};\n  let mut changed=false;'''
          insert='''fn migrate_library(app:&AppHandle,v:&mut Value)->bool{\n  let Some(obj)=v.as_object_mut() else{return false};\n  let mut changed=false;\n\n  const EQ_VIS_MIGRATION:&str="roundEqualizerVisibility1015SafeDefaults";\n  let already_migrated=obj.get("_migrations").and_then(Value::as_object).and_then(|m|m.get(EQ_VIS_MIGRATION)).and_then(Value::as_u64).unwrap_or(0)>=1;\n  let mut found_round_equalizer=false;\n  if !already_migrated{\n    if let Some(items)=obj.get_mut("effects").and_then(Value::as_array_mut){\n      for item in items.iter_mut(){\n        let Some(effect)=item.as_object_mut() else{continue};\n        let id=effect.get("id").and_then(Value::as_str).unwrap_or("");\n        let name=effect.get("name").and_then(Value::as_str).unwrap_or("").trim().to_lowercase();\n        let is_round=id=="825dd7a4-f0cf-4032-a3c9-64290cb5756d"||name=="эквалайзер круглый";\n        if !is_round{continue}\n        found_round_equalizer=true;\n        if effect.get("mode").and_then(Value::as_str)==Some("chromakey"){\n          let sim=effect.get("similarity").and_then(Value::as_f64).unwrap_or(0.10);\n          let blend=effect.get("blend").and_then(Value::as_f64).unwrap_or(0.06);\n          let despill=effect.get("despill").and_then(Value::as_f64).unwrap_or(0.35);\n          if (sim-0.60).abs()<0.000_001&&(blend-0.35).abs()<0.000_001&&(despill-1.0).abs()<0.000_001{\n            effect.insert("similarity".into(),json!(0.10));\n            effect.insert("blend".into(),json!(0.06));\n            effect.insert("despill".into(),json!(0.35));\n            effect.insert("cacheReady".into(),json!(false));\n            effect.insert("cacheKey".into(),Value::Null);\n            changed=true;\n          }\n        }\n      }\n    }\n    if found_round_equalizer{\n      let migrations=obj.entry("_migrations").or_insert_with(||json!({}));\n      if !migrations.is_object(){*migrations=json!({});}\n      if let Some(map)=migrations.as_object_mut(){map.insert(EQ_VIS_MIGRATION.into(),json!(1));}\n      changed=true;\n    }\n  }'''
          assert anchor in s; s=s.replace(anchor,insert,1)
          old='''pub fn save_library(app:AppHandle,mut payload:Value)->Result<(),String>{\n  let _=migrate_library(&app,&mut payload);\n  write_value(&app,"library.json",&payload).map_err(|e|e.to_string())\n}'''
          new='''pub fn save_library(app:AppHandle,mut payload:Value)->Result<(),String>{\n  let existing=read_value(&app,"library.json");\n  if let (Some(dst),Some(migrations))=(payload.as_object_mut(),existing.get("_migrations").cloned()){dst.insert("_migrations".into(),migrations);}\n  let _=migrate_library(&app,&mut payload);\n  write_value(&app,"library.json",&payload).map_err(|e|e.to_string())\n}'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          editors=Path('src/pages/Editors.tsx').read_text()
          assert 'similarity:0.10' in editors and 'blend:0.06' in editors and 'despill:0.35' in editors
          assert 'max={0.6}' in editors and 'max={0.35}' in editors and 'max={1}' in editors
          assert 'СБРОСИТЬ CHROMAKEY' in editors
          PY
          git diff --check
      - name: Commit clean product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'ENDLUME Hotfix Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/src/cache.rs src/components/LiveCompositePreview.tsx src-tauri/src/persistence.rs
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(10.0.15): preserve Round Equalizer visibility'
          git push origin HEAD:hotfix/endlume-10.0.15-equalizer-visibility
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
