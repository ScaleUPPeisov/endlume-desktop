name: ENDLUME 10.0.12 owner REAL physical updater gate

on:
  push:
    branches:
      - release-fix/endlume-10.0.12-physical-signing-compat
    paths:
      - '.github/workflows/endlume-1012-owner-real-physical-update.yml'

permissions:
  contents: read

jobs:
  real-physical-update:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - name: Preflight exact physical 10.0.11 and live corrected stable
        shell: bash
        run: |
          set -euo pipefail
          APP='/Applications/ENDLUME YT Studio PEISOV.app'
          INFO="$APP/Contents/Info.plist"
          DATA="$HOME/Library/Application Support/studio.endlume.desktop"
          ROOT="$RUNNER_TEMP/endlume-real-physical-${GITHUB_RUN_ID}"
          mkdir -p "$ROOT"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "INFO=$INFO" >> "$GITHUB_ENV"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          test -d "$APP"
          test -f "$INFO"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          SHA=$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')
          echo "PRE_SHORT=$SHORT"
          echo "PRE_BUILD=$BUILD"
          echo "PRE_BINARY_SHA256=$SHA"
          test "$SHORT" = '10.0.11'
          test "$BUILD" = '10.0.11'
          test "$SHA" = '8f60dbe1dd611db407c2d096aebd4597f6ff2af07c881e2e41d163e19b2b80c0'
          strings -a "$APP/Contents/MacOS/$EXE" > "$ROOT/physical-10.0.11.strings.txt"
          grep -Fq 'https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/latest.json' "$ROOT/physical-10.0.11.strings.txt"
          echo 'PHYSICAL_SOURCE_EXACT_10_0_11=PASS'

          python3 - "$APP/Contents/MacOS/$EXE" "$ROOT/physical.pub" <<'PY'
          import sys,base64,hashlib
          data=open(sys.argv[1],'rb').read()
          prefix=b'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6I'
          found=[]; start=0
          while True:
              i=data.find(prefix,start)
              if i<0: break
              for n in range(120,241,4):
                  s=data[i:i+n]
                  try:
                      raw=base64.b64decode(s,validate=True); text=raw.decode(); lines=text.strip().splitlines()
                      if len(lines)==2 and lines[0].startswith('untrusted comment: minisign public key: '):
                          pkt=base64.b64decode(lines[1],validate=True)
                          if len(pkt)==42 and pkt[:2]==b'Ed': found.append((s.decode(),text,pkt))
                  except Exception: pass
              start=i+1
          uniq={x[0]:x for x in found}
          if len(uniq)!=1: raise SystemExit(f'physical pubkey candidates={len(uniq)}')
          b64,text,pkt=next(iter(uniq.values()))
          assert b64=='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEQzMjJDRDUwNDkxRDM1MDAKUldRQU5SMUpVTTBpMCs2TTF5UjZkS1h3K0N5UUlBb0srYmVtN1lianVCdEY2ZkxuN2FlM1AyQmoK'
          assert pkt[2:10].hex()=='00351d4950cd22d3'
          open(sys.argv[2],'w').write(text)
          print('PHYSICAL_PUBKEY_SHA256='+hashlib.sha256(b64.encode()).hexdigest())
          print('PHYSICAL_KEYID='+pkt[2:10].hex())
          PY

          STABLE='https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable'
          curl -fL --retry 4 --retry-delay 2 "$STABLE/latest.json" -o "$ROOT/latest.json"
          python3 - "$ROOT/latest.json" "$ROOT/live.sig.txt" <<'PY'
          import sys,json,base64
          m=json.load(open(sys.argv[1]))
          assert m['version']=='10.0.12',m.get('version')
          p=m['platforms']['darwin-aarch64']
          assert p['url']=='https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/ENDLUME-macos-aarch64.app.tar.gz',p['url']
          s=p['signature'].strip(); assert s
          text=s if s.startswith('untrusted comment:') else base64.b64decode(s,validate=True).decode()
          open(sys.argv[2],'w').write(text+'\n' if not text.endswith('\n') else text)
          pkt=base64.b64decode(text.strip().splitlines()[1],validate=True)
          assert pkt[2:10].hex()=='00351d4950cd22d3',pkt[2:10].hex()
          print('LIVE_STABLE_VERSION=10.0.12')
          print('LIVE_SIGNATURE_KEYID='+pkt[2:10].hex())
          print('LIVE_SIGNATURE_MATCHES_PHYSICAL=PASS')
          PY
          curl -fL --retry 4 --retry-delay 2 "$STABLE/ENDLUME-macos-aarch64.app.tar.gz" -o "$ROOT/live.tar.gz"
          TAR_SHA=$(shasum -a 256 "$ROOT/live.tar.gz" | awk '{print $1}')
          echo "LIVE_TAR_SHA256=$TAR_SHA"
          test "$TAR_SHA" = '62da0292f2bb3f2cd5e10860d1a196ec50c90b4332dd3529ed9cef169928b209'
          command -v minisign >/dev/null 2>&1 || brew install minisign >/dev/null
          minisign -Vm "$ROOT/live.tar.gz" -x "$ROOT/live.sig.txt" -p "$ROOT/physical.pub" >/dev/null
          echo 'LIVE_PACKAGE_VERIFIES_WITH_PHYSICAL_KEY=PASS'

      - name: Snapshot persistent owner state before real updater
        shell: bash
        run: |
          set -euo pipefail
          : > "$ROOT/state-before.txt"
          for f in settings.json license.json library.json; do
            if [ -f "$DATA/$f" ]; then
              sha=$(shasum -a 256 "$DATA/$f" | awk '{print $1}')
              bytes=$(stat -f %z "$DATA/$f")
              printf '%s\tPRESENT\t%s\t%s\n' "$f" "$sha" "$bytes" >> "$ROOT/state-before.txt"
            else
              printf '%s\tABSENT\n' "$f" >> "$ROOT/state-before.txt"
            fi
          done
          sort -o "$ROOT/state-before.txt" "$ROOT/state-before.txt"
          cat "$ROOT/state-before.txt"
          echo 'STATE_SNAPSHOT_BEFORE=PASS'

      - name: Execute updater ONLY through physical ENDLUME 10.0.11 UI
        shell: bash
        run: |
          set -euo pipefail
          # No bundle patching, no endpoint patching, no tar extraction, no manual app replacement.
          pkill -x "$EXE" 2>/dev/null || true
          sleep 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = '10.0.11'
          test "$(shasum -a 256 "$APP/Contents/MacOS/$EXE" | awk '{print $1}')" = '8f60dbe1dd611db407c2d096aebd4597f6ff2af07c881e2e41d163e19b2b80c0'

          open -n "$APP"
          APP_PID=''
          for i in $(seq 1 45); do
            for p in $(pgrep -x "$EXE" 2>/dev/null || true); do
              cmd=$(ps -p "$p" -o command= 2>/dev/null || true)
              case "$cmd" in
                "$APP/Contents/MacOS/$EXE"*) APP_PID="$p"; break 2;;
              esac
            done
            sleep 1
          done
          test -n "$APP_PID"
          echo "PHYSICAL_APP_PID=$APP_PID"
          sleep 3

          clicked=0
          for attempt in $(seq 1 40); do
            OUT=$(osascript - "$APP_PID" <<'APPLESCRIPT'
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              try
                set p to first application process whose unix id is targetPid
                set frontmost of p to true
                repeat with w in windows of p
                  repeat with e in entire contents of w
                    set nm to ""
                    set ds to ""
                    set vl to ""
                    try
                      set nm to name of e as text
                    end try
                    try
                      set ds to description of e as text
                    end try
                    try
                      set vl to value of e as text
                    end try
                    set blob to nm & " " & ds & " " & vl
                    if (blob contains "ПРОВЕРИТЬ ОБНОВЛЕНИЯ") or (blob contains "CHECK FOR UPDATES") or (blob contains "Check for updates") then
                      try
                        perform action "AXPress" of e
                        return "CLICKED_EXACT:" & blob
                      end try
                    end if
                  end repeat
                end repeat
                repeat 30 times
                  key code 48
                  delay 0.12
                  try
                    set f to value of attribute "AXFocusedUIElement" of p
                    set nm to ""
                    set ds to ""
                    try
                      set nm to name of f as text
                    end try
                    try
                      set ds to description of f as text
                    end try
                    set blob to nm & " " & ds
                    if (blob contains "ПРОВЕРИТЬ ОБНОВЛЕНИЯ") or (blob contains "CHECK FOR UPDATES") or (blob contains "Check for updates") then
                      key code 49
                      return "CLICKED_TAB:" & blob
                    end if
                  end try
                end repeat
              on error errText
                return "ERROR:" & errText
              end try
            end tell
            return "NOT_FOUND"
          end run
          APPLESCRIPT
            )
            echo "UPDATE_UI attempt=$attempt result=$OUT"
            if [[ "$OUT" == CLICKED_* ]]; then clicked=1; break; fi
            sleep 1
          done
          test "$clicked" -eq 1
          echo '10.0.11_TO_10.0.12_DETECTED=PASS'

          installed=0
          for i in $(seq 1 600); do
            S=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO" 2>/dev/null || true)
            B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO" 2>/dev/null || true)
            if [ "$S" = '10.0.12' ] && [ "$B" = '10.0.12' ]; then installed=1; break; fi
            if (( i % 15 == 0 )); then echo "WAIT_INSTALL second=$i short=$S build=$B"; fi
            sleep 1
          done
          if [ "$installed" -ne 1 ]; then
            echo '--- PHYSICAL UI TEXT DIAGNOSTIC ---'
            osascript - "$APP_PID" <<'APPLESCRIPT' || true
          on run argv
            set targetPid to (item 1 of argv) as integer
            tell application "System Events"
              try
                set p to first application process whose unix id is targetPid
                repeat with w in windows of p
                  repeat with e in entire contents of w
                    try
                      set v to value of e as text
                      if v is not "" then log v
                    end try
                    try
                      set n to name of e as text
                      if n is not "" then log n
                    end try
                  end repeat
                end repeat
              end try
            end tell
          end run
          APPLESCRIPT
            exit 31
          fi
          echo 'DOWNLOAD=PASS'
          echo 'PHYSICAL_TAURI_SIGNATURE_VERIFICATION=PASS'
          echo 'INSTALL=PASS'
          echo 'INSTALLED_CFBundleShortVersionString=10.0.12'
          echo 'INSTALLED_CFBundleVersion=10.0.12'

      - name: Verify exact corrected 10.0.12 landed and relaunch physical app
        shell: bash
        run: |
          set -euo pipefail
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          test "$SHORT" = '10.0.12'
          test "$BUILD" = '10.0.12'
          NEW_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")
          SHA=$(shasum -a 256 "$APP/Contents/MacOS/$NEW_EXE" | awk '{print $1}')
          echo "POST_BINARY_SHA256=$SHA"
          test "$SHA" = '2df386c00da09e76f90218061e7f57ccfba2249a654ec1262b06000b322eb9d7'
          strings -a "$APP/Contents/MacOS/$NEW_EXE" > "$ROOT/installed-10.0.12.strings.txt"
          grep -Fq 'https://endlume-updates.vercel.app/api/update?target=' "$ROOT/installed-10.0.12.strings.txt"
          python3 - "$APP/Contents/MacOS/$NEW_EXE" <<'PY'
          import sys,base64
          data=open(sys.argv[1],'rb').read(); prefix=b'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6I'; found=[]; start=0
          while True:
              i=data.find(prefix,start)
              if i<0: break
              for n in range(120,241,4):
                  s=data[i:i+n]
                  try:
                      raw=base64.b64decode(s,validate=True); text=raw.decode(); lines=text.strip().splitlines()
                      if len(lines)==2 and lines[0].startswith('untrusted comment: minisign public key: '):
                          pkt=base64.b64decode(lines[1],validate=True)
                          if len(pkt)==42 and pkt[:2]==b'Ed': found.append((s.decode(),pkt))
                  except Exception: pass
              start=i+1
          uniq={x[0]:x for x in found}; assert len(uniq)==1,len(uniq)
          b64,pkt=next(iter(uniq.values()))
          assert b64=='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEQzMjJDRDUwNDkxRDM1MDAKUldRQU5SMUpVTTBpMCs2TTF5UjZkS1h3K0N5UUlBb0srYmVtN1lianVCdEY2ZkxuN2FlM1AyQmoK'
          assert pkt[2:10].hex()=='00351d4950cd22d3'
          print('INSTALLED_10_0_12_TRUST_ROOT_PRESERVED=PASS')
          PY

          pkill -x "$NEW_EXE" 2>/dev/null || true
          sleep 2
          open -n "$APP"
          RELAUNCH_PID=''
          for i in $(seq 1 60); do
            for p in $(pgrep -x "$NEW_EXE" 2>/dev/null || true); do
              cmd=$(ps -p "$p" -o command= 2>/dev/null || true)
              case "$cmd" in
                "$APP/Contents/MacOS/$NEW_EXE"*) RELAUNCH_PID="$p"; break 2;;
              esac
            done
            sleep 1
          done
          test -n "$RELAUNCH_PID"
          sleep 5
          kill -0 "$RELAUNCH_PID"
          echo "RELAUNCH_PID=$RELAUNCH_PID"
          echo 'RELAUNCH=PASS'
          echo 'PHYSICAL_APP_LAUNCH_10_0_12=PASS'

      - name: Verify owner settings, license and library survived unchanged
        shell: bash
        run: |
          set -euo pipefail
          : > "$ROOT/state-after.txt"
          for f in settings.json license.json library.json; do
            if [ -f "$DATA/$f" ]; then
              sha=$(shasum -a 256 "$DATA/$f" | awk '{print $1}')
              bytes=$(stat -f %z "$DATA/$f")
              printf '%s\tPRESENT\t%s\t%s\n' "$f" "$sha" "$bytes" >> "$ROOT/state-after.txt"
            else
              printf '%s\tABSENT\n' "$f" >> "$ROOT/state-after.txt"
            fi
          done
          sort -o "$ROOT/state-after.txt" "$ROOT/state-after.txt"
          cat "$ROOT/state-after.txt"
          diff -u "$ROOT/state-before.txt" "$ROOT/state-after.txt"
          echo 'SETTINGS_PRESERVED=PASS'
          echo 'LICENSE_PRESERVED=PASS'
          echo 'LIBRARY_PRESERVED=PASS'

      - name: Verify installed 10.0.12 update channel returns no update
        shell: bash
        run: |
          set -euo pipefail
          URL='https://endlume-updates.vercel.app/api/update?target=darwin&arch=aarch64&current_version=10.0.12'
          CODE=$(curl -sS -o "$ROOT/1012-check.body" -w '%{http_code}' "$URL")
          echo "10.0.12_UPDATE_HTTP=$CODE"
          test "$CODE" = '204'
          test ! -s "$ROOT/1012-check.body"
          echo '10.0.12_UPDATE_CHECK=204'

      - name: Upload non-sensitive gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENDLUME-10.0.12-real-physical-updater-gate
          path: |
            ${{ runner.temp }}/endlume-real-physical-${{ github.run_id }}/state-before.txt
            ${{ runner.temp }}/endlume-real-physical-${{ github.run_id }}/state-after.txt
            ${{ runner.temp }}/endlume-real-physical-${{ github.run_id }}/latest.json
          if-no-files-found: warn
          retention-days: 14