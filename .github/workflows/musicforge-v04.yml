name: Build MusicForge AI v0.4 for Mac M1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/musicforge-v04.yml'
      - 'musicforge-v04/**'

jobs:
  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild v0.4 source
        run: |
          cat musicforge-v02/chunks/*.txt > /tmp/v02.b64
          python3 - <<'PY'
          import base64, hashlib, pathlib, gzip
          data=base64.b64decode(pathlib.Path('/tmp/v02.b64').read_text().strip(), validate=True)
          assert hashlib.sha256(data).hexdigest()=='8a9dc8c16a06c14419a65df74c9307e472cff70eaba1ae89dc0b221742e69f7b'
          pathlib.Path('/tmp/v02.zip').write_bytes(data)
          for src,dst in [
              ('musicforge-v03/patch.gz.b64','/tmp/v03.patch'),
              ('musicforge-v031/patch.gz.b64','/tmp/v031.patch'),
              ('musicforge-v04/patch.gz.b64','/tmp/v04.patch')]:
              text=''.join(pathlib.Path(src).read_text().split())
              raw=base64.b64decode(text + '=' * ((4-len(text)%4)%4), validate=False)
              pathlib.Path(dst).write_bytes(gzip.decompress(raw))
          PY
          unzip -q /tmp/v02.zip
          cd musicforge-ai
          patch -p1 --forward --batch < /tmp/v03.patch
          patch -p1 --forward --batch < /tmp/v031.patch
          patch -p1 --forward --batch < /tmp/v04.patch
          grep -q '"version": "0.4.0"' package.json
          grep -q 'generation:transform' main.js
          grep -q 'trackToolsModal' renderer/index.html
          grep -q '1-step Turbo' renderer/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript and UI checks
        working-directory: musicforge-ai
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js
          ! grep -q "navigate('settings')" renderer/app.js
          python3 - <<'PY'
          import re, pathlib
          js=pathlib.Path('renderer/app.js').read_text()
          html=pathlib.Path('renderer/index.html').read_text()
          ids=set(re.findall(r"\\$\\('#([^']+)'\\)", js))
          missing=sorted(i for i in ids if f'id="{i}"' not in html)
          assert not missing, f'Missing DOM ids: {missing}'
          assert 'update: {' in js
          assert "data-transform=\"cover\"" in html
          assert "data-transform=\"remix\"" in html
          assert "data-transform=\"extend\"" in html
          print('UI checks OK:', len(ids), 'selectors')
          PY
      - name: Install dependencies
        working-directory: musicforge-ai
        run: npm install --no-audit --no-fund
      - name: Build macOS icon
        working-directory: musicforge-ai
        run: |
          python3 -m venv /tmp/musicforge-icon-venv
          /tmp/musicforge-icon-venv/bin/python -m pip install --disable-pip-version-check cairosvg
          /tmp/musicforge-icon-venv/bin/python scripts/make_icon.py
          iconutil -c icns assets/AppIcon.iconset -o assets/icon.icns
      - name: Package and verify ARM64
        working-directory: musicforge-ai
        run: |
          npm run package:mac
          APP_PATH="dist/MusicForge AI-darwin-arm64/MusicForge AI.app"
          file "$APP_PATH/Contents/MacOS/MusicForge AI" | tee /tmp/file.txt
          grep -q arm64 /tmp/file.txt
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
      - name: Create release ZIP
        working-directory: musicforge-ai
        run: |
          cd "dist/MusicForge AI-darwin-arm64"
          ditto -c -k --sequesterRsrc --keepParent "MusicForge AI.app" "../MusicForge-AI-v0.4.0-Mac-M1.zip"
          unzip -t "../MusicForge-AI-v0.4.0-Mac-M1.zip"
          shasum -a 256 "../MusicForge-AI-v0.4.0-Mac-M1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicForge-AI-v0.4.0-Mac-M1
          path: musicforge-ai/dist/MusicForge-AI-v0.4.0-Mac-M1.zip
          retention-days: 14
