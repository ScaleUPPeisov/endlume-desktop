name: Build MusicForge AI v0.3 Fixed for Mac M1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/musicforge-v03-fixed.yml'
      - 'musicforge-v03/**'

jobs:
  build-macos-arm64:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild verified v0.2 source
        run: |
          cat musicforge-v02/chunks/*.txt > /tmp/musicforge-v02-source.b64
          python3 - <<'PY'
          import base64, hashlib, pathlib
          src = pathlib.Path('/tmp/musicforge-v02-source.b64').read_text().strip()
          data = base64.b64decode(src, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected = '8a9dc8c16a06c14419a65df74c9307e472cff70eaba1ae89dc0b221742e69f7b'
          print('v0.2 source sha256:', digest)
          if digest != expected:
              raise SystemExit(f'Source checksum mismatch: {digest}')
          pathlib.Path('/tmp/musicforge-v02-source.zip').write_bytes(data)
          PY
          unzip -t /tmp/musicforge-v02-source.zip
          unzip -q /tmp/musicforge-v02-source.zip
          test -f musicforge-ai/main.js

      - name: Apply exact v0.3 patch
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          encoded = pathlib.Path('musicforge-v03/patch.gz.b64').read_text().strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          pathlib.Path('/tmp/musicforge-v03.patch').write_bytes(patch)
          print('patch bytes:', len(patch))
          PY
          cd musicforge-ai
          patch -p1 --forward --batch < /tmp/musicforge-v03.patch
          grep -q '"version": "0.3.0"' package.json
          grep -q 'Быстрый Preview' renderer/index.html
          grep -q 'UPDATE_MANIFEST_URL' main.js

      - name: Verify Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax checks
        working-directory: musicforge-ai
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js

      - name: Install dependencies
        working-directory: musicforge-ai
        run: npm install --no-audit --no-fund

      - name: Build macOS icon
        working-directory: musicforge-ai
        run: |
          python3 -m venv /tmp/musicforge-icon-venv
          /tmp/musicforge-icon-venv/bin/python -m pip install --disable-pip-version-check cairosvg
          /tmp/musicforge-icon-venv/bin/python scripts/make_icon.py
          iconutil -c icns assets/AppIcon.iconset -o assets/icon.icns
          test -f assets/icon.icns

      - name: Package MusicForge AI.app
        working-directory: musicforge-ai
        run: npm run package:mac

      - name: Verify ARM64 and sign
        working-directory: musicforge-ai
        run: |
          APP_PATH="dist/MusicForge AI-darwin-arm64/MusicForge AI.app"
          BIN="$APP_PATH/Contents/MacOS/MusicForge AI"
          file "$BIN"
          file "$BIN" | grep -q arm64
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify packaged source markers
        working-directory: musicforge-ai
        run: |
          test -f "dist/MusicForge AI-darwin-arm64/MusicForge AI.app/Contents/Resources/app.asar"
          node --check main.js
          node --check renderer/app.js
          grep -q 'Быстрый Preview' renderer/index.html

      - name: Make distributable ZIP
        working-directory: musicforge-ai
        run: |
          cd "dist/MusicForge AI-darwin-arm64"
          ditto -c -k --sequesterRsrc --keepParent "MusicForge AI.app" "../MusicForge-AI-v0.3-Mac-M1.zip"
          unzip -t "../MusicForge-AI-v0.3-Mac-M1.zip"
          shasum -a 256 "../MusicForge-AI-v0.3-Mac-M1.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicForge-AI-v0.3-Mac-M1-Fixed
          path: musicforge-ai/dist/MusicForge-AI-v0.3-Mac-M1.zip
          if-no-files-found: error
          retention-days: 14
