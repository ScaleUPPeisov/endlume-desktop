name: ENDLUME 8.58 Final Integrated
on:
  push:
    branches: [candidate/endlume-858-final-vyron-render-library]
permissions:
  contents: read
concurrency:
  group: endlume-858-final-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  final:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Prove integrated 8.58 scope and frozen render core
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=6635dafd372f4bf04d05c9c1c4de1b6d8d0d047b
          git diff --exit-code "$BASE" HEAD -- src-tauri/src/render.rs
          python3 - "$BASE" <<'PY'
          import subprocess,sys
          base=sys.argv[1]
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/endlume-858-final-physical-v2.yml',
            '.github/workflows/endlume-858-final-integrated.yml',
            'scripts/apply-queue-finalization-hotfix-8-58.py',
            'scripts/test-queue-finalization-8-58.mjs',
            'src-tauri/src/queue.rs','src/pages/App.tsx','src/queue-state.ts','src/store.ts',
            'src-tauri/src/vyron_bridge.rs','src-tauri/src/vyron_bridge_tests.rs'
          }
          extra=changed-allowed
          assert not extra,(sorted(changed),sorted(extra))
          required={
            'scripts/apply-queue-finalization-hotfix-8-58.py','scripts/test-queue-finalization-8-58.mjs',
            'src-tauri/src/queue.rs','src/queue-state.ts','src-tauri/src/vyron_bridge.rs','src-tauri/src/vyron_bridge_tests.rs'
          }
          assert required<=changed,(sorted(changed),sorted(required-changed))
          print('INTEGRATED_858_SCOPE_OK',sorted(changed))
          PY

      - name: Restore FFmpeg and apply production migrations
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
          CORE_BEFORE="$(shasum -a 256 src-tauri/src/render.rs|awk '{print $1}')"
          python3 scripts/apply-queue-finalization-hotfix-8-58.py
          CORE_AFTER="$(shasum -a 256 src-tauri/src/render.rs|awk '{print $1}')"
          test "$CORE_BEFORE" = "$CORE_AFTER"
          echo "RENDER_CORE_SHA256=$CORE_AFTER"
          grep -Fq 'const STRICT_857_MAX_GOP_FRAMES:u32=1800;' src-tauri/src/render.rs
          grep -Fq 'progressPending.delete(p.id)' src/pages/App.tsx
          grep -Fq 'finished:Mutex<VecDeque<Value>>' src-tauri/src/queue.rs
          grep -Fq 'fn latest_result_for_job' src-tauri/src/queue.rs
          grep -Fq 'runtime.remember_terminal(done_fallback_payload(&job))' src-tauri/src/queue.rs
          grep -Fq '"finished":finished' src-tauri/src/queue.rs
          grep -Fq 'const finished=Array.isArray(snapshot?.finished)?snapshot.finished:[]' src/queue-state.ts

      - name: Prove VYRON channel render-library contract
        shell: bash
        run: |
          set -Eeuo pipefail
          assert_contains() {
            local file="$1" pattern="$2" label="$3"
            if ! grep -Fq "$pattern" "$file"; then
              echo "FAIL: $label"
              echo "  file: $file"
              echo "  expected: $pattern"
              exit 1
            fi
            echo "PASS: $label"
          }
          assert_contains src-tauri/src/vyron_bridge.rs 'fn safe_channel_folder' 'channel folder sanitization exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'fn vyron_workspace_root' 'VYRON workspace resolver exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'workspace.join("Render").join(safe_channel_folder(channel_name))' 'central Render/<channel> output exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'let output=resolve_render_output(&v,&root,&channel_name)?;' 'manifest import uses render-library resolver'
          assert_contains src/components/VyronBatchBridge.tsx 'st.patchSettings({outputDir:info.outputDir})' 'frontend applies bridge outputDir'
          assert_contains src/components/VyronBatchBridge.tsx "'Completed',e.payload?.resultPath||null" 'completed output path is reported to VYRON'
          assert_contains src-tauri/src/render.rs 'let requested_out_dir=PathBuf::from(&job.settings.output_dir);let out_dir=resolve_output_dir(app,&requested_out_dir)?;' 'renderer remains settings-driven'
          assert_contains src-tauri/src/vyron_bridge_tests.rs 'vyron_render_library_sanitizes_channel_folder' 'sanitization regression exists'
          assert_contains src-tauri/src/vyron_bridge_tests.rs 'join("Render").join("NEON")' 'central Render/NEON regression exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'source_manifest_path' 'handoff source-manifest contract preserved'
          assert_contains src-tauri/src/vyron_bridge.rs 'selected_project_ids' 'selected-project handoff preserved'

      - name: Frontend production and 40-item queue regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          rm -rf .queue-test-dist
          ./node_modules/.bin/tsc src/queue-state.ts --target ES2022 --module ES2022 --moduleResolution Bundler --skipLibCheck --outDir .queue-test-dist --noEmit false
          node scripts/test-queue-finalization-8-58.mjs "$GITHUB_WORKSPACE/.queue-test-dist/queue-state.js"
          npm run build

      - name: Rust full regression and VYRON focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture

      - name: Stage exact physical fixture and detect concurrent user render
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp -d /tmp/e858integratedfixture.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          BUSY=0
          if pgrep -af '[f]fmpeg' > /tmp/e858-integrated-live-render.txt 2>/dev/null; then BUSY=1; fi
          echo "ENDLUME_EXTERNAL_RENDER_BUSY=$BUSY" >> "$GITHUB_ENV"
          echo "EXTERNAL_RENDER_BUSY=$BUSY"
          cat /tmp/e858-integrated-live-render.txt 2>/dev/null || true
          pmset -g therm 2>/dev/null || true
          uptime || true
          sleep 10

      - name: Exact real master integrity and speed gate
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          TMP="$(mktemp -d /tmp/e858integratedmaster.XXXX)"; trap 'rm -rf "$TMP"' EXIT
          "$FFM" -hide_banner -loglevel error -i "$FX1" -vf "fps=30,format=rgba,colorkey=0x0aa843:0.6:0.184,scale=252:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx1.mov"
          "$FFM" -hide_banner -loglevel error -i "$FX2" -vf "fps=30,format=rgba,colorkey=0x2bdc0a:0.6:0.188,scale=2128:-2:flags=lanczos,format=argb" -an -c:v qtrle -pix_fmt argb -y "$TMP/fx2.mov"
          GRAPH="[0:v]scale=1920:1080:force_original_aspect_ratio=increase:flags=lanczos+accurate_rnd,crop=1920:1080:(iw-ow)/2:(ih-oh)/2,fps=30,setsar=1[b0];[1:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx0];[b0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.8834535728307813-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b1];[2:v]fps=30,setpts=PTS-STARTPTS,format=argb[fx1];[b1][fx1]overlay=x='max(0,min(W-w,W*0.49-w/2))':y='max(0,min(H-h,H*0.49-h/2))':shortest=0:repeatlast=1:eof_action=repeat:format=auto[b2];[b2]fps=60,format=yuv420p[outv]"
          T0=$(python3 -c 'import time;print(time.time())')
          "$FFM" -hide_banner -loglevel error -filter_complex_threads 8 -loop 1 -framerate 30 -i "$IMG" -stream_loop -1 -i "$TMP/fx1.mov" -stream_loop -1 -i "$TMP/fx2.mov" -filter_complex "$GRAPH" -map '[outv]' -frames:v 3381 -an -c:v hevc_videotoolbox -realtime 1 -prio_speed 0 -power_efficient 0 -q:v 100 -b:v 500k -maxrate 12M -bufsize 64M -g 1800 -tag:v hvc1 -pix_fmt yuv420p -fps_mode cfr -r 60 -video_track_timescale 60000 -y "$TMP/master.mp4"
          T1=$(python3 -c 'import time;print(time.time())')
          FRAMES="$($FFP -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$TMP/master.mp4")"
          PACKETS="$($FFP -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of csv=p=0 "$TMP/master.mp4")"
          DUR="$($FFP -v error -show_entries format=duration -of csv=p=0 "$TMP/master.mp4")"
          "$FFP" -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,avg_frame_rate -of json "$TMP/master.mp4" > "$TMP/stream.json"
          python3 - "$T0" "$T1" "$FRAMES" "$PACKETS" "$DUR" "$TMP/stream.json" "$ENDLUME_EXTERNAL_RENDER_BUSY" <<'PY'
          import json,sys
          dt=float(sys.argv[2])-float(sys.argv[1]);frames=int(sys.argv[3]);packets=int(sys.argv[4]);dur=float(sys.argv[5]);s=json.load(open(sys.argv[6]))['streams'][0];busy=sys.argv[7]=='1'
          tier='ideal' if dt<=20.0 else ('normal' if dt<=24.0 else ('acceptable' if dt<=30.0 else 'too_slow'))
          m={'seconds':round(dt,3),'speed_tier':tier,'frames':frames,'packets':packets,'duration':round(dur,6),'codec':s.get('codec_name'),'pix_fmt':s.get('pix_fmt'),'width':s.get('width'),'height':s.get('height'),'fps':s.get('avg_frame_rate'),'busy':busy,'gop':1800,'quality':'q:v 100'}
          print('REAL_858_INTEGRATED_MASTER',json.dumps(m,ensure_ascii=False))
          assert frames==3381 and packets==3381,m
          assert s.get('width')==1920 and s.get('height')==1080,m
          assert s.get('avg_frame_rate')=='60/1' and s.get('codec_name')=='hevc' and s.get('pix_fmt')=='yuv420p',m
          assert 56.34<=dur<=56.37,m
          if not busy: assert dt<=30.0,m
          else: print('SPEED_THRESHOLD_NOT_USED: external ffmpeg was active; media integrity remains mandatory')
          PY

      - name: Precompile sample-table expander
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml external_prefix_cycle_manifest_if_requested --no-run

      - name: Full physical Subscribe-OFF media integrity E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          TESTSCRIPT="$RUNNER_TEMP/run-endlume-858-integrated-e2e.py"
          cp scripts/run-endlume-857-real-e2e.py "$TESTSCRIPT"
          python3 - "$TESTSCRIPT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text();old='    assert master_seconds <= 24.0, master_seconds';new="    print('E2E_MASTER_SECONDS', master_seconds, 'speed is gated separately; this gate validates full media integrity')"
          assert old in s;s=s.replace(old,new,1);p.write_text(s)
          PY
          python3 "$TESTSCRIPT" "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/858-integrated-off.json"
          cat 858-integrated-off.json
          python3 - <<'PY'
          import json
          x=json.load(open('858-integrated-off.json'));assert x.get('status')=='passed' and x.get('release_gate') is True,x
          PY

      - name: Physical real Subscribe-ON E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          FFM="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)"
          FFP="$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)"
          python3 scripts/find-endlume-real-subscribe.py "$GITHUB_WORKSPACE/858-integrated-subscribe.json"
          python3 scripts/run-endlume-857-subscribe-on.py "$SIDE" 858-integrated-subscribe.json "$FFM" "$FFP" "$GITHUB_WORKSPACE/858-integrated-on.json"
          cat 858-integrated-on.json
          python3 - <<'PY'
          import json
          x=json.load(open('858-integrated-on.json'));assert x.get('status')=='passed' and x.get('release_gate') is True and x.get('subscribe_on_gate') is True,x
          PY

      - name: Final integrated verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PASS: ENDLUME 8.58 integrated — queue terminal self-heal + 40/40 regression + central VYRON Render/<channel> + full Rust + physical master <=30s exact integrity + Subscribe OFF/ON E2E.'
