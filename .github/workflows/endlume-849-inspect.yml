name: ENDLUME 8.49 Inspect Effective 8.47
on:
  push:
    branches: [candidate/performance-fidelity-audio-8.49]
    paths: ['.github/workflows/endlume-849-inspect.yml']
jobs:
  inspect:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Inspect exact reconstructed workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          R="$WORK/src-tauri/src/render.rs"
          test -f "$R"
          grep -Fq '1.0.0-alpha.8.47' "$WORK/package.json"
          python3 - "$R" <<'PY'
          from pathlib import Path
          import sys,re
          s=Path(sys.argv[1]).read_text()
          def show(name):
              patterns=[rf'async fn {re.escape(name)}\b',rf'fn {re.escape(name)}\b',rf'pub async fn {re.escape(name)}\b']
              m=None
              for pat in patterns:
                  m=re.search(pat,s)
                  if m: break
              print(f'\n===== {name} @ {m.start() if m else -1} =====')
              if not m:return
              p=m.start(); nxt=re.search(r'\n(?:pub )?(?:async )?fn [A-Za-z0-9_]+\b',s[m.end():])
              end=(m.end()+nxt.start()) if nxt else min(len(s),p+12000)
              print(s[p:min(len(s),end)])
          for name in ['render_work_dir','build_variant','render_sub_segment','assemble_visual','smart_final_duration','render_job']:
              show(name)
          print('\n===== IMPORTS =====')
          print('\n'.join(s.splitlines()[:16]))
          print('\n===== FINAL MUX LINES =====')
          for line in s.splitlines():
              if any(k in line for k in ['final-mux','video_track_timescale','AudioSource::','VisualSource::','unique_output(','render_work_dir(']):
                  print(line)
          PY