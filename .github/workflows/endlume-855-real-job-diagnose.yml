name: ENDLUME 8.55 Real Job Diagnose
on:
  push:
    branches: [diagnose/endlume-855-real-job]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/endlume-855-real-job
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect exact user output and ENDLUME/VYRON state
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT='/Volumes/TOSHIBA EXT/ВАЙРОН/ProductionManager/Batches/2e0e14ba-d97a-48d5-ab32-2fb2b27754bf/Neon Drive FM_BATCH_2026-09-05_001/Rendered/001 — Ready Videos.mov'
          echo "OUT=$OUT"
          test -f "$OUT"
          FFP="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap/src-tauri/binaries/ffprobe-aarch64-apple-darwin"
          if ! test -x "$FFP"; then FFP="$(command -v ffprobe)"; fi
          "$FFP" -v error -show_entries format=duration,size,bit_rate:stream=index,codec_type,codec_name,bit_rate,width,height,avg_frame_rate,sample_rate,channels -of json "$OUT"
          ROOT="$(dirname "$(dirname "$OUT")")"
          echo "ROOT=$ROOT"
          echo '--- BATCH FILES ---'
          find "$ROOT" -maxdepth 3 -type f \( -name 'batch.json' -o -name 'status.json' -o -name '*render*.json' -o -name '*render*.log' -o -name '*.txt' \) -print | sed 's#^#FILE #'
          python3 - "$ROOT" <<'PY'
          import json,sys,pathlib
          root=pathlib.Path(sys.argv[1])
          for name in ('batch.json','status.json'):
              p=root/name
              if p.exists():
                  print(f'--- {name} ---')
                  try:
                      d=json.loads(p.read_text())
                      if name=='batch.json':
                          print('batchId=',d.get('batchId'),'projectCount=',d.get('projectCount'),'outputDir=',d.get('outputDir'))
                          for pr in d.get('projects',[]):
                              if str(pr.get('projectId')) in ('001','1') or str(pr.get('folderPath','')).endswith('/001'):
                                  print('project=',json.dumps(pr,ensure_ascii=False,indent=2))
                      else:
                          print(json.dumps(d,ensure_ascii=False,indent=2)[:12000])
                  except Exception as e: print('ERR',e)
          PY
          echo '--- ENDLUME APP DATA CANDIDATES ---'
          find "$HOME/Library/Application Support" -maxdepth 4 -type f \( -name 'library.json' -o -name 'queue.json' -o -name 'recovery.json' -o -name 'session.json' \) 2>/dev/null | grep -Ei 'endlume|studio\.endlume' || true
          python3 - <<'PY'
          import json,pathlib,os
          base=pathlib.Path.home()/'Library'/'Application Support'
          files=[]
          for p in base.rglob('library.json'):
              if 'endlume' in str(p).lower(): files.append(p)
          for p in files:
              print('--- LIBRARY',p,'---')
              try:
                  d=json.loads(p.read_text())
                  for kind in ('effects','subscribes'):
                      print(kind.upper())
                      for x in d.get(kind,[]):
                          e=x.get('effect',x)
                          print(json.dumps({
                            'id':e.get('id'),'enabled':e.get('enabled'),'source':os.path.basename(str(e.get('source',''))),
                            'mode':e.get('mode'),'startSec':e.get('startSec'),'endSec':e.get('endSec'),
                            'repeatEverySec':x.get('repeatEverySec'),'firstAtSec':x.get('firstAtSec'),'secondAtSec':x.get('secondAtSec')
                          },ensure_ascii=False))
                  print('ambient=',d.get('ambient'))
              except Exception as e: print('ERR',e)
          for name in ('queue.json','recovery.json'):
              for p in base.rglob(name):
                  if 'endlume' not in str(p).lower(): continue
                  print('---',name,p,'---')
                  try:
                      d=json.loads(p.read_text())
                      txt=json.dumps(d,ensure_ascii=False,indent=2)
                      print(txt[:24000])
                  except Exception as e: print('ERR',e)
          PY
