name: ENDLUME Subscribe realtime0 3h speed probe

on:
  push:
    branches: [qa/endlume-04a-regression-v2]
    paths: ['.github/workflows/endlume-subscribe-realtime0-probe.yml']

permissions:
  contents: read

jobs:
  realtime0-probe:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch one VideoToolbox flag only and build actual app
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor a7a399e83de8b9248e2065c6dda1f9079ded6565 HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/fast_render.rs');s=p.read_text()
          old='"-c:v","hevc_videotoolbox","-realtime","1","-prio_speed","1","-power_efficient","0"'
          new='"-c:v","hevc_videotoolbox","-realtime","0","-prio_speed","1","-power_efficient","0"'
          assert s.count(old)==1,s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          test "$(git diff --name-only | grep -v '^src-tauri/src/fast_render.rs$' | wc -l | tr -d ' ')" = 0
          git diff -- src-tauri/src/fast_render.rs
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm run build
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"; BIN="$APP/Contents/MacOS/endlume"; test -x "$BIN"
          ROOT="$RUNNER_TEMP/rt0"; MEDIA="$ROOT/project"; FX="$ROOT/effects"; OUT="$ROOT/out"; mkdir -p "$MEDIA" "$FX" "$OUT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"; echo "FX=$FX" >> "$GITHUB_ENV"; echo "OUT=$OUT" >> "$GITHUB_ENV"; echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Generate exact 3-hour workload
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$MEDIA/cover.png"
          for i in $(seq -w 1 12); do n=$((10#$i)); hz=$((180+n*23)); ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$MEDIA/track-${i}.mp3"; done
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x00ff00:s=640x360:r=60:d=3" -f lavfi -i "color=c=white:s=180x100:r=60:d=3" -filter_complex "[0:v][1:v]overlay=x='70+300*t/3':y='120+45*sin(2*PI*t/3)':eval=frame:shortest=1" -an -c:v libx264 -preset ultrafast -g 180 -pix_fmt yuv420p -r 60 -y "$FX/subscribe.mp4"
          python3 - <<'PY'
          import glob,json,os
          m=os.environ['MEDIA'];f=os.environ['FX'];o=os.environ['OUT'];r=os.environ['ROOT']
          sub={'id':'subscribe','name':'Subscribe Animated 3s','source':os.path.join(f,'subscribe.mp4'),'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.12,'blend':0.08,'despill':1.0,'lumaThreshold':0.10,'lumaTolerance':0.05,'saturation':1.0,'x':0.15,'y':0.65,'scale':0.30,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':None,'firstAtSec':600.0,'secondAtSec':3600.0,'repeatEverySec':3600.0}
          job={'project':{'id':'rt0-probe','name':'RT0 Probe','path':m,'media':[os.path.join(m,'cover.png')],'audio':sorted(glob.glob(os.path.join(m,'track-*.mp3'))),'valid':True,'error':None},'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':30.0,'durationHours':3.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':o,'preset':'fast','encoderPreference':'auto'},'effects':[],'subscribes':[sub],'ambient':None}
          json.dump(job,open(os.path.join(r,'job.json'),'w'),indent=2)
          PY
      - name: Actual 3-hour export
        shell: bash
        run: |
          set +e
          ENDLUME_ACCEPTANCE_JOB="$ROOT/job.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/receipt.json" "$BIN" > "$ROOT/app.log" 2>&1
          rc=$?; echo "APP_EXIT_CODE=$rc" >> "$ROOT/app.log"; test -f "$ROOT/receipt.json" && cat "$ROOT/receipt.json"; exit 0
      - name: Speed and integrity gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          d=json.load(open(os.path.join(os.environ['ROOT'],'receipt.json')));assert d.get('status')=='ok',d;r=d['result'];m=r.get('fast_metrics') or {};s=r['probe']['streams'];v=next(x for x in s if x.get('codec_type')=='video');a=next(x for x in s if x.get('codec_type')=='audio');mb=r['output_bytes']/1e6
          c={'fast':r.get('fast_path_used') is True,'no_legacy':not r.get('legacy_fallback_used'),'ten_seconds':r['export_seconds']<=10.0,'duration':abs(r['output_duration']-10800)<=0.1,'size':400<=mb<=600,'hevc':v.get('codec_name')=='hevc','1080p':(v.get('width'),v.get('height'))==(1920,1080),'fps':v.get('r_frame_rate')=='60/1' and v.get('avg_frame_rate')=='60/1','mp3':a.get('codec_name')=='mp3','decode':r.get('full_decode',{}).get('ok') is True,'seek':all(x.get('ok') for x in r.get('seek_checks',[]))}
          print('EXPORT_SECONDS=',r['export_seconds']);print('FAST_METRICS=',json.dumps(m));print('OUTPUT_MB=',mb);print(c);json.dump({'checks':c,'result':{'export_seconds':r['export_seconds'],'fast_metrics':m,'output_bytes':r['output_bytes'],'duration':r['output_duration']}},open(os.path.join(os.environ['ROOT'],'gate.json'),'w'),indent=2)
          if not all(c.values()):sys.exit(1)
          print('REALTIME0_3H_SPEED=PASS')
          PY
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscribe-realtime0-3h-probe
          path: |
            ${{ env.ROOT }}/receipt.json
            ${{ env.ROOT }}/gate.json
            ${{ env.ROOT }}/app.log
          retention-days: 7
