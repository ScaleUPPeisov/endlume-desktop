name: ENDLUME macOS production periodic 3h acceptance

on:
  workflow_dispatch:
  push:
    branches: [perf/endlume-macos-3h-10s-acceptance]
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - '.github/workflows/endlume-periodic-seam-poc.yml'

permissions:
  contents: read

jobs:
  production-periodic-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert Apple Silicon and stable ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor e2896da7702891a5b760ecd4daad4fd54bc90b82 HEAD
          echo "BUILD_HEAD=$(git rev-parse HEAD)"

      - name: Install and compile actual product
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          npm install --no-audit --no-fund
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features acceptance-harness
          npx tauri build --target aarch64-apple-darwin --bundles app --features acceptance-harness --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"; BIN="$APP/Contents/MacOS/endlume"
          test -d "$APP"; test -x "$BIN"
          ROOT="$RUNNER_TEMP/endlume-periodic-3h"; mkdir -p "$ROOT"
          VERSION="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"; BUNDLE_BYTES="$(du -sk "$APP" | awk '{print $1*1024}')"
          printf 'BUILD_HEAD=%s\nAPP_VERSION=%s\nBUNDLE_PATH=%s\nBINARY_PATH=%s\nBUNDLE_SIZE=%s\n' "$(git rev-parse HEAD)" "$VERSION" "$APP" "$BIN" "$BUNDLE_BYTES" | tee "$ROOT/build-info.txt"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"; echo "APP=$APP" >> "$GITHUB_ENV"; echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Generate 3-hour input and exact 5-second periodic effect
        shell: bash
        run: |
          set -euo pipefail
          MEDIA="$ROOT/project"; OUT="$ROOT/out"; mkdir -p "$MEDIA" "$OUT"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x182033:s=1920x1080" -frames:v 1 -y "$MEDIA/cover.png"
          for i in $(seq -w 1 12); do n=$((10#$i)); hz=$((190+n*19)); ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -metadata title="Periodic Track ${i}" -y "$MEDIA/track-${i}.mp3"; done
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=black:s=640x360:r=60:d=5" -vf "drawbox=x='280+220*sin(2*PI*t/5)':y='140+80*sin(2*PI*t/5+PI/2)':w=80:h=80:color=white@0.95:t=fill" -an -c:v libx264 -preset ultrafast -g 300 -pix_fmt yuv420p -r 60 -y "$ROOT/periodic-screen.mp4"
          D="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$ROOT/periodic-screen.mp4")"
          python3 - "$D" <<'PY'
          import sys
          d=float(sys.argv[1]); assert abs(d-5.0)<0.001,d
          PY
          echo "MEDIA=$MEDIA" >> "$GITHUB_ENV"; echo "OUT=$OUT" >> "$GITHUB_ENV"; echo "EFFECT=$ROOT/periodic-screen.mp4" >> "$GITHUB_ENV"

      - name: Create periodic production QueueJob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,glob
          root=os.environ['ROOT']; media=os.environ['MEDIA']; out=os.environ['OUT']; effect=os.environ['EFFECT']
          fx={'id':'periodic-screen','name':'Periodic Screen 5s','source':effect,'enabled':True,'mode':'screen','keyColor':'#00ff00','similarity':0.18,'blend':0.08,'despill':0.0,'lumaThreshold':0.12,'lumaTolerance':0.12,'saturation':1.0,'x':0.5,'y':0.5,'scale':1.0,'fullscreen':True,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':None}
          job={'project':{'id':'acceptance-periodic-3h','name':'ENDLUME Periodic 3H Acceptance','path':media,'media':[os.path.join(media,'cover.png')],'audio':sorted(glob.glob(os.path.join(media,'track-*.mp3'))),'valid':True,'error':None},'settings':{'width':1920,'height':1080,'fps':60,'codec':'h265','bitrateMbps':30.0,'durationHours':3.0,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':out,'preset':'fast','encoderPreference':'auto'},'effects':[fx],'subscribes':[],'ambient':None}
          json.dump(job,open(os.path.join(root,'job.json'),'w'),indent=2)
          PY

      - name: Launch actual ENDLUME app periodic export and product preview
        shell: bash
        run: |
          set +e
          ENDLUME_ACCEPTANCE_JOB="$ROOT/job.json" ENDLUME_ACCEPTANCE_RECEIPT="$ROOT/receipt.json" ENDLUME_SOURCE_HEAD="$GITHUB_SHA" ENDLUME_ACCEPTANCE_PREVIEW_TIMES="0,1,4.983333333,5,5.016666667,10,30,60" "$BIN" > "$ROOT/app.log" 2>&1
          rc=$?; echo "APP_EXIT_CODE=$rc" >> "$ROOT/app.log"; test -f "$ROOT/receipt.json" && cat "$ROOT/receipt.json"; exit 0

      - name: Validate long-run periodic visibility seam and phase
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,statistics,sys
          root=os.environ['ROOT']; rec=json.load(open(os.path.join(root,'receipt.json')))
          if rec.get('status')!='ok': sys.exit('periodic render failed')
          r=rec['result']; out=r['output_path']; W,H=480,270; fs=W*H
          def frame(t,path=out):
              q=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{t:.9f}','-i',path,'-frames:v','1','-an','-vf',f'scale={W}:{H},format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
              if len(q.stdout)<fs: raise RuntimeError(('short frame',t,path,len(q.stdout)))
              return q.stdout[:fs]
          def mae(a,b): return sum(abs(x-y) for x,y in zip(a,b))/fs
          ref=frame(1.25); phase={}
          for label,t in [('1h',3601.25),('2h',7201.25),('near3h',10796.25)]: phase[label]=mae(ref,frame(t))
          motion=mae(frame(1.00),frame(1.20))
          start=5.0-6.0/60.0
          q=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{start:.9f}','-i',out,'-frames:v','13','-an','-vf',f'scale={W}:{H},format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
          frames=[q.stdout[i*fs:(i+1)*fs] for i in range(13)]; diffs=[mae(a,b) for a,b in zip(frames,frames[1:])]; moving=[d for d in diffs if d>0.02]; seam=diffs[5]; typical=statistics.median([d for i,d in enumerate(diffs) if i!=5])
          checks={'motion':motion>0.02,'effect_1h':phase['1h']<0.15,'effect_2h':phase['2h']<0.15,'effect_near3h':phase['near3h']<0.15,'seam_motion':len(moving)>=8,'seam':typical>0.02 and seam<=max(typical*2.5,0.20)}
          report={'period':5.0,'master_duration':(r.get('fast_metrics') or {}).get('masterDuration'),'motion_diff':motion,'phase_diff':phase,'adjacent_diffs':diffs,'typical_adjacent_diff':typical,'seam_diff':seam,'checks':checks}
          json.dump(report,open(os.path.join(root,'periodic-visual.json'),'w'),indent=2); print(json.dumps(report,indent=2))
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Compare actual product preview with production export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,sys
          root=os.environ['ROOT']; r=json.load(open(os.path.join(root,'receipt.json')))['result']; out=r['output_path']; W,H=480,270; fs=W*H
          def frame(path,t):
              q=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{t:.9f}','-i',path,'-frames:v','1','-an','-vf',f'scale={W}:{H},format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
              if len(q.stdout)<fs: raise RuntimeError(('short frame',path,t))
              return q.stdout[:fs]
          rows=[]
          for item in r.get('preview_outputs',[]):
              t=float(item['at']); a=frame(out,t); b=frame(item['path'],0.0); diff=sum(abs(x-y) for x,y in zip(a,b))/fs; rows.append({'at':t,'mae':diff,'pass':diff<6.0})
          required={0.0,1.0,4.983333333,5.0,5.016666667,10.0,30.0,60.0}; got={round(x['at'],9) for x in rows}
          checks={'all_frames':len(rows)==8 and all(x['pass'] for x in rows),'required_times':all(any(abs(t-x['at'])<1e-6 for x in rows) for t in required)}
          report={'metric':'mean absolute luma difference after 480x270 normalization','threshold':6.0,'frames':rows,'checks':checks}
          json.dump(report,open(os.path.join(root,'preview-export.json'),'w'),indent=2); print(json.dumps(report,indent=2))
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Prove periodic product audio packet preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,glob,os,subprocess,sys
          root=os.environ['ROOT']; r=json.load(open(os.path.join(root,'receipt.json')))['result']; out=r['output_path']
          def hashes(path):
              d=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','a:0','-show_packets','-show_entries','packet=data_hash','-show_data_hash','sha256','-of','json',path],text=True)); return [p['data_hash'] for p in d.get('packets',[]) if p.get('data_hash')]
          src=[]
          for p in sorted(glob.glob(os.path.join(os.environ['MEDIA'],'track-*.mp3'))):src.extend(hashes(p))
          dst=hashes(out); report={'source_packets':len(src),'output_packets':len(dst),'packet_perfect':src==dst,'last_packet':bool(src and dst and src[-1]==dst[-1])}; json.dump(report,open(os.path.join(root,'audio-integrity.json'),'w'),indent=2); print(json.dumps(report,indent=2))
          if not report['packet_perfect']:sys.exit(1)
          PY

      - name: Hard gate periodic production output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,sys
          root=os.environ['ROOT']; d=json.load(open(os.path.join(root,'receipt.json')))
          if d.get('status')!='ok':sys.exit(str(d))
          r=d['result']; m=r.get('fast_metrics') or {}; streams=r['probe']['streams']; v=next(x for x in streams if x.get('codec_type')=='video'); a=next(x for x in streams if x.get('codec_type')=='audio'); mb=r['output_bytes']/1_000_000; visual=json.load(open(os.path.join(root,'periodic-visual.json'))); parity=json.load(open(os.path.join(root,'preview-export.json'))); audio=json.load(open(os.path.join(root,'audio-integrity.json'))); total_ms=r['export_seconds']*1000
          checks={'FAST_PATH_SELECTED':bool(r.get('fast_path_used')),'PERIODIC_MODE':m.get('mode')=='periodic-hevc-mp3-packet-copy','MASTER_5S':abs(float(m.get('masterDuration',0))-5.0)<0.001,'DURATION':abs(r['output_duration']-10800.0)<=0.10,'SIZE_400_600_MB':400<=mb<=600,'HEVC':v.get('codec_name')=='hevc','RESOLUTION':(v.get('width'),v.get('height'))==(1920,1080),'FPS':v.get('r_frame_rate')=='60/1' and v.get('avg_frame_rate')=='60/1','MP3':a.get('codec_name')=='mp3','AUDIO_PACKET_PRESERVED':audio.get('packet_perfect') is True,'FULL_DECODE':r.get('full_decode',{}).get('ok') is True,'SEEK':all(x.get('ok') for x in r.get('seek_checks',[])),'VISUAL_LONG_RUN':all(visual['checks'].values()),'PREVIEW_EXPORT':all(parity['checks'].values()),'TEN_SECONDS':total_ms<=10000.0}
          print(f"MASTER_RENDER_MS={m.get('masterMs')} VIDEO_TIMELINE_BUILD_MS={m.get('timelineMs')} AUDIO_MS={m.get('audioMs')} MUX_MS={m.get('muxMs')} FINALIZE_MS={m.get('finalizeMs')} TOTAL_MS={total_ms:.3f}")
          print(f"OUTPUT_DURATION={r['output_duration']:.6f} OUTPUT_MB={mb:.3f}")
          for k,vv in checks.items():print(f"{k}={'PASS' if vv else 'FAIL'}")
          json.dump({'checks':checks,'total_ms':total_ms,'fast_metrics':m},open(os.path.join(root,'gate.json'),'w'),indent=2)
          if not all(checks.values()):sys.exit(1)
          print('PERIODIC_PRODUCTION_3H=PASS')
          PY

      - name: Upload periodic production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endlume-production-periodic-3h-evidence
          path: |
            ${{ env.ROOT }}/build-info.txt
            ${{ env.ROOT }}/receipt.json
            ${{ env.ROOT }}/app.log
            ${{ env.ROOT }}/job.json
            ${{ env.ROOT }}/periodic-visual.json
            ${{ env.ROOT }}/preview-export.json
            ${{ env.ROOT }}/audio-integrity.json
            ${{ env.ROOT }}/gate.json
          if-no-files-found: warn
          retention-days: 30
