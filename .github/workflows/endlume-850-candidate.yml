name: ENDLUME 8.50 Real Speed Candidate

on:
  workflow_dispatch:
  push:
    branches: [candidate/endlume-850-real-speed]
    paths:
      - 'scripts/apply-real-speed-8-50.py'
      - 'scripts/validate-release-8-50.sh'
      - 'BUILD_ENDLUME_850_SELFHOSTED.command'
      - '.github/workflows/endlume-850-candidate.yml'

permissions:
  contents: read

concurrency:
  group: endlume-850-real-speed-candidate
  cancel-in-progress: true

jobs:
  macos-arm64-candidate:
    name: macOS ARM64 • 8.50 Speed / Quality Gate
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout 8.50 candidate
        uses: actions/checkout@v4
        with:
          ref: candidate/endlume-850-real-speed
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify M1 runner and signing material
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          command -v gh
          command -v npm
          command -v cargo
          test -s "$HOME/.endlume-updater/endlume.key"
          test -s "$HOME/.endlume-updater/endlume.key.pub"
          python3 -m py_compile scripts/apply-real-speed-8-50.py
          /bin/bash -n scripts/validate-release-8-50.sh
          /bin/bash -n BUILD_ENDLUME_850_SELFHOSTED.command

      - name: Build exact signed 8.50 candidate and run real speed gates
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          KEY="$HOME/.endlume-updater/endlume.key"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$KEY"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          export ENDLUME_RELEASE_ARTIFACT_DIR="$HOME/.endlume-release-bridge/endlume/candidate-8.50"
          export ENDLUME_RELEASE_VERSION="1.0.0-alpha.8.50"
          export ENDLUME_850_PATCH_REF="candidate/endlume-850-real-speed"
          chmod +x BUILD_ENDLUME_850_SELFHOSTED.command
          /bin/bash BUILD_ENDLUME_850_SELFHOSTED.command
          test -s "$ENDLUME_RELEASE_ARTIFACT_DIR/ENDLUME-macos-aarch64.app.tar.gz"
          test -s "$ENDLUME_RELEASE_ARTIFACT_DIR/ENDLUME-macos-aarch64.app.tar.gz.sig"
          grep -Fxq '1.0.0-alpha.8.50' "$ENDLUME_RELEASE_ARTIFACT_DIR/version.txt"
          echo 'PASS: exact signed 8.50 candidate + real speed/quality gates'
