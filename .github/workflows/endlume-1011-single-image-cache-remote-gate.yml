name: ENDLUME 10.0.11 Single Image Cache Remote Gate

on:
  push:
    branches: [hotfix/endlume-10.0.11-performance-effects-reliability]
    paths:
      - "src-tauri/src/render.rs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/endlume-1011-single-image-cache-remote-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1011-single-image-cache-remote
  cancel-in-progress: true

jobs:
  remote-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact single-image routing invariant
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/render.rs')
          s=p.read_text()
          start=s.index('fn fast_multi_still(job:&QueueJob)->bool{')
          end=s.index('\n}\n', start)+3
          body=s[start:end]
          assert 'fast_path_decision(job).reason=="FAST_MULTI_STILL"' in body, body
          assert 'FAST_ONE_IMAGE' not in body.replace('// A single image must continue into render_zero_sub_zero_copy_856, where its','').replace('// physical visual master is persistent-cacheable. Routing FAST_ONE_IMAGE here',''), body

          order='''if render_pingpong_zero_copy_1002(app,job,&source_master,&fx,&subs,&audio,final_duration,&work,&out,&encoder,attempt,&cancel,started,&timer).await?{true}\n        else if render_multi_still_zero_copy_863(app,job,&audio,final_duration,&work,&out,&encoder,attempt,&cancel,started,&timer).await?{true}\n        else if render_interval_zero_copy_1000(app,job,&fx,&subs,&audio,final_duration,visual_master_duration,&work,&out,&encoder,attempt,&cancel,started,&timer).await?{true}\n        else if render_zero_sub_zero_copy_856(app,job,&fx,&subs,&audio,visual_master_duration,final_duration,&work,&out,&encoder,attempt,&cancel,started,&timer).await?{true}'''
          assert order in s, 'zero-copy routing order changed'

          z=s.index('async fn render_zero_sub_zero_copy_856(')
          z2=s.index('async fn render_periodic_zero_copy_852(', z)
          zero=s[z:z2]
          assert 'build_cached_visual_master_1000' in zero
          assert 'prepare_fast_aac_audio_1003' in zero
          assert 'tokio::join!' in zero
          print('SINGLE_IMAGE_ROUTING_INVARIANT=PASS')
          print('PERSISTENT_VISUAL_CACHE_PATH=PASS')
          print('PARALLEL_VISUAL_AUDIO_PREP=PASS')
          PY

      - name: Frontend production checks
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build

      - name: Rust formatting sanity
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup component add rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Remote gate summary
        shell: bash
        run: |
          echo 'REMOTE_GATE=PASS'
          echo 'PRODUCT_FIX=c3d4fe97c99d176a896f7565cc374883c738d707'
          echo 'PHYSICAL_MAC_GATE=DEFERRED_ONLY'
