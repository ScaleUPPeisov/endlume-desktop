name: ENDLUME 10.0.11 Single Image Cache Hotfix

on:
  push:
    branches: [hotfix/endlume-10.0.11-performance-effects-reliability]
    paths:
      - ".github/workflows/endlume-1011-single-image-cache-hotfix.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1011-single-image-cache-hotfix
  cancel-in-progress: true

jobs:
  completed-hotfix-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm product fix is already committed
        shell: bash
        run: |
          echo 'Single-image cache product fix already verified and committed at c3d4fe97c99d176a896f7565cc374883c738d707.'
          echo 'This workflow is intentionally retired so it cannot occupy the physical Mac runner again.'
