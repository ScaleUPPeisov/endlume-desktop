name: ENDLUME apply isolated legacy Subscribe encoder patch

on:
  push:
    branches: [perf/endlume-macos-subscribe-3h-fastpath]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/endlume-macos-subscribe-3h-fastpath
      - name: Apply exact compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/src/render.rs')
          s=p.read_text()
          old='args.extend(vec!["-filter_complex",&graph,"-map","[outv]","-t",&duration.to_string(),"-an"].into_iter().map(String::from));if is_image(media){args.extend(static_smart_encoder_args(s));}else{args.extend(encoder_args(encoder,s,false));}args.extend(vec!["-progress","pipe:1","-y",clip.to_string_lossy().as_ref()].into_iter().map(String::from));'
          new='args.extend(vec!["-filter_complex",&graph,"-map","[outv]","-t",&duration.to_string(),"-an"].into_iter().map(String::from));if is_image(media){let has_subscribe=job.subscribes.iter().any(|x|x.effect.enabled);if has_subscribe{args.extend(encoder_args(encoder,s,false));}else{args.extend(static_smart_encoder_args(s));}}else{args.extend(encoder_args(encoder,s,false));}args.extend(vec!["-progress","pipe:1","-y",clip.to_string_lossy().as_ref()].into_iter().map(String::from));'
          if new in s:
              print('PATCH_ALREADY_APPLIED=PASS')
          else:
              n=s.count(old)
              if n != 1: raise SystemExit(f'expected exactly one patch site, found {n}')
              p.write_text(s.replace(old,new))
              print('PATCH_APPLIED=PASS')
          PY
          git diff --check
          git diff -- src-tauri/src/render.rs
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/render.rs; then echo NO_COMMIT_NEEDED=PASS; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/render.rs
          git commit -m 'fix: keep legacy Subscribe segments on one HEVC encoder'
          git push origin HEAD:perf/endlume-macos-subscribe-3h-fastpath