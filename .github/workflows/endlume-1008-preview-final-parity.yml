name: ENDLUME 10.0.8 Preview Final Pixel Parity

on:
  push:
    branches: [hotfix/endlume-10.0.8-performance-visual]
    paths:
      - ".github/workflows/endlume-1008-preview-final-parity.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1008-preview-final-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Exact FFmpeg Preview vs Final pixel parity
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          ROOT="$RUNNER_TEMP/e1008-exact-parity"; rm -rf "$ROOT"; mkdir -p "$ROOT"

          grep -q 'FFmpeg Exact Preview' src/pages/Editors.tsx
          grep -q 'compositePath' src/components/LiveCompositePreview.tsx
          grep -q 'fps=60,format=yuv420p' src-tauri/src/preview.rs

          LIB=""
          while IFS= read -r p; do
            if python3 - "$p" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except Exception:raise SystemExit(1)
          ok=any(isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()) for x in (d.get("effects") or []))
          raise SystemExit(0 if ok else 1)
          PY
            then LIB="$p"; break; fi
          done < <(find "$HOME/Library/Application Support" "$HOME/Library/Containers" -type f -name library.json 2>/dev/null)
          test -n "$LIB"

          python3 - "$LIB" > "$ROOT/env" <<'PY'
          import json,sys,shlex
          d=json.load(open(sys.argv[1]))
          e=next(x for x in d.get("effects",[]) if isinstance(x,dict) and (x.get("id")=="825dd7a4-f0cf-4032-a3c9-64290cb5756d" or "эквалайзер круглый" in str(x.get("name","")).lower()))
          vals={"SRC":e["source"],"KEY":e.get("keyColor","#00ff00"),"SIM":0.18,"BLEND":0.03,
                "DESPILL":float(e.get("despill",0) or 0),"SCALE":float(e.get("scale",1) or 1),
                "X":float(e.get("x",.5) or .5),"Y":float(e.get("y",.5) or .5),
                "OPACITY":float(e.get("opacity",1) if e.get("opacity") is not None else 1)}
          for k,v in vals.items():print(f"{k}={shlex.quote(str(v))}")
          PY
          source "$ROOT/env"; test -f "$SRC"; KEY_RAW="$(printf '%s' "$KEY"|sed 's/^#//')"

          ffmpeg -hide_banner -loglevel error -f lavfi -i "gradients=s=1920x1080:r=30:c0=0x101828:c1=0x334466" -t 2 -c:v ffv1 -pix_fmt bgra -y "$ROOT/base.mkv"
          TARGET="$(python3 -c 'import sys;x=round(1920*float(sys.argv[1]));print(max(2,x if x%2==0 else x+1))' "$SCALE")"
          FILTER="[0:v]fps=30,setsar=1[b0];[1:v]fps=30,format=rgba,colorkey=0x$KEY_RAW:$SIM:$BLEND,despill=type=green:mix=$DESPILL:expand=0.20,scale=$TARGET:-2:flags=lanczos,colorchannelmixer=aa=$OPACITY[fx];[b0]format=rgba[base];[base][fx]overlay=x='max(0,min(W-w,W*$X-w/2))':y='max(0,min(H-h,H*$Y-h/2))':shortest=1:eof_action=repeat:format=auto[b1];[b1]fps=60,format=yuv420p[outv]"

          # Exact Preview codec path.
          ffmpeg -hide_banner -loglevel error -stream_loop -1 -i "$ROOT/base.mkv" -stream_loop -1 -i "$SRC"             -filter_complex "$FILTER" -map "[outv]" -t 2 -an             -c:v h264_videotoolbox -realtime 1 -q:v 100 -b:v 35M -maxrate 50M -pix_fmt yuv420p             -y "$ROOT/preview.mp4"

          # Final master codec path for this 56 s class: HEVC VideoToolbox high-fidelity master.
          ffmpeg -hide_banner -loglevel error -stream_loop -1 -i "$ROOT/base.mkv" -stream_loop -1 -i "$SRC"             -filter_complex "$FILTER" -map "[outv]" -t 2 -an             -c:v hevc_videotoolbox -realtime 1 -prio_speed 1 -power_efficient 0 -constant_bit_rate 1 -b:v 80M -g 120             -tag:v hvc1 -pix_fmt yuv420p -y "$ROOT/final.mp4"

          for n in preview final; do
            ffmpeg -hide_banner -loglevel error -ss 0.5 -i "$ROOT/$n.mp4" -frames:v 1 -y "$ROOT/$n.png"
            ffmpeg -hide_banner -loglevel error -i "$ROOT/$n.png" -frames:v 1 -f rawvideo -pix_fmt rgb24 "$ROOT/$n.rgb"
            echo "$n $(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,color_range,color_space,color_primaries,color_transfer -of compact=p=0:nk=0 "$ROOT/$n.mp4")"
          done

          ffmpeg -hide_banner -nostats -loglevel info -i "$ROOT/preview.png" -i "$ROOT/final.png" -lavfi "[0:v][1:v]ssim" -f null - 2>"$ROOT/ssim.txt"

          python3 - "$ROOT" "$TARGET" "$X" "$Y" <<'PY'
          import os,re,sys
          root,target,x,y=sys.argv[1],int(sys.argv[2]),float(sys.argv[3]),float(sys.argv[4])
          pre=open(os.path.join(root,"preview.rgb"),"rb").read();fin=open(os.path.join(root,"final.rgb"),"rb").read()
          W,H=1920,1080;assert len(pre)==len(fin)==W*H*3
          # Round Equalizer source is square; use the exact visual effect box plus 6px guard.
          h=target;x0=max(0,round(W*x-target/2)-6);x1=min(W,round(W*x+target/2)+6);y0=max(0,round(H*y-h/2)-6);y1=min(H,round(H*y+h/2)+6)
          ids=[yy*W+xx for yy in range(y0,y1) for xx in range(x0,x1)]
          def lum(img,i):
            r,g,b=img[i*3:i*3+3];return .2126*r+.7152*g+.0722*b
          pl=sum(lum(pre,i) for i in ids)/len(ids);fl=sum(lum(fin,i) for i in ids)/len(ids)
          pw=sorted(max(pre[i*3:i*3+3]) for i in ids)[int(.99*(len(ids)-1))]
          fw=sorted(max(fin[i*3:i*3+3]) for i in ids)[int(.99*(len(ids)-1))]
          mad=sum(abs(pre[i*3+j]-fin[i*3+j]) for i in ids for j in range(3))/(len(ids)*3)
          m=re.findall(r"All:([0-9.]+)",open(os.path.join(root,"ssim.txt")).read());ssim=float(m[-1]) if m else 0
          ld=abs(pl-fl)/max(1,fl);wd=abs(pw-fw)/max(1,fw)
          print(f"EXACT_PARITY_PREVIEW_LUMA={pl:.3f}")
          print(f"EXACT_PARITY_FINAL_LUMA={fl:.3f}")
          print(f"EXACT_PARITY_LUMA_DELTA={ld:.6f}")
          print(f"EXACT_PARITY_PREVIEW_WHITE_P99={pw}")
          print(f"EXACT_PARITY_FINAL_WHITE_P99={fw}")
          print(f"EXACT_PARITY_WHITE_DELTA={wd:.6f}")
          print(f"EXACT_PARITY_RGB_MAD={mad:.3f}")
          print(f"EXACT_PARITY_SSIM={ssim:.6f}")
          ok=ld<=0.04 and wd<=0.04 and mad<=6.0 and ssim>=0.995
          print("ENDLUME_1008_EXACT_PIXEL_PARITY_GREEN="+("1" if ok else "0"))
          if not ok:raise SystemExit(31)
          PY
