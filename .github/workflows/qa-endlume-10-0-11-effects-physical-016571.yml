name: QA ENDLUME 10.0.11 physical Effects migration isolated namespace

on:
  push:
    branches:
      - qa/endlume-10.0.11-stale-effect-gate-5522f7
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 016571ccc0031feb511e225f749d718df5f89a58
  QA_APP_ID: studio.endlume.qa.stalefx
  FX_80S_ID: 9951d1c3-5ff6-4a37-891f-1c323889a663
  FX_ROUND_ID: 825dd7a4-f0cf-4032-a3c9-64290cb5756d
  FX_80S_MANAGED: e8054c2afef438886500ce4e6e27fda0.mp4

jobs:
  physical-effects-isolated:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    steps:
      - name: Checkout exact product
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 1

      - name: Prove exact checkout and snapshot live library
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git status --porcelain)" = ""
          LIVE="$HOME/Library/Application Support/studio.endlume.desktop/library.json"
          test -f "$LIVE"
          shasum -a 256 "$LIVE" | awk '{print $1}' > "$RUNNER_TEMP/endlume-live-library-before.sha"
          echo "LIVE_LIBRARY_SHA_BEFORE=$(cat "$RUNNER_TEMP/endlume-live-library-before.sha")"

      - name: Build exact product code under dedicated QA app identifier
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          cp src-tauri/tauri.conf.json "$RUNNER_TEMP/tauri.conf.product.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('src-tauri/tauri.conf.json')
          cfg=json.loads(p.read_text())
          cfg['identifier']=os.environ['QA_APP_ID']
          cfg['productName']='ENDLUME QA STALEFX'
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('QA_IDENTIFIER='+cfg['identifier'])
          PY
          git diff -- src-tauri/tauri.conf.json
          cargo build --release --manifest-path src-tauri/Cargo.toml
          test -x src-tauri/target/release/endlume

      - name: Seed isolated QA namespace with proven 80s identity and broken Round identity
        shell: bash
        run: |
          set -euo pipefail
          QA_ROOT="$HOME/Library/Application Support/$QA_APP_ID"
          LIVE_ASSET="$HOME/Library/Application Support/studio.endlume.desktop/library-assets/effects/$FX_80S_MANAGED"
          test -f "$LIVE_ASSET"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/library-assets/effects"
          cp "$LIVE_ASSET" "$QA_ROOT/library-assets/effects/$FX_80S_MANAGED"
          python3 - <<'PY'
          import json,os,pathlib
          qa=pathlib.Path.home()/'Library'/'Application Support'/os.environ['QA_APP_ID']
          eighty={
            'id':os.environ['FX_80S_ID'],'name':'пыль и царапины 80-х',
            'source':f"/stale/old-app/library-assets/effects/{os.environ['FX_80S_MANAGED']}",
            'enabled':True,'mode':'chromakey','keyColor':'#0aa843','similarity':0.10,'blend':0.06,
            'despill':0.35,'lumaThreshold':0.03,'lumaTolerance':0.08,'saturation':1.0,
            'x':0.5,'y':0.5,'scale':1.0,'fullscreen':False,'previewFrameTime':0.0,
            'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':False,'usageMode':'always'
          }
          roundfx={
            'id':os.environ['FX_ROUND_ID'],'name':'эквалайзер круглый',
            'source':'/stale/old-app/library-assets/effects/__round_equalizer_missing_exact__.mp4',
            'enabled':True,'mode':'chromakey','keyColor':'#0aa843','similarity':0.18,'blend':0.03,
            'despill':0.35,'lumaThreshold':0.03,'lumaTolerance':0.08,'saturation':1.0,
            'x':0.5,'y':0.5,'scale':1.0,'fullscreen':False,'previewFrameTime':0.0,
            'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':False,'usageMode':'always'
          }
          fixture={'effects':[eighty,roundfx],'subscribes':[],'ambient':None}
          (qa/'library.json').write_text(json.dumps(fixture,ensure_ascii=False,indent=2))
          print('QA_LIBRARY_SEEDED='+str(qa/'library.json'))
          print(json.dumps(fixture,ensure_ascii=False))
          PY

      - name: Launch exact candidate pass 1 in isolated QA namespace
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/src-tauri/target/release/endlume"
          "$BIN" >"$RUNNER_TEMP/endlume-qa-pass1.log" 2>&1 &
          pid=$!
          sleep 10
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          QA_LIB="$HOME/Library/Application Support/$QA_APP_ID/library.json"
          test -f "$QA_LIB"
          shasum -a 256 "$QA_LIB" | awk '{print $1}' > "$RUNNER_TEMP/qa-library-pass1.sha"
          echo "QA_LIBRARY_PASS1_SHA=$(cat "$RUNNER_TEMP/qa-library-pass1.sha")"
          echo 'PASS1_LOG_BEGIN'; cat "$RUNNER_TEMP/endlume-qa-pass1.log" || true; echo 'PASS1_LOG_END'

      - name: Verify pass 1 migration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          qa=pathlib.Path.home()/'Library'/'Application Support'/os.environ['QA_APP_ID']
          data=json.loads((qa/'library.json').read_text())
          effects=data.get('effects') or []
          print('QA_EFFECTS_PASS1='+json.dumps(effects,ensure_ascii=False))
          assert len(effects)==2, f'WRONG_EFFECT_COUNT:{len(effects)}'
          eighty=next((e for e in effects if e.get('id')==os.environ['FX_80S_ID']),None)
          roundfx=next((e for e in effects if e.get('id')==os.environ['FX_ROUND_ID']),None)
          assert eighty is not None, '80S_PRESET_DISAPPEARED'
          assert roundfx is not None, 'ROUND_PRESET_DISAPPEARED'
          assert eighty.get('name')=='пыль и царапины 80-х', '80S_NAME_CHANGED'
          assert eighty.get('enabled') is True, '80S_ENABLED_CHANGED'
          assert eighty.get('assetState')=='ready', f"80S_NOT_READY:{eighty.get('assetState')}"
          p80=pathlib.Path(str(eighty.get('source') or ''))
          assert p80.is_file(), f'80S_REPAIRED_SOURCE_MISSING:{p80}'
          assert p80.name==os.environ['FX_80S_MANAGED'], f'80S_WRONG_ASSET:{p80.name}'
          assert roundfx.get('name')=='эквалайзер круглый', 'ROUND_NAME_CHANGED'
          assert roundfx.get('enabled') is True, 'ROUND_ENABLED_CHANGED'
          assert roundfx.get('source')=='/stale/old-app/library-assets/effects/__round_equalizer_missing_exact__.mp4', 'ROUND_SOURCE_GUESSED_OR_REPLACED'
          assert roundfx.get('assetState')=='repair-required', f"ROUND_NOT_REPAIR_REQUIRED:{roundfx.get('assetState')}"
          assert roundfx.get('assetError'), 'ROUND_DIAGNOSTIC_MISSING'
          print('PASS1_MIGRATION_CONTRACT=PASS')
          PY

      - name: Launch exact candidate pass 2 and prove idempotence
        shell: bash
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/src-tauri/target/release/endlume"
          "$BIN" >"$RUNNER_TEMP/endlume-qa-pass2.log" 2>&1 &
          pid=$!
          sleep 10
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          QA_LIB="$HOME/Library/Application Support/$QA_APP_ID/library.json"
          test -f "$QA_LIB"
          PASS1="$(cat "$RUNNER_TEMP/qa-library-pass1.sha")"
          PASS2="$(shasum -a 256 "$QA_LIB" | awk '{print $1}')"
          echo "QA_LIBRARY_PASS1_SHA=$PASS1"
          echo "QA_LIBRARY_PASS2_SHA=$PASS2"
          test "$PASS1" = "$PASS2"
          echo 'PASS2_LOG_BEGIN'; cat "$RUNNER_TEMP/endlume-qa-pass2.log" || true; echo 'PASS2_LOG_END'
          echo 'RESTART_IDEMPOTENCE=PASS'

      - name: Prove live ENDLUME data untouched and clean QA namespace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LIVE="$HOME/Library/Application Support/studio.endlume.desktop/library.json"
          BEFORE="$(cat "$RUNNER_TEMP/endlume-live-library-before.sha")"
          AFTER="$(shasum -a 256 "$LIVE" | awk '{print $1}')"
          echo "LIVE_LIBRARY_SHA_BEFORE=$BEFORE"
          echo "LIVE_LIBRARY_SHA_AFTER=$AFTER"
          test "$BEFORE" = "$AFTER"
          echo 'LIVE_LIBRARY_UNTOUCHED=PASS'
          rm -rf "$HOME/Library/Application Support/$QA_APP_ID"
          echo 'QA_NAMESPACE_CLEANED=PASS'
