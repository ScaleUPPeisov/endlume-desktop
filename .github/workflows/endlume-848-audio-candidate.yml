name: ENDLUME 8.48 Audio Whole-Track Candidate

on:
  workflow_dispatch:
  push:
    branches: ['candidate/audio-cut-fix-8.48']
    paths:
      - 'BUILD_ENDLUME_848_SELFHOSTED.command'
      - 'scripts/apply-audio-whole-track-fix-8-48.py'
      - 'scripts/validate-release-8-48.sh'
      - '.github/workflows/endlume-848-audio-candidate.yml'

permissions:
  contents: read

concurrency:
  group: endlume-848-audio-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ENDLUME_IN_APP_UPDATE: '1'
      ENDLUME_848_PATCH_REF: candidate/audio-cut-fix-8.48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/audio-cut-fix-8.48
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify 8.48 audio-only inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 -m py_compile scripts/apply-audio-whole-track-fix-8-48.py
          /bin/bash -n BUILD_ENDLUME_848_SELFHOSTED.command
          /bin/bash -n scripts/validate-release-8-48.sh
          test -s "$HOME/.endlume-updater/endlume.key"
          test -s "$HOME/.endlume-updater/endlume.key.pub"
          echo 'PASS: 8.48 audio-only inputs / Apple Silicon / signing material'

      - name: Build exact 8.48 audio candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          KEY="$HOME/.endlume-updater/endlume.key"
          ART="$HOME/.endlume-release-bridge/endlume/candidate-8.48-audio"
          rm -rf "$ART"; mkdir -p "$ART"
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$KEY"
          export TAURI_SIGNING_PRIVATE_KEY="$KEY"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          export ENDLUME_RELEASE_ARTIFACT_DIR="$ART"
          export ENDLUME_RELEASE_PLATFORM="darwin-aarch64"
          export ENDLUME_RELEASE_VERSION="1.0.0-alpha.8.48"
          export ENDLUME_UPDATER_PUBLIC_KEY_FILE="$KEY.pub"
          export ENDLUME_UPDATER_ENDPOINT="https://github.com/ScaleUPPeisov/scaleup-site/releases/download/endlume-stable/latest.json"
          chmod +x BUILD_ENDLUME_848_SELFHOSTED.command
          /bin/bash BUILD_ENDLUME_848_SELFHOSTED.command
          test -s "$ART/ENDLUME-macos-aarch64.app.tar.gz"
          test -s "$ART/ENDLUME-macos-aarch64.app.tar.gz.sig"
          echo 'PASS: 8.48 audio-only candidate built and signed locally'

      - name: Validate staged app and audio-only effective source
        shell: bash
        run: |
          set -Eeuo pipefail
          ART="$HOME/.endlume-release-bridge/endlume/candidate-8.48-audio"
          UNPACK="$ART/unpack"; rm -rf "$UNPACK"; mkdir -p "$UNPACK"
          /usr/bin/tar -xzf "$ART/ENDLUME-macos-aarch64.app.tar.gz" -C "$UNPACK"
          APP="$(find "$UNPACK" -type d -name 'ENDLUME Studio.app' -print -quit)"
          test -d "$APP"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = studio.endlume.desktop
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = 1.0.0-alpha.8.48
          EXE="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          /usr/bin/lipo -archs "$APP/Contents/MacOS/$EXE" | grep -qw arm64
          /usr/bin/codesign --verify --deep --strict "$APP" >/dev/null 2>&1 || /usr/bin/codesign --force --deep --sign - "$APP"
          /usr/bin/codesign --verify --deep --strict "$APP"
          W="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          grep -Fq 'let cf=crossfade.clamp(0.0,10.0);' "$W/src-tauri/src/render.rs"
          ! grep -Fq 'if t-target<=240.0{t}else{target}' "$W/src-tauri/src/render.rs"
          grep -Fq 'attempt==1&&encoder_works(app,"hevc_videotoolbox")' "$W/src-tauri/src/render.rs"
          grep -Fq 'target_video_kbps=500' "$W/src-tauri/src/render.rs"
          grep -Fq 'FFMPEG_STALL_TIMEOUT_SECS:u64=120' "$W/src-tauri/src/render.rs"
          echo 'PASS: staged 8.48 app + effective audio-only source'

      - name: Do not publish candidate
        shell: bash
        run: |
          echo '✅ 8.48 candidate passed audio whole-track regression gates'
          echo '✅ Stable updater was NOT modified by candidate workflow'
