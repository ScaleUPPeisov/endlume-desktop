name: ENDLUME 8.50 VideoToolbox Quality Sweep

on:
  workflow_dispatch:
  push:
    branches: [candidate/endlume-850-real-speed]
    paths:
      - 'scripts/benchmark-videotoolbox-quality-8-50.sh'
      - '.github/workflows/endlume-850-vt-sweep.yml'

permissions:
  contents: read

concurrency:
  group: endlume-850-vt-sweep
  cancel-in-progress: true

jobs:
  vt-sweep:
    name: M1 • VideoToolbox SSIM / bitrate / speed sweep
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/endlume-850-real-speed
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Benchmark hardware quality profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          WORK="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          FFMPEG="$(find "$WORK/src-tauri/binaries" -maxdepth 1 -type f -name 'ffmpeg*' -print -quit)"
          FFPROBE="$(find "$WORK/src-tauri/binaries" -maxdepth 1 -type f -name 'ffprobe*' -print -quit)"
          test -x "$FFMPEG"
          test -x "$FFPROBE"
          chmod +x scripts/benchmark-videotoolbox-quality-8-50.sh
          scripts/benchmark-videotoolbox-quality-8-50.sh "$FFMPEG" "$FFPROBE"
