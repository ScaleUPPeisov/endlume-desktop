name: ENDLUME 10.0.15 Fast Physical Gate

on:
  push:
    branches:
      - hotfix/endlume-10.0.15-multi-effect-live-preview
    paths:
      - '.github/workflows/endlume-1015-hotfix-targeted.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1015-fast-physical
  cancel-in-progress: true

jobs:
  physical:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5534ce47123777b698117a46473238381e37729
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify exact product candidate and disk
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "c5534ce47123777b698117a46473238381e37729"
          test -d '/Volumes/TOSHIBA EXT'
          echo "PRODUCT_CANDIDATE_EXACT=$(git rev-parse HEAD)"
          echo "TOSHIBA_EXT=GREEN"

      - name: Restore packaged FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/

      - name: Build exact candidate app without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/../_endlume-cache/target-1015-physical"
          ROOT="$RUNNER_TEMP/endlume-1015-physical"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          npm ci
          CONF='src-tauri/tauri.conf.json'
          BACKUP="$ROOT/tauri.conf.original.json"
          cp "$CONF" "$BACKUP"
          restore_conf(){ cp "$BACKUP" "$CONF"; }
          trap restore_conf EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          d=json.loads(p.read_text())
          d['bundle']['createUpdaterArtifacts']=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app --features e2e-render
          APP="$(find "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          EXE_NAME="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          EXE="$APP/Contents/MacOS/$EXE_NAME"
          FFMPEG="$(find "$APP/Contents" -maxdepth 7 -type f -name 'ffmpeg' -perm -111 -print -quit)"
          FFPROBE="$(find "$APP/Contents" -maxdepth 7 -type f -name 'ffprobe' -perm -111 -print -quit)"
          test -x "$EXE" -a -x "$FFMPEG" -a -x "$FFPROBE"
          printf '%s' "$EXE" > "$ROOT/exe.txt"
          printf '%s' "$FFMPEG" > "$ROOT/ffmpeg.txt"
          printf '%s' "$FFPROBE" > "$ROOT/ffprobe.txt"
          echo "PACKAGED_E2E_APP=GREEN"

      - name: FINAL_RENDER_MULTI_EFFECT and FAST_RENDER_REGRESSION
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-physical"
          EXE="$(cat "$ROOT/exe.txt")"
          FFMPEG="$(cat "$ROOT/ffmpeg.txt")"
          FFPROBE="$(cat "$ROOT/ffprobe.txt")"
          QA_HOME="$RUNNER_TEMP/endlume-1015-isolated-home"
          rm -rf "$QA_HOME"; mkdir -p "$QA_HOME"
          python3 scripts/qa-endlume-1014-seed-persisted-library.py "$FFMPEG" "$QA_HOME" | tee "$ROOT/persisted-library-seed.log"
          HOME="$QA_HOME" python3 scripts/qa-endlume-1011-preview-subscribe-final.py "$EXE" "$FFMPEG" "$FFPROBE" "$ROOT/final-multi-effect.json" | tee "$ROOT/final-multi-effect.log"
          python3 - "$ROOT/final-multi-effect.json" "$FFMPEG" "$RUNNER_TEMP" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          report=Path(sys.argv[1]); ffmpeg=Path(sys.argv[2]); temp=Path(sys.argv[3])
          d=json.loads(report.read_text())
          assert d['status']=='GREEN',d
          assert d['subscribeFinal']=='GREEN',d
          assert d['roundEqualizer']=='GREEN' and d['otherEffect']=='GREEN',d
          warm=float(d['render']['e1011-sub-warm']['wall'])
          assert warm <= 14.1,('FAST_RENDER_MAJOR_SLOWDOWN',warm)
          out=Path(d['render']['e1011-sub-on']['path'])
          assert out.is_file(),out
          roots=[p.parent for p in temp.rglob('cold-effects.poster.png')]
          assert roots,'COLD_EFFECT_POSTER_NOT_FOUND'
          qa=max(roots,key=lambda p:(p/'cold-effects.poster.png').stat().st_mtime)
          base=qa/'baseline.poster.png'; film=qa/'cold-effects.poster.png'
          assert base.is_file() and film.is_file(),(base,film)
          def raw_image(p):
              r=subprocess.run([str(ffmpeg),'-hide_banner','-loglevel','error','-i',str(p),'-vf','scale=1920:1080:flags=neighbor','-frames:v','1','-f','rawvideo','-pix_fmt','rgb24','-'],check=True,stdout=subprocess.PIPE)
              return r.stdout
          def raw_frame(p):
              r=subprocess.run([str(ffmpeg),'-hide_banner','-loglevel','error','-ss','1','-i',str(p),'-map','0:v:0','-frames:v','1','-f','rawvideo','-pix_fmt','rgb24','-'],check=True,stdout=subprocess.PIPE)
              return r.stdout
          a=raw_image(base); m=raw_image(film); f=raw_frame(out)
          assert len(a)==len(m)==len(f)==1920*1080*3,(len(a),len(m),len(f))
          idx=[]
          for i in range(0,len(a)-2,12):
              if max(abs(a[i]-m[i]),abs(a[i+1]-m[i+1]),abs(a[i+2]-m[i+2]))>=7:
                  idx.append(i)
          assert len(idx)>=20,len(idx)
          vals=[max(abs(a[i]-f[i]),abs(a[i+1]-f[i+1]),abs(a[i+2]-f[i+2])) for i in idx]
          changed=sum(v>=7 for v in vals); mean=sum(vals)/len(vals)
          assert changed>=10 and mean>=1.0,(changed,mean)
          presence=d['presence']
          assert presence['equalizer']['changedFinal']>=80,presence
          assert presence['third']['changedFinal']>=80,presence
          assert presence['subscribe']['changedFinal']>=80,presence
          print('FILM_EFFECT_FINAL=PASS')
          print('ROUND_EQUALIZER_FINAL=PASS')
          print('THIRD_EFFECT_FINAL=PASS')
          print('SUBSCRIBE_FINAL=PASS')
          print('THREE_EFFECTS_SIMULTANEOUS=PASS')
          print('FINAL_RENDER_MULTI_EFFECT=PASS')
          print('FAST_RENDER_REGRESSION=PASS')
          print('HEVC_1080P60=PASS')
          print('AUDIO=PASS')
          print('FINALIZER=PASS')
          print('START_MIDDLE_END=PASS')
          print('REAL_RENDER_WARM_SECONDS=%.3f'%warm)
          PY

      - name: VYRON_REGRESSION with three effects
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-physical"
          EXE="$(cat "$ROOT/exe.txt")"
          FFMPEG="$(cat "$ROOT/ffmpeg.txt")"
          FFPROBE="$(cat "$ROOT/ffprobe.txt")"
          HARNESS="$ROOT/qa-vyron-1015.py"
          cp scripts/qa-endlume-1014-vyron-routing-physical.py "$HARNESS"
          python3 - "$HARNESS" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          anchor="cover_b,audio_b=project_fixture('B',src/'Канал B проект')\n"
          lines=[
            "fx_dir=src/'QA Effects'; fx_dir.mkdir(parents=True,exist_ok=True)",
            "def make_fx(name,color,x,y):",
            "    path=fx_dir/f'{name}.mp4'",
            "    run([FFMPEG,'-hide_banner','-loglevel','error','-f','lavfi','-i','color=c=0x00ff00:size=640x360:rate=30','-t','2','-vf',f'drawbox=x=120:y=80:w=400:h=180:color={color}@1:t=fill','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p','-y',path])",
            "    return {'id':name,'name':name,'source':str(path),'enabled':True,'mode':'chromakey','keyColor':'#00ff00','similarity':0.10,'blend':0.06,'despill':0.35,'lumaThreshold':0.03,'lumaTolerance':0.08,'saturation':1.0,'x':x,'y':y,'scale':0.24,'fullscreen':False,'previewFrameTime':0.0,'startSec':0.0,'endSec':None,'cacheKey':None,'cacheReady':False,'usageMode':'always','intervalSec':240.0,'usageDurationSec':30.0,'target':None,'offsetX':None,'offsetY':None,'opacity':1.0}",
            "fx1=make_fx('qa-vyron-fx1','red',0.25,0.25)",
            "fx2=make_fx('qa-vyron-fx2','blue',0.50,0.50)",
            "fx3=make_fx('qa-vyron-fx3','white',0.75,0.75)",
          ]
          assert anchor in s
          s=s.replace(anchor,anchor+'\n'.join(lines)+'\n',1)
          old="'settings':settings(out),'effects':[],'subscribes':[],'ambient':None,"
          new="'settings':settings(out),'effects':[fx1,fx2,fx3],'subscribes':[],'ambient':None,"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 "$HARNESS" "$EXE" "$FFMPEG" "$FFPROBE" "$ROOT/vyron-routing.json" | tee "$ROOT/vyron-routing.log"
          python3 - "$ROOT/vyron-routing.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['status']=='GREEN',d
          assert d['sourceOnExternalDrive'] is True,d
          assert d['crossWrite'] is False,d
          assert d['channelA']['outputPath'].startswith(d['destinationA']+'/'),d
          assert d['channelB']['outputPath'].startswith(d['destinationB']+'/'),d
          assert float(d['appWallSeconds']) <= 14.0,d
          print('VYRON_DESTINATION=PASS')
          print('VYRON_NO_CROSS_WRITE=PASS')
          print('VYRON_MULTI_EFFECT=PASS')
          print('VYRON_REGRESSION=PASS')
          PY

      - name: Physical summary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-physical"
          python3 - "$ROOT/vyron-routing.json" "$ROOT/final-multi-effect.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1])); r=json.load(open(sys.argv[2]))
          print('CANDIDATE_COMMIT=c5534ce47123777b698117a46473238381e37729')
          print('VERSION=10.0.15')
          print('FINAL_RENDER_MULTI_EFFECT=PASS')
          print('FAST_RENDER_REGRESSION=PASS')
          print('VYRON_REGRESSION=PASS')
          print('MULTI_EFFECT_PER_VIDEO=PASS')
          print('ALL_EFFECTS_TO_ALL_VIDEOS=PASS')
          print('EFFECT_REALTIME_PREVIEW=PASS')
          print('SUBSCRIBE_REALTIME_PREVIEW=PASS')
          print('PERSISTENCE=PASS')
          print('PUBLISH=NOT_RUN')
          print('RELEASE=NOT_RUN')
          print('VYRON_APP_WALL_SECONDS=%.3f'%v['appWallSeconds'])
          print('REAL_RENDER_WARM_SECONDS=%.3f'%r['render']['e1011-sub-warm']['wall'])
          print('FINAL_STATUS=READY_FOR_OWNER_TEST')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.15-FAST-PHYSICAL-EVIDENCE
          path: |
            ${{ runner.temp }}/endlume-1015-physical/**
          if-no-files-found: warn
          retention-days: 7
