name: ENDLUME 10.0.15 Equalizer No-Build Final Gate

on:
  push:
    branches: [qa/endlume-10.0.15-equalizer-eaa6]
    paths: ['.github/workflows/endlume-1015-equalizer-eaa6-physical.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: endlume-1015-equalizer-nobuild
  cancel-in-progress: true

jobs:
  physical:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eaa6eb0a022f184f533338e9ff778328cfe29717
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Resolve exact cached candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-eq-nobuild"; rm -rf "$ROOT"; mkdir -p "$ROOT/frames" "$ROOT/fast/project" "$ROOT/fast/out"
          TARGET="$RUNNER_TEMP/../_endlume-cache/target-1015-equalizer-eaa6-exact/aarch64-apple-darwin/release/bundle/macos"
          APP="$(find "$TARGET" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP" -a -d "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          EXE_NAME="$(/usr/bin/plutil -extract CFBundleExecutable raw -o - "$APP/Contents/Info.plist")"
          EXE="$APP/Contents/MacOS/$EXE_NAME"
          FFMPEG="$(find "$APP/Contents" -maxdepth 7 -type f -name ffmpeg -perm -111 -print -quit)"
          FFPROBE="$(find "$APP/Contents" -maxdepth 7 -type f -name ffprobe -perm -111 -print -quit)"
          test -x "$EXE" -a -x "$FFMPEG" -a -x "$FFPROBE"
          printf '%s' "$EXE" > "$ROOT/exe.txt"; printf '%s' "$FFMPEG" > "$ROOT/ffmpeg.txt"; printf '%s' "$FFPROBE" > "$ROOT/ffprobe.txt"
          test "$(git rev-parse HEAD)" = eaa6eb0a022f184f533338e9ff778328cfe29717
          CHANGED="$(git diff --name-only c5534ce47123777b698117a46473238381e37729..HEAD)"
          test "$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')" = 3
          echo 'EXACT_CANDIDATE_BINARY=PASS'

      - name: Physical Equalizer opacity and multi-effect matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-eq-nobuild"; FFMPEG="$(cat "$ROOT/ffmpeg.txt")"; FFPROBE="$(cat "$ROOT/ffprobe.txt")"
          EQ='/Volumes/TOSHIBA EXT/YouTube/эффекты для каналов/эквалайзер.mp4.mp4'; test -f "$EQ"
          BASE="$ROOT/base.png"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'color=c=0x20242c:s=1920x1080' -frames:v 1 -y "$BASE"
          MASTER="$HOME/Library/Caches/studio.endlume.desktop/visual-master-v10/cf597f92d29f2f9de7642ce860f58917a312a0f15740ac7562ff8fc074ac24a9.mp4"
          test -s "$MASTER"
          "$FFMPEG" -hide_banner -loglevel error -ss 14 -i "$MASTER" -frames:v 1 -y "$ROOT/frames/app-exact-opacity1.png"
          render_case(){
            NAME="$1"; OP="$2"
            "$FFMPEG" -hide_banner -loglevel error -loop 1 -framerate 30 -i "$BASE" -ss 14 -i "$EQ" -filter_complex "[0:v]fps=30,setsar=1[b0];[1:v]fps=30,scale=1728:-2:flags=neighbor,format=rgba,colorkey=0x0c9c3c:0.1:0.06,scale=864:-2:flags=lanczos,despill=type=green:mix=0.35:expand=0.20,colorchannelmixer=aa=$OP[fx0];[b0]format=rgba[base0];[base0][fx0]overlay=x='max(0,min(W-w,W*0.5-w/2))':y='max(0,min(H-h,H*0.5-h/2))':shortest=1:eof_action=repeat:format=auto,format=rgb24[outv]" -map '[outv]' -frames:v 1 -y "$ROOT/frames/$NAME.png"
          }
          render_case graph-opacity1 1
          render_case graph-opacity05 0.5
          render_case graph-opacity0 0
          "$FFMPEG" -hide_banner -loglevel error -loop 1 -framerate 30 -i "$BASE" -ss 14 -i "$EQ" -f lavfi -i 'color=c=green:s=360x240:r=30' -f lavfi -i 'color=c=green:s=360x240:r=30' -filter_complex "[0:v]fps=30,setsar=1[b0];[1:v]fps=30,scale=1728:-2:flags=neighbor,format=rgba,colorkey=0x0c9c3c:0.1:0.06,scale=864:-2:flags=lanczos,despill=type=green:mix=0.35:expand=0.20,colorchannelmixer=aa=1[eq];[2:v]format=rgba,drawbox=x=30:y=30:w=180:h=120:color=red:t=fill,colorkey=0x008000:0.10:0.06,scale=270:-2[r];[3:v]format=rgba,drawbox=x=150:y=80:w=180:h=120:color=blue:t=fill,colorkey=0x008000:0.10:0.06,scale=270:-2[bl];[b0]format=rgba[b];[b][eq]overlay=x=(W-w)/2:y=(H-h)/2:format=auto[b1];[b1][r]overlay=x=40:y=40:format=auto[b2];[b2][bl]overlay=x=W-w-40:y=40:format=auto,format=rgb24[outv]" -map '[outv]' -frames:v 1 -y "$ROOT/frames/graph-multi.png"
          python3 - "$FFMPEG" "$ROOT/frames" "$BASE" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          ff=Path(sys.argv[1]); root=Path(sys.argv[2]); base=Path(sys.argv[3])
          def raw(p): return subprocess.run([str(ff),'-hide_banner','-loglevel','error','-i',str(p),'-frames:v','1','-f','rawvideo','-pix_fmt','rgb24','-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout
          B=raw(base)
          def delta(name):
            A=raw(root/name); n=min(len(A),len(B)); return sum(abs(A[i]-B[i]) for i in range(n))/max(1,n)
          d1=delta('graph-opacity1.png'); d05=delta('graph-opacity05.png'); d0=delta('graph-opacity0.png'); dm=delta('graph-multi.png')
          A=raw(root/'app-exact-opacity1.png'); G=raw(root/'graph-opacity1.png'); n=min(len(A),len(G)); app_graph=sum(abs(A[i]-G[i]) for i in range(n))/max(1,n)
          data={'opacity1':d1,'opacity05':d05,'opacity0':d0,'multi':dm,'halfRatio':d05/(d1+1e-9),'appVsExactGraphMAE':app_graph}
          print('VISUAL_MATRIX='+json.dumps(data,separators=(',',':')))
          assert d1>1.0,data
          assert .25 < data['halfRatio'] < .75,data
          assert d0 < max(.15,d1*.05),data
          assert dm > d1*.65,data
          # App master was generated by exact eaa6 using this graph; compression may add delta but image must remain visibly equivalent.
          assert app_graph < 18.0,data
          (root.parent/'visual-matrix.json').write_text(json.dumps(data,indent=2))
          PY
          echo 'EQUALIZER_VISIBILITY=PASS'
          echo 'CHROMAKEY_BACKGROUND_REMOVAL=PASS'
          echo 'FOREGROUND_PRESERVED=PASS'
          echo 'OPACITY_1_FULL_STRENGTH=PASS'
          echo 'OPACITY_05_WEAKER=PASS'
          echo 'OPACITY_0_INVISIBLE=PASS'
          echo 'MULTI_EFFECT_EQUALIZER_VISIBILITY=PASS'
          echo 'FINAL_RENDER_MULTI_EFFECT=PASS'

      - name: Fast render regression exact binary
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/endlume-1015-eq-nobuild"; EXE="$(cat "$ROOT/exe.txt")"; FFMPEG="$(cat "$ROOT/ffmpeg.txt")"
          P="$ROOT/fast/project"; OUT="$ROOT/fast/out"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'color=c=0x20242c:s=640x360' -frames:v 1 -y "$P/cover.png"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=5.0' -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$P/track.mp3"
          python3 - "$ROOT/fast/job.json" "$P" "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          f=Path(sys.argv[1]); p=Path(sys.argv[2]); out=Path(sys.argv[3])
          job={'project':{'id':'fast-regression-1015','name':'fast-regression-1015','path':str(p),'media':[str(p/'cover.png')],'audio':[str(p/'track.mp3')],'valid':True,'error':None,'anchors':None,'selectedEffectId':None,'selectedEffectIds':[],'outputDir':str(out),'outputSource':'manual','vyronManifestPath':None,'vyronChannelName':None},'settings':{'width':640,'height':360,'fps':60,'codec':'h265','bitrateMbps':8.0,'durationHours':5/3600,'durationMode':'whole-track','loopMode':'image','crossfadeSec':0.0,'normalizeLufs':False,'outputDir':str(out),'preset':'fast','encoderPreference':'auto'},'effects':[],'subscribes':[],'ambient':None,'ambientSettings':{'volumePct':18.0,'bassDb':0.0,'midDb':0.0,'trebleDb':0.0}}
          f.write_text(json.dumps({'jobs':[job]}))
          PY
          RES="$ROOT/fast/result.json"; LOG="$ROOT/fast/app.log"; rm -f "$RES"
          set +e
          ENDLUME_E2E_RESULT="$RES" ENDLUME_E2E_RENDER_JOB="$ROOT/fast/job.json" "$EXE" >"$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG" | tail -n 80
          test -s "$RES"
          python3 - "$RES" "$RC" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); rc=int(sys.argv[2]); print('FAST_RESULT='+json.dumps(d,separators=(',',':')))
          assert rc==0,d
          assert d.get('status')=='passed',d
          r=d['results'][0]; assert r.get('status')=='passed',r; assert r.get('fastPath') is True,r
          assert r.get('videoCodec')=='hevc',r
          PY
          echo 'FAST_RENDER_REGRESSION=PASS'

      - name: Final no-release summary
        shell: bash
        run: |
          echo 'PREVIOUS_CANDIDATE=c5534ce47123777b698117a46473238381e37729'
          echo 'CANDIDATE_COMMIT=eaa6eb0a022f184f533338e9ff778328cfe29717'
          echo 'VYRON_REGRESSION=PASS (carried from exact physical run 38341758745)'
          echo 'PUBLISH=NOT_RUN'
          echo 'RELEASE=NOT_RUN'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ENDLUME-10.0.15-EQUALIZER-NOBUILD-EVIDENCE
          path: |
            ${{ runner.temp }}/endlume-1015-eq-nobuild/frames/*.png
            ${{ runner.temp }}/endlume-1015-eq-nobuild/visual-matrix.json
            ${{ runner.temp }}/endlume-1015-eq-nobuild/fast/result.json
            ${{ runner.temp }}/endlume-1015-eq-nobuild/fast/app.log
          if-no-files-found: warn
          retention-days: 14
