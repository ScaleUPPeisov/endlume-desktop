name: ENDLUME 8.61 Still Loop Probe

on:
  push:
    branches: [candidate/endlume-861-still-loop-probe]
  workflow_dispatch:

concurrency:
  group: endlume-861-still-loop-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for ENDLUME idle
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 240); do
            if ! pgrep -af '[f]fmpeg' >/tmp/e861-still-user-render.txt 2>/dev/null; then exit 0; fi
            sleep 5
          done
          cat /tmp/e861-still-user-render.txt || true
          exit 3
      - name: Stage binaries and fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe*
          TMP="$(mktemp -d /tmp/e861-still.XXXXXX)"
          python3 scripts/find-endlume-real-fixture.py "$TMP/env"
          cat "$TMP/env" >> "$GITHUB_ENV"
          source "$TMP/env"
          test "$AUDIO_COUNT" = 15
          test "$EFFECT_COUNT" -ge 2
          echo "FFM=$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffmpeg*' -perm -111 -print -quit)" >> "$GITHUB_ENV"
          echo "FFP=$(find src-tauri/binaries -maxdepth 1 -type f -name 'ffprobe*' -perm -111 -print -quit)" >> "$GITHUB_ENV"
      - name: Probe decoded-still reuse
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/run-endlume-861-still-loop-probe.py "$SIDE" "$FFM" "$FFP" "$GITHUB_WORKSPACE/e861-still-loop.json"
          cat e861-still-loop.json
