name: ENDLUME zero-copy 3h architecture POC

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/src/mp4_manifest.rs'
      - 'src-tauri/src/bin/manifest_poc.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/endlume-zero-copy-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-zero-copy-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-on-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact ancestry and Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor e2896da7702891a5b760ecd4daad4fd54bc90b82 HEAD
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Prepare toolchain and compile manifest helper outside timing
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v ffprobe >/dev/null || brew install ffmpeg
          rustup target add aarch64-apple-darwin
          mkdir -p src-tauri/binaries
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$(command -v ffprobe)" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x src-tauri/binaries/*
          cargo build --release --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --bin manifest_poc --features acceptance-harness

      - name: Generate pre-existing production inputs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/zero-copy-poc"
          mkdir -p "$ROOT/audio"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=0x162033:s=1920x1080" -frames:v 1 -y "$ROOT/cover.png"
          : > "$ROOT/audio.txt"
          for i in $(seq -w 1 12); do
            n=$((10#$i))
            hz=$((170+n*29))
            p="$ROOT/audio/track-${i}.mp3"
            ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=${hz}:sample_rate=48000:duration=900" -c:a libmp3lame -b:a 320k -ar 48000 -ac 2 -y "$p"
            printf "file '%s'\n" "$p" >> "$ROOT/audio.txt"
          done
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Timed architecture path — periodic HEVC master + audio stream copy + sample-table expansion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time
          root=os.environ['ROOT']
          manifest=os.path.abspath('src-tauri/target/aarch64-apple-darwin/release/manifest_poc')
          master=os.path.join(root,'visual-master.mp4')
          final=os.path.join(root,'final-3h.mp4')
          tracks=[os.path.join(root,'audio',f'track-{i:02d}.mp3') for i in range(1,13)]
          def run(cmd, capture=False):
              return subprocess.run(cmd,check=True,capture_output=capture,text=capture)
          def duration(path):
              return float(run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',path],True).stdout.strip())
          input_total=sum(duration(p) for p in tracks)
          total_frames=round(input_total*60)
          stages={'input_audio_duration':input_total,'logical_video_frames':total_frames}
          t0=time.perf_counter()
          t=time.perf_counter()
          # Exact 5 s visual period: position and velocity match at the repeat boundary.
          run(['ffmpeg','-hide_banner','-loglevel','error','-loop','1','-framerate','60','-i',os.path.join(root,'cover.png'),'-vf',"scale=1920:1080,drawbox=x='860+700*sin(2*PI*t/5)':y=430:w=200:h=200:color=white@0.18:t=fill,format=yuv420p",'-t','5','-an','-c:v','hevc_videotoolbox','-realtime','1','-q:v','100','-b:v','500k','-maxrate','12M','-bufsize','64M','-g','300','-tag:v','hvc1','-fps_mode','cfr','-r','60','-video_track_timescale','60000','-y',master])
          stages['visual_build_encode_ms']=(time.perf_counter()-t)*1000
          t=time.perf_counter()
          run(['ffmpeg','-hide_banner','-loglevel','error','-i',master,'-f','concat','-safe','0','-i',os.path.join(root,'audio.txt'),'-map','0:v:0','-map','1:a:0','-c:v','copy','-c:a','copy','-video_track_timescale','60000','-y',final])
          stages['audio_mux_copy_ms']=(time.perf_counter()-t)*1000
          t=time.perf_counter()
          run([manifest,final,'0','300',str(total_frames)])
          stages['manifest_expand_finalize_ms']=(time.perf_counter()-t)*1000
          stages['total_ms']=(time.perf_counter()-t0)*1000
          with open(os.path.join(root,'timing.json'),'w') as f: json.dump(stages,f,indent=2)
          print(json.dumps(stages,indent=2))
          PY

      - name: Verify probe size physical bytes and exact encoded MP3 payload
        shell: bash
        run: |
          set -euo pipefail
          FINAL="$ROOT/final-3h.mp4"
          ffprobe -v error -show_streams -show_format -of json "$FINAL" > "$ROOT/probe.json"
          python3 - <<'PY'
          import json, os, subprocess
          root=os.environ['ROOT']; final=os.path.join(root,'final-3h.mp4')
          timing=json.load(open(os.path.join(root,'timing.json'))); expected=float(timing['input_audio_duration'])
          probe=json.load(open(os.path.join(root,'probe.json')))
          streams=probe['streams']; v=next(x for x in streams if x['codec_type']=='video'); a=next(x for x in streams if x['codec_type']=='audio')
          container_duration=float(probe['format']['duration']); audio_duration=float(a.get('duration') or container_duration); video_duration=float(v.get('duration') or container_duration); size=os.path.getsize(final)
          assert v['codec_name']=='hevc', v
          assert int(v['width'])==1920 and int(v['height'])==1080, v
          assert (v.get('avg_frame_rate') or v.get('r_frame_rate'))=='60/1', v
          assert a['codec_name']=='mp3', a
          assert abs(audio_duration-expected) <= 0.100, (audio_duration,expected)
          assert abs(video_duration-expected) <= 0.100, (video_duration,expected)
          assert abs(container_duration-expected) <= 0.100, (container_duration,expected)
          assert 400_000_000 <= size <= 600_000_000, size

          def packet_hashes(path):
              p=subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_packets','-show_data_hash','sha256','-show_entries','packet=data_hash','-of','csv=p=0',path],capture_output=True,text=True,check=True)
              # ffprobe CSV appends packet side-data such as "Skip Samples" on
              # some standalone MP3 packets. Only the first CSV field is the
              # requested packet data_hash; comparing whole rows is a false fail.
              return [line.split(',',1)[0].strip() for line in p.stdout.splitlines() if line.strip()]
          src=[]
          track_packet_counts=[]
          for i in range(1,13):
              hs=packet_hashes(os.path.join(root,'audio',f'track-{i:02d}.mp3'))
              track_packet_counts.append(len(hs)); src += hs
          out=packet_hashes(final)
          assert src==out, (len(src),len(out),'encoded MP3 packet payload changed')

          packet_json=json.loads(subprocess.run(['ffprobe','-v','error','-show_packets','-show_entries','packet=stream_index,pos,size','-of','json',final],capture_output=True,text=True,check=True).stdout)
          by_stream={}
          for p in packet_json.get('packets',[]):
              try: key=(int(p['pos']),int(p['size']))
              except Exception: continue
              by_stream.setdefault(int(p['stream_index']),set()).add(key)
          video_index=int(v['index']); audio_index=int(a['index'])
          video_bytes=sum(sz for _,sz in by_stream.get(video_index,set()))
          audio_bytes=sum(sz for _,sz in by_stream.get(audio_index,set()))
          overhead=size-video_bytes-audio_bytes
          assert video_bytes>0 and audio_bytes>0 and overhead>=0, (video_bytes,audio_bytes,overhead)
          breakdown={'video_bytes':video_bytes,'audio_bytes':audio_bytes,'container_overhead_bytes':overhead,'output_bytes':size,'audio_packets':len(out),'track_packet_counts':track_packet_counts}
          json.dump(breakdown,open(os.path.join(root,'size-breakdown.json'),'w'),indent=2)
          open(os.path.join(root,'duration.txt'),'w').write(str(container_duration))
          print(f'INPUT_AUDIO_DURATION={expected:.6f}')
          print(f'OUTPUT_AUDIO_DURATION={audio_duration:.6f}')
          print(f'OUTPUT_VIDEO_DURATION={video_duration:.6f}')
          print(f'OUTPUT_BYTES={size}')
          print(f'VIDEO_PHYSICAL_BYTES={video_bytes}')
          print(f'AUDIO_PHYSICAL_BYTES={audio_bytes}')
          print(f'CONTAINER_OVERHEAD_BYTES={overhead}')
          print(f'VIDEO_CODEC={v["codec_name"]}')
          print(f'FPS={v.get("avg_frame_rate") or v.get("r_frame_rate")}')
          print(f'AUDIO_CODEC={a["codec_name"]}')
          print(f'AUDIO_PACKETS={len(out)}')
          print('AUDIO_PACKET_PAYLOAD_HASHES=PASS')
          PY

      - name: Full ffmpeg decode — no quick-probe substitute
        shell: bash
        run: |
          set -euo pipefail
          : > "$ROOT/full-decode.stderr"
          ffmpeg -hide_banner -v error -i "$ROOT/final-3h.mp4" -f null - 2> "$ROOT/full-decode.stderr"
          test ! -s "$ROOT/full-decode.stderr"
          echo FULL_DECODE=PASS

      - name: Fixed seeks track boundaries EOF tails and picture validity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          root=os.environ['ROOT']; final=os.path.join(root,'final-3h.mp4')
          dur=float(open(os.path.join(root,'duration.txt')).read().strip())
          report={'seeks':[],'track_boundaries':[],'tails':[]}
          def run_decode(at,length):
              p=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{at:.6f}','-i',final,'-t',f'{length:.6f}','-map','0:v:0','-map','0:a:0','-f','null','-'],capture_output=True,text=True)
              assert p.returncode==0 and not p.stderr.strip(), (at,length,p.returncode,p.stderr[-1000:])
          def yavg(at):
              p=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{at:.6f}','-i',final,'-frames:v','1','-an','-vf','signalstats,metadata=print:file=-','-f','null','-'],capture_output=True,text=True,check=True)
              text=p.stdout+'\n'+p.stderr
              m=re.search(r'lavfi\.signalstats\.YAVG=([0-9.]+)',text)
              assert m, ('YAVG missing',at,text[-2000:])
              val=float(m.group(1)); assert val>1.0, ('black/corrupt picture',at,val); return val
          points=[0,600,1800,3600,5400,7200,9000,10500,dur*0.99]
          for at in points:
              at=min(max(0.0,at),max(0.0,dur-0.25)); run_decode(at,0.5); report['seeks'].append({'at':at,'yavg':yavg(at),'ok':True})
          for i in range(1,12):
              at=900.0*i
              run_decode(max(0,at-0.5),1.0); report['track_boundaries'].append({'at':at,'ok':True})
          for window in [60.0,30.0,10.0,2.0]:
              at=max(0.0,dur-window); run_decode(at,window); report['tails'].append({'last_seconds':window,'ok':True})
          json.dump(report,open(os.path.join(root,'seek-tail-report.json'),'w'),indent=2)
          print('FIXED_SEEKS=PASS')
          print('TRACK_BOUNDARIES=PASS')
          print('EOF_TAILS=PASS')
          PY

      - name: Verify the 5-second periodic visual loop boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, statistics
          root=os.environ['ROOT']; final=os.path.join(root,'final-3h.mp4')
          # 11 frames centered around the first 5-second master repeat boundary.
          start=5.0-5.0/60.0
          p=subprocess.run(['ffmpeg','-hide_banner','-v','error','-ss',f'{start:.9f}','-i',final,'-frames:v','11','-an','-vf','scale=320:180,format=gray','-f','rawvideo','-pix_fmt','gray','-'],capture_output=True,check=True)
          frame_size=320*180; raw=p.stdout
          assert len(raw)>=frame_size*11, (len(raw),frame_size*11)
          frames=[raw[i*frame_size:(i+1)*frame_size] for i in range(11)]
          diffs=[]
          for a,b in zip(frames,frames[1:]):
              diffs.append(sum(abs(x-y) for x,y in zip(a,b))/frame_size)
          median=statistics.median(diffs); peak=max(diffs); boundary_index=4
          boundary=diffs[boundary_index]
          # Boundary motion must be in-family with adjacent 60 FPS motion, not a reset flash/jump.
          assert boundary <= max(1.0,median*3.0), (boundary,median,peak,diffs)
          report={'start':start,'adjacent_mean_abs_diffs':diffs,'median':median,'peak':peak,'boundary_diff':boundary,'ok':True}
          json.dump(report,open(os.path.join(root,'loop-boundary.json'),'w'),indent=2)
          print('LOOP_BOUNDARY=PASS',json.dumps(report))
          PY

      - name: Verify AVFoundation can open and seek the repeated HEVC timeline
        shell: bash
        run: |
          set -euo pipefail
          cat > "$ROOT/avf.swift" <<'SWIFT'
          import Foundation
          import AVFoundation
          import CoreMedia
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          let asset = AVURLAsset(url: url)
          let duration = CMTimeGetSeconds(asset.duration)
          guard duration > 10799.0 else { fatalError("AVFoundation duration \(duration)") }
          let gen = AVAssetImageGenerator(asset: asset)
          gen.appliesPreferredTrackTransform = true
          for f in [0.0,0.10,0.50,0.90,0.99] {
            let t = CMTime(seconds: duration * f, preferredTimescale: 60000)
            var actual = CMTime.zero
            _ = try gen.copyCGImage(at: t, actualTime: &actual)
            print("AVF_SEEK_\(f)=\(CMTimeGetSeconds(actual))")
          }
          print("AVFOUNDATION=PASS")
          SWIFT
          swift "$ROOT/avf.swift" "$ROOT/final-3h.mp4" | tee "$ROOT/avfoundation.txt"

      - name: Summarize architectural evidence
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- TIMING ---'
          cat "$ROOT/timing.json" 2>/dev/null || true
          echo '--- PROBE ---'
          cat "$ROOT/probe.json" 2>/dev/null || true
          echo '--- SIZE BREAKDOWN ---'
          cat "$ROOT/size-breakdown.json" 2>/dev/null || true
          echo '--- SEEK / TAIL ---'
          cat "$ROOT/seek-tail-report.json" 2>/dev/null || true
          echo '--- LOOP BOUNDARY ---'
          cat "$ROOT/loop-boundary.json" 2>/dev/null || true
          echo '--- FULL DECODE STDERR ---'
          cat "$ROOT/full-decode.stderr" 2>/dev/null || true
          du -h "$ROOT/final-3h.mp4" 2>/dev/null || true

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-copy-3h-poc-evidence
          path: |
            ${{ env.ROOT }}/timing.json
            ${{ env.ROOT }}/probe.json
            ${{ env.ROOT }}/size-breakdown.json
            ${{ env.ROOT }}/seek-tail-report.json
            ${{ env.ROOT }}/loop-boundary.json
            ${{ env.ROOT }}/full-decode.stderr
            ${{ env.ROOT }}/avfoundation.txt
          if-no-files-found: warn
          retention-days: 30
