name: ENDLUME Next macOS M1 Validation

on:
  push:
    branches: [feature/endlume-next-mac-first]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/endlume-next-mac-first-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endlume-next-mac-first-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/endlume-next-mac-first
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Environment
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Frontend check and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build

      - name: Rust check and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

      - name: Validation marker
        run: echo ENDLUME_NEXT_MAC_M1_VALIDATION_GREEN
