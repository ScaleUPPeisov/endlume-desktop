name: ENDLUME 8.58 VYRON Channel Render Library
on:
  push:
    branches: [candidate/endlume-858-vyron-channel-render-library]
permissions:
  contents: read
concurrency:
  group: endlume-858-vyron-render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: [self-hosted, macOS, ARM64, endlume, macos-arm64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Restore embedded FFmpeg sidecars
        shell: bash
        run: |
          set -Eeuo pipefail
          FOUNDATION="$HOME/.endlume-local-builder/endlume-desktop-8.40-bootstrap"
          test -d "$FOUNDATION/src-tauri/binaries"
          mkdir -p src-tauri/binaries
          rsync -a "$FOUNDATION/src-tauri/binaries/" src-tauri/binaries/
          chmod +x src-tauri/binaries/ffmpeg* src-tauri/binaries/ffprobe* || true
      - name: Apply frozen 8.57 render source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/apply-render-isolation-8-56.py
          python3 scripts/apply-master-frame-hotfix-8-57.py
      - name: Prove VYRON render-library contract
        shell: bash
        run: |
          set -Eeuo pipefail
          assert_contains() {
            local file="$1" pattern="$2" label="$3"
            if ! grep -Fq "$pattern" "$file"; then
              echo "FAIL: $label"
              echo "  file: $file"
              echo "  expected: $pattern"
              exit 1
            fi
            echo "PASS: $label"
          }
          assert_contains src-tauri/src/vyron_bridge.rs 'fn safe_channel_folder' 'channel folder sanitization exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'fn vyron_workspace_root' 'VYRON workspace resolver exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'workspace.join("Render").join(safe_channel_folder(channel_name))' 'central Render/<channel> path exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'let output=resolve_render_output(&v,&root,&channel_name)?;' 'manifest import uses central output resolver'
          assert_contains src/components/VyronBatchBridge.tsx 'st.patchSettings({outputDir:info.outputDir})' 'frontend applies bridge outputDir'
          assert_contains src/components/VyronBatchBridge.tsx "'Completed',e.payload?.resultPath||null" 'ENDLUME reports completed output path to VYRON'
          assert_contains src-tauri/src/render.rs 'let requested_out_dir=PathBuf::from(&job.settings.output_dir);let out_dir=resolve_output_dir(app,&requested_out_dir)?;' 'renderer consumes configured output directory with writable fallback'
          assert_contains src-tauri/src/vyron_bridge_tests.rs 'vyron_render_library_sanitizes_channel_folder' 'channel sanitization regression test exists'
          assert_contains src-tauri/src/vyron_bridge_tests.rs 'join("Render").join("NEON")' 'central NEON render-library regression assertion exists'
          assert_contains src-tauri/src/vyron_bridge.rs 'source_manifest_path' 'handoff source manifest contract preserved'
          assert_contains src-tauri/src/vyron_bridge.rs 'selected_project_ids' 'selected-project handoff contract preserved'
      - name: Frontend production gate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run check
          npm run build
      - name: Rust full regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: VYRON focused regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml vyron_ -- --nocapture
      - name: Candidate gate summary
        shell: bash
        run: |
          echo 'PASS: VYRON imports route to <workspace>/Render/<channel>; legacy manifests retain declared outputDir; manual ENDLUME output remains settings-driven; frontend production build and full Rust tests passed.'
